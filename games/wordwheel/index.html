<script>
/* if Letter Loop can't open, say so on screen (never a blank page) and offer a fresh start */
(function () {
  var shown = false;
  function fail(msg) {
    if (shown || window.__wwReady) return; shown = true;
    function put() {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:#f4f5f9;color:#1b1f33;font:600 16px -apple-system,system-ui,sans-serif;text-align:center';
      d.innerHTML = '<b style="font-size:21px">Letter Loop didn’t open</b><div style="max-width:320px;opacity:.75;font-size:13px">' + String(msg).replace(/[<>&]/g, '') + '</div>';
      function btn(t, bg, go) { var b = document.createElement('button'); b.textContent = t; b.style.cssText = 'font:800 17px -apple-system,system-ui,sans-serif;padding:13px 24px;border-radius:14px;border:0;color:#fff;background:' + bg; b.onclick = go; d.appendChild(b); }
      btn('Start fresh', '#5a54f0', function () { try { localStorage.removeItem('wordwheel.game'); } catch (e) { /* ignore */ } location.reload(); });
      btn('All games', '#6b7080', function () { location.href = '../../'; });
      document.body.appendChild(d);
    }
    if (document.body) put(); else document.addEventListener('DOMContentLoaded', put);
  }
  window.addEventListener('error', function (e) { fail((e.message || 'Something went wrong') + (e.lineno ? ' (line ' + e.lineno + ')' : '')); });
  setTimeout(function () { if (!window.__wwReady) fail('It took too long to start.'); }, 8000);
})();
</script>
<title>Letter Loop</title>
<style>
/* Letter Loop: a scene for each place fills the phone edge to edge; the crossword sits in the top half, the
   letter wheel in the bottom half within thumb reach. */
html, body { height: 100%; }
body { background: #2b2350; overflow: hidden; }
.scene { position: fixed; inset: 0; z-index: 0; }
.scene img { width:100%; height:100%; display:block; object-fit:cover; }
.scene { pointer-events:none; background:#566b69; }
.scene::after { content:""; position:absolute; inset:0; background:rgba(19,36,35,.22); }
html.gg-fs-over .app { position: relative; z-index: 1; height: 100%; gap: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 58px) calc(env(safe-area-inset-right, 0px) + 10px) calc(env(safe-area-inset-bottom, 0px) + 10px) calc(env(safe-area-inset-left, 0px) + 10px); }

/* level and coins float in the middle of the top row */
.wwhud { position: fixed; z-index: 7; top: calc(env(safe-area-inset-top, 0px) + 6px); left: 60px; right: 60px; height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; pointer-events: none; }
.wwhud .ggpill { font-size: 16px; padding: 8px 13px; }
.coins { display: inline-flex; align-items: center; gap: 5px; }
.coins svg { width: 20px; height: 20px; }
.coins.bump { animation: bump .5s ease-out; }
@keyframes bump { 40% { transform: scale(1.18); } }

/* the crossword */
.boardarea { flex: 1; width: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
.board { position: relative; }
.sq { position: absolute; border-radius: 22%; background: rgba(255,255,255,.34); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.55); display: flex; align-items: center; justify-content: center;
  font-family: var(--round); font-weight: 800; text-transform: uppercase; color: #2b2350; transition: background-color .2s; }
.sq.on { background: #fff; box-shadow: 0 2px 5px rgba(20,10,50,.25); }
.sq.hinted { background: #fff; color: #8a7fb8; }
.sq.flash { animation: flash .6s ease-out both; }
@keyframes flash { 0% { transform: scale(.5); } 55% { transform: scale(1.16); background: #ffe27a; } 100% { transform: scale(1); } }
.sq.seen { animation: seen .7s ease-out; }
@keyframes seen { 30% { background: #ffe27a; transform: scale(1.1); } }
.sq.pickable { background: rgba(255,255,255,.6); box-shadow: inset 0 0 0 2px #ffcf3a; cursor: pointer; }
.board.won .sq { animation: wave .8s ease-out both; }
@keyframes wave { 35% { transform: translateY(-8px) scale(1.08); background: #ffe27a; } }

/* the word being made */
.wordline { height: 50px; flex: none; display: flex; align-items: center; justify-content: center; }
.cur { min-width: 0; padding: 6px 16px; border-radius: 14px; font-family: var(--round); font-weight: 800; font-size: 28px; letter-spacing: 3px; text-transform: uppercase;
  color: #fff; background: rgba(43,35,80,.55); opacity: 0; transition: opacity .12s; }
.cur.show { opacity: 1; }
.cur.good { background: #22a06b; } .cur.extra { background: #e0a100; } .cur.again { background: #6b6f86; }
.cur.bad { background: #d6455a; animation: shake .35s ease-in-out; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

/* the wheel and its buttons */
.wheelarea { flex: none; width: 100%; height: clamp(250px, 41vh, 380px); display: flex; align-items: center; justify-content: center; gap: 4px; }
.side { display: flex; flex-direction: column; justify-content: space-between; height: 72%; flex: none; }
.sbtn { position: relative; width: 52px; height: 52px; border-radius: 26px; border: 0; background: rgba(255,255,255,.92); color: #3b2a5c; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 3px 10px rgba(20,10,50,.25); -webkit-tap-highlight-color: transparent; }
.sbtn svg { width: 26px; height: 26px; }
.sbtn:active { transform: scale(.93); }
.sbtn.on { background: #ffcf3a; }
.sbtn .cost, .sbtn .badge { position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 900; padding: 1px 6px; border-radius: 9px; background: #ffb224; color: #3a2a00; white-space: nowrap; }
.sbtn .badge { background: #5a54f0; color: #fff; }
#btnExtra svg { color: #f2a200; }
.sbtn .ring { position: absolute; inset: -3px; border-radius: 50%; background: conic-gradient(#ffcf3a var(--p, 0%), transparent 0); -webkit-mask: radial-gradient(circle, transparent 26px, #000 27px); mask: radial-gradient(circle, transparent 26px, #000 27px); pointer-events: none; }
.wheel { position: relative; width: min(calc(100vw - 140px), 33vh, 330px); aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,.9); box-shadow: 0 8px 26px rgba(20,10,50,.3);
  touch-action: none; -webkit-user-select: none; user-select: none; }
.wheel .lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.wheel .lines path { fill: none; stroke: #5a54f0; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; opacity: .75; }
.ltr { position: absolute; width: 23%; aspect-ratio: 1; margin: -11.5% 0 0 -11.5%; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-family: var(--round); font-weight: 800; text-transform: uppercase; color: #3b2a5c; font-size: calc(min(calc(100vw - 140px), 33vh, 330px) * .13); transition: left .25s ease, top .25s ease, background-color .1s; pointer-events: none; }
.ltr.sel { background: #5a54f0; color: #fff; }

.toast { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); max-width: 86vw; text-align: center; pointer-events: none; z-index: 8;
  opacity: 0; transition: opacity .2s; background: rgba(20,14,40,.88); color: #fff; font-weight: 700; font-size: 16px; line-height: 1.3; padding: 10px 15px; border-radius: 14px; }
.toast.show { opacity: 1; }

/* sheets */
.extranote { margin: 0 0 10px; color: var(--muted); font-size: 15px; }
.extralist { display: flex; flex-wrap: wrap; gap: 6px; }
.extralist span { background: var(--surface-2); border-radius: 10px; padding: 5px 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; font-size: 15px; }
.maplist { display: flex; flex-direction: column; gap: 8px; }
.place { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 16px; background: var(--surface-2); }
.place .thumb { width: 64px; height: 44px; border-radius: 10px; overflow: hidden; flex: none; }
.place .thumb img { width:100%; height:100%; display:block; object-fit:cover; }
.place b { display: block; font-size: 16px; }
.place small { color: var(--muted); font-size: 13px; }
.place.here { box-shadow: inset 0 0 0 2px var(--accent); }
.place.locked { opacity: .45; }
.place .go { margin-left: auto; font-weight: 800; font-size: 14px; border: 0; border-radius: 12px; padding: 8px 12px; background: var(--surface); color: var(--ink); }
/* Visual refinement: porcelain letter tokens and a recessed wheel. */
.sq { border-radius:16%; font-family:-apple-system,system-ui,sans-serif; font-weight:750; background:rgba(255,255,255,.24); box-shadow:inset 0 1px 3px #221b4230,inset 0 0 0 1px #ffffff70; }
.sq.on, .sq.hinted { background:linear-gradient(145deg,#fffefa,#eeeae2); box-shadow:inset 0 1px #fff,0 2px 0 #d1cabb,0 4px 6px #1e123533; }
.sq.pickable { background:#ffffff99; box-shadow:inset 0 0 0 2px #ffcf3a; }
.wheel { background:radial-gradient(circle at 40% 30%,#fffdf5,#e4e0d8); box-shadow:inset 0 0 0 2px #fff9,inset 0 0 0 7px #b9afa329,0 4px 0 #b5ab9b,0 10px 22px #140a5040; }
.ltr { font-family:-apple-system,system-ui,sans-serif; font-weight:750; background:linear-gradient(145deg,#ffffff,#eeeae2); box-shadow:inset 0 1px #fff,0 2px 0 #c8c1b5,0 3px 5px #33244526; text-shadow:0 1px #fff; }
.ltr.sel { background:#5a54f0; box-shadow:inset 0 1px #ffffff40,0 2px 0 #3933ac; text-shadow:none; }
.sbtn { box-shadow:inset 0 1px #fff,0 2px 0 #d8d1c5,0 5px 10px #140a5033; }
.cur { letter-spacing:2px; font-family:-apple-system,system-ui,sans-serif; }

/* Natural materials: quiet scenery, readable recessed slots and ivory tokens. */
.sq { background:rgba(33,51,49,.82); color:#253c39; box-shadow:inset 0 1px 3px #0004,inset 0 0 0 1px #fff8; border-radius:13%; }
.sq.on,.sq.hinted { background:linear-gradient(145deg,#fffef8,#ece4d5); box-shadow:inset 0 1px #fff,0 2px 0 #bcb09b,0 3px 6px #0004; }
.sq.hinted { color:#6b7770; }
.sq.pickable { background:#f6e1a9; box-shadow:inset 0 0 0 2px #ba8b32; }
.wheel { background:linear-gradient(#e6c69240,#78533250),url('assets/wood-v1.webp') center/cover; box-shadow:inset 0 0 0 2px #f4dfb080,inset 0 0 0 8px #4e321e30,0 4px 0 #60462e,0 10px 22px #0005; }
.ltr { color:#263e39; background:linear-gradient(145deg,#fffef8,#ece4d5); box-shadow:inset 0 1px #fff,0 2px 0 #bbae98,0 3px 5px #0003; }
.ltr.sel { background:#245e55; color:#fff; box-shadow:inset 0 1px #ffffff55,0 2px 0 #173e38; }
.wheel .lines path { stroke:#a8d6c5; opacity:.95; }
.sbtn { color:#294c43; background:#fffdf4; }
.sbtn.on { background:#f0cb79; }
.cur { background:#223e37eb; }
@media(prefers-reduced-motion:reduce) { .sq.flash,.sq.seen,.board.won .sq,.coins.bump { animation:none; } .ltr { transition:none; } }

</style>

<script>
/* Letter Loop levels and words: WW_LEVELS made by tools/gen.js (seed 20261001); WW_DICT and WW_AX by tools/endless.js; checked by tools/check.js.
   WW_LEVELS[i] = "wheel letters|rows|cols|<row><col><a|d><word>,..." (row and col in base 36). WW_DICT[n] = every accepted n-letter word, sorted, run together.
   WW_AX = base64 bits over WW_DICT (3..7 letters, in order): 1 = crossword answer, then 3 bits frequency and 1 bit base word; 0 = extra only. */

/* Letter Loop sounds: synthesized with Web Audio (no audio files). Off until switched on in Settings. */
var WWSound = (function () {
  'use strict';
  var ac = null, master = null, on = false;
  function ctx() {
    if (!on) return null;
    if (!ac) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ac = new AC(); } catch (e) { return null; }
      master = ac.createGain(); master.gain.value = 0.45; master.connect(ac.destination);
    }
    if (ac.state === 'suspended') { try { ac.resume(); } catch (e) { /* ignore */ } }
    return ac;
  }
  function tone(type, f0, f1, dur, gain, delay) {
    var a = ctx(); if (!a) return;
    var t = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  var NOTES = [523, 587, 659, 698, 784, 880, 988, 1047];
  return {
    set: function (v) { on = !!v; },
    unlock: function () { ctx(); },
    pick: function (n) { tone('sine', NOTES[Math.min(7, n)], 0, 0.12, 0.25); },
    good: function () { [0, 0.07, 0.14].forEach(function (d, i) { tone('triangle', [659, 784, 1047][i], 0, 0.22, 0.22, d); }); },
    extra: function () { tone('sine', 1319, 1760, 0.18, 0.2); tone('sine', 1760, 0, 0.2, 0.15, 0.08); },
    again: function () { tone('sine', 440, 0, 0.15, 0.18); },
    bad: function () { tone('square', 180, 120, 0.18, 0.12); },
    coin: function () { tone('square', 988, 0, 0.06, 0.1); tone('square', 1319, 0, 0.14, 0.1, 0.06); },
    shuffle: function () { tone('sine', 300, 600, 0.15, 0.12); },
    win: function () { [523, 659, 784, 1047, 1319].forEach(function (f, i) { tone('triangle', f, 0, 0.3, 0.2, i * 0.09); }); }
  };
})();

<script>
/* Letter Loop app: swipe across the letter wheel to make words that fill a small crossword. Extra real words earn
   coins, coins buy hints. 2,000 levels in places of 16, each place with its own scene. Saves, house ads between
   levels only. */
/* ===== WWGEN BEGIN: levels past the 2,000 banked ones, made on the phone from the level number =====
   The same steps as tools/gen.js (a base word's letters on the wheel, a small crossword of common words made from
   them), seeded by the level number, so level n is the same level on every phone, every time. tools/endless.js runs
   this exact block in Node (it is cut out between the BEGIN/END lines) to build the word data and to prove a sample.
   Word data (src/levels.js): WW_DICT = accepted words; WW_AX = a bit string over WW_DICT saying which words are
   crossword answers (common words, the gen.js standard), how common (8 steps) and which may be a wheel's base word. */
var WWGen = (function () {
  'use strict';
  var BANK = WW_LEVELS.length;
  function rng(s) { var a = s >>> 0; return function () { a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function counts(w) { var c = new Int8Array(26); for (var i = 0; i < w.length; i++) c[w.charCodeAt(i) - 97]++; return c; }
  function fits(wc, bc) { for (var i = 0; i < 26; i++) if (wc[i] > bc[i]) return false; return true; }
  function isWord(w) {
    var s = WW_DICT[w.length]; if (!s) return false;
    var n = w.length, lo = 0, hi = s.length / n - 1;
    while (lo <= hi) { var m = (lo + hi) >> 1, x = s.substr(m * n, n); if (x === w) return true; if (x < w) lo = m + 1; else hi = m - 1; }
    return false;
  }

  // ----- the answer list, unpacked once (about 7,700 words; a few ms) -----
  var ANSW = null, ANSC, ZIPF = {}, POOL = { 6: [], 7: [] };
  function unpack() {
    if (ANSW) return;
    ANSW = [];
    var bin = typeof atob === 'function' ? atob(WW_AX) : Buffer.from(WW_AX, 'base64').toString('binary'), pos = 0;
    var bit = function () { var b = (bin.charCodeAt(pos >> 3) >> (7 - (pos & 7))) & 1; pos++; return b; };
    for (var n = 3; n <= 7; n++) {
      var s = WW_DICT[n] || '';

        if (!bit()) continue;
        var w = s.substr(i, n), t = bit() * 4; t += bit() * 2; t += bit(); // left to right on purpose
        ANSW.push(w); ZIPF[w] = 3.25 + t * 0.5; // middle of its half-step of word frequency

  // mostly 7 letters, every 4th level 6 letters, and every 12th (n % 12 === 6) an easier 6-letter "breather".
  function plan(n) {
    if (n % 12 === 6) return { L: 6, min: 6, max: 8, cols: 9, rows: 9, breather: true };
    if (n % 4 === 0) return { L: 6, min: 8, max: 11, cols: 10, rows: 10 };
    return { L: 7, min: 9, max: 13, cols: 11, rows: 10 };

  var PERIOD = 12, perPeriod = { 6: 0, 7: 0 };
  for (var r0 = 0; r0 < PERIOD; r0++) perPeriod[plan(BANK + 1 + r0).L]++;
  function slotOf(n, L) {
    var k = n - BANK - 1, s = Math.floor(k / PERIOD) * perPeriod[L];
    for (var m = BANK + 1 + Math.floor(k / PERIOD) * PERIOD; m < n; m++) if (plan(m).L === L) s++;
    return s;

    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;

  }

  // Same rules and scores as gen.js; it only looks at squares holding the right letter (a list per letter) and
  // keeps the grid's bounds as it goes, which makes it several times faster on a phone.

      saveMeta(); save(); renderHud(); return;
    }
    flashCur('bad'); S.bad();
  }
  function pulse(k, cls) { var el = sqEls[k]; if (!el) return; renderBoard(); el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(function () { el.classList.remove(cls); }, 800); }
  function pay(n) { meta.coins += n; meta.earned += n; saveMeta(); var c = $('coins'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); S.coin(); renderHud(); }
  // words whose letters are all showing (hints and crossings) count as found
  function autoFound() {
    var any = false;
    LV.words.forEach(function (x) {
      if (g.found[x.w]) return;
      if (x.cells.every(function (k) { return g.shown[k] || cellOn(k); })) { g.found[x.w] = 1; meta.words++; any = true; }
    });
    if (any) autoFound();
  }
  function afterChange() {
    autoFound(); save(); saveMeta(); renderAll();
    if (allDone()) finish();
  }

  // ================= hints =================
  var pickMode = false;
  function spend(n) {
    if (meta.coins < n) { toast('Not enough coins: find extra words or finish levels to earn more', 2600); S.bad(); return false; }
    meta.coins -= n; meta.hints++; saveMeta(); return true;
  }
  function hint() {
    if (!g || allDone()) return;
    var open = LV.words.filter(function (x) { return !g.found[x.w]; });
    if (!open.length) return;
    if (!spend(HINT)) return;
    var x = open[Math.floor(Math.random() * open.length)], k = null;
    for (var i = 0; i < x.cells.length; i++) if (!g.shown[x.cells[i]] && !cellOn(x.cells[i])) { k = x.cells[i]; break; }
    if (!k) { autoFound(); afterChange(); return; }
    g.shown[k] = 1; S.coin(); pulse(k, 'flash'); afterChange();
  }
  function togglePick() {
    if (!g || allDone()) return;
    if (!pickMode && meta.coins < PICK) { toast('Not enough coins: find extra words or finish levels to earn more', 2600); S.bad(); return; }
    pickMode = !pickMode;
    if (pickMode) toast('Tap a square to show its letter');
    renderAll();
  }
  function pickSquare(k) {
    if (!pickMode) return;
    if (g.shown[k] || cellOn(k)) return;
    pickMode = false;
    if (!spend(PICK)) { renderAll(); return; }
    g.shown[k] = 1; S.coin(); pulse(k, 'flash'); afterChange();
  }

  // ================= finishing =================
  function finish() {
    var lvl = g.level, placeEnd = lvl % PER_PLACE === 0, ex = g.extras.length;
    meta.levels++; meta.finished++;
    pay(LEVEL_PAY + (placeEnd ? PLACE_PAY : 0));
    meta.level = lvl + 1; saveMeta();
    S.win();
    var b = $('board'), els = b.children;
    for (var i = 0; i < els.length; i++) els[i].style.animationDelay = (i * 0.03) + 's';
    b.classList.add('won');
    store.del('game');
    setTimeout(function () {
      var text = (placeEnd ? '<b>' + placeName(placeOf(lvl)) + '</b> done! +' + (LEVEL_PAY + PLACE_PAY) + ' coins' : '+' + LEVEL_PAY + ' coins') +
        (ex ? ' · ' + ex + ' extra word' + (ex === 1 ? '' : 's') : '') +
        (placeEnd ? '<br>Next: <b>' + placeName(placeOf(lvl + 1)) + '</b>' : '');
      // make the next level now (it is usually ready in a blink anyway) while the card is up
      if (lvl + 1 > NL) setTimeout(function () { try { WWGen.level(lvl + 1); } catch (x) { /* made again on start */ } }, 400);
      showCard(placeEnd ? 'Place complete!' : ['Great!', 'Nice work!', 'Well done!', 'Brilliant!', 'Splendid!'][lvl % 5], text,
        [{ label: 'Level ' + fmt(lvl + 1), red: true, go: function () { between(function () { startLevel(lvl + 1); }); } }]);
    }, 1100);
  }
  function showCard(title, html, buttons) {
    $('endTitle').textContent = title; $('endText').innerHTML = html;
    var box = $('endActions'); box.innerHTML = '';
    buttons.forEach(function (b) {
      var el = document.createElement('button'); el.className = 'btn' + (b.red ? ' red' : ''); el.textContent = b.label;
      el.addEventListener('click', function () { $('ovEnd').classList.remove('show'); b.go(); });
      box.appendChild(el);
    });
    $('ovEnd').classList.add('show');
  }
  function showAd(done) { GoobsAds.show({}, done); }
  // a house ad between levels only, every few finished levels
  function between(next) {
    var f = meta.finished;
    if (Goobs.adsOn() && f > 0 && f % settings.adEvery === 0 && meta.lastAdAt !== f) { meta.lastAdAt = f; saveMeta(); next(); showAd(function () {}); return; }
    next();
  }

  // ================= sheets =================
  function openExtra() {
    $('extraNote').textContent = 'Real words that aren’t in the puzzle. Every ' + EXTRA_GOAL + ' earns ' + EXTRA_PAY + ' coins (' + meta.extraBank + ' of ' + EXTRA_GOAL + ' so far).';
    $('extraList').innerHTML = g.extras.length ? g.extras.slice().sort().map(function (w) { return '<span>' + w + '</span>'; }).join('') : '<p class="extranote">None on this level yet. Try short words!</p>';
    $('ovExtra').classList.add('show');
  }
  function openMap() {
    var here = placeOf(g.level), h = '';
    for (var p = Math.max(0, here - 6); p <= here + 3; p++) {
      var a = p * PER_PLACE + 1, z = a + PER_PLACE - 1, st = p < here ? 'Done' : p === here ? 'now on level ' + fmt(g.level) : 'Ahead';
      h += '<div class="place' + (p === here ? ' here' : '') + (p > here ? ' locked' : '') + '"><div class="thumb">' + sceneSVG(p) + '</div><div><b>' + placeName(p) + '</b><small>Levels ' + fmt(a) + '–' + fmt(z) + ' · ' + st + '</small></div></div>';
    }
    $('mapList').innerHTML = h;
    $('ovMap').classList.add('show');
  }
  function openStats() {
    $('statsBody').innerHTML = '<div class="tiles"><div class="tile"><b>' + meta.levels + '</b><span>levels</span></div><div class="tile"><b>' + meta.words + '</b><span>words</span></div><div class="tile"><b>' + meta.extras + '</b><span>extra words</span></div></div>' +
      '<div class="tiles"><div class="tile"><b>' + meta.hints + '</b><span>hints used</span></div><div class="tile"><b>' + meta.earned + '</b><span>coins earned</span></div><div class="tile"><b>' + (placeOf(g.level) + 1) + '</b><span>place</span></div></div>';
    $('ovStats').classList.add('show');
  }
  function openHelp() {
    $('helpList').innerHTML = [
      '<b>Swipe</b> across the letters in the wheel to make a word, then lift your finger. Go back over the last letter to undo it.',
      'Every word in the crossword uses the wheel’s letters (each letter once). Words are 3 letters or longer. Find them all to finish the level.',
      '<b>Extra words</b>: real words that aren’t in the crossword fill the star. Every ' + EXTRA_GOAL + ' extra words earn ' + EXTRA_PAY + ' coins. Tap the star to see them.',
      '<b>Shuffle</b> spins the letters into a new order (free). <b>Hint</b> (' + HINT + ' coins) shows a letter. <b>Target</b> (' + PICK + ' coins): tap any square to show its letter.',
      'Each level earns ' + LEVEL_PAY + ' coins; finishing a place (16 levels) earns ' + PLACE_PAY + ' more. Levels start with 4 letters and grow to 7. The levels never run out.',
      'Everything works offline. Your level, coins and the words you found are saved.'
    ].map(function (x) { return '<li>' + x + '</li>'; }).join('');
    $('ovHelp').classList.add('show');
  }
  function syncSettings() {
    $('setSound').checked = settings.sound; $('setAds').checked = Goobs.adsOn(); $('adEvery').textContent = settings.adEvery;
    $('rowAdEvery').classList.toggle('off', !Goobs.adsOn());
  }
  function sheet(btn, ov, close, before) {
    $(btn).addEventListener('click', function () { if (before) before(); else $(ov).classList.add('show'); });
    $(close).addEventListener('click', function () { $(ov).classList.remove('show'); });
    $(ov).addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  }

  // ================= start =================
  function init() {
    Goobs.fullscreen({ overlay: true, menu: ['btnMap', 'btnStats', 'btnHelp', 'btnSettings'], info: function () {
      if (!g) return '';
      return '<b>Level ' + fmt(g.level) + '</b> · ' + placeName(placeOf(g.level)) + ' · ' + LV.words.filter(wordDone).length + ' of ' + LV.words.length + ' words';
    } });
    var wh = $('wheel');
    wh.addEventListener('pointerdown', onDown); wh.addEventListener('pointermove', onMove);
    wh.addEventListener('pointerup', onUp); wh.addEventListener('pointercancel', onUp);
    wh.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    $('board').addEventListener('click', function (e) { var s = e.target.closest('.sq'); if (s) pickSquare(s.dataset.k); });
    $('btnShuffle').addEventListener('click', shuffleWheel);
    $('btnHint').addEventListener('click', hint);
    $('btnPick').addEventListener('click', togglePick);
    $('btnHome').addEventListener('click', function () { save(); saveMeta(); Goobs.home(); });
    sheet('btnExtra', 'ovExtra', 'btnCloseExtra', openExtra);
    sheet('btnMap', 'ovMap', 'btnCloseMap', openMap);
    sheet('btnStats', 'ovStats', 'btnCloseStats', openStats);
    sheet('btnHelp', 'ovHelp', 'btnCloseHelp', openHelp);
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings', function () { syncSettings(); $('ovSettings').classList.add('show'); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); S.set(settings.sound); S.good(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncSettings(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncSettings(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncSettings(); });
    S.set(settings.sound);
    var rq = 0; function refit() { if (rq) return; rq = requestAnimationFrame(function () { rq = 0; layoutBoard(); }); }
    window.addEventListener('resize', refit); if (window.ResizeObserver) new ResizeObserver(refit).observe($('boardarea'));
    document.addEventListener('visibilitychange', function () { if (document.hidden) { save(); saveMeta(); } });
    window.addEventListener('pagehide', function () { save(); saveMeta(); });
    try { if (load()) { setScene(); buildBoard(); buildWheel(); renderAll(); if (allDone()) startLevel(g.level + 1); } else startLevel(meta.level); }
    catch (e) { store.del('game'); startLevel(meta.level || 1); } // a bad save never keeps the game from opening
    if (!meta.seen) { meta.seen = true; saveMeta(); setTimeout(function () { toast('Swipe across the letters to make words', 2800); }, 700); }
    Goobs.markPlayed('wordwheel');
    Goobs.initUpdates({ beforeReload: function () { save(); saveMeta(); }, onVersions: function (v) { $('version').textContent = 'Letter Loop ' + (v.wordwheel || '?') + ' · Goobs-Games ' + (v.shell || '?'); } });
    window.__wwReady = true;
  }
  init();

  // test hook
  window.__ww = { get g() { return g; }, get LV() { return LV; }, meta: meta, judge: judge, startLevel: startLevel, hint: hint, togglePick: togglePick, pickSquare: pickSquare,
    isWord: isWord, placeName: placeName, slots: function () { return slots; }, shuffle: shuffleWheel, gen: WWGen, NL: NL };
})();
</script>
