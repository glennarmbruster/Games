<script>
/* if Knotty can't open, say so on screen (never a blank page) and offer a fresh start */
(function () {
  var shown = false;
  function fail(msg) {
    if (shown || window.__knReady) return; shown = true;
    function put() {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:#e6f5ff;color:#1b1f33;font:600 16px -apple-system,system-ui,sans-serif;text-align:center';
      d.innerHTML = '<b style="font-size:21px">Knotty didn’t open</b><div style="max-width:320px;opacity:.75;font-size:13px">' + String(msg).replace(/[<>&]/g, '') + '</div>';
      function btn(t, bg, go) { var b = document.createElement('button'); b.textContent = t; b.style.cssText = 'font:800 17px -apple-system,system-ui,sans-serif;padding:13px 24px;border-radius:14px;border:0;color:#fff;background:' + bg; b.onclick = go; d.appendChild(b); }
      btn('Start fresh', '#5a54f0', function () { try { localStorage.removeItem('knotty.game'); } catch (e) { /* ignore */ } location.reload(); });
      btn('All games', '#6b7080', function () { location.href = '../../'; });
      document.body.appendChild(d);
    }
    if (document.body) put(); else document.addEventListener('DOMContentLoaded', put);
  }
  window.addEventListener('error', function (e) { fail((e.message || 'Something went wrong') + (e.lineno ? ' (line ' + e.lineno + ')' : '')); });
  setTimeout(function () { if (!window.__knReady) fail('It took too long to start.'); }, 30000);
})();
</script>

.toast { position: absolute; z-index: 3; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 80px); transform: translateX(-50%); max-width: 92%; text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: rgba(20,24,36,.84); color: #fff; font-weight: 700; font-size: 14px; padding: 8px 14px; border-radius: 14px; }
.toast.show { opacity: 1; }
/* the top row pills: level (with a thin bar: ropes free) and moves */
.pills { flex: 1 1 auto; min-width: 0; display: flex; justify-content: center; gap: 6px; }
.pills .ggpill { position: relative; font-size: 17px; padding: 4px 13px 6px; line-height: 18px; min-width: 0; overflow: hidden; text-align: center; white-space: nowrap; }
.pills button.ggpill { font-family: inherit; cursor: pointer; }
.pills .ggpill small { display: block; font-size: 10px; line-height: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; opacity: .6; }
.pills .ggpill i { font-style: normal; font-size: 13px; opacity: .6; }
.pills .ggpill .bar { position: absolute; left: 10px; right: 10px; bottom: 3px; height: 3px; border-radius: 2px; background: rgba(0,0,0,.1); overflow: hidden; }
.pills .ggpill .bar b { display: block; height: 100%; width: 0; background: #3fae4a; border-radius: 2px; transition: width .4s; }
.pills .ggpill.warn { background: #ffb020; color: #3a2400; }
.pills .ggpill.out { background: #ef3b4f; color: #fff; }
/* Restart / Undo / Hint float at the bottom, clear of the home bar */
html.gg-fs-over .toolbar { position: fixed; z-index: 5; left: calc(env(safe-area-inset-left, 0px) + 10px); right: calc(env(safe-area-inset-right, 0px) + 10px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); width: auto; max-width: 480px; margin: 0 auto; }
html.gg-fs-over .toolbar .tool { box-shadow: 0 4px 12px rgba(0,0,0,.18); }
html.gg-fs-over .toolbar .tool:not(.red) { background: rgba(255,255,255,.93); color: #1b2130; border-color: transparent; }
html.gg-fs-over .toolbar .tool:disabled { opacity: .55; }
.tool { position: relative; }
.tool .cnt { position: absolute; top: 4px; right: 8px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--gold); color: #3a2a00; font-style: normal; font-weight: 800; font-size: 12px; line-height: 20px; }
.tool.red .cnt { background: #ffffff; color: var(--accent); }
.cardicon svg { border-radius: 16px; }
.card .btn small { display: block; font-size: 12px; font-weight: 700; opacity: .8; }
.stars { display: flex; justify-content: center; gap: 6px; margin: 2px 0 4px; min-height: 0; }
.stars:empty { display: none; }
.stars svg { width: 40px; height: 40px; }
.stars svg.on { animation: knStar .5s cubic-bezier(.3,1.6,.5,1) both; }
.stars svg:nth-child(2) { animation-delay: .15s; transform: translateY(-6px); }
.stars svg:nth-child(3) { animation-delay: .3s; }
@keyframes knStar { from { transform: scale(0) rotate(-40deg); opacity: 0; } to { opacity: 1; } }

.helplist canvas { display: block; margin: 6px 0 2px; border-radius: 12px; }
.statsnote { color: var(--muted); text-align: center; margin: 4px 0 0; }
html[data-theme="dark"] .tippic { background: linear-gradient(#1d2a4a, #33456e); }

.stage, html.gg-fs-over, html.gg-fs-over body { background:#29261f; }

<script>
/* Knotty rules, solver and level maker (no DOM; runs in Node for tools/gen.js and tools/check.js).
   A board is a set of pegs on a grid (one cluster, or several clusters side by side). Each rope has two knobs (its two
   ends), each knob sits on its own peg; a peg holds at most one knob. A move: drag one knob to an EMPTY peg (the other
   end stays put). Goal: no two ropes cross.
   THE CROSSING RULE: a rope is the straight segment between its two pegs. Two ropes cross when the segments make a
   real X, or when a knob of one rope TOUCHES the other rope: the knob's centre is closer than 0.38 peg spacings to the
   other segment (the drawn knob radius 0.28 + half the drawn rope 0.10; exact integer test). That covers a rope
   running over a peg that holds another rope's knob, a rope grazing a knob, and two ropes overlapping along a line.
   Ropes never share a peg (one knob per peg). A rope may pass over an EMPTY peg; it only matters once a knob is put
   there. The game draws ropes so that what you see follows this rule (app.js: a free rope's sag is only as deep as
   it can be without touching another rope or knob; crossed ropes are drawn straight and taut).
   Twists: a rope can have a LENGTH LIMIT (its knobs may be at most sqrt(lim) apart, squared board units), and a knob
   can be PINNED (it never moves). Coordinates are integers: peg spacing 2, clusters 3 apart (1.5 spacings).
   Level string: "spec|ropes|lims|pins"
     spec  "w.h" (one cluster w x h) or "w.h.cx.cy" (cx x cy clusters of w x h)
     ropes 2 chars per rope (peg index in ALPH), first knob then second knob (knob k of rope r = r*2 + k)
     lims  one char per rope: '0' = no limit, else ALPH index = squared length limit
     pins  one char per pinned knob (ALPH index of the knob)
   Bank entry: [level string, minimum moves (proven by IDA*), crossings at start, solution as "kp kp ..."]. */
var KN = (function () {
  'use strict';
  var ALPH = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ-_';
  var SP = 2, GAP = 3, TOUCH = 0.38; // TOUCH: knob radius + half a rope, in peg spacings
  function ai(c) { return ALPH.indexOf(c); }

  // ---------------- boards ----------------
  var boards = {};
  function board(spec) {
    if (boards[spec]) return boards[spec];
    var p = spec.split('.').map(Number), w = p[0], h = p[1], cx = p[2] || 1, cy = p[3] || 1;
    var cwU = (w - 1) * SP, chU = (h - 1) * SP, pts = [], cl = [];
    for (var j = 0; j < cy; j++) for (var i = 0; i < cx; i++) {
      var x0 = i * (cwU + GAP), y0 = j * (chU + GAP); cl.push({ x0: x0, y0: y0, x1: x0 + cwU, y1: y0 + chU });
      for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) pts.push([x0 + x * SP, y0 + y * SP, cl.length - 1]);
    }
    pts.sort(function (a, b) { return a[1] - b[1] || a[0] - b[0]; });
    var B = { spec: spec, w: w, h: h, cx: cx, cy: cy, n: pts.length, px: pts.map(function (q) { return q[0]; }), py: pts.map(function (q) { return q[1]; }),
      pc: pts.map(function (q) { return q[2]; }), clusters: cl, W: cx * cwU + (cx - 1) * GAP, H: cy * chU + (cy - 1) * GAP };
    var n = B.n; B.d2 = new Int32Array(n * n);
    for (var a = 0; a < n; a++) for (var b = 0; b < n; b++) { var dx = B.px[a] - B.px[b], dy = B.py[a] - B.py[b]; B.d2[a * n + b] = dx * dx + dy * dy; }
    boards[spec] = B; return B;
  }

  // ---------------- geometry: the crossing rule ----------------
  function orient(ax, ay, bx, by, cx, cy) { var v = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax); return v > 0 ? 1 : v < 0 ? -1 : 0; }
    // a knob at p touches rope ab: p lies within TOUCH of the segment, beside it (not past its ends).
  // TOUCH^2 = 29/50 board units^2 (0.38 of a peg spacing) = knob radius (0.28) + half a rope (0.10) as drawn.
  function touch(px, py, ax, ay, bx, by) {
    var vx = bx - ax, vy = by - ay, wx = px - ax, wy = py - ay, dot = vx * wx + vy * wy, L2 = vx * vx + vy * vy;
    if (dot <= 0 || dot >= L2) return false;
    var cr = vx * wy - vy * wx; return 50 * cr * cr < 29 * L2;
  }
  // ropes ab and cd cross: a real X, or a knob of one touching the other rope (this also covers a rope running
  // through a knob's peg and two ropes overlapping along one line). Knobs are never on the same peg.
  function segX(ax, ay, bx, by, cx, cy, dx, dy) {
    var o1 = orient(ax, ay, bx, by, cx, cy), o2 = orient(ax, ay, bx, by, dx, dy), o3 = orient(cx, cy, dx, dy, ax, ay), o4 = orient(cx, cy, dx, dy, bx, by);
    if (o1 * o2 < 0 && o3 * o4 < 0) return true;
    return touch(cx, cy, ax, ay, bx, by) || touch(dx, dy, ax, ay, bx, by) || touch(ax, ay, cx, cy, dx, dy) || touch(bx, by, cx, cy, dx, dy);
  }
  function ropesX(B, a, b, c, d) { var X = B.px, Y = B.py; return segX(X[a], Y[a], X[b], Y[b], X[c], Y[c], X[d], Y[d]); }
  // crossing masks: m[r] has bit j set when ropes r and j cross

<script>
/* Knotty art: everything drawn in code on a 2D canvas.
   Ropes: a thick twisted rope (dark edge, base colour, diagonal twist stripes, a soft top highlight) with a soft shadow
   under it; a free rope gets a soft white glow and hangs in a gentle sag, a crossed rope is pulled straight and taut
   with a faint red strain line. Knobs: glossy coloured balls with a little pin in the middle (pinned knobs: a steel
   bolt and ring). Pegs: grey holes in rounded board panels. Scenes: four soft skies that rotate by level (morning,
   peach, seafoam, lilac), each with clouds, hills and a calm sea; night versions in the dark theme; Halloween: dusk,
   moon, pumpkins and bats. */
var KA = (function () {
  'use strict';
  // 12 rope colours: [base, dark, light]
  var COLORS = [
    ['#ef3b4f', '#a5172a', '#ff9aa6'], ['#2f74f0', '#1a3f9c', '#9cc6ff'], ['#ffc21e', '#c08300', '#fff0a0'], ['#35b44a', '#1d7a2e', '#a6ee9e'],
    ['#9b4fe0', '#5f2496', '#d6b0ff'], ['#ff8a1e', '#b85400', '#ffd09a'], ['#18b6b0', '#0b6f6c', '#9ff0e8'], ['#ff5fa8', '#b8246a', '#ffc0dc'],
    ['#8a5a32', '#54331a', '#d8b08a'], ['#f4f4f4', '#9aa3ad', '#ffffff'], ['#2b3548', '#0f1522', '#7b879c'], ['#a6d63a', '#62881a', '#e2ff9a']];
  var NAMES = ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange', 'Teal', 'Pink', 'Brown', 'White', 'Navy', 'Lime'];

  // ---------------- symbols (white shapes for colour blindness) ----------------

    x.beginPath();
    switch (i % 12) {

    function rp(a, b, c2, o) { var pts = []; for (var i = 0; i <= 10; i++) pts.push([a[0] + (b[0] - a[0]) * i / 10, a[1] + (b[1] - a[1]) * i / 10 + (o && o.sag ? Math.sin(Math.PI * i / 10) * o.sag : 0)]); KA.rope(x, pts, rw, c2, o || {}); }
    if (k === 'clusters') {
      KA.panel(x, 14, 18, 92, 84, 14, dk); KA.panel(x, 134, 18, 92, 84, 14, dk);
      [[40, 44], [80, 44], [40, 80], [80, 80], [160, 44], [200, 44], [160, 80], [200, 80]].forEach(function (p) { pg(p[0], p[1]); });
      rp([80, 44], [160, 80], 1, { free: true, sag: 6 }); rp([40, 80], [80, 80], 3, { free: true, sag: 3 });
      KA.knob(x, 80, 44, kr, 1, {}); KA.knob(x, 160, 80, kr, 1, {}); KA.knob(x, 40, 80, kr, 3, {}); KA.knob(x, 80, 80, kr, 3, {});
      return;
    }
    KA.panel(x, 14, 14, 212, 92, 16, dk);
    for (var i2 = 0; i2 < 5; i2++) for (var j2 = 0; j2 < 2; j2++) pg(40 + i2 * 40, 40 + j2 * 40);
    if (k === 'limit') {
      x.save(); x.setLineDash([5, 5]); x.strokeStyle = KA.COLORS[0][1]; x.lineWidth = 2; x.beginPath(); x.arc(80, 80, 57, 0, Math.PI * 2); x.stroke(); x.restore();
      rp([80, 80], [120, 40], 0, {}); KA.ferrule(x, 80, 80, 120, 40, rw, kr * 1.55); KA.ferrule(x, 120, 40, 80, 80, rw, kr * 1.55);
      KA.knob(x, 80, 80, kr, 0, { pinned: false }); KA.knob(x, 120, 40, kr, 0, { lift: 1 });
      x.fillStyle = 'rgba(30,40,60,.3)'; [[200, 40], [200, 80], [160, 80]].forEach(function (p) { x.beginPath(); x.arc(p[0], p[1], 6, 0, Math.PI * 2); x.fill(); });
    } else if (k === 'pin') {
      rp([40, 40], [160, 80], 4, { tense: true }); rp([120, 40], [80, 80], 2, { tense: true });
      KA.knob(x, 40, 40, kr, 4, { pinned: true }); KA.knob(x, 160, 80, kr, 4, {}); KA.knob(x, 120, 40, kr, 2, {}); KA.knob(x, 80, 80, kr, 2, {});
    } else {
      rp([40, 40], [200, 40], 6, { free: true, sag: 6 }); rp([40, 80], [160, 80], 5, { free: true, sag: 5 });
      KA.knob(x, 40, 40, kr, 6, {}); KA.knob(x, 200, 40, kr, 6, {}); KA.knob(x, 40, 80, kr, 5, {}); KA.knob(x, 160, 80, kr, 5, {});
    }
  }
  function nextTip() {
    if (!tipQueue.length || !meta.seen) return;
    var k = tipQueue.shift(); meta.tips[k] = 1; saveMeta();
    $('tipTitle').textContent = 'New: ' + TIPS[k][0]; $('tipText').textContent = TIPS[k][1];
    tipPic(k); $('ovTip').classList.add('show');
  }
  function openHelp() {
    $('helpList').innerHTML = [
      '<b>Drag a knob</b> (the round grip at the end of a rope) to an <b>empty peg</b>. The rope stretches after your finger and the knob snaps onto the nearest free peg. You can also <b>tap a knob</b>, then tap a peg.',
      '<b>Untangle every rope:</b> no two ropes may cross. A rope that crosses nothing <b>relaxes and briefly glows</b>; a crossed rope is pulled tight.',
      'A rope also counts as crossed when it <b>touches another rope’s knob</b> (it runs over that peg). Ropes may pass over empty pegs.',
      'Fewer moves, more stars: <b>3 stars</b> for the best number of moves (shown at the top), 2 for close to it. Every level can be done in its best.',
      'Helpers: <b>Undo</b> (as often as you like, gives the move back), <b>Hint</b> (moves one knob along a shortest way; 3 per level, each costs a star), <b>Restart</b>.',
      'It gets harder: more ropes, bigger boards, <b>short ropes</b> (metal clamps: they only stretch so far), <b>pinned ends</b> (a steel bolt: they can’t move), <b>several boards</b>, and from level 30 a <b>move limit</b>.',
      'Settings: <b>Knob symbols</b> put a small shape on every knob, so colours are easy to tell apart.',
      '300 levels are built in, then new ones are made on the phone, without end.'
    ].map(function (x) { return '<li>' + x + '</li>'; }).join('');
    $('ovHelp').classList.add('show');
  }
  function renderStats() {
    var lv = Object.keys(meta.stars).length;
    $('statsBody').innerHTML = '<div class="tiles"><div class="tile"><b>' + fmt(stats.cleared) + '</b><span>Levels untangled</span></div><div class="tile"><b>' + fmt(stats.stars) + '</b><span>Stars</span></div><div class="tile"><b>' + fmt(stats.three) + '</b><span>3-star levels</span></div></div>' +
      '<div class="tiles"><div class="tile"><b>' + fmt(stats.moves) + '</b><span>Moves</span></div><div class="tile"><b>' + fmt(stats.freed) + '</b><span>Ropes freed</span></div><div class="tile"><b>' + fmt(stats.undos) + '</b><span>Undos</span></div></div>' +
      '<div class="tiles"><div class="tile"><b>' + fmt(stats.hints) + '</b><span>Hints</span></div><div class="tile"><b>' + fmt(stats.restarts) + '</b><span>Restarts</span></div><div class="tile"><b>' + fmt(meta.level) + '</b><span>Next level</span></div></div>' +
      '<p class="statsnote">' + fmt(lv) + ' different levels finished' + (stats.conts ? ' · ' + fmt(stats.conts) + ' Continues' : '') + '</p>';
  }

  // ================= wiring =================
  function syncSound() { $('btnSound').innerHTML = '<svg viewBox="0 0 24 24"><use href="#i-sound-' + (settings.sound ? 'on' : 'off') + '"/></svg>'; $('btnSound').classList.toggle('on', settings.sound); $('setSound').checked = settings.sound; S.setEnabled(settings.sound); }
  function syncAds() { $('setAds').checked = Goobs.adsOn(); $('adEvery').textContent = settings.adEvery; $('rowAdEvery').classList.toggle('off', !Goobs.adsOn()); }
  function sheet(btn, ov, close, onOpen) {
    if (btn) $(btn).addEventListener('click', function () { if (onOpen) onOpen(); $(ov).classList.add('show'); });
    $(close).addEventListener('click', function () { $(ov).classList.remove('show'); });
    $(ov).addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  }
  function init() {
    Goobs.fullscreen({ overlay: true, menu: ['btnHelp', 'btnStats', 'btnSettings'], info: function () {
      if (!g) return '';
      var nf = free.filter(Boolean).length, st = meta.stars[g.level];
      return '<b>Level ' + fmt(g.level) + '</b> · ' + nf + ' of ' + g.R + ' ropes free · ' + g.used + ' move' + (g.used === 1 ? '' : 's') + (g.limit ? ' of ' + g.limit : '') + ' (best ' + g.best + ')' + (st ? ' · ' + '★★★'.slice(0, st) : '') + ' · ' + KA.SCENES[sceneNo].name;
    } });
    Goobs.themePicker($('themes'));
    Goobs.onTheme(function () { drawBg(); KA.fxInit(sceneNo, W, H, Goobs.theme(), Goobs.skin()); });
    cv = $('cv'); cx = cv.getContext('2d'); bg = $('bg'); bx = bg.getContext('2d');
    cv.addEventListener('pointerdown', down);
    cv.addEventListener('pointermove', moveEv);
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
    cv.addEventListener('lostpointercapture', function (e) { if (drag && e.pointerId === drag.pid) up({ pointerId: e.pointerId, type: 'pointercancel' }); });
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) { document.addEventListener(ev, function () { S.unlock(); }, { passive: true }); });
    $('btnHome').addEventListener('click', function () { save(); Goobs.home(); });
    $('btnRestart').addEventListener('click', function () { if (!g || ending) return; if (g.hist.length || g.hints) showCard('Restart this level?', 'The ropes go back to where they started.', [{ label: 'Restart', red: true, go: restart }, { label: 'Keep playing', go: function () {} }]); });
    $('btnUndo').addEventListener('click', undo);
    $('btnHint').addEventListener('click', hint);
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings');
    sheet('btnStats', 'ovStats', 'btnCloseStats', renderStats);
    function closeHelp() { $('ovHelp').classList.remove('show'); if (!meta.seen) { meta.seen = true; saveMeta(); nextTip(); } }
    $('btnHelp').addEventListener('click', openHelp);
    $('btnCloseHelp').addEventListener('click', closeHelp);
    $('ovHelp').addEventListener('click', function (e) { if (e.target === this) closeHelp(); });
    $('pillLevel').addEventListener('click', openHelp);
    function closeTip() { $('ovTip').classList.remove('show'); setTimeout(nextTip, 200); }
    $('btnTip').addEventListener('click', closeTip);
    $('ovTip').addEventListener('click', function (e) { if (e.target === this) closeTip(); });
    $('btnSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncSound(); S.ding(); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); syncSound(); S.ding(); });
    $('setMusic').checked = settings.music;
    $('setMusic').addEventListener('change', function () { settings.music = this.checked; saveSettings(); S.setMusic(settings.music); });
    $('setSymbols').checked = settings.symbols;
    $('setSymbols').addEventListener('change', function () { settings.symbols = this.checked; saveSettings(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncAds(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncAds(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncAds(); });
    if (window.ResizeObserver) { var ro = new ResizeObserver(fit); ro.observe($('stagewrap')); ro.observe(document.querySelector('.toolbar')); ro.observe(document.querySelector('.top')); }
    window.addEventListener('resize', fit);
    document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });
    window.addEventListener('pagehide', save);
    syncSound(); syncAds(); if (settings.music) S.setMusic(true);
    fit();
    if (!load()) startLevel(meta.level);
    fit();
    if (!meta.seen) openHelp();
    requestAnimationFrame(frame);
    window.__knReady = true;
    Goobs.markPlayed('knotty');
    Goobs.initUpdates({ beforeReload: save, onVersions: function (v) { $('version').textContent = 'Knotty ' + (v.knotty || '1.0.0') + ' · Goobs-Games ' + (v.shell || '?'); } });
  }
  // hook for automated tests
  window.__knotty = { get g() { return g; }, get L() { return L; }, get FR() { return FR; }, get sag() { return sag; }, get free() { return free; }, KN: KN,
    startLevel: startLevel, undo: undo, hint: hint, restart: restart, outOfMoves: outOfMoves, ending: function () { return ending; }, busy: busy,
    meta: function () { return meta; }, stats: function () { return stats; }, sel: function () { return sel; },
    // client coordinates of knob k / peg p
    knob: function (k) { var P = pegXY(g.pos[k]), r = cv.getBoundingClientRect(); return { x: r.left + P.x, y: r.top + P.y }; },
    peg: function (p) { var P = pegXY(p), r = cv.getBoundingClientRect(); return { x: r.left + P.x, y: r.top + P.y }; },
    // a shortest solution from here (the level's own while on it, else the exact search)
    solution: function () {
      var e = entryFor(levelNo), sol = KN.solOf(e), st = KN.create(e[0]);
      for (var i = 0; i <= sol.length; i++) { if (st.pos.join(',') === g.pos.join(',')) return sol.slice(i); if (i < sol.length) st.pos[sol[i][0]] = sol[i][1]; }
      var ex = KN.solveState(g.spec, g.pos, g.lim, g.pins, { maxNodes: 2000000, maxDepth: 30 }); return ex ? ex.moves : null;
    } };
  KnottyWorkshop.ready.then(init).catch(function(e){window.dispatchEvent(new ErrorEvent("error",{message:e.message}));});
})();
</script>
