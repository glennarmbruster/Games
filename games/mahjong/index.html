<style>
/* Tile Temple styles (themes, UI kit and ad cards come from /shared/goobs.css) */
:root { --tt-table: #dff1e8; --tt-table-2: #cfe9dc; }
:root[data-theme="dark"] { --tt-table: #16241e; --tt-table-2: #1b2c24; }
:root[data-theme="blue"] { --tt-table: #10283f; --tt-table-2: #143250; }
.brand svg { border-radius: 10px; }
.brand h1 { font-size: 23px; }
.info .mid .of { color: var(--muted); font-weight: 600; }

.stagewrap { flex: 1 1 auto; min-height: 0; width: calc(100% + 20px); margin: 0 -10px; display: flex; align-items: center; justify-content: center; }
.stage { position: relative; width: 100%; height: 100%; border-radius: 16px; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, var(--tt-table), var(--tt-table-2)); touch-action: manipulation; }
.stage canvas { display: block; width: 100%; height: 100%; }
.toast {
  position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); max-width: 88%; text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: rgba(20,24,36,.78); color: #fff; font-weight: 700; font-size: 14px; padding: 7px 13px; border-radius: 14px;
}
.toast.show { opacity: 1; }
.toolbar .tool.hot { background: var(--accent); color: var(--accent-ink); }

.layouts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.layouts button { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 10px 8px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--ink); }
.layouts button.cur { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.layouts canvas { width: 100%; height: 76px; }
.layouts button.tall canvas { height: 112px; }
/* 1.3.0: Tall / Wide group headings in the layout picker */
.layouts .lgroup { grid-column: 1 / -1; margin: 6px 2px -2px; font-size: 17px; color: var(--ink); }
.layouts .lgroup small { font-size: 13px; font-weight: 600; color: var(--muted); }
.layouts b { font-size: 16px; }
.layouts small { font-size: 12px; color: var(--muted); font-weight: 600; }
.cardicon svg { border-radius: 16px; }
@media (max-width: 385px) { .brand h1 { font-size: 21px; } }
.toolbar .tool span { white-space: nowrap; }
/* the matching box */
.tray { display: none; flex: none; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 6px; border-radius: 16px;
  background: linear-gradient(#b87a45, #9a6232); box-shadow: inset 0 2px 6px rgba(0,0,0,.35), 0 2px 0 rgba(255,255,255,.35); }
.tray.show { display: flex; }
.tray .slot { flex: none; border-radius: 8px; background: rgba(0,0,0,.22); box-shadow: inset 0 1px 3px rgba(0,0,0,.35); display: grid; place-items: center; }
.tray .slot.tile { background: #fbf7ef; box-shadow: 3px 3px 0 #1b7457, 0 0 0 1px rgba(120,105,80,.35); overflow: hidden; }
.tray .slot.tile canvas { display: block; }
.tray .slot.in { animation: trayin .25s ease-out; }
.tray .slot.out { animation: trayout .26s ease-in forwards; }
.tray .slot.locked { background: rgba(0,0,0,.12); border: 2px dashed rgba(255,255,255,.4); box-shadow: none; }
.tray .slot.locked span { color: rgba(255,255,255,.75); font-weight: 900; font-size: 22px; }
@keyframes trayin { from { transform: translateY(-30px) scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes trayout { 0% { transform: scale(1); } 40% { transform: scale(1.15); background: #ffe79a; } 100% { transform: scale(.3); opacity: 0; } }
/* 1.3.0: zoomed in, this pill (or a double tap) goes back to the whole board */
.zoomhint { position: absolute; right: 10px; top: 10px; border: 0; background: rgba(20,24,36,.66); color: #fff; font: inherit; font-weight: 800; font-size: 13px; padding: 7px 12px; border-radius: 14px; display: none; }
.zoomhint.show { display: block; }
/* sideways: the board takes the left, the numbers and buttons stack on the right */
@media (orientation: landscape) and (max-height: 540px) {
  .app { max-width: none; display: grid; grid-template-columns: 1fr 132px; grid-template-rows: auto 1fr; gap: 6px 10px; align-items: stretch;
    padding: calc(env(safe-area-inset-top, 0px) + 4px) calc(env(safe-area-inset-right, 0px) + 10px) calc(env(safe-area-inset-bottom, 0px) + 6px) calc(env(safe-area-inset-left, 0px) + 10px); }
  .top { grid-column: 1 / span 2; grid-row: 1; min-height: 40px; } /* full screen: the counters are pills in the top row, so it spans both columns */
  .app { grid-template-rows: auto 1fr auto; }
  .stagewrap { grid-column: 1; grid-row: 2; width: 100%; margin: 0; }
  .tray { grid-column: 1; grid-row: 3; padding: 4px; }
  .toolbar { grid-column: 2; grid-row: 2 / span 2; flex-direction: column; justify-content: flex-end; }
  .toolbar .tool { flex: 1; min-height: 0; max-height: 58px; flex-direction: row; gap: 6px; font-size: 14px; }
}
/* full screen (kit): the counters are pills in the top row, so the game's name is hidden there (the Menu shows it).
   Upright, the table runs to the very edges of the screen: the Turtle is 15 tiles across, so its size is set by the width. */
html.gg-fs .top .brand h1 { display: none; }
html.gg-fs .top .brand { flex: none; }
.ttpills { flex: 1 1 auto; width: auto; min-width: 0; min-height: 0; justify-content: flex-end; gap: 6px; padding: 0; cursor: pointer; }
.ttpills .ggpill { overflow: hidden; text-overflow: ellipsis; }
.ttpills.tight .ggpill { padding-left: 7px; padding-right: 7px; }
.ttpills.tight .ggpill small { display: none; }
.ttpills .ggpill small { font-size: 13px; font-weight: 700; color: var(--muted); }
.ttpills .ggpill.full { color: var(--bad); }
.ttpills .ggpill { flex: none; }
@media (max-width: 385px) { .ttpills { gap: 4px; } .ttpills .ggpill { padding: 7px 8px; font-size: 15px; } } /* three pills fit on an SE */
@media not all and (orientation: landscape) and (max-height: 540px) {
  html.gg-fs .stagewrap { width: auto; align-self: stretch; margin: 0 calc(-8px - env(safe-area-inset-right, 0px)) 0 calc(-8px - env(safe-area-inset-left, 0px)); }
  html.gg-fs .stage { border-radius: 0; }
}
/* Local cloth table; tile sizes, touch geometry and zoom are unchanged. */
:root { --tt-table:#37745b; --tt-table-2:#214c3c; }
.stage { background-image:radial-gradient(ellipse at 40% 20%,var(--tt-table),var(--tt-table-2)),url('assets/cloth-v1.webp'); background-size:auto,160px; background-blend-mode:multiply; box-shadow:inset 0 0 24px #0002; }
.tray { background:linear-gradient(160deg,#ae865d,#785235); box-shadow:inset 0 1px #ffffff55,inset 0 3px 8px #0005; }
.tray .slot.tile { background:linear-gradient(145deg,#fffdf6,#e9dfcb); }

<script>
/* Tile Temple logic: Mahjong solitaire. Layouts, the 144 tiles, which tiles are free, deals that can always be
   cleared (built by taking pairs off a full board, so the order they came off is a solution), hints, shuffles.
   Positions are in half-tile steps: a tile at (x, y, z) covers x..x+2 and y..y+2 on layer z. Runs in Node. */
var MJ = (function () {
  'use strict';
  // ---------- the tiles ----------
  // faces: dots d1-d9, bamboo b1-b9, characters c1-c9 (4 of each), winds wE wS wW wN, dragons dr dg dw (4 of each),
  // flowers f1-f4 and seasons s1-s4 (one of each; any flower matches any flower, any season any season)
  var FACES = [];
  ['d', 'b', 'c'].forEach(function (s) { for (var i = 1; i <= 9; i++) FACES.push(s + i); });
  FACES = FACES.concat(['wE', 'wS', 'wW', 'wN', 'dr', 'dg', 'dw']);
  var FLOWERS = ['f1', 'f2', 'f3', 'f4'], SEASONS = ['s1', 's2', 's3', 's4'];
  function group(f) { return /^f[1-4]$/.test(f) ? 'flower' : /^s[1-4]$/.test(f) ? 'season' : f; }
  function matches(a, b) { return group(a) === group(b); }
  // the 72 pairs of a full set: two pairs of each normal face, flowers and seasons paired among themselves
  function allPairs() {
    var p = [];
    FACES.forEach(function (f) { p.push([f, f], [f, f]); });
    p.push(['f1', 'f2'], ['f3', 'f4'], ['s1', 's2'], ['s3', 's4']);
    return p;
  }

  // ---------- layouts ----------
  function rect(out, x0, y0, w, h, z) { for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) out.push([(x0 + x) * 2, (y0 + y) * 2, z]); }
  function row(out, x0, n, y, z) { for (var x = 0; x < n; x++) out.push([(x0 + x) * 2, y * 2, z]); }
  // a layer drawn as text: '#' is a tile at that column; lines start at row y0 (1.3.0's tall layouts)
  function art(out, z, y0, lines) { lines.forEach(function (s, r) { for (var c = 0; c < s.length; c++) if (s[c] === '#') out.push([c * 2, (y0 + r) * 2, z]); }); }
  var LAYOUTS = [
    { id: 'turtle', name: 'Turtle', build: function () {
      // the classic shape (traditional): 87 on the bottom, 36, 16, 4, then 1 on top
      var t = [];
      row(t, 1, 12, 0, 0); row(t, 3, 8, 1, 0); row(t, 2, 10, 2, 0); row(t, 1, 12, 3, 0); row(t, 1, 12, 4, 0); row(t, 2, 10, 5, 0); row(t, 3, 8, 6, 0); row(t, 1, 12, 7, 0);
      t.push([0, 7, 0], [26, 7, 0], [28, 7, 0]);
      rect(t, 4, 1, 6, 6, 1); rect(t, 5, 2, 4, 4, 2); rect(t, 6, 3, 2, 2, 3);
      t.push([13, 7, 4]);
      return t;
    } },
    { id: 'pyramid', name: 'Pyramid', build: function () {
      var t = []; rect(t, 0, 0, 10, 7, 0); rect(t, 1, 1, 8, 5, 1); rect(t, 2, 2, 6, 3, 2); rect(t, 3, 3, 4, 1, 3);
      return t; // 70 + 40 + 18 + 4 = 132
    } },
    { id: 'fortress', name: 'Fortress', build: function () {
      var t = [];
      rect(t, 0, 0, 12, 8, 0);                                    // 96
      [[0, 0], [10, 0], [0, 6], [10, 6]].forEach(function (c) { rect(t, c[0], c[1], 2, 2, 1); rect(t, c[0], c[1], 2, 2, 2); }); // towers: 32

    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); syncSound(); S.ding(); });
    $('setDim').checked = settings.dim; $('setIdx').checked = settings.idx; $('setBox').checked = settings.box;
    $('setBox').addEventListener('change', function () { settings.box = this.checked; saveSettings(); toast(settings.box ? 'The box is on from your next game.' : 'The box is off from your next game.'); });
    $('tray').addEventListener('click', function (e) { if (e.target.closest('.locked')) toast('When the box is full and nothing matches, you can watch an ad for these 2 spaces.'); });
    $('setDim').addEventListener('change', function () { settings.dim = this.checked; saveSettings(); draw(); });
    $('setIdx').addEventListener('change', function () { settings.idx = this.checked; saveSettings(); faceCache = {}; trayCache = {}; draw(); renderTray(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncAds(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncAds(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncAds(); });
    if (window.ResizeObserver) { new ResizeObserver(layoutBoard).observe($('stage')); new ResizeObserver(function () { renderTray(); }).observe($('tray')); }
    window.addEventListener('resize', layoutBoard);
    // iOS reports the new size a little after it turns: fit again once it has settled
    window.addEventListener('orientationchange', function () { setTimeout(layoutBoard, 120); setTimeout(layoutBoard, 450); setTimeout(function () { layoutBoard(); renderTray(); }, 900); });
    $('zoomhint').addEventListener('click', function (e) { e.stopPropagation(); resetView(); });
    document.addEventListener('visibilitychange', function () { tick(); if (document.hidden) saveGame(); });
    window.addEventListener('pagehide', function () { tick(); saveGame(); });
    syncSound(); syncAds();
    if (!loadGame()) newGame(meta.layout); else { layoutBoard(); renderAll(); }
    if (!meta.seen) openHelp();
    else if (tallNews) toast(g && MJ.BY_ID[g.layout].tall ? 'New: tall layouts made for an upright phone.' : 'New: tall layouts with bigger tiles (Menu → New).');
    lastTick = performance.now();
    requestAnimationFrame(loop);
    Goobs.markPlayed('mahjong');
    Goobs.initUpdates({
      beforeReload: function () { tick(); saveGame(); },
      onVersions: function (v) { $('version').textContent = 'Tile Temple ' + (v.mahjong || '?') + ' · Goobs-Games ' + (v.shell || '?'); }
    });
  }

  // hook for automated tests
  window.__tt = { get view() { return view; }, get g() { return g; }, MJ: MJ, take: function (a, b) { take(a, b); }, resetView: resetView, hitAt: function (x, y) { return hit(x, y); }, layoutBoard: function () { layoutBoard(); }, phoneUpright: phoneUpright, hint: hint, undo: undo, shuffle: shuffle, newGame: newGame, stats: function () { return stats; }, pos: function (i) { return pos(i); }, B: function () { return B; } };

  init();
})();
</script>
