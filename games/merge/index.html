<title>Number Nook</title>
<style>
/* Number Nook styles (themes, UI kit and ad cards come from /shared/goobs.css) */
:root {
  --nn-board: #d9ddef; --nn-cell: #eceef8; --nn-ink: #3b3f73;
  --tr-board: #cfe3e8; --tr-cell: #e3f0f2;
}
:root[data-theme="dark"] { --nn-board: #1d2030; --nn-cell: #272b3e; --tr-board: #16272c; --tr-cell: #1f3338; }
:root[data-theme="blue"] { --nn-board: #13284a; --nn-cell: #1b335a; --tr-board: #123040; --tr-cell: #1a3d50; }

.brand svg { border-radius: 10px; }
.brand h1 { font-size: 20px; letter-spacing: -.3px; white-space: nowrap; }
@media (max-width: 385px) { .brand h1 { font-size: 18px; } }
.modes button { white-space: nowrap; }

/* board sizes (Classic only) */
.sizes { display: flex; gap: 6px; width: 100%; justify-content: center; flex: none; }
.sizes button {
  flex: 1; max-width: 76px; height: 30px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
  color: var(--muted); font-weight: 700; font-size: 14px; padding: 0;
}
.sizes button.on { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.sizes.hide { display: none; }

/* next card (Trios) */
.nextbox { display: flex; align-items: center; gap: 10px; }
.nextcard {
  width: 30px; height: 40px; border-radius: 7px; display: grid; place-items: center; font-weight: 900; font-size: 13px;
  box-shadow: 0 3px 0 rgba(0,0,0,.18); transition: background .15s;
}
.nextcard.bonus { width: auto; min-width: 30px; padding: 0 6px; font-size: 12px; }

/* board */
.boardwrap { position: relative; width: min(calc(100vw - 28px), calc(100vh - 330px), 540px); aspect-ratio: 1 / 1; flex: none; }
@supports (height: 100dvh) { .boardwrap { width: min(calc(100vw - 28px), calc(100vh - 330px), 540px); }@supports(height:100dvh){.boardwrap{width: min(calc(100vw - 28px), calc(100dvh - 330px), 540px);}} }
.board { position: absolute; inset: 0; border-radius: 16px; background: var(--nn-board); box-shadow: var(--shadow); touch-action: none; overflow: hidden; }
.board.trios { background: var(--tr-board); }
.bg, .layer { position: absolute; inset: 0; }
.bg i { position: absolute; border-radius: 10%; background: var(--nn-cell); }
.board.trios .bg i { background: var(--tr-cell); border-radius: 12%; }
.layer { pointer-events: none; }

/* tiles: positioned with transform so moves can animate */
.tl {
  position: absolute; left: 0; top: 0; display: grid; place-items: center; border-radius: 10%;
  font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -.5px; line-height: 1;
  transition: transform .11s ease-in-out; will-change: transform; user-select: none; -webkit-user-select: none;
}
.tl.nt { transition: none; }
.tl span { display: block; }
.tl.pop span, .tl.pop { animation: tpop .2s ease-out; }
@keyframes tpop { 0% { scale: 1; } 45% { scale: 1.16; } 100% { scale: 1; } }
.tl.appear { animation: tappear .18s ease-out both; }
@keyframes tappear { 0% { scale: 0; opacity: 0; } 100% { scale: 1; opacity: 1; } }

/* Classic colors (our own palette) */
.c2 { background: #eef1ff; color: #3b3f73; }
.c4 { background: #dbe2ff; color: #3b3f73; }
.c8 { background: #ffc46b; color: #fff; }
.c16 { background: #ffa24d; color: #fff; }
.c32 { background: #ff7a59; color: #fff; }
.c64 { background: #ff4f6a; color: #fff; }
.c128 { background: #c77dff; color: #fff; box-shadow: 0 0 10px 1px rgba(199,125,255,.45); }
.c256 { background: #9a6bff; color: #fff; box-shadow: 0 0 12px 2px rgba(154,107,255,.5); }
.c512 { background: #5a7cff; color: #fff; box-shadow: 0 0 14px 2px rgba(90,124,255,.5); }
.c1024 { background: #25b5f0; color: #fff; box-shadow: 0 0 16px 3px rgba(37,181,240,.55); }
.c2048 { background: #16cf97; color: #fff; box-shadow: 0 0 20px 4px rgba(22,207,151,.6); }
.cbig { background: #1b1f3a; color: #ffd66b; box-shadow: 0 0 18px 3px rgba(255,214,107,.4); }
:root[data-theme="dark"] .c2, :root[data-theme="blue"] .c2 { background: #dfe3f7; }

/* Trios cards: a thick bottom edge, like a playing card lying on the table */
.board.trios .tl { border-radius: 12%; box-shadow: 0 4px 0 rgba(0,0,0,.2); }
.t1 { background: #4fa8ff; color: #fff; box-shadow: 0 4px 0 #2e7fd1 !important; }
.t2 { background: #ff5f7e; color: #fff; box-shadow: 0 4px 0 #d23d5c !important; }
.t3 { background: #fffdf7; color: #2b2f4a; box-shadow: 0 4px 0 #e0c98f !important; }
.t3.hi { color: #ff4f6a; }
.nextcard.t3 { color: transparent; }

.floats { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.float {
  position: absolute; left: 70px; top: -44px; font-weight: 900; font-size: 22px; color: var(--accent);
  animation: rise .8s ease-out forwards;
}
@keyframes rise { 0% { opacity: 0; transform: translateY(10px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-24px); } }
.spacer { flex: 1; min-height: 0; }
.cardicon svg { border-radius: 16px; }
.tally { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }
.tally span { background: var(--surface-2); border-radius: 8px; padding: 3px 8px; font-size: 13px; font-weight: 700; }

/* Chain Cube (3D) */
.chainwrap { position: relative; width: 100%; flex: 1 1 auto; min-height: 260px; border-radius: 18px; overflow: hidden; display: none;
  background: linear-gradient(#bfe3ff, #eef6ff 60%, #f4f5f9); box-shadow: var(--shadow); }
:root[data-theme="dark"] .chainwrap { background: linear-gradient(#1b2340, #262d4a 60%, #1a1d25); }
:root[data-theme="blue"] .chainwrap { background: linear-gradient(#143260, #1c3d6e 60%, #13233b); }
.chainwrap.show { display: block; }
.chainwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.chainmsg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-weight: 700; }
.chainmsg.hide { display: none; }
.app.chainmode .boardwrap, .app.chainmode .sizes, .app.chainmode .spacer { display: none; }
.app.chainmode #btnUndo { display: none; }
.nextcube { width: 32px; height: 32px; border-radius: 7px; display: grid; place-items: center; font-weight: 900; font-size: 13px; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
#cfloats .float { left: 50%; top: 18%; transform: translateX(-50%); }

/* Full screen (1.2.0, Glenn: "every game full screen"): the board is as big as the free box (.ggfit) allows, the Chain
   Cube tray fills that box; Undo stays at the bottom, the rest is in the Menu. */
html.gg-fs .boardwrap { width: min(100cqw, 100cqh, 720px); }
html.gg-fs .chainwrap { position: absolute; inset: 0; min-height: 0; width: auto; }
html.gg-fs .spacer { display: none; }
html.gg-fs .app.chainmode .toolbar { display: none; }
</style>

<script>
/* Number Nook game logic (no DOM). Each mode follows its best-known original as closely as possible.
   Tiles are objects { id, v } so the screen can animate each one from where it was to where it went.
   Directions: 0 up, 1 right, 2 down, 3 left. */
var NN = (function () {
  'use strict';
  function rnd() { try { return crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296; } catch (e) { return Math.random(); } }
  function mkState(n) { var g = { n: n, cells: [], nextId: 1, score: 0 }; for (var i = 0; i < n * n; i++) g.cells.push(null); return g; }
  function tile(g, v) { return { id: g.nextId++, v: v }; }
  function empties(g) { var e = []; for (var i = 0; i < g.cells.length; i++) if (!g.cells[i]) e.push(i); return e; }
  // the cells of each line, listed from the edge the tiles move toward
  function lines(n, dir) {
    var out = [];
    for (var a = 0; a < n; a++) {
      var L = [];
      for (var b = 0; b < n; b++) {
        var r, c;
        if (dir === 0) { r = b; c = a; } else if (dir === 2) { r = n - 1 - b; c = a; }
        else if (dir === 3) { r = a; c = b; } else { r = a; c = n - 1 - b; }
        L.push(r * n + c);
      }
      out.push(L);
    }
    return out;
  }
  function maxTile(g) { var m = 0; g.cells.forEach(function (t) { if (t && t.v > m) m = t.v; }); return m; }

  // ================= Classic 2048 =================
  // Swipe: every tile slides as far as it can; two equal tiles that meet merge once per move.
  // After a move that changed the board, a 2 (90%) or a 4 (10%) appears in a random empty cell.
  // Score = the sum of every merged tile. Reaching 2048 wins; you may keep going. No move left = game over.
  var classic = {
    WIN: 2048,
    create: function (n) { var g = mkState(n || 4); g.won = false; g.over = false; classic.spawn(g); classic.spawn(g); return g; },
    spawn: function (g) {
      var e = empties(g);
      if (!e.length) return null;
      var i = e[Math.floor(rnd() * e.length)], t = tile(g, rnd() < 0.9 ? 2 : 4);
      g.cells[i] = t;
      return { i: i, t: t };
    },
    // returns null if nothing moved, else { slides: [{id, to}], merges: [{to, ids:[a,b], t}], gained, spawn }
    move: function (g, dir) {
      var n = g.n, slides = [], merges = [], gained = 0, moved = false, next = g.cells.slice();
      lines(n, dir).forEach(function (L) {
        var out = [], last = null; // last: the previous placed tile, if it can still merge
        L.forEach(function (idx) {
          var t = g.cells[idx];
          if (!t) return;
          if (last && !last.merged && last.t.v === t.v) {
            var to = L[out.length - 1], nt = tile(g, t.v * 2);
            merges.push({ to: to, ids: [last.t.id, t.id], t: nt });
            slides.push({ id: t.id, to: to });
            out[out.length - 1] = nt; last = { t: nt, merged: true };
            gained += nt.v; moved = true;
          } else {
            var dest = L[out.length];
            if (dest !== idx) moved = true;
            slides.push({ id: t.id, to: dest });
            out.push(t); last = { t: t, merged: false };
          }
        });
        for (var k = 0; k < n; k++) next[L[k]] = out[k] || null;
      });
      if (!moved) return null;
      g.cells = next; g.score += gained;
      var sp = classic.spawn(g), res = { slides: slides, merges: merges, gained: gained, spawn: sp, won: false };
      if (!g.won && maxTile(g) >= classic.WIN) { g.won = true; res.won = true; }
      g.over = !classic.canMove(g);
      return res;
    },
    canMove: function (g) {
      var n = g.n;
      for (var i = 0; i < n * n; i++) {
        var t = g.cells[i];
        if (!t) return true;
        var r = Math.floor(i / n), c = i % n;
        if (c < n - 1 && g.cells[i + 1] && g.cells[i + 1].v === t.v) return true;
        if (r < n - 1 && g.cells[i + n] && g.cells[i + n].v === t.v) return true;
      }
      return false;
    }
  };

  // ================= Trios (Threes-style) =================
  // 4x4. A swipe moves every tile ONE step. A 1 and a 2 make 3; from 3 up, two equal tiles make double.
  // One merge or shift per line per swipe; the tiles behind it follow. The next tile (shown ahead) slides in
  // at the far edge of one of the lines that moved. Next tiles come from a shuffled deck of four 1s, four 2s and
  // four 3s; once the top tile reaches 48, a "bonus" draw (1 in 21) can bring a bigger tile (6 up to top/8).
  // Game over when no swipe moves anything. Score: each tile of 3 or more is worth 3^(doublings from 3 + 1).
  var trios = {
    create: function () {
      var g = mkState(4); g.deck = []; g.over = false;
      var spots = []; for (var i = 0; i < 16; i++) spots.push(i);
      for (var k = 0; k < 9; k++) { var j = Math.floor(rnd() * spots.length), idx = spots.splice(j, 1)[0]; g.cells[idx] = tile(g, trios.draw(g, true)); }
      g.next = trios.draw(g); g.bonus = g.nextBonus || false;
      return g;
    },
    draw: function (g, plain) {
      var top = maxTile(g);
      g.nextBonus = false;
      if (!plain && top >= 48 && rnd() < 1 / 21) {
        var opts = []; for (var v = 6; v <= top / 8; v *= 2) opts.push(v);
        if (opts.length) {
          var pick = Math.floor(rnd() * opts.length), lo = Math.max(0, Math.min(pick - Math.floor(rnd() * 3), opts.length - 3));
          g.nextBonus = opts.slice(lo, lo + 3); // up to 3 values, one of them the real one (shown on the next card)
          return opts[pick];
        }
      }
      if (!g.deck.length) {

      else { c.m.position.copy(c.b.position); c.m.quaternion.copy(c.b.quaternion); }

  // ---------------- input: drag to line up, let go to shoot ----------------

  }
  function onDown(e) {

  }
  function onMove(e) { if (dragging) heldX = xFromClient(e.clientX); }
  function onUp() { if (!dragging) return; dragging = false; if (held && state !== 'over') { state = 'aim'; shoot(); } }

  // ---------------- public ----------------
  function load() {
    if (T && C) return Promise.resolve();

  }
  function mount(el, h) {
    host = el; hooks = h || {};
    if (!canvas) {
      canvas = document.createElement('canvas'); canvas.className = 'chaincv'; host.appendChild(canvas);

  }

  function snapshot() {

      var p = c.b.position, q = c.b.quaternion; return [c.v, +p.x.toFixed(3), +p.y.toFixed(3), +p.z.toFixed(3), +q.x.toFixed(4), +q.y.toFixed(4), +q.z.toFixed(4), +q.w.toFixed(4)];
    }) };
  }
  function restore(s) {

    get score() { return score; }, get top() { return top; }, get next() { return nextVal; }, get heldValue() { return held ? held.v : 0; }, get state() { return state; },

    count: function () { return cubes.length; }
  };
})();
</script>
<script src="../../shared/ads.js"></script>
<script>
(function () {
  'use strict';
  var S = NNSound, UNDOS_PER_GAME = 3, SNAP_LIMIT = 12, SLIDE_MS = 110;
  var MODES = { classic: NN.classic, trios: NN.trios };

  // ================= storage =================
  var store = Goobs.store('merge');
  var settings = { sound: false, adEvery: 3 };
  (function () {
    var s = store.get('settings', {}) || {};
    for (var k in settings) if (typeof s[k] === typeof settings[k]) settings[k] = s[k];
    settings.adEvery = Math.min(10, Math.max(1, settings.adEvery | 0));
  })();
  function saveSettings() { store.set('settings', settings); }
  var meta = store.get('meta', null) || {};
  var MD = { mode: 'classic', size: 4, seen: {}, finished: 0, lastAdAt: 0 };
  for (var mk in MD) if (meta[mk] === undefined) meta[mk] = MD[mk];
  if (!MODES[meta.mode] && meta.mode !== 'chain') meta.mode = 'classic';
  if ([3, 4, 5, 6].indexOf(meta.size) < 0) meta.size = 4;
  function saveMeta() { store.set('meta', meta); }
  var stats = store.get('stats', null) || {};
  if (!stats.classic) stats.classic = {};
  if (!stats.trios) stats.trios = {};
  function blankStats(o) { var d = { best: 0, games: 0, total: 0, bestTile: 0, wins: 0 }; for (var k in d) if (typeof o[k] !== 'number') o[k] = d[k]; return o; }
  blankStats(stats.trios);
  if (!stats.chain) stats.chain = {};
  blankStats(stats.chain);
  function statsFor(mode, size) {
    if (mode === 'trios') return stats.trios;
    return blankStats(stats.classic[size] || (stats.classic[size] = {}));
  }
  function saveStats() { store.set('stats', stats); }

  // ================= helpers =================
  function $(id) { return document.getElementById(id); }
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function isOpen(id) { return $(id).classList.contains('show'); }
  function locked() { return document.documentElement.classList.contains('collection-open') || isOpen('ggMenu') || isOpen('ovEnd') || isOpen('ovSettings') || isOpen('ovStats') || isOpen('ovHelp') || GoobsAds.isOpen(); }

  // ================= game =================
  // game: { mode, size, g (engine state), undos, snaps, moves, done, won (2048 card shown) }
  var game = null;
  function keyFor(mode, size) { return mode === 'trios' ? 'game.trios' : 'game.classic.' + size; }
  function saveGame() { if (game && !game.done) store.set(keyFor(game.mode, game.size), game); }
  function start(mode, size, fresh) {
    if (mode === 'chain') { startChain(); return; }
    leaveChain();
    flush();
    if (game && !game.done) saveGame();
    size = mode === 'trios' ? 4 : (size || meta.size);
    var saved = !fresh && store.get(keyFor(mode, size), null);
    if (saved && saved.g && !saved.done && saved.g.cells && saved.g.cells.length === size * size) game = saved;
    else game = { mode: mode, size: size, g: mode === 'trios' ? NN.trios.create() : NN.classic.create(size), undos: UNDOS_PER_GAME, snaps: [], moves: 0, done: false, won: false };
    meta.mode = mode; if (mode === 'classic') meta.size = size;
    saveMeta();
    renderAll();
    saveGame();
    if (!meta.seen[mode]) { openHelp(); }
    if (game.g.over) setTimeout(gameOver, 300);
  }

  // ================= board geometry and tiles =================
  var W = 0, pad = 0, gap = 0, cell = 0, els = {}, timers = [];
  function geom() {
    var r = $('board').getBoundingClientRect(), n = game.size;
    W = r.width;
    pad = W * (game.mode === 'trios' ? 0.035 : 0.03); gap = W * (n >= 6 ? 0.018 : 0.025);
    cell = (W - 2 * pad - (n - 1) * gap) / n;
  }
  function xy(i) { var n = game.size, r = Math.floor(i / n), c = i % n; return [pad + c * (cell + gap), pad + r * (cell + gap)]; }
  function place(el, x, y) { el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)'; }
  function tileClass(v) {
    if (game.mode === 'trios') return v === 1 ? 't1' : v === 2 ? 't2' : 't3' + (v >= 48 ? ' hi' : '');
    return v <= 2048 ? 'c' + v : 'cbig';
  }
  function fontFor(v) {
    var d = String(v).length, k = game.mode === 'trios' ? [0.46, 0.46, 0.4, 0.33, 0.27, 0.23] : [0.5, 0.5, 0.44, 0.35, 0.29, 0.24];
    return cell * k[Math.min(5, d)];
  }
  function makeTile(t, i, cls) {
    var el = document.createElement('div'), p = xy(i);
    el.className = 'tl ' + tileClass(t.v) + (cls ? ' ' + cls : '');
    el.style.width = el.style.height = cell.toFixed(1) + 'px';
    el.style.fontSize = fontFor(t.v).toFixed(1) + 'px';
    el.innerHTML = '<span>' + t.v + '</span>';
    place(el, p[0], p[1]);
    $('layer').appendChild(el);
    els[t.id] = el;
    return el;
  }
  function renderBoard() {
    geom();
    $('board').classList.toggle('trios', game.mode === 'trios');
    var h = '';
    for (var i = 0; i < game.size * game.size; i++) {
      var p = xy(i);
      h += '<i style="left:' + p[0].toFixed(1) + 'px;top:' + p[1].toFixed(1) + 'px;width:' + cell.toFixed(1) + 'px;height:' + cell.toFixed(1) + 'px"></i>';
    }
    $('bg').innerHTML = h;
    $('layer').innerHTML = ''; els = {};
    game.g.cells.forEach(function (t, i) { if (t) makeTile(t, i); });
  }
  // finish any animation still waiting (so a fast second swipe starts from the true board)
  function flush() { var t = timers; timers = []; t.forEach(function (x) { clearTimeout(x.id); x.fn(); }); }
  function later(fn, ms) { var x = { fn: fn }; x.id = setTimeout(function () { timers = timers.filter(function (y) { return y !== x; }); fn(); }, ms); timers.push(x); }
  var DIRV = [[0, -1], [1, 0], [0, 1], [-1, 0]];
  function animate(res, dir) {
    res.slides.forEach(function (s) { var el = els[s.id]; if (!el) return; el.classList.remove('nt'); var p = xy(s.to); place(el, p[0], p[1]); });
    var gone = [];
    res.merges.forEach(function (m) { m.ids.forEach(function (id) { gone.push(id); }); });
    later(function () {
      gone.forEach(function (id) { if (els[id]) { els[id].remove(); delete els[id]; } });
      res.merges.forEach(function (m) { makeTile(m.t, m.to, 'pop'); });
      if (res.spawn && game.mode === 'classic') makeTile(res.spawn.t, res.spawn.i, 'appear');
    }, SLIDE_MS);
    if (res.spawn && game.mode === 'trios') {
      // the new card slides in from beyond the far edge
      var v = DIRV[dir], el = makeTile(res.spawn.t, res.spawn.i, 'nt'), p = xy(res.spawn.i), step = cell + gap;
      place(el, p[0] - v[0] * step, p[1] - v[1] * step);
      void el.offsetWidth;
      el.classList.remove('nt'); place(el, p[0], p[1]);
    }
  }

  // ================= moving =================
  function doMove(dir) {
    if (chainOn || !game || game.done || locked()) return false;
    flush();
    var snap = JSON.stringify(game.g), res = MODES[game.mode].move(game.g, dir);
    if (!res) { S.bump(); nudge(dir); return false; }
    game.snaps.push(snap);
    if (game.snaps.length > SNAP_LIMIT) game.snaps.shift();
    game.moves++;
    animate(res, dir);
    S.slide();
    if (res.merges.length) {
      var top = 0; res.merges.forEach(function (m) { if (m.t.v > top) top = m.t.v; });
      setTimeout(function () { S.merge(top); }, SLIDE_MS - 20);
    } else if (game.mode === 'classic') setTimeout(S.spawn, SLIDE_MS);
    if (game.mode === 'classic' && res.gained) floatText('+' + fmt(res.gained));
    var st = statsFor(game.mode, game.size), topTile = NN.maxTile(game.g);
    if (topTile > st.bestTile) { st.bestTile = topTile; saveStats(); }
    renderInfo(); renderTools();
    saveGame();
    if (res.won && !game.won) { game.won = true; st.wins++; saveStats(); saveGame(); setTimeout(winCard, 380); }
    else if (game.g.over) setTimeout(gameOver, 450);
    return true;
  }
  function nudge(dir) {
    var b = $('board'), v = DIRV[dir];
    b.animate([{ transform: 'none' }, { transform: 'translate(' + v[0] * 5 + 'px,' + v[1] * 5 + 'px)' }, { transform: 'none' }], { duration: 160 });
  }

  // ================= touch: swipe (Classic), drag-and-peek (Trios, like the original) =================
  var touch = null;
  function onDown(e) {
    if (chainOn || !game || locked()) return;
    S.unlock();
    touch = { x: e.clientX, y: e.clientY, t: performance.now(), dir: -1, done: false, id: e.pointerId, movers: null, frac: 0 };
    try { $('board').setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }
  function dirOf(dx, dy) { return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0); }
  function onMove(e) {
    if (!touch || e.pointerId !== touch.id || touch.done) return;
    var dx = e.clientX - touch.x, dy = e.clientY - touch.y, d = Math.hypot(dx, dy);
    if (game.mode === 'classic') {
      if (d > 26) { touch.done = true; doMove(dirOf(dx, dy)); }
      return;
    }
    // Trios: the tiles that would move follow the finger, up to one step
    if (touch.dir < 0) {
      if (d < 10) return;
      flush();
      touch.dir = dirOf(dx, dy);
      touch.movers = [];
      NN.trios.plan(game.g, touch.dir).forEach(function (p) {
        if (p.k < 0) return;
        for (var k = p.k; k < 4; k++) { var t = game.g.cells[p.L[k]]; if (t && els[t.id]) touch.movers.push({ el: els[t.id], i: p.L[k] }); }
      });
      touch.movers.forEach(function (m) { m.el.classList.add('nt'); });
    }
    var v = DIRV[touch.dir], along = dx * v[0] + dy * v[1], step = cell + gap;
    touch.frac = Math.max(0, Math.min(1, along / step));
    var eased = touch.movers.length ? touch.frac : Math.min(0.12, touch.frac * 0.25); // nothing to move: a small give
    touch.movers.forEach(function (m) { var p = xy(m.i); place(m.el, p[0] + v[0] * step * eased, p[1] + v[1] * step * eased); });
  }
  function onUp(e) {
    if (!touch || e.pointerId !== touch.id) return;
    var t = touch; touch = null;
    if (game.mode !== 'trios' || t.dir < 0) return;
    var fast = (performance.now() - t.t) < 220 && t.frac > 0.12;
    if (t.movers.length && (t.frac > 0.33 || fast)) { if (doMove(t.dir)) return; }
    else if (!t.movers.length && t.frac > 0.05) { S.bump(); }
    t.movers.forEach(function (m) { m.el.classList.remove('nt'); var p = xy(m.i); place(m.el, p[0], p[1]); });
  }
  function onCancel() {
    if (!touch) return;
    var t = touch; touch = null;
    if (t.movers) t.movers.forEach(function (m) { m.el.classList.remove('nt'); var p = xy(m.i); place(m.el, p[0], p[1]); });
  }

  // ================= info, tools, floats =================
  function renderInfo() {
    var st = statsFor(game.mode, game.size), h;
    if (game.mode === 'trios') {
      var g = game.g, cls = g.bonus ? 't3 bonus' : tileClass(g.next);
      h = '<div class="nextbox"><div><div class="lbl">Next</div></div><div class="nextcard ' + cls + '">' + NN.trios.nextLabel(g) + '</div></div>' +
        '<div class="right"><div class="lbl">Best</div><div class="mid">' + fmt(st.best) + '</div></div>';
    } else {
      h = '<div><div class="lbl">Score</div><div class="big">' + fmt(game.g.score) + '</div></div>' +
        '<div class="right"><div class="lbl">Best ' + game.size + '&times;' + game.size + '</div><div class="mid">' + fmt(Math.max(st.best, game.g.score)) + '</div></div>';
    }
    $('info').innerHTML = h;
  }
  function renderModes() {
    var cur = chainOn ? 'chain' : game.mode;
    Array.prototype.forEach.call($('modes').children, function (b) { b.classList.toggle('on', b.dataset.mode === cur); });
    $('sizes').classList.toggle('hide', game.mode !== 'classic');
    Array.prototype.forEach.call($('sizes').children, function (b) { b.classList.toggle('on', +b.dataset.size === game.size); });
  }
  function renderTools() {
    var ul = $('undoLabel');
    if (game.undos > 0) ul.innerHTML = 'Undo (' + game.undos + ')';
    else ul.innerHTML = Goobs.adsOn() ? 'Undo<span class="ad">AD</span>' : 'Undo';
    $('btnUndo').disabled = !game.snaps.length || game.done;
  }
  function renderAll() { renderModes(); renderInfo(); renderTools(); renderBoard(); }
  function floatText(txt) {
    var f = document.createElement('div');
    f.className = 'float'; f.textContent = txt;
    $('floats').appendChild(f);
    setTimeout(function () { f.remove(); }, 850);
  }

  // ================= undo (3 free per game, then one quick ad each, like Woodpile) =================
  function undo() {
    if (!game || !game.snaps.length || game.done) return;
    function go() {
      flush();
      game.g = JSON.parse(game.snaps.pop());
      $('ovEnd').classList.remove('show');
      S.slide();
      renderAll(); saveGame();
    }
    if (game.undos > 0) { game.undos--; go(); return; }
    if (Goobs.adsOn()) showAd(go); else go();
  }

  // ================= cards, records, ads =================
  function showCard(title, html, buttons) {
    $('cardIcon').innerHTML = '<svg viewBox="0 0 100 100"><use href="#nn-logo"/></svg>';
    $('endTitle').textContent = title;
    $('endText').innerHTML = html;
    var box = $('endActions');
    box.innerHTML = '';
    buttons.forEach(function (b) {
      var el = document.createElement('button');
      el.className = 'btn' + (b.red ? ' red' : '');
      el.textContent = b.label;
      el.addEventListener('click', function () { $('ovEnd').classList.remove('show'); b.go(); });
      box.appendChild(el);
    });
    $('ovEnd').classList.add('show');
  }
  function undoButton() {
    if (!game.snaps.length) return null;
    return { label: game.undos > 0 ? 'Undo last move (' + game.undos + ' left)' : (Goobs.adsOn() ? 'Undo last move (quick ad)' : 'Undo last move'), go: undo };
  }
  function record() {
    if (!game || game.recorded || !game.moves) return;
    var st = statsFor(game.mode, game.size), sc = game.g.score;
    st.games++; st.total += sc;
    if (sc > st.best) st.best = sc;
    game.recorded = true;
    saveStats();
  }
  function finish() {
    record();
    game.done = true;
    store.del(keyFor(game.mode, game.size));
    meta.finished++; saveMeta();
  }
  function winCard() {
    S.win();
    showCard('2048!', 'You made the 2048 tile in ' + fmt(game.moves) + ' moves. Keep going for a bigger one?', [
      { label: 'Keep going', red: true, go: function () {} },
      { label: 'New game', go: function () { finish(); between(function () { start(game.mode, game.size, true); }); } }
    ]);
  }
  function gameOver() {
    if (!game || game.done || !game.g.over || isOpen('ovEnd')) return;
    S.over();
    var st = statsFor(game.mode, game.size), sc = game.g.score, best = sc > st.best, b = [], u = undoButton();
    if (u) b.push(u);
    b.push({ label: 'New game', red: true, go: function () { finish(); between(function () { start(game.mode, game.size, true); }); } });
    var html = 'Score: <b>' + fmt(sc) + '</b>' + (best ? '<br><span class="newbest">New best!</span>' : '<br>Best: ' + fmt(st.best));
    if (game.mode === 'trios') {
      var counts = {};
      game.g.cells.forEach(function (t) { if (t && t.v >= 3) counts[t.v] = (counts[t.v] || 0) + 1; });
      var keys = Object.keys(counts).map(Number).sort(function (a, b2) { return b2 - a; });
      html += '<div class="tally">' + keys.map(function (v) { return '<span>' + v + ' &times;' + counts[v] + ' = ' + fmt(NN.trios.tileScore(v) * counts[v]) + '</span>'; }).join('') + '</div>';
    } else html += '<br>Top tile: ' + fmt(NN.maxTile(game.g));
    showCard(game.mode === 'trios' ? 'Out of moves' : 'No more moves', html, b);
  }
  function showAd(done) { GoobsAds.show({ onShow: function () { S.ding(); }, onStep: function () { S.sign(); } }, done); }
  function between(next) {
    if (Goobs.adsOn() && meta.finished > 0 && meta.finished % settings.adEvery === 0 && meta.lastAdAt !== meta.finished) {
      meta.lastAdAt = meta.finished; saveMeta();
      next();
      showAd(function () {});
      return;
    }
    next();
  }

  // ================= sheets =================
  var HELP = {
    chain: ['Chain Cube', [
      'A numbered cube waits at the near end of the tray. <b>Drag</b> left or right to line it up, then <b>let go</b> to shoot it forward.',
      'Two cubes with the <b>same number</b> that touch merge into one cube worth double: 2+2 = 4, 4+4 = 8, and so on.',
      'A new cube <b>hops</b> toward the nearest cube with its new number, so merges can <b>chain</b>. Each merge scores its new number.',
      'The cube after this one shows as <b>Next</b>.',
      'If a cube is left <b>behind the red line</b> once everything settles, the game is over. Keep the tray from filling up.',
      'There\u2019s no undo in Chain Cube.']],
    classic: ['Classic 2048', [
      '<b>Swipe</b> up, down, left or right. Every tile slides as far as it can.',
      'Two tiles with the <b>same number</b> that bump together merge into one: 2+2 = 4, 4+4 = 8, and so on. A tile merges once per swipe.',
      'After each swipe a new <b>2</b> (sometimes a 4) appears in an empty spot.',
      'Your score goes up by every tile you make. Make a <b>2048</b> tile to win, then keep going if you like.',
      'The game ends when no swipe can move anything.',
      'Board sizes 3&times;3 to 6&times;6, each with its own game and best score.',
      '<b>Undo:</b> 3 per game. After that, each extra undo costs one quick ad.']],
    trios: ['Trios', [
      '<b>Swipe</b> and every card that can moves <b>one step</b>. Drag slowly to peek at what will move, then let go.',
      'A <b>1</b> and a <b>2</b> make a <b>3</b>. From 3 up, two equal cards make double: 3+3 = 6, 6+6 = 12, and so on.',
      'A new card slides in at the edge of one of the rows (or columns) that moved.',
      '<b>Next</b> shows its color: blue is 1, red is 2, white is 3 or more. A card showing numbers is a <b>bonus</b>: it will be one of them.',
      'The game ends when no swipe moves anything. Then every card of 3 or more scores: 3 is 3 points, 6 is 9, 12 is 27; each doubling triples it.',
      '<b>Undo:</b> 3 per game. After that, each extra undo costs one quick ad.']]
  };
  function openHelp() {
    var h = HELP[chainOn ? 'chain' : game.mode];
    $('helpTitle').textContent = 'How to play ' + h[0];
    $('helpList').innerHTML = h[1].map(function (x) { return '<li>' + x + '</li>'; }).join('');
    $('ovHelp').classList.add('show');
  }
  function renderStats() {
    var t = stats.trios, h = '<div class="themelabel">Classic 2048</div><div class="tiles">';
    [3, 4, 5, 6].forEach(function (n) {
      var s = stats.classic[n];
      h += '<div class="tile"><b>' + (s ? fmt(s.best) : 0) + '</b><span>' + n + '&times;' + n + ' best</span></div>';
    });
    h += '</div>';
    var c4 = statsFor('classic', 4), games = 0, wins = 0, top = 0;
    [3, 4, 5, 6].forEach(function (n) { var s = stats.classic[n]; if (s) { games += s.games; wins += s.wins; top = Math.max(top, s.bestTile); } });
    h += '<div class="tiles"><div class="tile"><b>' + fmt(top) + '</b><span>Top tile</span></div><div class="tile"><b>' + wins + '</b><span>2048s made</span></div>' +
      '<div class="tile"><b>' + games + '</b><span>Games</span></div></div>';
    h += '<div class="themelabel">Trios</div><div class="tiles"><div class="tile"><b>' + fmt(t.best) + '</b><span>Best</span></div>' +
      '<div class="tile"><b>' + fmt(t.bestTile) + '</b><span>Top card</span></div><div class="tile"><b>' + t.games + '</b><span>Games</span></div></div>' +
      '<div class="themelabel">Chain Cube</div><div class="tiles"><div class="tile"><b>' + fmt(stats.chain.best) + '</b><span>Best</span></div>' +
      '<div class="tile"><b>' + NNChainLabel(stats.chain.bestTile) + '</b><span>Top cube</span></div><div class="tile"><b>' + stats.chain.games + '</b><span>Games</span></div></div>' +
      '<p class="version">Trios average ' + fmt(t.games ? Math.round(t.total / t.games) : 0) + ' · 4&times;4 Classic average ' + fmt(c4.games ? Math.round(c4.total / c4.games) : 0) + '</p>';
    $('statsBody').innerHTML = h;
  }

  // ================= Chain Cube (3D; three.js and cannon-es load the first time) =================
  var chainOn = false, chainReady = false, chainRecorded = false;
  function NNChainLabel(v) { return window.NNChain ? NNChain.label(v || 0) : String(v || 0); }
  function saveChain() { if (chainReady && NNChain.state !== 'over' && NNChain.score > 0) store.set('game.chain', NNChain.snapshot()); }
  function leaveChain() {
    if (!chainOn) return;
    saveChain(); chainOn = false;
    if (window.NNChain) NNChain.stop();
    $('chainwrap').classList.remove('show'); document.querySelector('.app').classList.remove('chainmode');
  }
  function startChain() {
    flush();
    if (game && !game.done) saveGame();
    chainOn = true; meta.mode = 'chain'; saveMeta();
    document.querySelector('.app').classList.add('chainmode'); $('chainwrap').classList.add('show');
    renderModes(); renderChainInfo();
    NNChain.load().then(function () {
      $('chainMsg').classList.add('hide');
      NNChain.mount($('chainwrap'), {
        paused: locked, unlock: function () { S.unlock(); },
        change: renderChainInfo,
        sound: function () { S.slide(); },
        merge: function (v) { S.merge(v); chainFloat('+' + NNChainLabel(v)); var st = stats.chain; if (v > st.bestTile) { st.bestTile = v; saveStats(); } renderChainInfo(); },
        save: saveChain,
        over: chainOver
      });
      if (!chainReady) {
        chainReady = true;
        var sv = store.get('game.chain', null);
        if (sv && sv.cubes) NNChain.restore(sv); else NNChain.newGame();
        chainRecorded = false;
      }
      renderChainInfo();
      if (!meta.seen.chain) openHelp();
    }).catch(function () {
      $('chainMsg').textContent = 'Couldn\u2019t load the 3D view. Connect to the internet once and reopen.';
    });
  }
  function renderChainInfo() {
    if (!chainOn) return;
    var st = stats.chain, sc = chainReady ? NNChain.score : 0, nx = chainReady ? NNChain.next : 2;
    $('info').innerHTML = '<div><div class="lbl">Score</div><div class="big">' + fmt(sc) + '</div></div>' +
      '<div class="nextbox"><div class="lbl">Next</div><div class="nextcube" style="background:' + NNChain.colorOf(nx) + ';color:' + NNChain.inkOf(nx) + '">' + NNChainLabel(nx) + '</div></div>' +
      '<div class="right"><div class="lbl">Best</div><div class="mid">' + fmt(Math.max(st.best, sc)) + '</div></div>';
  }
  function chainFloat(t) {
    var f = document.createElement('div'); f.className = 'float'; f.textContent = t;
    $('cfloats').appendChild(f); setTimeout(function () { f.remove(); }, 850);
  }
  function chainRecord() {
    if (chainRecorded || !NNChain.score) return;
    var st = stats.chain; st.games++; st.total += NNChain.score; if (NNChain.score > st.best) st.best = NNChain.score;
    chainRecorded = true; saveStats(); meta.finished++; saveMeta();
    store.del('game.chain');
  }
  function chainOver() {
    var best = NNChain.score > stats.chain.best, sc = NNChain.score;
    chainRecord(); S.over();
    showCard('Over the line', 'Score: <b>' + fmt(sc) + '</b>' + (best ? '<br><span class="newbest">New best!</span>' : '<br>Best: ' + fmt(stats.chain.best)) + '<br>Top cube: ' + NNChainLabel(NNChain.top), [
      { label: 'New game', red: true, go: function () { between(function () { chainRecorded = false; NNChain.newGame(); renderChainInfo(); }); } }]);
  }
  function chainNew() {
    if (!chainReady) return;
    var go = function () { chainRecord(); between(function () { chainRecorded = false; NNChain.newGame(); renderChainInfo(); }); };
    if (!NNChain.score || NNChain.state === 'over') { chainRecorded = false; NNChain.newGame(); renderChainInfo(); return; }
    showCard('Start a new game?', 'This game ends with ' + fmt(NNChain.score) + ' points.', [
      { label: 'New game', red: true, go: go }, { label: 'Keep playing', go: function () {} }]);
  }

  // ================= wiring =================
  function syncSound() {
    $('btnSound').innerHTML = '<svg viewBox="0 0 24 24"><use href="#i-sound-' + (settings.sound ? 'on' : 'off') + '"/></svg>';
    $('btnSound').classList.toggle('on', settings.sound);
    $('setSound').checked = settings.sound;
    S.setEnabled(settings.sound);
  }
  function syncAds() {
    $('setAds').checked = Goobs.adsOn();
    $('adEvery').textContent = settings.adEvery;
    $('rowAdEvery').classList.toggle('off', !Goobs.adsOn());
    if (game) renderTools();
  }
  function sheet(btn, ov, close, onOpen) {
    if (btn) $(btn).addEventListener('click', function () { if (onOpen) onOpen(); $(ov).classList.add('show'); });
    $(close).addEventListener('click', function () { $(ov).classList.remove('show'); });
    $(ov).addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  }
  function menuInfo() {
    if (chainOn) return '<b>Chain Cube</b> · ' + fmt(chainReady ? NNChain.score : 0) + ' points';
    return '<b>' + (game.mode === 'trios' ? 'Trios' : 'Classic ' + game.size + '&times;' + game.size) + '</b> · ' + fmt(game.g.score) + ' points';
  }
  function init() {
    Goobs.themePicker($('themes'));
    // Full screen (1.2.0): edge to edge; the board (or the Chain Cube tray) fills the free space; How to, New game,
    // Stats and Settings are in the Menu (Chain Cube pauses while it's open: locked() checks ggMenu)
    Goobs.fullscreen({ menu: ['btnHelp', 'btnNew', 'btnStats', 'btnSettings'], info: menuInfo });
    var b = $('board');
    b.addEventListener('pointerdown', onDown);
    b.addEventListener('pointermove', onMove);
    b.addEventListener('pointerup', onUp);
    b.addEventListener('pointercancel', onCancel);
    document.addEventListener('touchmove', function (e) { if (touch) e.preventDefault(); }, { passive: false });
    document.addEventListener('keydown', function (e) {
      var k = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3 }[e.key];
      if (k !== undefined) { e.preventDefault(); doMove(k); }
    });
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) { document.addEventListener(ev, function () { S.unlock(); }, { passive: true }); });
    $('btnHome').addEventListener('click', function () { saveGame(); saveChain(); Goobs.home(); });
    $('btnUndo').addEventListener('click', undo);
    $('btnNew').addEventListener('click', function () {
      if (chainOn) { chainNew(); return; }
      var started = game.moves > 0 && !game.done;
      var go = function () { finish(); between(function () { start(game.mode, game.size, true); }); };
      if (!started) { start(game.mode, game.size, true); return; }
      showCard('Start a new game?', game.mode === 'trios' ? 'This game ends now and counts with ' + fmt(game.g.score) + ' points.' : 'This game ends with ' + fmt(game.g.score) + ' points.', [
        { label: 'New game', red: true, go: go },
        { label: 'Keep playing', go: function () {} }
      ]);
    });
    $('modes').addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (!btn || (btn.dataset.mode === game.mode && !chainOn) || (btn.dataset.mode === 'chain' && chainOn)) return;
      start(btn.dataset.mode, meta.size);
    });
    $('sizes').addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (!btn || +btn.dataset.size === game.size) return;
      start('classic', +btn.dataset.size);
    });
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings');
    sheet('btnStats', 'ovStats', 'btnCloseStats', renderStats);
    $('btnHelp').addEventListener('click', openHelp);
    $('btnCloseHelp').addEventListener('click', function () {
      $('ovHelp').classList.remove('show');
      var m = chainOn ? 'chain' : game.mode;
      if (!meta.seen[m]) { meta.seen[m] = true; saveMeta(); }
    });
    $('ovHelp').addEventListener('click', function (e) { if (e.target === this) { this.classList.remove('show'); meta.seen[chainOn ? 'chain' : game.mode] = true; saveMeta(); } });
    $('btnSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncSound(); S.ding(); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); syncSound(); S.ding(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncAds(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncAds(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncAds(); });
    // keep tiles lined up with the board's real size (the page settles after the first draw on iPhone)
    var lastW = 0;
    function onResize() { if (!game) return; var w = $('board').getBoundingClientRect().width; if (Math.abs(w - lastW) > 0.5) { lastW = w; flush(); renderBoard(); } }
    if (window.ResizeObserver) new ResizeObserver(onResize).observe($('board'));
    window.addEventListener('resize', onResize);
    document.addEventListener('visibilitychange', function () { if (document.hidden) { saveGame(); saveChain(); } });
    window.addEventListener('pagehide', function () { saveGame(); saveChain(); });
    syncSound(); syncAds();

    if (meta.mode === 'chain') { start('classic', meta.size); start('chain'); } else start(meta.mode, meta.size);
    Goobs.markPlayed('merge');
    Goobs.initUpdates({
      beforeReload: saveGame,
      onVersions: function (v) { $('version').textContent = 'Number Nook ' + (v.merge || '2.0.0') + ' · Goobs-Games ' + (v.shell || '?'); }
    });
  }

  // hook for automated tests
  window.__nn = { get chain() { return window.NNChain; }, get game() { return game; }, move: doMove, start: start, undo: undo, stats: function () { return stats; }, meta: function () { return meta; }, flush: flush };

  init();
})();
</script>
<script defer src="../../shared/remaining-navigation.js"></script></body>
</html>
