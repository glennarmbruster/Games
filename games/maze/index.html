<style>
/* Cheese Chase styles (themes, UI kit and ad cards come from /shared/goobs.css) */
.brand svg { border-radius: 10px; }
.brand h1 { font-size: 21px; }
.info .mid .of { color: var(--muted); font-weight: 600; }

.stagewrap { flex: 1 1 auto; min-height: 0; width: calc(100% + 20px); margin: 0 -10px; display: flex; align-items: center; justify-content: center; }
.stage { position: relative; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); background: #17121f; touch-action: none; }
.stage canvas { display: block; width: 100%; height: 100%; }

.ready {
  position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  background: rgba(14,18,40,.74); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); color: #fff; text-align: center; padding: 18px;
}
.ready.show { display: flex; }
.ready h2 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.3px; }
.ready p { margin: 0; color: #d6daf2; font-size: 15px; line-height: 1.4; max-width: 280px; }
.ready .go { min-height: 52px; width: 200px; flex: none; }
.ready .or { font-size: 13px; color: #c3c8e6; }
.ready .cast { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; max-width: 300px; }
.ready .cast div { display: flex; flex-direction: column; align-items: center; font-size: 12px; font-weight: 800; color: #e6e9fb; gap: 3px; }
.ready .cast canvas { width: 40px; height: 40px; }
.ready .cast small { font-weight: 600; color: #aab1d6; font-size: 11px; }
.ready.compact { gap: 8px; }
.ready.compact .cast { display: none; }

/* joystick */
.joy { display: none; width: 160px; height: 160px; flex: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.joy.show { display: block; }
.joy svg { width: 100%; height: 100%; display: block; }
.joy .ring { fill: var(--surface); stroke: var(--line); stroke-width: 2; }
.joy .arr { fill: var(--muted); transition: fill .05s; }
.joy .arr.on { fill: var(--accent); }
.joy .knob { fill: #ffc53d; stroke: #b07a00; stroke-width: 3; transition: transform .05s; transform-origin: 60px 60px; }
@media (max-height: 700px) { .joy { width: 132px; height: 132px; } }
.cardicon svg { border-radius: 16px; }
@media (max-width: 385px) { .brand h1 { font-size: 19px; } }

/* full screen (Goobs.fullscreen, 2026-09-29): Pause sits in the top row as a round button (icon only) */
html.gg-fs .top #btnPause span { display: none; }
html.gg-fs .top #btnPause:disabled { opacity: .4; }
html.gg-fs .stagewrap { width: calc(100% + 16px); margin: 0 -8px; }
@media (min-height: 780px) { html.gg-fs .joy { width: 176px; height: 176px; } }
</style>

<script>
/* Cheese Chase logic: the 1980 maze-chase arcade rules on our own maze, with our own mouse and cats.
   Positions are in maze pixels (8 per tile, tile centers at 8k + 4). One tick() = one frame at 60 Hz. Runs in Node. */
var CC = (function () {
  'use strict';
  // Our own maze (left half; the right half is its mirror). # wall, . crumb, o big cheese, space open, T tunnel,
  // - cat-basket door, G inside the basket. Checked by tools/check.js: symmetric, one tile wide, no dead ends, all connected.
  var HALF = [
    '##############', '#.....#.......', '#.###.#.####.#', '#o###.#.####.#', '#.............', '#.##.#####.###', '#.##.#####.###',
    '#....##.......', '####.##.###.##', '####.##.###.##', '####.##       ', '####.##.#.###-', '####.##.#.#GGG', 'TTTT.     #GGG',
    '####.##.#.#GGG', '####.##.#.####', '####.##       ', '####.##.######', '####.##.######', '#.............', '#.###.#####.##',
    '#.###.#####.##', '#o..#........ ', '###.#.##.#####', '###.#.##.#####', '#...#....#....', '#.########.#.#', '#.########.#.#',
    '#.########.#.#', '#.............', '##############'
  ];
  var ROWS = HALF.map(function (r) { return r + r.split('').reverse().join(''); });
  var TW = 28, TH = ROWS.length, T = 8;
  var DX = [0, -1, 0, 1], DY = [-1, 0, 1, 0]; // up, left, down, right (also the tie order)
  var HOME_X = 14 * T, DOOR_Y = 10 * T + 4, HOUSE_Y = 13 * T + 4, START_Y = 22 * T + 4, FRUIT_Y = 16 * T + 4;
  var BASE = 75.75757625 / 60;                 // pixels per frame at 100% speed
  var NAMES = ['Ginger', 'Rosie', 'Misty', 'Pudding'];
  var SCATTER = [[25, -3], [2, -3], [27, 33], [0, 33]];
  var RED_ZONE = function (tx, ty) { return (ty === 10 || ty === 22) && tx >= 11 && tx <= 16; }; // cats can't turn up here (scatter/chase)

  function tileAt(tx, ty) {
    if (ty < 0 || ty >= TH) return '#';
    tx = ((tx % TW) + TW) % TW;
    return ROWS[ty][tx];
  }
  function open(tx, ty) { var c = tileAt(tx, ty); return c === '.' || c === 'o' || c === ' ' || c === 'T'; }
  function tunnel(tx, ty) { return tileAt(tx, ty) === 'T'; }

  // ---------- the level tables ----------
  function speeds(level) {
    if (level === 1) return { pac: 80, pacF: 90, cat: 75, catF: 50, catT: 40 };
    if (level <= 4) return { pac: 90, pacF: 95, cat: 85, catF: 55, catT: 45 };
    if (level <= 20) return { pac: 100, pacF: 100, cat: 95, catF: 60, catT: 50 };
    return { pac: 90, pacF: 90, cat: 95, catF: 95, catT: 50 };
  }
  function elroy(level) { // [dots left for step 1, speed], [for step 2, speed]
    var d = level === 1 ? 20 : level === 2 ? 30 : level <= 5 ? 40 : level <= 8 ? 50 : level <= 11 ? 60 : level <= 14 ? 80 : level <= 18 ? 100 : 120;
    var sp = level === 1 ? [80, 85] : level <= 4 ? [90, 95] : [100, 105];
    return [[d, sp[0]], [d / 2, sp[1]]];
  }
  var FRIGHT = [6, 5, 4, 3, 2, 5, 2, 2, 1, 5, 2, 1, 1, 3, 1, 1, 0, 1];
  var FLASHES = [5, 5, 5, 5, 5, 5, 5, 5, 3, 5, 5, 3, 3, 5, 3, 3, 0, 3];
  function frightFrames(level) { return (level <= FRIGHT.length ? FRIGHT[level - 1] : 0) * 60; }
  function flashes(level) { return level <= FLASHES.length ? FLASHES[level - 1] : 0; }
  function modeTimes(level) { // scatter/chase lengths in frames, then chase for good
    var s = 60;
    if (level === 1) return [7 * s, 20 * s, 7 * s, 20 * s, 5 * s, 20 * s, 5 * s];
    if (level <= 4) return [7 * s, 20 * s, 7 * s, 20 * s, 5 * s, 1033 * s, 1];
    return [5 * s, 20 * s, 5 * s, 20 * s, 5 * s, 1037 * s, 1];
  }
  var BONUS = [['berry', 100], ['strawberry', 300], ['corn', 500], ['corn', 500], ['apple', 700], ['apple', 700], ['grapes', 1000], ['grapes', 1000],
    ['cupcake', 2000], ['cupcake', 2000], ['pie', 3000], ['pie', 3000], ['cheese', 5000]];
  function bonusFor(level) { return BONUS[Math.min(level, BONUS.length) - 1]; }
  function houseDots(level) { return level === 1 ? [0, 0, 30, 60] : level === 2 ? [0, 0, 0, 50] : [0, 0, 0, 0]; }

  // ---------- random (seeded) ----------
  function rnd(s) { var t = (s.seed = (s.seed + 0x6D2B79F5) | 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }

  // ---------- state ----------
  function create(seed) {
    var s = { seed: (seed >>> 0) || 1, level: 1, score: 0, lives: 3, extra: false, ev: [], over: false, t: 0, fresh: true };
    newLevel(s);
    return s;
  }
  function newLevel(s) {
    s.dots = []; s.dotsLeft = 0; s.eaten = 0;
    for (var y = 0; y < TH; y++) for (var x = 0; x < TW; x++) {
      var c = ROWS[y][x], v = c === '.' ? 1 : c === 'o' ? 2 : 0;
      if ((y === 22) && (x === 13 || x === 14)) v = 0;
      s.dots.push(v); if (v) s.dotsLeft++;
    }
    s.total = s.dotsLeft;
    s.fruit = null; s.fruitsShown = 0;
    s.catDots = [0, 0, 0, 0];
    s.globalDots = -1;           // after a lost life the cats leave by a shared crumb count
    resetActors(s);
  }
  function resetActors(s) {
    s.pac = { x: HOME_X, y: START_Y, dir: 1, want: 1, moving: true, anim: 0, pause: 0 };
    s.cats = [0, 1, 2, 3].map(function (i) {
      var inside = i > 0;
      return { i: i, x: i === 0 ? HOME_X : i === 1 ? HOME_X : i === 2 ? HOME_X - 16 : HOME_X + 16, y: inside ? HOUSE_Y : DOOR_Y,
        dir: i === 0 ? 1 : i === 1 ? 2 : 0, state: inside ? 'house' : 'active', fright: false, anim: 0, reverse: false };
    });
    s.modeStep = 0; s.modeT = 0; s.scatter = true;
    s.frightT = 0; s.chain = 0;
    s.idle = 0;                  // frames since the mouse last ate a crumb (lets cats out of the basket)
    s.phase = 'ready'; s.phaseT = 0;
    s.pop = null;
    s.elroyOn = true;
  }
  function tileOf(a) { return [Math.floor(((a.x % (TW * T)) + TW * T) % (TW * T) / T), Math.floor(a.y / T)]; }

  // ---------- moving along the maze ----------
  // step an actor px pixels; at each tile center call decide(tx, ty) -> the direction to leave by (or -1 to stop)
  function advance(a, px, decide) {
    var guard = 0;
    while (px > 1e-6 && guard++ < 4) {
      var tx = Math.floor(a.x / T), ty = Math.floor(a.y / T), cx = tx * T + 4, cy = ty * T + 4;
      var ahead = (cx - a.x) * DX[a.dir] + (cy - a.y) * DY[a.dir]; // distance to this tile's center, if still ahead
      if (ahead < -1e-6) { // past the center: head to the next tile's center
        ahead += T; tx += DX[a.dir]; ty += DY[a.dir]; cx = tx * T + 4; cy = ty * T + 4;
      }
      if (ahead > px + 1e-6) { a.x += DX[a.dir] * px; a.y += DY[a.dir] * px; break; }
      a.x = cx; a.y = cy; px -= ahead;
      wrap(a);
      var nd = decide(Math.floor(a.x / T), Math.floor(a.y / T));
      if (nd < 0) { a.moving = false; return; }
      a.dir = nd;
      if (px <= 1e-6) break;
      // nudge past the center so the next loop measures from here
      var st = Math.min(px, 0.001); a.x += DX[a.dir] * st; a.y += DY[a.dir] * st; px -= st;
    }
    wrap(a);
  }
  function wrap(a) { var w = TW * T; if (a.x < -T) a.x += w; else if (a.x >= w + T) a.x -= w; }

  // ---------- the mouse ----------
  function pacTick(s) {
    var p = s.pac, sp = speeds(s.level);
    if (p.pause > 0) { p.pause--; return; }
    var pct = s.frightT > 0 ? sp.pacF : sp.pac, px = pct / 100 * BASE;
    var t = tileOf(p);
    // turning straight back works any time
    if (p.want === (p.dir + 2) % 4) { p.dir = p.want; p.moving = true; }
    // a turn that's open: take it at the center, or a little before it (cutting the corner, like the original)
    if (p.want !== p.dir && p.want !== (p.dir + 2) % 4) {
      var cx = t[0] * T + 4, cy = t[1] * T + 4, ahead = (cx - p.x) * DX[p.dir] + (cy - p.y) * DY[p.dir];
      if (Math.abs(ahead) <= 4 && open(t[0] + DX[p.want], t[1] + DY[p.want])) { p.x = cx; p.y = cy; p.dir = p.want; p.moving = true; }
    }
    if (!p.moving) { if (open(t[0] + DX[p.dir], t[1] + DY[p.dir])) p.moving = true; else return; }
    advance(p, px, function (tx, ty) {
      if (p.want !== p.dir && open(tx + DX[p.want], ty + DY[p.want])) return p.want;
      if (open(tx + DX[p.dir], ty + DY[p.dir])) return p.dir;
      return -1;
    });
    p.anim++;
    eat(s);
  }
  function eat(s) {
    var t = tileOf(s.pac), k = t[1] * TW + t[0], v = s.dots[k];
    if (v) {
      s.dots[k] = 0; s.dotsLeft--; s.eaten++; s.idle = 0;

      '<button class="btn red go" id="btnGo">Start</button><p class="or">or just swipe' + (stats.best ? ' &middot; high score ' + fmt(stats.best) : '') + '</p>';
    r.classList.add('show');
    CC.NAMES.forEach(function (n, i) { var d = document.createElement('div'); d.appendChild(castIcon(i)); d.appendChild(document.createTextNode(n)); var sm = document.createElement('small'); sm.textContent = CAT_BLURB[i]; d.appendChild(sm); $('cast').appendChild(d); });
    $('btnGo').addEventListener('click', begin);
  }
  function renderAll() { renderInfo(); renderTools(); renderReady(); draw(); }

  // ================= end of a game =================
  function record() {
    stats.games++; stats.crumbs += counted.crumbs; stats.cats += counted.cats; stats.bonus += counted.bonus; stats.levels += counted.levels;
    stats.ms += Math.round(s.t * STEP);
    var nb = false;
    if (s.score > stats.best) { stats.best = s.score; nb = true; }
    if (s.level > stats.bestLevel) stats.bestLevel = s.level;
    saveStats(); meta.finished++; saveMeta(); store.del('run');
    counted = { crumbs: 0, cats: 0, bonus: 0, levels: 0 };
    return nb;
  }
  function gameOver() {
    var nb = record();
    showCard('Game over', 'Score <b>' + fmt(s.score) + '</b> &middot; level ' + s.level + (nb && s.score ? '<br><span class="newbest">New high score!</span>' : '<br>High score: ' + fmt(stats.best)),
      [{ label: 'Play again', red: true, go: function () { between(newGame); } }]);
    renderTools(); renderInfo();
  }
  function showCard(title, html, buttons) {
    $('cardIcon').innerHTML = '<svg viewBox="0 0 100 100"><use href="#cc-logo"/></svg>';
    $('endTitle').textContent = title; $('endText').innerHTML = html;
    var box = $('endActions'); box.innerHTML = '';
    buttons.forEach(function (b) {
      var el = document.createElement('button'); el.className = 'btn' + (b.red ? ' red' : ''); el.textContent = b.label;
      el.addEventListener('click', function () { $('ovEnd').classList.remove('show'); b.go(); });
      box.appendChild(el);
    });
    $('ovEnd').classList.add('show');
  }
  function showAd(done) { GoobsAds.show({ onShow: function () { S.ding(); }, onStep: function () { S.sign(); } }, done); }
  function between(next) {
    if (Goobs.adsOn() && meta.finished > 0 && meta.finished % settings.adEvery === 0 && meta.lastAdAt !== meta.finished) {
      meta.lastAdAt = meta.finished; saveMeta(); next(); showAd(function () {}); return;
    }
    next();
  }

  // ================= sheets =================
  function openHelp() {
    $('helpTitle').textContent = 'How to play Cheese Chase';
    $('helpList').innerHTML = [
      '<b>Swipe</b> anywhere to steer the mouse: up, down, left or right. Swipe a turn early and the mouse takes it at the next corner. Prefer a stick? Turn on the <b>joystick</b> in Settings.',
      'Eat every <b>crumb</b> (10 points) to clear the level. The four <b>big cheeses</b> (50) make the cats scared for a few seconds: they turn blue and run. Catch them for 200, 400, 800, then 1,600. When they flash, time’s nearly up. A caught cat’s bell rolls home to the basket and the cat comes back.',
      'Four cats, four ways: <b>Ginger</b> chases you, and gets faster when few crumbs are left. <b>Rosie</b> heads you off. <b>Misty</b> is hard to read (she works with Ginger). <b>Pudding</b> is shy: close up, she wanders off. Every so often they all break off and go to their corners.',
      'A <b>snack</b> shows up twice a level below the basket, for a short time: 100 points on level 1, up to 5,000 later.',
      'You have 3 lives and get one more at 10,000 points. The tunnels at the sides take you across, and slow the cats down.',
      'Each level is faster and the cats stay scared for less time. Pause any time; a game in progress is saved.'
    ].map(function (x) { return '<li>' + x + '</li>'; }).join('');
    $('ovHelp').classList.add('show');
  }
  function renderStats() {
    $('statsBody').innerHTML =
      '<div class="tiles"><div class="tile"><b>' + fmt(stats.best) + '</b><span>High score</span></div><div class="tile"><b>' + (stats.bestLevel || '–') + '</b><span>Best level</span></div><div class="tile"><b>' + stats.games + '</b><span>Games</span></div></div>' +
      '<div class="tiles"><div class="tile"><b>' + fmt(stats.crumbs) + '</b><span>Crumbs</span></div><div class="tile"><b>' + fmt(stats.cats) + '</b><span>Cats caught</span></div><div class="tile"><b>' + fmt(stats.levels) + '</b><span>Levels cleared</span></div></div>' +
      '<p class="version">' + fmt(stats.bonus) + ' snacks &middot; ' + Math.round(stats.ms / 60000) + ' min played</p>';
  }

  // ================= wiring =================
  function syncSound() {
    $('btnSound').innerHTML = '<svg viewBox="0 0 24 24"><use href="#i-sound-' + (settings.sound ? 'on' : 'off') + '"/></svg>';
    $('btnSound').classList.toggle('on', settings.sound); $('setSound').checked = settings.sound; S.setEnabled(settings.sound);
  }
  function syncAds() { $('setAds').checked = Goobs.adsOn(); $('adEvery').textContent = settings.adEvery; $('rowAdEvery').classList.toggle('off', !Goobs.adsOn()); }
  function syncPad() { $('setPad').checked = settings.pad; $('joy').classList.toggle('show', settings.pad); requestAnimationFrame(function () { fit(); draw(); }); }
  function sheet(btn, ov, close, onOpen) {
    if (btn) $(btn).addEventListener('click', function () { pause(); if (onOpen) onOpen(); $(ov).classList.add('show'); });
    $(close).addEventListener('click', function () { $(ov).classList.remove('show'); });
    $(ov).addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  }
  function init() {
    Goobs.themePicker($('themes'));
    cv = $('cv'); cx = cv.getContext('2d');
    document.addEventListener('pointerdown', onDown);
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
    document.addEventListener('touchmove', function (e) { if (sw) e.preventDefault(); }, { passive: false });
    document.addEventListener('keydown', function (e) {
      var d = { ArrowUp: 0, ArrowLeft: 1, ArrowDown: 2, ArrowRight: 3 }[e.key];
      if (d !== undefined) { e.preventDefault(); input(d); }
      else if (e.key === ' ' || e.key === 'p') { e.preventDefault(); if (phase === 'run') pause(); else if (phase === 'paused') resume(); else if (phase === 'ready') begin(); }
    });
    joystick();
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) { document.addEventListener(ev, function () { S.unlock(); }, { passive: true }); });
    $('btnHome').addEventListener('click', function () { pause(); saveRun(); Goobs.home(); });
    $('btnPause').addEventListener('click', function () { if (phase === 'run') pause(); else if (phase === 'paused') resume(); });
    $('btnNew').addEventListener('click', function () {
      if (phase === 'run') pause();
      if (phase === 'paused' && s.score > 0) {
        showCard('Start over?', 'This game ends now with ' + fmt(s.score) + ' points.', [
          { label: 'Start over', red: true, go: function () { record(); between(newGame); } },
          { label: 'Keep playing', go: function () {} }]);
        return;
      }
      newGame();
    });
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings');
    sheet('btnStats', 'ovStats', 'btnCloseStats', renderStats);
    // full screen (2026-09-29): Pause moves up to the top row as a round button; How to, Restart, Stats and Settings live
    // in the Menu (the empty toolbar hides itself), so the board gets the toolbar's height. The game pauses while it is open.
    var pb = $('btnPause'); pb.className = 'iconbtn'; pb.setAttribute('aria-label', 'Pause');
    $('btnSound').parentNode.insertBefore(pb, $('btnSound'));
    Goobs.fullscreen({
      menu: ['btnNew', 'btnHelp', 'btnStats', 'btnSettings'],
      info: function () { return s ? 'Level <b>' + s.level + '</b> &middot; high score <b>' + fmt(Math.max(stats.best, s.score)) + '</b>' : ''; },
      onOpen: function () { pause(); }
    });
    $('btnHelp').addEventListener('click', function () { pause(); openHelp(); });
    function closeHelp() { $('ovHelp').classList.remove('show'); if (!meta.seen) { meta.seen = true; saveMeta(); } }
    $('btnCloseHelp').addEventListener('click', closeHelp);
    $('ovHelp').addEventListener('click', function (e) { if (e.target === this) closeHelp(); });
    $('btnSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncSound(); S.ding(); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); syncSound(); S.ding(); });
    $('setPad').addEventListener('change', function () { settings.pad = this.checked; saveSettings(); syncPad(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncAds(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncAds(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncAds(); });
    if (window.ResizeObserver) new ResizeObserver(function () { fit(); draw(); }).observe($('stagewrap'));
    window.addEventListener('resize', function () { fit(); draw(); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) { pause(); saveRun(); } });
    window.addEventListener('pagehide', function () { pause(); saveRun(); });
    syncSound(); syncAds(); syncPad();
    fit();
    if (!resumeRun()) newGame();
    if (!meta.seen) openHelp();
    lastT = performance.now();
    requestAnimationFrame(frame);
    Goobs.markPlayed('maze');
    Goobs.initUpdates({
      beforeReload: function () { pause(); saveRun(); },
      onVersions: function (v) { $('version').textContent = 'Cheese Chase ' + (v.maze || '?') + ' · Goobs-Games ' + (v.shell || '?'); }
    });
  }

  // hook for automated tests
  window.__cc = { get s() { return s; }, get phase() { return phase; }, input: input, begin: begin, pause: pause, newGame: newGame, stats: function () { return stats; }, CC: CC };

  init();
})();
</script>
</body>
</html>
