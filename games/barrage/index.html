<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#5a54f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goobs-Games">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="../../icons/icon-192.png">
<link rel="stylesheet" href="../../shared/goobs.css">
<script src="../../shared/goobs.js"></script>
<title>Ball Barrage</title>
<style>
/* Ball Barrage styles (themes, UI kit and ad cards come from /shared/goobs.css) */
.brand svg { border-radius: 10px; }
.brand h1 { font-size: 21px; }
.modes button { font-size: 15px; }
/* full screen (1.3.0): Glenn: "not full screen yet". The field's navy covers the whole phone (behind the notch and the home
   bar), the kit floats back / Sound / Menu over it with the counters as pills between them, the field is centred in the
   free space as big as it fits (fit() in app.js) and the booster bar floats at the bottom, clear of the home bar. */
html.gg-fs-over, html.gg-fs-over body { background: #151b3d; }
.stagewrap { position: fixed; inset: 0; background: #151b3d; touch-action: none; overflow: hidden; }
/* the walls: a thin line round the field so the edges the balls bounce off stay visible on the same navy */
.stage { position: absolute; left: 0; top: 0; background: #151b3d; box-shadow: 0 0 0 1.5px rgba(160,175,255,.28); touch-action: none; }
.stage canvas { display: block; touch-action: none; }
.bar { position: absolute; left: calc(env(safe-area-inset-left, 0px) + 10px); right: calc(env(safe-area-inset-right, 0px) + 10px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); display: flex; align-items: center; gap: 8px; }
.hud { flex: 1 1 auto; min-width: 0; display: flex; justify-content: center; gap: 5px; }
.hud .ggpill { height: 44px; box-sizing: border-box; min-width: 50px; padding: 3px 9px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  line-height: 1.05; font-size: 17px; border-radius: 22px; }
.hud .ggpill small { font-size: 10px; font-weight: 800; color: #6b7080; letter-spacing: .4px; text-transform: uppercase; }
.hud .ggpill .st { color: #e0a800; font-size: 14px; letter-spacing: -1px; }
.ggmenu .modes { margin: 4px 0 2px; }
/* 1.4.0: eight power-ups share the row while aiming (each up to 50 wide, narrower on a small phone); during a shot they
   make way for what is on (chips), Faster and bring-home */
.boosts { flex: 1 1 auto; display: flex; gap: 5px; justify-content: center; min-width: 0; }
.boosts .boost { flex: 1 1 0; max-width: 50px; min-width: 0; }
.ctls { display: none; flex: 1 1 auto; align-items: center; gap: 8px; min-width: 0; }
.bar.shooting .boosts { display: none; } .bar.shooting .ctls { display: flex; }
.onnow { flex: 1 1 auto; display: flex; gap: 4px; min-width: 0; overflow: hidden; }
.onnow span { display: flex; align-items: center; gap: 3px; height: 26px; padding: 0 8px; border-radius: 13px; background: rgba(255,255,255,.12); color: #fff; font-size: 12px; font-weight: 800; white-space: nowrap; }
.onnow svg { width: 15px; height: 15px; }
.boost.tgt { background: #fff; color: #1b1f33; box-shadow: 0 0 0 3px #ffc53d; }
.tgthint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 60px); display: none; pointer-events: none;
  background: #ffc53d; color: #1b1f33; font-weight: 800; font-size: 15px; padding: 7px 14px; border-radius: 14px; white-space: nowrap; box-shadow: 0 3px 10px rgba(0,0,0,.3); }
.tgthint.show { display: block; }
.boost { position: relative; width: 50px; height: 44px; border-radius: 14px; box-shadow: 0 3px 10px rgba(0,0,0,.25); border: 0; background: #262f66; color: #fff; display: flex; align-items: center; justify-content: center; }
.boost svg { width: 25px; height: 25px; }
.boost b { position: absolute; right: -3px; bottom: -3px; min-width: 18px; height: 18px; border-radius: 9px; background: #ffc53d; color: #1b1f33; font-size: 11px; font-weight: 900; line-height: 18px; padding: 0 4px; }
.boost:disabled { opacity: .35; }
.boost.on { background: #ffc53d; color: #1b1f33; }
#bRocket { color: #ff8a8a; } #bFreeze { color: #8fe3ff; } #bPower { color: #ffe066; }
#bBeam { color: #ff8ff0; } #bBomb { color: #ffb066; } #bHalve { color: #b8f27a; } #bExtra { color: #9dffb0; } #bBounce { color: #9cc2ff; }
.boost.on, .boost.tgt { color: #1b1f33; }
.boost.ctl { background: #1d2450; color: #cfd6ff; }
.boost.ctl.on { background: #3a86ff; color: #fff; }
.toast { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: rgba(10,14,36,.85); color: #fff; font-weight: 800; font-size: 16px; padding: 8px 15px; border-radius: 14px; white-space: nowrap; }
.toast.show { opacity: 1; }
.lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.lv { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); height: 52px; font-weight: 800; font-size: 16px; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.lv small { font-size: 11px; color: #e0a800; letter-spacing: -1px; }
.lv.cur { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.lv:disabled { opacity: .35; }
.stars { font-size: 26px; color: #ffc83d; letter-spacing: 2px; }
.stars .off { color: var(--line-strong); }
.cardicon svg { border-radius: 16px; }
@media (max-width: 385px) { .brand h1 { font-size: 19px; } .modes button { font-size: 14px; } .hud { gap: 4px; } .hud .ggpill { padding: 3px 7px; min-width: 46px; } }

/* 1.4.0: the start card, the ball picker and the power-up list */
.startsheet { max-height: 94vh; }
.sthead { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.sthead svg { width: 44px; height: 44px; border-radius: 12px; flex: none; }
.sthead h2 { margin: 0; }
.stinfo { color: var(--muted); font-weight: 700; font-size: 14px; }
.stlabel { font-weight: 800; font-size: 15px; color: var(--ink); margin: 2px 2px 6px; }
.stlabel small { color: var(--muted); font-weight: 700; margin-left: 4px; }
.stgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.stopt { position: relative; display: flex; align-items: center; gap: 9px; text-align: left; border-radius: 14px; border: 2px solid var(--line); background: var(--surface-2);
  color: var(--ink); padding: 7px 8px; min-height: 58px; font: inherit; }
.stopt .ic { flex: none; width: 34px; height: 34px; border-radius: 10px; background: #262f66; display: flex; align-items: center; justify-content: center; }
.stopt .ic svg { width: 21px; height: 21px; }
.stopt b { display: block; font-size: 14px; line-height: 1.15; }
.stopt small { display: block; font-size: 11.5px; line-height: 1.2; color: var(--muted); font-weight: 600; }
.stopt i { position: absolute; top: -6px; right: -4px; min-width: 18px; height: 18px; border-radius: 9px; background: #ffc53d; color: #1b1f33; font-size: 11px; font-weight: 900;
  font-style: normal; line-height: 18px; text-align: center; padding: 0 4px; }
.stopt.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.stopt.on::after { content: "\2713"; position: absolute; left: -5px; top: -6px; width: 20px; height: 20px; border-radius: 10px; background: var(--accent); color: var(--accent-ink);
  font-size: 12px; font-weight: 900; line-height: 20px; text-align: center; }
.stopt:disabled { opacity: .4; }
.stball { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2);
  color: var(--ink); padding: 6px 12px; font: inherit; font-size: 15px; font-weight: 700; }
.stball canvas { width: 32px; height: 32px; border-radius: 16px; background: #151b3d; }
.stball em { margin-left: auto; font-style: normal; color: var(--accent); font-weight: 800; }
.ballgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ballopt { display: flex; flex-direction: column; align-items: center; gap: 4px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface-2); color: var(--ink);
  padding: 10px 4px 8px; font: inherit; font-size: 14px; font-weight: 800; }
.ballopt canvas { width: 56px; height: 56px; border-radius: 28px; background: #151b3d; }
.ballopt small { font-size: 11px; color: var(--muted); font-weight: 700; }
.ballopt.on { border-color: var(--accent); }
.ballopt:disabled canvas { opacity: .35; filter: grayscale(1); }
.ballopt:disabled { opacity: .8; }
.ballnote { color: var(--muted); font-size: 14px; margin: 12px 2px 0; }
.pwlist { display: flex; flex-direction: column; gap: 6px; }
.pw { display: flex; align-items: center; gap: 10px; padding: 7px 4px; border-bottom: 1px solid var(--line); }
.pw .ic { flex: none; width: 38px; height: 38px; border-radius: 11px; background: #262f66; display: flex; align-items: center; justify-content: center; }
.pw .ic svg { width: 23px; height: 23px; }
.pw div { flex: 1; font-size: 14px; color: var(--muted); line-height: 1.3; }
.pw div b { color: var(--ink); font-size: 15px; }
.pw em { font-style: normal; font-weight: 900; font-size: 17px; color: var(--ink); min-width: 28px; text-align: right; }
.pwnote { color: var(--muted); font-size: 14px; margin: 10px 2px 0; line-height: 1.4; }
@media (max-height: 700px) { .stopt { min-height: 52px; padding: 5px 7px; } .stopt small { font-size: 11px; } .sthead svg { width: 38px; height: 38px; } }
/* Compact instrument counters and consistent power-up housings. */
.hud .ggpill { border-radius:12px; gap:1px; line-height:1.05; font-variant-numeric:tabular-nums; }
.hud .ggpill small { font-size:10px; letter-spacing:.25px; line-height:1.2; }
.boost { border-radius:10px; background:linear-gradient(#303b60,#202a49); box-shadow:inset 0 1px #ffffff26,0 2px 3px #0004; }
.boost svg { width:23px; height:23px; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.boost b { right:0; bottom:-2px; border-radius:6px; background:#e9c579; font-weight:750; }
.boost.on,.boost.tgt { background:#f0d496; color:#1b1f33; }
.stage { box-shadow:0 0 0 1px #697a9a,0 3px 10px #0002; }

</style>
</head>

<div class="app" id="app">
  <div class="top">
    <button class="brand homebtn" id="btnHome" aria-label="Back to all games">
      <span class="chev" aria-hidden="true">&#8249;</span>
      <svg viewBox="0 0 100 100" aria-hidden="true"><use href="#bb-logo"/></svg>
      <h1>Ball Barrage</h1>
    </button>
    <div class="hud" id="hud"></div>
    <div class="topbtns">
      <button class="iconbtn" id="btnSound" aria-label="Sound"><svg viewBox="0 0 24 24"><use href="#i-sound-off"/></svg></button>
      <button class="iconbtn" id="btnStats" aria-label="Stats"><svg viewBox="0 0 24 24"><use href="#i-stats"/></svg></button>
      <button class="iconbtn" id="btnSettings" aria-label="Settings"><svg viewBox="0 0 24 24"><use href="#i-gear"/></svg></button>
    </div>
  </div>

  <div class="modes" id="modes">
    <button data-mode="levels">Levels</button>
    <button data-mode="endless">Endless</button>
  </div>

  <!-- 1.3.0: the field's navy fills the whole screen; the field is centred in it and the booster bar floats at the bottom -->
  <div class="stagewrap" id="stagewrap">
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="toast" id="toast"></div>
    </div>
    <!-- 1.4.0: eight power-ups (built by app.js) while aiming; during a shot the bar shows what is on, Faster and bring-home -->
    <div class="bar" id="bar">
      <div class="boosts" id="boosts"></div>
      <div class="ctls"><div class="onnow" id="onNow"></div>
        <button class="boost ctl" id="bFast" aria-label="Faster"><svg viewBox="0 0 24 24"><use href="#i-fast"/></svg></button>
        <button class="boost ctl" id="bRecall" aria-label="Bring the balls back"><svg viewBox="0 0 24 24"><use href="#i-down"/></svg></button></div>
    </div>
    <div class="tgthint" id="tgtHint"></div>
  </div>

  <div class="toolbar">
    <button class="tool" id="btnHelp"><svg viewBox="0 0 24 24"><use href="#i-help"/></svg><span>How to</span></button>
    <button class="tool" id="btnLevels"><svg viewBox="0 0 24 24"><use href="#i-levels"/></svg><span>Levels</span></button>

<script>
/* Ball Barrage logic: the balls-and-numbered-bricks game. Aim, and a stream of balls flies out; every touch takes 1 off
   a brick's number and a brick at 0 breaks. When every ball is back, the bricks come down a row. A brick reaching the
   bottom row ends the game. Levels (drawn from rules, taller than the screen) are cleared by breaking every brick;
   Endless adds a new row every turn. Runs in Node (tools/gen.js proves the levels with the bot below). */
// 1.5.0: the module is a named function (BBModule) so the app can rebuild it inside a Web Worker from its own source
// (a Blob, no extra file) to make and check the levels past the bank without stalling the page.
function BBModule() {
  'use strict';
  var COLS = 11, ROWS = 15, BR = 0.16, SPEED = 0.5, SUB = 3, FIRE_GAP = 3, MINVY = 0.16, MAX_STEPS = 60 * 45;

  function rng(seed) { var s = seed >>> 0 || 1; return function () { s = (s + 0x6D2B79F5) | 0; var t = Math.imul(s ^ (s >>> 15), s | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function emptyRow() { var a = new Array(COLS); for (var i = 0; i < COLS; i++) a[i] = null; return a; }
  // 'p' is a part of a big block (1.4.0): it points at the block's anchor, its bottom-left cell, dr rows down and dc
  // columns left. Parts are solid like bricks; the number, damage and drawing all live on the anchor.
  function isBrick(c) { return c && (c.t === 'b' || c.t === 'x' || c.t === 'p'); }
  function isBlock(c) { return c && (c.t === 'b' || c.t === 'x'); }

  // ---------------- a game ----------------
  // level: { n, balls, start, rows: [strings top-first], hp: [[...numbers]], big: [[r, c, w, h]] }  rows chars: '.' empty,
  // 'b' brick, 'x' bomb, '+' ball, 'h'/'v' lasers. big (1.4.0): r, c = a big block's bottom-left cell in the map (it holds
  // the number), w x h = its size (2x1, 1x2 or 2x2); the other cells it covers become parts
  function cellFrom(ch, hp) {
    if (ch === 'b' || ch === 'x') return { t: ch, hp: hp, max: hp };
    if (ch === '+' || ch === 'h' || ch === 'v') return { t: ch };
    return null;
  }
  function create(level) {
    var g = base('levels');
    g.n = level.n; g.balls = level.balls; g.bot = level.bot || 0;
    var rows = level.rows.map(function (s, r) { var row = emptyRow(); for (var c = 0; c < COLS; c++) row[c] = cellFrom(s[c], level.hp[r][c]); return row; });
    (level.big || []).forEach(function (bk) {
      var r = bk[0], c = bk[1], a = rows[r][c]; if (!a) return;
      a.w = bk[2]; a.h = bk[3];
      for (var i = 0; i < a.h; i++) for (var j = 0; j < a.w; j++) if (i || j) rows[r - i][c + j] = { t: 'p', dr: i, dc: j };
    });
    // the map's bottom row starts at visible row `start`; the rest wait above and come down one a turn
    var start = level.start, H = rows.length;
    for (var r = 0; r < ROWS; r++) { var mr = r - start + H - 1; g.grid[r] = mr >= 0 && mr < H ? rows[mr] : emptyRow(); }
    g.pending = rows.slice(0, Math.max(0, H - 1 - start)); // top-first; the last one enters next
    return g;
  }
  function createEndless(seed) {
    var g = base('endless'); g.seed = seed >>> 0 || 1; g.balls = 1;
    for (var r = 0; r < ROWS; r++) g.grid[r] = emptyRow();
    g.grid[1] = endlessRow(g, 1);
    return g;
  }
  function base(mode) {
    return { mode: mode, grid: new Array(ROWS), pending: [], balls: 1, x: COLS / 2, turn: 1, over: false, won: false, score: 0,
      freeze: false, power: false, n: 0 };
  }
  function endlessRow(g, t) {
    var R = rng(g.seed * 31 + t * 7919), row = emptyRow(), n = 1 + Math.floor(R() * (t < 5 ? 3 : COLS - 3)), free = [];
    // 1.4.0: the top half of a tall big block that came in last turn (its anchor is in the row below, grid row 0 now)
    var below = g.grid[0] || emptyRow();
    for (var c0 = 0; c0 < COLS; c0++) {
      var a = below[c0];
      if (a && a.h === 2) for (var jj = 0; jj < (a.w || 1); jj++) row[c0 + jj] = { t: 'p', dr: 1, dc: jj };
    }
    for (var c = 0; c < COLS; c++) if (!row[c]) free.push(c);
    for (var i = free.length - 1; i > 0; i--) { var j = Math.floor(R() * (i + 1)), tmp = free[i]; free[i] = free[j]; free[j] = tmp; }
    n = Math.min(n, free.length - 1);
    for (var k = 0; k < n; k++) { var hp = R() < 0.22 ? t * 2 : t; row[free[k]] = R() < 0.04 && t > 8 ? { t: 'x', hp: hp, max: hp } : { t: 'b', hp: hp, max: hp }; }
    if (n >= 0) row[free[n]] = { t: '+' };
    if (t > 6 && R() < 0.18 && free[n + 1] !== undefined) row[free[n + 1]] = { t: R() < 0.5 ? 'h' : 'v' };
    // big blocks from turn 12: now and then a brick grows to 2x1 (the cell to its right) or, later, 1x2 / 2x2 (its top half
    // comes in with next turn's row). They carry bigger numbers: 3x the turn for 2 cells, 5x for 4.
    if (t >= 12 && R() < 0.3) {
      var tall = t >= 20 && R() < 0.5, wide = !tall || R() < 0.5, spots = [];
      // a spot: a plain brick (and, for a wide one, a plain brick or an empty cell next to it)
      for (var s = 0; s < COLS - (wide ? 1 : 0); s++) {
        if (!(row[s] && row[s].t === 'b')) continue;
        if (wide && row[s + 1] && row[s + 1].t !== 'b') continue;
        spots.push(s);
      }
      if (spots.length) {
        var at = spots[Math.floor(R() * spots.length)], w = wide ? 2 : 1, h = tall ? 2 : 1, big = t * (w * h === 4 ? 5 : 3);
        row[at] = { t: 'b', hp: big, max: big, w: w, h: h };
        if (wide) row[at + 1] = { t: 'p', dr: 0, dc: 1 };
      }
    }
    return row;
  }
  function bricksLeft(g) { // a big block counts once
    var n = 0;
    g.grid.forEach(function (row) { row.forEach(function (c) { if (isBlock(c)) n++; }); });
    g.pending.forEach(function (row) { row.forEach(function (c) { if (isBlock(c)) n++; }); });
    return n;
  }
  // a cell above the field (r < 0) is in the rows still to come down (pending is top-first, its last row enters next)
  function cellAt(g, r, c) { if (r >= 0) return g.grid[r] ? g.grid[r][c] : null; var pr = g.pending[g.pending.length + r]; return pr ? pr[c] : null; }
  function setCell(g, r, c, v) { if (r >= 0) { if (g.grid[r]) g.grid[r][c] = v; return; } var pr = g.pending[g.pending.length + r]; if (pr) pr[c] = v; }
  // the block a cell belongs to: [row, col] of its anchor (itself for a plain brick), or null
  function anchorOf(g, r, c) {
    var cell = g.grid[r] && g.grid[r][c]; if (!isBrick(cell)) return null;
    if (cell.t === 'p') { var ar = r + cell.dr, ac = c - cell.dc; return isBlock(g.grid[ar] && g.grid[ar][ac]) ? [ar, ac] : null; }
    return [r, c];
  }
  // the distinct blocks touching a list of cells (so a big block in a laser's row is hit once, not once per cell)
  function blocksIn(g, cells) {
    var seen = {}, out = [];
    cells.forEach(function (p) { if (p[0] < 0 || p[0] >= ROWS || p[1] < 0 || p[1] >= COLS) return; var a = anchorOf(g, p[0], p[1]); if (!a) return; var key = a[0] * 100 + a[1]; if (seen[key]) return; seen[key] = 1; out.push(a); });
    return out;
  }
  function lowestBrickRow(g) { for (var r = ROWS - 1; r >= 0; r--) if (g.grid[r].some(isBrick)) return r; return -1; }

  // ---------------- damage ----------------
  // r, c may be any cell of a block (a part is turned into its anchor); a broken big block clears every cell it covers
  function hit(g, r, c, amt, ev) {
    var a = anchorOf(g, r, c); if (!a) return; r = a[0]; c = a[1];
    var cell = g.grid[r][c];
    var d = Math.min(cell.hp, amt); cell.hp -= d; g.score += d;
    if (cell.hp <= 0) {
      var w = cell.w || 1, h = cell.h || 1;
      for (var i = 0; i < h; i++) for (var j = 0; j < w; j++) setCell(g, r - i, c + j, null);
      if (ev) ev.push({ t: 'break', r: r, c: c, w: w, h: h, max: cell.max, bomb: cell.t === 'x' });
      if (cell.t === 'x') { // a bomb clears the eight cells around it (each block once)
        if (ev) ev.push({ t: 'boom', r: r, c: c });
        blast(g, r, c, false, ev);
      }
    } else if (ev) ev.push({ t: 'hit', r: r, c: c });
  }
  // break every block touching the 3x3 around (r, c) (withMiddle: the middle cell too, for the bomb booster)
  function blast(g, r, c, withMiddle, ev) {
    var cells = [];
    for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) if (withMiddle || dr || dc) cells.push([r + dr, c + dc]);
    blocksIn(g, cells).forEach(function (p) { var o = g.grid[p[0]][p[1]]; if (isBlock(o)) hit(g, p[0], p[1], o.hp, ev); });
  }
  function lineCells(r, c, kind) {
    var cells = [];
    if (kind !== 'v') for (var cc = 0; cc < COLS; cc++) cells.push([r, cc]);
    if (kind !== 'h') for (var rr = 0; rr < ROWS; rr++) cells.push([rr, c]);
    return cells;
  }
  function laser(g, r, c, kind, amt, ev) {
    if (ev) ev.push({ t: 'laser', r: r, c: c, kind: kind });
    blocksIn(g, lineCells(r, c, kind)).forEach(function (p) { hit(g, p[0], p[1], amt, ev); });
  }

  // ---------------- ball movement ----------------
  function solidAt(g, r, c) { return r >= 0 && r < ROWS && c >= 0 && c < COLS && isBrick(g.grid[r][c]); }
  // move one ball a sub-step; returns true when it has landed. dry: only look (the bot's probe), count what it touches
  function moveBall(g, b, ev, dry, probe) {
    b.x += b.vx / SUB; b.y += b.vy / SUB;
    if (b.x < BR) { b.x = BR; b.vx = Math.abs(b.vx); }
    else if (b.x > COLS - BR) { b.x = COLS - BR; b.vx = -Math.abs(b.vx); }
    if (b.y < BR) { b.y = BR; b.vy = Math.abs(b.vy); }
    for (var pass = 0; pass < 3; pass++) {
      var c0 = Math.floor(b.x - BR), c1 = Math.floor(b.x + BR), r0 = Math.floor(b.y - BR), r1 = Math.floor(b.y + BR);
      var best = null, bp = 0;
      for (var r = r0; r <= r1; r++) for (var c = c0; c <= c1; c++) {
        if (!solidAt(g, r, c)) continue;
        var cx = b.x < c ? c : b.x > c + 1 ? c + 1 : b.x, cy = b.y < r ? r : b.y > r + 1 ? r + 1 : b.y;
        var dx = b.x - cx, dy = b.y - cy, d2 = dx * dx + dy * dy, nx, ny, pen;
        if (d2 >= BR * BR) continue;
        if (d2 > 1e-12) {
          var d = Math.sqrt(d2); nx = dx / d; ny = dy / d; pen = BR - d;
          // a corner joined to a neighbour is really a flat face (no snagging on the seams between bricks)
          if (dx !== 0 && dy !== 0) {
            var sx = dx > 0 ? 1 : -1, sy = dy > 0 ? 1 : -1;
            if (solidAt(g, r, c + sx)) { nx = 0; ny = sy; pen = BR - Math.abs(dy); }
            else if (solidAt(g, r + sy, c)) { nx = sx; ny = 0; pen = BR - Math.abs(dx); }
          }
        } else { // center inside the brick: out through the nearest side
          var l = b.x - c, rt = c + 1 - b.x, t = b.y - r, bt = r + 1 - b.y, m = Math.min(l, rt, t, bt);
          if (m === l) { nx = -1; ny = 0; } else if (m === rt) { nx = 1; ny = 0; } else if (m === t) { nx = 0; ny = -1; } else { nx = 0; ny = 1; }
          pen = m + BR;
        }
        if (pen > bp) { bp = pen; best = [r, c, nx, ny, pen]; }
      }
      if (!best) break;
      b.x += best[2] * best[4]; b.y += best[3] * best[4];
      var dot = b.vx * best[2] + b.vy * best[3];
      if (dot < 0) {
        b.vx -= 2 * dot * best[2]; b.vy -= 2 * dot * best[3];
        if (dry) { if (probe) probe.hit(best[0], best[1]); }
        else hit(g, best[0], best[1], g.power ? 2 : 1, ev);
      }
    }
    // never let a ball skim sideways for ever
    var sp = Math.hypot(b.vx, b.vy) || 1;
    if (Math.abs(b.vy) < MINVY * SPEED) { b.vy = (b.vy < 0 ? -1 : 1) * MINVY * SPEED; }
    sp = Math.hypot(b.vx, b.vy); b.vx *= SPEED / sp; b.vy *= SPEED / sp;
    // things a ball passes through: extra balls and lasers
    var ir = Math.floor(b.y), ic = Math.floor(b.x);
    if (ir >= 0 && ir < ROWS && ic >= 0 && ic < COLS) {
      var it = g.grid[ir][ic];
      if (it && !isBrick(it) && Math.hypot(b.x - ic - 0.5, b.y - ir - 0.5) < 0.42) {
        if (dry) { if (probe) probe.item(ir, ic, it); }
        else if (it.t === '+') { if (!it.got) { it.got = true; g.grid[ir][ic] = null; g.collected = (g.collected || 0) + 1; if (ev) ev.push({ t: 'collect', r: ir, c: ic }); } }
        else { var key = ir * 100 + ic; if (b.laser !== key) { b.laser = key; it.used = true; laser(g, ir, ic, it.t, g.power ? 2 : 1, ev); } }
      } else if (b.laser !== undefined && !(it && (it.t === 'h' || it.t === 'v'))) b.laser = undefined;
    }
    if (b.y >= ROWS - BR && b.vy > 0) { b.y = ROWS - BR; return true; }
    return false;
  }

  // ---------------- a turn ----------------
  function aimOk(a) { return a > 0.12 && a < Math.PI - 0.12; }
  function clampAim(a) { return Math.max(0.12, Math.min(Math.PI - 0.12, a)); }
  // angle: measured from the right-hand floor, so PI/2 is straight up
  function startShot(g, angle) {
    angle = clampAim(angle);
    g.collected = 0;
    // extra-balls booster (1.4.0): half as many again for this shot only
    var total = g.balls + (g.extra ? Math.ceil(g.balls / 2) : 0);
    return { angle: angle, vx: Math.cos(angle) * SPEED, vy: -Math.sin(angle) * SPEED, fired: 0, total: total, balls: [], step: 0, firstX: null, done: false, x0: g.x };
  }
  function stepShot(g, s, ev) {
    if (s.done) return true;
    var gap = s.total > 60 ? 1 : s.total > 20 ? 2 : FIRE_GAP; // big volleys come out faster
    if (s.fired < s.total && s.step % gap === 0) { s.balls.push({ x: s.x0, y: ROWS - BR, vx: s.vx, vy: s.vy, live: true }); s.fired++; }
    s.step++;
    var live = 0;
    for (var i = 0; i < s.balls.length; i++) {
      var b = s.balls[i]; if (!b.live) continue;
      for (var k = 0; k < SUB; k++) {
        if (moveBall(g, b, ev, false)) {
          // bouncer booster (1.4.0): each ball bounces off the floor once more before it lands
          if (g.bounce && !b.bounced) { b.bounced = true; b.vy = -Math.abs(b.vy); b.y = ROWS - BR - 0.01; if (ev) ev.push({ t: 'bounce', x: b.x }); continue; }
          b.live = false; b.landX = Math.max(BR, Math.min(COLS - BR, b.x));
          if (s.firstX === null) { s.firstX = b.landX; if (ev) ev.push({ t: 'first', x: s.firstX }); }
          if (ev) ev.push({ t: 'land', i: i });
          break;
        }
      }
      if (b.live) live++;
    }
    if (s.step > MAX_STEPS) { recall(g, s); return true; }
    if (live === 0 && s.fired >= s.total) { s.done = true; return true; }
    return false;
  }
  // bring every ball home now (the rest of this turn does nothing more)
  function recall(g, s) {
    s.balls.forEach(function (b) { if (b.live) { b.live = false; b.landX = b.x; } });
    s.fired = s.total; s.done = true;
    if (s.firstX === null) s.firstX = s.x0;
  }
  function endTurn(g, s) {
    g.balls += g.collected || 0; g.collected = 0;
    g.x = s.firstX === null ? g.x : s.firstX;
    g.power = false; g.extra = false; g.bounce = false;
    // used lasers go away
    g.grid.forEach(function (row) { for (var c = 0; c < COLS; c++) if (row[c] && row[c].used) row[c] = null; });
    if (g.mode === 'levels' && bricksLeft(g) === 0) { g.over = true; g.won = true; return { won: true }; }
    if (g.freeze) g.freeze = false;
    else {
      g.grid.pop();
      g.grid.unshift(g.mode === 'endless' ? endlessRow(g, g.turn + 1) : g.pending.length ? g.pending.pop() : emptyRow());
    }
    g.turn++;
    var last = g.grid[ROWS - 1], extra = 0;
    for (var c = 0; c < COLS; c++) { var it = last[c]; if (it && it.t === '+') { extra++; last[c] = null; } else if (it && (it.t === 'h' || it.t === 'v')) last[c] = null; }
    g.balls += extra;
    if (last.some(isBrick)) { g.over = true; g.won = false; return { lost: true, extra: extra }; }
    return { extra: extra };
  }

  // ---------------- boosters ----------------
  function rocket(g, ev) { // clears the lowest row that has bricks (a big block in it goes whole)
    var r = lowestBrickRow(g); if (r < 0) return false;
    if (ev) ev.push({ t: 'rocket', r: r });
    blocksIn(g, lineCells(r, 0, 'h')).forEach(function (p) { var o = g.grid[p[0]][p[1]]; if (isBlock(o)) hit(g, p[0], p[1], o.hp, ev); });
    return true;
  }

    $('bFast').classList.toggle('on', fast);
    $('bFast').disabled = $('bRecall').disabled = phase !== 'shot';
  }
  function renderAll() { renderInfo(); renderBar(); draw(); }
  function openLevels() {
    // 1.5.0: the bank plus the made-on-the-phone levels up to 30 past the furthest open one (the list grows as you go)
    var h = '', top = Math.max(BANK, meta.open + 30, levelNo);
    for (var n = 1; n <= top; n++) {
      var st = meta.stars[n] || 0;
      h += '<button class="lv' + (n === levelNo && g && g.mode === 'levels' ? ' cur' : '') + '" data-n="' + n + '"' + (n > meta.open ? ' disabled' : '') + '>' + n + '<small>' + '★★★'.slice(0, st) + '</small></button>';
    }
    $('lvgrid').innerHTML = h;
    $('ovLevels').classList.add('show');
    // a long list: start at the level being played (or the furthest open one)
    var cur = $('lvgrid').querySelector('.cur') || $('lvgrid').querySelector('[data-n="' + meta.open + '"]');
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'center' });
  }
  var toastT = 0;
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('show'); }, 1600); }
  function showCard(title, html, buttons) {
    $('cardIcon').innerHTML = '<svg viewBox="0 0 100 100"><use href="#bb-logo"/></svg>';
    $('endTitle').textContent = title; $('endText').innerHTML = html;
    var box = $('endActions'); box.innerHTML = '';
    buttons.forEach(function (b) {
      var el = document.createElement('button'); el.className = 'btn' + (b.red ? ' red' : ''); el.textContent = b.label;
      el.addEventListener('click', function () { $('ovEnd').classList.remove('show'); b.go(); });
      box.appendChild(el);
    });
    $('ovEnd').classList.add('show');
  }
  function showAd(done) { GoobsAds.show({ onShow: function () { S.ding(); }, onStep: function () { S.sign(); } }, done); }
  function between(next) {
    if (Goobs.adsOn() && meta.finished > 0 && meta.finished % settings.adEvery === 0 && meta.lastAdAt !== meta.finished) {
      meta.lastAdAt = meta.finished; saveMeta(); next(); showAd(function () {}); return;
    }
    next();
  }
  // ---- 1.4.0: the start card (before a level or Endless) ----
  var picks = [];
  function openStart() {
    picks = [];
    var lv = levelAt(levelNo) || {};
    $('stTitle').textContent = g.mode === 'levels' ? 'Level ' + fmt(levelNo) : 'Endless';
    $('stInfo').innerHTML = g.mode === 'levels' ? fmt(g.balls) + ' balls &middot; ' + BB.bricksLeft(g) + ' bricks &middot; <span style="color:#e0a800">★★★</span> in ' + (lv.bot || '?') + ' turns or fewer'
      : 'One ball to start, a new row every turn &middot; best ' + meta.endlessBest;
    renderStart(); $('ovStart').classList.add('show');
  }
  function renderStart() {
    $('stGrid').innerHTML = BOOSTS.filter(function (b) { return b.start; }).map(function (b) {
      var n = meta.boost[b.k], on = picks.indexOf(b.k) >= 0;
      return '<button class="stopt' + (on ? ' on' : '') + '" data-k="' + b.k + '"' + (n <= 0 ? ' disabled' : '') + '><span class="ic" style="color:' + b.col + '">' + icon(b.icon) + '</span><span><b>' + b.name + '</b><small>' + b.start + '</small></span><i>' + n + '</i></button>';
    }).join('');
    $('stCount').textContent = picks.length ? picks.length + ' of 2 picked' : 'pick up to 2 (optional)';
    $('btnStart').textContent = picks.length ? 'Play with ' + picks.map(function (k2) { return BK[k2].name.toLowerCase(); }).join(' + ') : 'Play';
    var cur = BALLS.filter(function (b) { return b.id === settings.ball; })[0];
    $('stBallName').textContent = cur.name; previewBall($('stBallCv'), cur.id);
  }
  // the picks are used up only now, when the level starts
  function beginLevel() {
    $('ovStart').classList.remove('show');
    var used = [];
    picks.forEach(function (k2) { if (meta.boost[k2] > 0 && applyBoost(k2)) used.push(BK[k2].name); });
    picks = [];
    if (used.length) setTimeout(function () { toast('Starting with ' + used.join(' + ')); }, 50);
    renderAll();
  }
  function openBalls() {
    $('ballGrid').innerHTML = BALLS.map(function (b) {
      var open = ballOpen(b);
      return '<button class="ballopt' + (b.id === settings.ball ? ' on' : '') + '" data-id="' + b.id + '"' + (open ? '' : ' disabled') + '><canvas width="112" height="112"></canvas>' + b.name + (open ? '' : '<small>Clear level ' + b.at + '</small>') + '</button>';
    }).join('');
    Array.prototype.forEach.call($('ballGrid').querySelectorAll('.ballopt'), function (el) { previewBall(el.querySelector('canvas'), el.dataset.id); });
    $('ovBalls').classList.add('show');
  }
  function openPowers() {
    $('pwList').innerHTML = BOOSTS.map(function (b) { return '<div class="pw"><span class="ic" style="color:' + b.col + '">' + icon(b.icon) + '</span><div><b>' + b.name + '</b><br>' + b.help + (b.start ? ' <i>Start with it: ' + b.start.toLowerCase() + '.</i>' : '') + '</div><em>' + meta.boost[b.k] + '</em></div>'; }).join('') +
      '<p class="pwnote">Use them before a shot from the bar under the field, or take up to two into a level on the card before it starts. You earn one for every new three-star finish and one for the first clear of every fifth level. No shop: they can\'t be bought.</p>';
    $('ovPowers').classList.add('show');
  }
  function openHelp() {
    $('helpTitle').textContent = 'How to play Ball Barrage';
    $('helpList').innerHTML = [
      '<b>Drag</b> anywhere above the bottom line to aim (the dotted line shows the way to the first hit) and <b>let go</b>. All your balls fly out, one after another.',
      'Every time a ball touches a brick, its number goes down by 1. At 0 it breaks. Balls bounce off everything and come back down.',
      'When all the balls are back, the bricks <b>move down a row</b>. The next shot starts where the first ball landed. If a brick reaches the bottom row, the game is over.',
      'Green rings give <b>+1 ball</b>. Blue arrows are <b>lasers</b>: a ball passing through hits every brick in that row or column. A <b>bomb</b> breaks the eight bricks around it when it goes.',
      '<b>Big blocks</b> (2 or 4 squares) carry big numbers. They count as one brick: every touch takes 1 off the one number, and they move down as one.',
      '<b>Power-ups</b> (the bar under the field, before a shot): <b>rocket</b> clears the lowest row, <b>beam</b> (tap a brick) hits its whole row and column, <b>bomb</b> (tap a spot) breaks a 3×3, <b>halve</b> halves every number, <b>freeze</b> keeps the bricks still after the shot, <b>power</b> doubles every hit, <b>extra balls</b> adds half as many again, and the <b>bouncer</b> bounces every ball off the floor once. Menu, Power-ups has the details.',
      'Before each level you can <b>start with</b> up to two of them, and pick your <b>ball</b> (new ones open as you clear levels). New three-star finishes and every fifth level earn more power-ups.',
      'The <b>fast</b> button speeds up a long turn (it also speeds up by itself); the <b>down arrow</b> brings all the balls home.',
      '<b>Levels</b>: break every brick, including the ones still coming down from above. Fewer turns earn more stars. There is no last level: the first 100 are hand-checked, and after that new ones keep coming, each made on your phone and cleared by a computer player (twice) with room to spare before you get it. <b>Endless</b>: a new row every turn; how long can you last?'
    ].map(function (x) { return '<li>' + x + '</li>'; }).join('');
    $('ovHelp').classList.add('show');
  }
  function renderStats() {
    var stars = 0; for (var n in meta.stars) stars += meta.stars[n];
    $('statsBody').innerHTML = '<div class="tiles"><div class="tile"><b>' + Math.max(0, meta.open - 1) + '</b><span>Levels cleared</span></div><div class="tile"><b>' + stars + '</b><span>Stars</span></div><div class="tile"><b>' + meta.endlessBest + '</b><span>Endless best</span></div></div>' +
      '<div class="tiles"><div class="tile"><b>' + fmt(stats.shots) + '</b><span>Shots</span></div><div class="tile"><b>' + fmt(stats.balls) + '</b><span>Balls fired</span></div><div class="tile"><b>' + fmt(stats.broken) + '</b><span>Bricks broken</span></div></div>';
  }

  // ================= wiring =================
  function syncSound() {
    $('btnSound').innerHTML = '<svg viewBox="0 0 24 24"><use href="#i-sound-' + (settings.sound ? 'on' : 'off') + '"/></svg>';
    $('btnSound').classList.toggle('on', settings.sound); $('setSound').checked = settings.sound; S.setEnabled(settings.sound);
  }
  function syncAds() { $('setAds').checked = Goobs.adsOn(); $('adEvery').textContent = settings.adEvery; $('rowAdEvery').classList.toggle('off', !Goobs.adsOn()); }
  function sheet(btn, ov, close, onOpen) {
    if (btn) $(btn).addEventListener('click', function () { if (onOpen) onOpen(); $(ov).classList.add('show'); });
    $(close).addEventListener('click', function () { $(ov).classList.remove('show'); });
    $(ov).addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  }
  function inGame() { return g && !g.over && g.turn > 1; }
  function init() {
    // full screen: How to, Levels, Stats, Settings and Restart live in the Menu; the balls stop while it is open.
    // 1.3.0: overlay mode (the top row floats on the navy) and the Levels / Endless tabs move to the top of the Menu
    FS = Goobs.fullscreen({ overlay: true, menu: ['btnHelp', 'btnLevels', 'btnBalls', 'btnPowers', 'btnStats', 'btnSettings', 'btnNew'], info: function () {
      if (!g) return '';
      return g.mode === 'levels' ? 'Level <b>' + fmt(levelNo) + '</b> &middot; ' + BB.bricksLeft(g) + ' bricks left &middot; turn ' + g.turn : 'Endless &middot; turn <b>' + g.turn + '</b> &middot; best ' + Math.max(meta.endlessBest, g.turn - 1);
    } });
    FS.list.parentNode.insertBefore($('modes'), FS.list);
    Goobs.themePicker($('themes'));
    cv = $('cv'); cx = cv.getContext('2d');
    var sw = $('stagewrap');
    sw.addEventListener('pointerdown', onDown); sw.addEventListener('pointermove', onMove); sw.addEventListener('pointerup', onUp);
    sw.addEventListener('pointercancel', function () { ptr = null; aim = null; });
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) { document.addEventListener(ev, function () { S.unlock(); }, { passive: true }); });
    $('btnHome').addEventListener('click', function () { save(); Goobs.home(); });
    $('modes').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      FS.close();
      if (g && b.dataset.mode === g.mode) return; // 1.5.0: g can be null while the first level is being made
      var go = b.dataset.mode === 'endless' ? startEndless : function () { startLevel(meta.level); };
      if (inGame() && phase !== 'over') { showCard('Leave this game?', 'It ends here.', [{ label: 'Leave it', red: true, go: go }, { label: 'Keep playing', go: function () {} }]); return; }
      go();
    });
    $('btnNew').addEventListener('click', function () {
      var go = g && g.mode === 'endless' ? startEndless : function () { startLevel(levelNo); };
      if (inGame() && phase !== 'over') { showCard('Restart?', 'This one starts over.', [{ label: 'Restart', red: true, go: go }, { label: 'Keep playing', go: function () {} }]); return; }
      go();
    });
    $('btnLevels').addEventListener('click', openLevels);
    $('lvgrid').addEventListener('click', function (e) { var b = e.target.closest('button[data-n]'); if (!b) return; $('ovLevels').classList.remove('show'); startLevel(+b.dataset.n); });
    sheet(null, 'ovLevels', 'btnCloseLevels');
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings');
    sheet('btnStats', 'ovStats', 'btnCloseStats', renderStats);
    $('btnHelp').addEventListener('click', openHelp);
    function closeHelp() { $('ovHelp').classList.remove('show'); if (!meta.seen) { meta.seen = true; saveMeta(); } }
    $('btnCloseHelp').addEventListener('click', closeHelp);
    $('ovHelp').addEventListener('click', function (e) { if (e.target === this) closeHelp(); });
    $('btnSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncSound(); S.ding(); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); syncSound(); S.ding(); });
    $('setGuide').checked = settings.guide;
    $('setGuide').addEventListener('change', function () { settings.guide = this.checked; saveSettings(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncAds(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncAds(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncAds(); });
    buildBar();
    $('stGrid').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-k]'); if (!b || b.disabled) return;
      var i = picks.indexOf(b.dataset.k);
      if (i >= 0) picks.splice(i, 1); else { if (picks.length >= 2) picks.shift(); picks.push(b.dataset.k); } // a third pick replaces the first
      S.pick(); renderStart();
    });
    $('btnStart').addEventListener('click', beginLevel);
    $('stBall').addEventListener('click', openBalls);
    $('btnBalls').addEventListener('click', openBalls);
    $('ballGrid').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-id]'); if (!b || b.disabled) return;
      settings.ball = b.dataset.id; saveSettings(); S.pick();
      Array.prototype.forEach.call($('ballGrid').children, function (el) { el.classList.toggle('on', el.dataset.id === settings.ball); });
      if (isOpen('ovStart')) renderStart();
    });
    sheet(null, 'ovBalls', 'btnCloseBalls');
    $('btnPowers').addEventListener('click', openPowers);
    sheet(null, 'ovPowers', 'btnClosePowers');
    $('bFast').addEventListener('click', function () { fast = !fast; renderBar(); });
    $('bRecall').addEventListener('click', function () { if (phase === 'shot' && shot) { BB.recall(g, shot); slideHome(); } });
    var rq = 0, refit = function () { if (rq) return; rq = requestAnimationFrame(function () { rq = 0; fit(); draw(); }); };
    if (window.ResizeObserver) new ResizeObserver(refit).observe($('stagewrap'));
    window.addEventListener('resize', refit);
    document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });
    window.addEventListener('pagehide', save);
    syncSound(); syncAds(); fit();
    if (!load()) { if (meta.mode === 'endless') startEndless(); else startLevel(Math.min(meta.level, meta.open)); }
    else { phase = 'aim'; renderAll(); if (g.mode === 'levels') { need(levelNo); need(levelNo + 1); } } // 1.5.0: the stars need the level; and the next one
    if (!meta.seen) openHelp();
    lastT = performance.now(); requestAnimationFrame(frame);
    Goobs.markPlayed('barrage');
    Goobs.initUpdates({ beforeReload: save, onVersions: function (v) { $('version').textContent = 'Ball Barrage ' + (v.barrage || '?') + ' · Goobs-Games ' + (v.shell || '?'); } });
  }

  // hook for automated tests
  window.__bb = { get g() { return g; }, get phase() { return phase; }, fire: fire, BB: BB, startLevel: startLevel, startEndless: startEndless, meta: function () { return meta; },
    get tgt() { return tgt; }, settings: function () { return settings; }, BALLS: BALLS, BOOSTS: BOOSTS, maxHp: function () { scaleMax = maxHp(); },
    bot: function () { return phase === 'aim' && g && !g.over ? fire(BB.botAngle(g)) : false; }, get k() { return k; },  get shot() { return shot; }, useBoost: useBoost, stats: function () { return stats; },
    BANK: BANK, levelAt: levelAt, need: need, made: function () { return made; }, lastMs: function () { return lastMs; }, get levelNo() { return levelNo; } };

  init();
})();
</script>
</body>
</html>
