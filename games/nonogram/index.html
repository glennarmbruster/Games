<script>
/* if Pixel Pier can't open, say so on screen (never a blank page) and offer a fresh start */
(function () {
  var shown = false;
  function fail(msg) {
    if (shown || window.__ngReady) return; shown = true;
    function put() {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:#f4f5f9;color:#1b1f33;font:600 16px -apple-system,system-ui,sans-serif;text-align:center';
      d.innerHTML = '<b style="font-size:21px">Pixel Pier didn’t open</b><div style="max-width:320px;opacity:.75;font-size:13px">' + String(msg).replace(/[<>&]/g, '') + '</div>';
      function btn(t, bg, go) { var b = document.createElement('button'); b.textContent = t; b.style.cssText = 'font:800 17px -apple-system,system-ui,sans-serif;padding:13px 24px;border-radius:14px;border:0;color:#fff;background:' + bg; b.onclick = go; d.appendChild(b); }
      btn('Start fresh', '#5a54f0', function () { try { localStorage.removeItem('nonogram.games'); localStorage.removeItem('nonogram.gen'); } catch (e) { /* ignore */ } location.reload(); });
      btn('All games', '#6b7080', function () { location.href = '../../'; });
      document.body.appendChild(d);
    }
    if (document.body) put(); else document.addEventListener('DOMContentLoaded', put);
  }
  window.addEventListener('error', function (e) { fail((e.message || 'Something went wrong') + (e.lineno ? ' (line ' + e.lineno + ')' : '')); });
  setTimeout(function () { if (!window.__ngReady) fail('It took too long to start.'); }, 8000);
})();
</script>
<title>Pixel Pier</title>
<style>
/* Pixel Pier: portrait, full screen (kit overlay mode). A light seaside backdrop (sky, sea, a pier at the bottom edge)
   behind a white, high-contrast board; the counters above the board, the big Fill / Cross switch and the tools under it
   within thumb reach. The board is drawn on a canvas (app.js); its colours come from the --ng-* tokens below, per theme. */
:root {
  --ng-sky: #e4f3fb; --ng-sea: #bfe2f1; --ng-sea2: #a9d6ea; --ng-pier: rgba(47,94,130,.16);
  --ng-card: #ffffff; --ng-clue: #f1f6fb; --ng-clue2: #e5eef8; --ng-thin: #d2d9e4; --ng-thick: #7d8aa0; --ng-edge: #44516a;
  --ng-ink: #1f2b45; --ng-x: #aeb8c8; --ng-num: #1b2130; --ng-done: #b9c1cd; --ng-bad: #e5484d;
  --ng-cross: rgba(63,124,255,.10); --ng-cluehl: #d6e4ff; --ng-cur: #3f7cff; --ng-hint: #f5a400; --ng-hintbg: rgba(255,186,40,.20);
  --ng-ctl: rgba(255,255,255,.86); --ng-ctlink: #1b2130;
}
:root[data-theme="dark"] {
  --ng-sky: #101826; --ng-sea: #0d2034; --ng-sea2: #0b2a44; --ng-pier: rgba(140,180,220,.10);
  --ng-card: #1a1f2c; --ng-clue: #20263a; --ng-clue2: #262d44; --ng-thin: #30384c; --ng-thick: #6c7a98; --ng-edge: #93a2c2;
  --ng-ink: #d8e3fb; --ng-x: #5f6b85; --ng-num: #e8edf7; --ng-done: #4f5a70; --ng-bad: #ff6369;
  --ng-cross: rgba(120,160,255,.13); --ng-cluehl: #2f3d66; --ng-cur: #7ea6ff; --ng-hint: #ffc53d; --ng-hintbg: rgba(255,197,61,.16);
  --ng-ctl: rgba(30,36,52,.92); --ng-ctlink: #eef1f7;
}
:root[data-theme="blue"] {
  --ng-sky: #0c1a30; --ng-sea: #0b2440; --ng-sea2: #0a2f55; --ng-pier: rgba(140,190,255,.10);
  --ng-card: #13233b; --ng-clue: #182b47; --ng-clue2: #1d3354; --ng-thin: #25406a; --ng-thick: #6585b6; --ng-edge: #9db8e0;
  --ng-ink: #dbe8ff; --ng-x: #5a7299; --ng-num: #e8f0fc; --ng-done: #4a6288; --ng-bad: #ff7a70;
  --ng-cross: rgba(124,192,255,.13); --ng-cluehl: #24477a; --ng-cur: #7cc0ff; --ng-hint: #ffc53d; --ng-hintbg: rgba(255,197,61,.16);
  --ng-ctl: rgba(19,35,59,.94); --ng-ctlink: #e8f0fc;
}
html, body { height: 100%; }
body { background: linear-gradient(var(--ng-sky) 0%, var(--ng-sky) 38%, var(--ng-sea) 72%, var(--ng-sea2) 100%) fixed; background-color: var(--ng-sea); overflow: hidden; }
/* the pier and the waves along the bottom edge, behind everything */
.seabg { position: fixed; left: 0; right: 0; bottom: 0; height: 120px; pointer-events: none; z-index: 0; color: var(--ng-pier); }
.seabg svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; }
html.gg-fs-over .app { position: relative; z-index: 1; height: 100%; gap: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 54px) calc(env(safe-area-inset-right, 0px) + 8px) calc(env(safe-area-inset-bottom, 0px) + 6px) calc(env(safe-area-inset-left, 0px) + 8px); }

/* pack + picture pill in the middle of the top row (tap: the pack) */
.nghud { position: fixed; z-index: 7; top: calc(env(safe-area-inset-top, 0px) + 6px); left: 58px; right: 58px; height: 44px; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.nghud .ggpill { pointer-events: auto; font: inherit; font-size: 15px; font-weight: 800; padding: 8px 14px; border: 0; color: #1b1f33; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.nghud .ggpill .st { color: #f5b301; margin-left: 4px; }

/* clock, mistakes, hints */
.counters { display: flex; justify-content: center; gap: 6px; margin: 0 0 6px; flex: none; min-height: 30px; }
.cnt { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 15px; background: var(--ng-ctl); color: var(--ng-ctlink); font-size: 15px; font-weight: 800; box-shadow: 0 1px 4px rgba(20,40,70,.12); }
.cnt svg { width: 15px; height: 15px; opacity: .55; }
.cnt b { font-variant-numeric: tabular-nums; }
.cnt.hide { display: none; }
.cnt.bad b { color: var(--ng-bad); }

/* the board */
.boardarea { flex: 1; width: 100%; min-height: 0; position: relative; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.bubble { position: absolute; left: 0; top: 0; min-width: 44px; height: 44px; padding: 0 10px; border-radius: 22px; background: var(--ng-cur); color: #fff; font-size: 24px; font-weight: 900; display: none;
  align-items: center; justify-content: center; pointer-events: none; box-shadow: 0 4px 14px rgba(20,40,90,.3); transform: translate(-50%, -100%); z-index: 3; font-variant-numeric: tabular-nums; }
.bubble.show { display: flex; }
.bubble.red { background: var(--ng-bad); }
.toast { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); max-width: 88%; text-align: center; pointer-events: none; z-index: 4;
  opacity: 0; transition: opacity .2s; background: rgba(16,24,40,.9); color: #fff; font-weight: 700; font-size: 16px; line-height: 1.3; padding: 11px 16px; border-radius: 14px; }
.toast.show { opacity: 1; }
.making { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--ng-ctlink); font-weight: 800; font-size: 17px; }
.making.show { display: flex; }
.making .spin { width: 34px; height: 34px; border-radius: 50%; border: 4px solid rgba(60,110,170,.2); border-top-color: var(--ng-cur); animation: ngspin 0.9s linear infinite; }
@keyframes ngspin { to { transform: rotate(360deg); } }

/* the controls under the board: one of three panels, all the same height so the board never jumps */
.controls { flex: none; width: 100%; max-width: 560px; height: 124px; position: relative; margin-top: 6px; }
.playctl, .hintctl, .donectl { position: absolute; inset: 0; display: none; flex-direction: column; gap: 6px; }
.controls.play .playctl, .controls.hint .hintctl { display: flex; }
.controls.done .donectl { display: flex; justify-content: center; }
.modesw { display: flex; gap: 6px; height: 58px; flex: none; background: var(--ng-ctl); border-radius: 18px; padding: 4px; box-shadow: 0 2px 8px rgba(20,40,70,.14); }
.modesw button { flex: 1; border: 0; border-radius: 14px; background: transparent; color: var(--ng-ctlink); font: inherit; font-size: 19px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 9px; opacity: .62; }
.modesw button svg { width: 24px; height: 24px; }
.modesw button.on { opacity: 1; background: var(--ng-ink); color: var(--ng-card); box-shadow: 0 3px 10px rgba(20,40,70,.25); }
.modesw button#mCross.on { background: #5a6478; color: #fff; }
:root[data-theme="dark"] .modesw button#mCross.on, :root[data-theme="blue"] .modesw button#mCross.on { background: #8090ad; color: #10141f; }
.modesw button:active { transform: scale(.97); }
.toolrow { display: flex; gap: 6px; height: 60px; flex: none; }
.tbtn { flex: 1; border: 0; border-radius: 16px; background: var(--ng-ctl); color: var(--ng-ctlink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font: inherit; font-size: 12px; font-weight: 700; -webkit-tap-highlight-color: transparent; box-shadow: 0 1px 5px rgba(20,40,70,.12); padding: 0; }
.tbtn svg { width: 23px; height: 23px; }
.tbtn:active { transform: scale(.95); }
.tbtn:disabled { color: var(--ng-ctlink);color: color-mix(in srgb, var(--ng-ctlink) 32%, transparent); }
.tbtn:disabled:active { transform: none; }
.tbtn.hide { display: none; }
.hintctl { background: var(--ng-ctl); border-radius: 18px; padding: 10px 12px; box-shadow: 0 2px 10px rgba(20,40,70,.16); gap: 8px; }
.htext { flex: 1; min-height: 0; overflow-y: auto; color: var(--ng-ctlink); font-size: 15px; line-height: 1.32; font-weight: 600; }
.htext b { color: var(--ng-hint); }
.hbtns { display: flex; gap: 8px; flex: none; }
.hbtns .btn { min-height: 42px; font-size: 16px; }
.donectl { gap: 8px; }
.donectl .btn { flex: none; min-height: 54px; font-size: 18px; }
.donectl .btn:not(.red) { background: var(--ng-ctl); color: var(--ng-ctlink); }

/* the pack sheet */
.packtabs { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 2px 0 10px; flex: none; scrollbar-width: none; }
.packtabs::-webkit-scrollbar { display: none; }
.packtabs button { flex: 1 1 0; min-width: 0; border: 0; border-radius: 14px; padding: 7px 4px 6px; background: var(--surface-2); color: var(--ink); font: inherit; font-weight: 800; font-size: 15px; line-height: 1.15; text-align: center; }
.packtabs button small { display: block; font-size: 11px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.packtabs button.on { background: var(--accent); color: #fff; }
.packtabs button.on small { color: rgba(255,255,255,.85); }
.packhead { display: flex; align-items: center; gap: 10px; flex: none; margin-bottom: 10px; }
.packnote { margin: 0; flex: 1; color: var(--muted); font-size: 14px; line-height: 1.35; }
.packnote b { color: var(--ink); }
.contbtn { flex: none; min-height: 44px; padding: 0 18px; font-size: 16px; }
.pgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; padding: 3px 3px 6px; }
.ptile { position: relative; border: 0; padding: 0; border-radius: 12px; background: var(--surface-2); color: var(--ink); font: inherit; display: flex; flex-direction: column; align-items: stretch; overflow: hidden; }
.ptile .pic { position: relative; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
.ptile canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
.ptile .q { font-size: 30px; font-weight: 900; color: var(--muted); opacity: .55; }
.ptile .num { position: absolute; left: 6px; top: 4px; font-size: 11px; font-weight: 800; color: var(--muted); }
.ptile .lbl { font-size: 11px; font-weight: 700; padding: 3px 4px 4px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); min-height: 20px; }
.ptile.done .lbl { color: var(--ink); }
.ptile .stars { position: absolute; right: 4px; top: 4px; font-size: 10px; line-height: 1; padding: 2px 4px 3px; border-radius: 8px; background: rgba(255,255,255,.9); color: #f5b301; letter-spacing: -1px; }
.ptile .prog { position: absolute; left: 8px; right: 8px; bottom: 7px; height: 4px; border-radius: 2px; background: rgba(120,130,150,.25); overflow: hidden; }
.ptile .prog i { display: block; height: 100%; background: var(--accent); }
.ptile.cur { box-shadow: 0 0 0 3px var(--accent); }
.ptile.next .q { color: var(--accent); opacity: 1; }
.ptile.lock { opacity: .4; }
.pgrid .psep { grid-column: 1 / -1; margin: 10px 0 2px; color: var(--muted); font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px; }
.pgrid .pempty { grid-column: 1 / -1; color: var(--muted); font-size: 14px; margin: 4px 0; }

/* stats */
.tiles .tile b { font-size: 24px; }
.packrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 15px; }
.packrow .pn { font-weight: 800; }
.packrow .pv { color: var(--muted); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.packrow .pd { grid-column: 1 / -1; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.stnote { color: var(--muted); font-size: 13px; margin: 8px 0 4px; }

/* how to play */
.help p { margin: 0 0 10px; font-size: 16px; line-height: 1.45; }
.help h3 { margin: 14px 0 6px; font-size: 17px; }
.help .exrow { display: flex; gap: 8px; justify-content: center; margin: 6px 0 10px; }
.help .ex { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--muted); }
.help .ex { flex: 1; max-width: 140px; }
.help .ex canvas { width: 100%; aspect-ratio: 1; height: auto; }
.help ul { margin: 0 0 10px; padding-left: 20px; font-size: 15px; line-height: 1.45; }
.help li { margin-bottom: 5px; }
.help .mk { display: inline-block; width: 14px; height: 14px; border-radius: 2px; vertical-align: -2px; background: var(--ng-ink); }
.help .mx { display: inline-block; font-weight: 900; color: var(--ng-x); }

/* the solved card */
.endcard { padding-top: 18px; }
.endpic { display: flex; justify-content: center; margin-bottom: 10px; }
.endpic canvas { width: 168px; height: 168px; border-radius: 12px; box-shadow: var(--shadow); image-rendering: pixelated; image-rendering: crisp-edges; }
.endstars { font-size: 34px; color: #f5b301; letter-spacing: 4px; line-height: 1; margin: 0 0 8px; }
.endstars i { font-style: normal; color: var(--line-strong); }
.endstats { display: flex; justify-content: center; gap: 8px; margin-bottom: 4px; }
.endstats div { flex: 1; max-width: 100px; background: var(--surface-2); border-radius: 12px; padding: 7px 4px 6px; }
.endstats b { display: block; font-size: 20px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
.endstats span { font-size: 12px; font-weight: 700; color: var(--muted); }
.card p.endnote { margin: 8px 0 14px; font-size: 15px; }
.card p.endnote:empty { display: none; }
</style>

<script>
/* Pixel Pier logic: clues, the exact line solver, the line-by-line solver, hints, clue greying, the picture bank parser
   and the maker of the endless "mosaic" levels. Plain ES5 with no page access, wrapped in one function so the same
   source runs on the page (var NG = ngLogic()), in the Web Worker that makes new levels (built from a Blob of
   ngLogic.toString(), no extra file) and in Node (tools/check.js reads this file). */
function ngLogic() {
  'use strict';
  var SIZES = [5, 10, 15, 20];
  // most clue numbers on one row or column (the clue bars must fit on a phone; same limits as tools/nono.py)
  var MAXCLUE = { 5: 3, 10: 5, 15: 7, 20: 9 };

  // ================= clues =================
  function runsOf(line) {
    var out = [], c = 0;
    for (var i = 0; i < line.length; i++) { if (line[i] === 1) c++; else if (c) { out.push(c); c = 0; } }
    if (c) out.push(c);
    return out;
  }
  function rowOf(a, n, y) { var o = []; for (var x = 0; x < n; x++) o.push(a[y * n + x]); return o; }
  function colOf(a, n, x) { var o = []; for (var y = 0; y < n; y++) o.push(a[y * n + x]); return o; }
  // the squares of line k (rows 0..n-1, then columns as k = n..2n-1)
  function lineIdx(n, k) { var o = [], i; if (k < n) for (i = 0; i < n; i++) o.push(k * n + i); else for (i = 0; i < n; i++) o.push(i * n + (k - n)); return o; }
  function cluesOf(g, n) {
    var rows = [], cols = [];
    for (var k = 0; k < n; k++) { rows.push(runsOf(rowOf(g, n, k))); cols.push(runsOf(colOf(g, n, k))); }
    return { rows: rows, cols: cols };
  }
  function sameClue(a, b) { if (a.length !== b.length) return false; for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false; return true; }

  // ================= the exact line solver =================
  // One row or column on its own: cells are -1 (unknown), 0 (empty) or 1 (filled). Returns the line with every square
  // that is the same in ALL placements of the clue filled in (a copy), or null if no placement fits. A port of
  // tools/nono.py solve_line (dynamic programming: ok[j][i] = clue numbers j.. fit into squares i..; then a forward
  // pass over the reachable placements marks which squares can be empty and which can be filled).
  var OKB = new Uint8Array(24 * 24), REB = new Uint8Array(24 * 24), PZ = new Int32Array(26), PO = new Int32Array(26), C0 = new Uint8Array(26), D1 = new Int32Array(26);
  function solveLine(clue, cells) {
    var n = cells.length, k = clue.length, W = n + 1, i, j, L, v, t;
    PZ[0] = 0; PO[0] = 0;
    for (i = 0; i < n; i++) { PZ[i + 1] = PZ[i] + (cells[i] === 0 ? 1 : 0); PO[i + 1] = PO[i] + (cells[i] === 1 ? 1 : 0); }
    for (i = 0; i <= n; i++) OKB[k * W + i] = PO[n] - PO[i] === 0 ? 1 : 0;
    for (j = k - 1; j >= 0; j--) {
      L = clue[j]; OKB[j * W + n] = 0;
      for (i = n - 1; i >= 0; i--) {
        v = cells[i] !== 1 && OKB[j * W + i + 1] === 1;
        if (!v && i + L <= n && PZ[i + L] - PZ[i] === 0 && (i + L === n || cells[i + L] !== 1)) v = OKB[(j + 1) * W + (i + L < n ? i + L + 1 : n)] === 1;
        OKB[j * W + i] = v ? 1 : 0;
      }
    }
    if (!OKB[0]) return null;
    for (i = 0; i < (k + 1) * W; i++) REB[i] = 0;
    for (i = 0; i <= n; i++) { C0[i] = 0; D1[i] = 0; }
    REB[0] = 1;
    for (i = 0; i < n; i++) for (j = 0; j <= k; j++) {
      if (!REB[j * W + i]) continue;
      if (cells[i] !== 1 && OKB[j * W + i + 1]) { C0[i] = 1; REB[j * W + i + 1] = 1; }
      if (j < k) {
        L = clue[j];
        if (i + L <= n && PZ[i + L] - PZ[i] === 0 && (i + L === n || cells[i + L] !== 1)) {
          t = i + L < n ? i + L + 1 : n;
          if (OKB[(j + 1) * W + t]) { D1[i]++; D1[i + L]--; if (i + L < n) C0[i + L] = 1; REB[(j + 1) * W + t] = 1; }
        }
      }
    }
    var out = new Int8Array(n), acc = 0;
    for (i = 0; i < n; i++) {
      acc += D1[i];
      var c1 = acc > 0, c0 = C0[i] === 1;
      if (c1 && !c0) out[i] = 1; else if (c0 && !c1) out[i] = 0; else if (c0 && c1) out[i] = cells[i]; else return null;
    }
    return out;
  }

  // ================= the line-by-line solver =================
  // Sweep the rows, then the columns, until nothing changes (the same sweeps and round count as tools/nono.py
  // line_solve). init: an optional starting board (-1/0/1). Returns { st, bad (a contradiction), unknown, rounds }.
  function solveGrid(n, rows, cols, init) {
    var N = n * n, st = new Int8Array(N), i, x, y, res, line = new Int8Array(n);
    for (i = 0; i < N; i++) st[i] = init ? init[i] : -1;
    var dr = new Uint8Array(n), dc = new Uint8Array(n), rounds = 0, more = true;
    for (i = 0; i < n; i++) { dr[i] = 1; dc[i] = 1; }
    while (more) {
      rounds++; more = false;
      for (y = 0; y < n; y++) {
        if (!dr[y]) continue; dr[y] = 0;
        for (x = 0; x < n; x++) line[x] = st[y * n + x];
        res = solveLine(rows[y], line);
        if (!res) return { st: st, bad: true, unknown: -1, rounds: rounds };
        for (x = 0; x < n; x++) if (res[x] !== st[y * n + x]) { st[y * n + x] = res[x]; dc[x] = 1; }
      }
      for (x = 0; x < n; x++) {
        if (!dc[x]) continue; dc[x] = 0;
        for (y = 0; y < n; y++) line[y] = st[y * n + x];
        res = solveLine(cols[x], line);
        if (!res) return { st: st, bad: true, unknown: -1, rounds: rounds };
        for (y = 0; y < n; y++) if (res[y] !== st[y * n + x]) { st[y * n + x] = res[y]; dr[y] = 1; more = true; }
      }
    }
    var unk = 0; for (i = 0; i < N; i++) if (st[i] < 0) unk++;
    return { st: st, bad: false, unknown: unk, rounds: rounds };
  }
  // line-solvable: the line logic alone fills in the whole picture (which also proves it has exactly one answer)
  function lineSolvable(g, n) {
    var c = cluesOf(g, n), r = solveGrid(n, c.rows, c.cols);
    if (r.bad || r.unknown) return false;
    for (var i = 0; i < n * n; i++) if (r.st[i] !== g[i]) return false;
    return true;
  }
  // a rough difficulty, the same as tools/nono.py difficulty(): sweeps needed, plus how little the first sweep of rows
  // and columns settles (0 = all of it, 4 = none)
  function difficulty(g, n) {
    var c = cluesOf(g, n), st = new Int8Array(n * n), x, y, res, line = new Int8Array(n), i;
    for (i = 0; i < n * n; i++) st[i] = -1;
    for (y = 0; y < n; y++) { for (x = 0; x < n; x++) line[x] = st[y * n + x]; res = solveLine(c.rows[y], line); for (x = 0; x < n; x++) st[y * n + x] = res[x]; }
    for (x = 0; x < n; x++) { for (y = 0; y < n; y++) line[y] = st[y * n + x]; res = solveLine(c.cols[x], line); for (y = 0; y < n; y++) st[y * n + x] = res[y]; }
    var known = 0; for (i = 0; i < n * n; i++) if (st[i] >= 0) known++;
    return solveGrid(n, c.rows, c.cols).rounds + 4 * (1 - known / (n * n));
  }

  // ================= what the player sees on the clues =================
  // A line's filled squares match its clue: every run of filled squares in order equals the clue numbers.
  function lineMatches(clue, line) { return sameClue(runsOf(line), clue); }
  // Which clue numbers are clearly done (greyed). line: 1 filled, 0 crossed, -1 unmarked. The whole clue when the line's
  // filled squares match it; otherwise numbers matched from either end by finished runs: a run of filled squares with
  // only crosses (or the edge) between it and the end, closed by a cross or the edge, and as long as the next number.
  function clueDone(clue, line) {
    var k = clue.length, n = line.length, done = [], i, j, s, len;
    for (j = 0; j < k; j++) done.push(false);
    if (lineMatches(clue, line)) { for (j = 0; j < k; j++) done[j] = true; return { all: true, done: done }; }
    var left = 0, pl = 0;
    i = 0;
    while (left < k) {
      while (i < n && line[i] === 0) i++;
      if (i >= n || line[i] !== 1) break;
      s = i; while (i < n && line[i] === 1) i++;
      len = i - s;
      if (i < n && line[i] !== 0) break;
      if (len !== clue[left]) break;
      done[left] = true; left++; pl = i;
    }
    var right = k - 1;
    i = n - 1;
    while (right >= left) {
      while (i >= pl && line[i] === 0) i--;
      if (i < pl || line[i] !== 1) break;
      s = i; while (i >= pl && line[i] === 1) i--;
      len = s - i;
      if (i >= pl && line[i] !== 0) break;
      if (i < pl && pl > 0) break;               // the run reaches squares the left scan already used
      if (len !== clue[right]) break;
      done[right] = true; right--;
    }
    return { all: false, done: done };
  }

  // ================= hints =================
  // The next line-logic step from the player's board (st: -1 unmarked, 0 empty, 1 filled; every mark must be right).
  // Every row and column is solved on its own with the exact line solver; the step shown is the line a person would
  // most likely spot first: a 0 clue, a finished line whose other squares are empty, a clue that fits only one way, the
  // overlap of a long number on an empty line, then any line by how many squares it settles. Returns
  // { line (0..2n-1: rows then columns), cells: [[square, 0|1], ...], kind, text } or null if nothing is left to find.
  var KIND_RANK = { zero: 0, done: 1, full: 2, overlap1: 3, overlap: 4, generic: 5 };
  function lineName(n, k) { return k < n ? 'Row ' + (k + 1) : 'Column ' + (k - n + 1); }
  function clueText(clue) { return clue.length ? clue.join(' ') : '0'; }
  function plural(c, one, many) { return c === 1 ? one : c + ' ' + many; }
  function hintStep(n, rows, cols, st) {
    var best = null;
    for (var k = 0; k < 2 * n; k++) {
      var idx = lineIdx(n, k), clue = k < n ? rows[k] : cols[k - n], line = new Int8Array(n), i, blank = true;
      for (i = 0; i < n; i++) { line[i] = st[idx[i]]; if (line[i] !== -1) blank = false; }
      var res = solveLine(clue, line);
      if (!res) continue;
      var cells = [];
      for (i = 0; i < n; i++) if (line[i] === -1 && res[i] !== -1) cells.push([idx[i], res[i]]);
      if (!cells.length) continue;
      var sum = 0; clue.forEach(function (c) { sum += c; });
      var need = sum + Math.max(0, clue.length - 1), kind;
      var filledNow = []; for (i = 0; i < n; i++) filledNow.push(line[i] === 1 ? 1 : 0);
      if (!clue.length) kind = 'zero';
      else if (lineMatches(clue, filledNow)) kind = 'done';
      else if (blank && need === n) kind = 'full';
      else if (blank && clue.length === 1) kind = 'overlap1';
      else if (blank) kind = 'overlap';
      else kind = 'generic';
      var cand = { line: k, cells: cells, kind: kind, clue: clue, n: n, need: need };
      if (!best || KIND_RANK[kind] < KIND_RANK[best.kind] || (KIND_RANK[kind] === KIND_RANK[best.kind] && cells.length > best.cells.length)) best = cand;
    }
    if (best) best.text = hintText(best);
    return best;
  }
  function hintText(h) {
    var n = h.n, name = lineName(n, h.line), what = h.line < n ? 'row' : 'column', ct = clueText(h.clue), L = h.clue[0];
    var fills = h.cells.filter(function (c) { return c[1] === 1; }).length, empties = h.cells.length - fills;
    switch (h.kind) {
      case 'zero': return name + '’s clue is 0: every square in it is empty.';
      case 'done': return name + ' already has its ' + ct + ': the other ' + plural(empties, 'square is', 'squares are') + ' empty.';
      case 'full':
        if (h.clue.length === 1) return name + '’s clue is ' + L + ': the whole ' + what + ' is filled.';

  }
  function showEnd(stars) {
    paintPic($('endPic'), P);
    $('endTitle').textContent = P.entry[1];
    $('endStars').innerHTML = starStr(stars);
    $('endStats').innerHTML = '<div><b>' + clock(G.ms) + '</b><span>time</span></div><div><b>' + G.mis + '</b><span>mistake' + (G.mis === 1 ? '' : 's') + '</span></div><div><b>' + G.hin + '</b><span>hint' + (G.hin === 1 ? '' : 's') + '</span></div>';
    var note = stars === 3 ? 'No mistakes, no hints: three stars!' : stars === 2 ? 'Three stars with no mistakes and no hints.' : '';
    if (winAnim && winAnim.best) note = '<span class="newbest">Best ' + P.n + '×' + P.n + ' time!</span>';
    var p = parseKey(P.key);
    if (!p.gen && BANK[P.n].every(function (e) { return bankStars(e[0]); }) && winAnim && winAnim.first) note = '<b>Every ' + PNAME[P.n] + ' picture solved!</b> New mosaics are made on this phone from here on: the pack never ends.';
    $('endNote').innerHTML = note;
    var nk = nextKey(P.key), box = $('endActions'); box.innerHTML = '';
    [{ label: parseKey(nk).gen ? 'Next mosaic' : 'Next picture', red: true, go: function () { between(function () { open(nk); }); } },
     { label: 'Pictures', go: function () { openPack(P.n); } },
     { label: 'See the picture', go: function () { renderHud(); } }].forEach(function (b) {
      var el = document.createElement('button'); el.className = 'btn' + (b.red ? ' red' : ''); el.textContent = b.label;
      el.addEventListener('click', function () { $('ovEnd').classList.remove('show'); b.go(); });
      box.appendChild(el);
    });
    $('ovEnd').classList.add('show');
    for (var q = 0; q < stars; q++) (function (k) { setTimeout(function () { S.star(k); }, 120 + k * 140); })(q);
  }
  // a house ad between puzzles only, every few finished puzzles
  function between(next) {
    var f = meta.finished;
    if (Goobs.adsOn() && f > 0 && f % settings.adEvery === 0 && meta.lastAdAt !== f) { meta.lastAdAt = f; saveMeta(); next(); GoobsAds.show({}, function () {}); return; }
    next();
  }
  function restart() {
    if (!G || G.won) return;
    ask('Restart this picture?', 'Clears every square. The clock, mistakes and hints keep counting. Undo brings it back.', [
      { label: 'Restart', red: true, go: function () {
        var step = [], changed = [];
        for (var i = 0; i < G.c.length; i++) if (G.c[i]) { step.push(i, G.c[i], 0); changed.push(i); G.c[i] = 0; }
        closeHint(); if (step.length) { G.u.push(step); G.r = []; }
        recomputeClues(); renderAll(); saveGame();
      } },
      { label: 'Keep playing', go: function () {} }]);
  }
  function ask(title, text, buttons) {
    $('askTitle').textContent = title; $('askText').innerHTML = text;
    var box = $('askActions'); box.innerHTML = '';
    buttons.forEach(function (b) { var el = document.createElement('button'); el.className = 'btn' + (b.red ? ' red' : ''); el.textContent = b.label; el.addEventListener('click', function () { $('ovAsk').classList.remove('show'); b.go(); }); box.appendChild(el); });
    $('ovAsk').classList.add('show');
  }

  // ================= the pack sheet =================
  var listN = 5;
  function openPack(n) {
    listN = n || (P ? P.n : pending ? pending.n : 5);
    renderPack(); $('ovPack').classList.add('show');
    prefetch(listN, genDone(listN) + 1);
    var cur = $('packGrid').querySelector('.cur'); if (cur) setTimeout(function () { cur.scrollIntoView({ block: 'center' }); }, 30);
  }
  function packSolved(n) { var b = 0; BANK[n].forEach(function (e) { if (bankStars(e[0])) b++; }); return { bank: b, gen: genDone(n) }; }
  function renderPack() {
    var n = listN, curKey = P ? P.key : pending ? pending.key : '';
    $('packTabs').innerHTML = SIZES.map(function (m) { return '<button data-n="' + m + '" class="' + (m === n ? 'on' : '') + '">' + m + '×' + m + '<small>' + PNAME[m] + '</small></button>'; }).join('');
    var s = packSolved(n), h = '', bank = BANK[n];
    $('packNote').innerHTML = '<b>' + PNAME[n] + ' ' + n + '×' + n + '</b>: ' + (bank.length ? s.bank + ' of ' + bank.length + ' pictures solved' : 'mosaics') + (s.gen ? ', ' + s.gen + ' mosaic' + (s.gen === 1 ? '' : 's') : '') + '.';
    bank.forEach(function (e, i) {
      var k = e[0], st = +bankStars(k), g = games.s[k], cls = 'ptile' + (st ? ' done' : '') + (k === curKey ? ' cur' : '');
      h += '<button class="' + cls + '" data-k="' + esc(k) + '"><div class="pic">' + (st ? '<canvas data-t="' + esc(k) + '"></canvas>' : '<span class="q">?</span>') + '<span class="num">' + (st ? '' : i + 1) + '</span>' +
        (!st && g && progressOf(g, k) ? '<span class="prog"><i style="width:' + progressOf(g, k) + '%"></i></span>' : '') + '</div><div class="lbl">' + (st ? esc(e[1]) : '&nbsp;') + '</div>' + (st ? '<span class="stars">' + '★★★'.slice(0, st) + '</span>' : '') + '</button>';
    });
    h += '<div class="psep">' + (bank.length ? 'Mosaics, made on this phone' : 'Mosaics, made on this phone, one after another') + '</div>';
    if (bank.length && s.bank < bank.length) h += '<div class="pempty">The mosaics never run out: each new one opens when you solve the one before.</div>';
    var gd = genDone(n);
    for (var j = 1; j <= gd + 1; j++) {
      var k2 = genKey(n, j), e2 = genEntry(n, j), done = j <= gd, st2 = done ? +meta.gen[n].charAt(j - 1) : 0, g2 = games.s[k2];
      h += '<button class="ptile' + (done ? ' done' : ' next') + (k2 === curKey ? ' cur' : '') + '" data-k="' + k2 + '"><div class="pic">' + (done && e2 ? '<canvas data-t="' + k2 + '"></canvas>' : '<span class="q">' + (done ? '✓' : '?') + '</span>') +
        '<span class="num">' + (done && e2 ? '' : j) + '</span>' + (!done && g2 && progressOf(g2, k2) ? '<span class="prog"><i style="width:' + progressOf(g2, k2) + '%"></i></span>' : '') + '</div><div class="lbl">' + (done && e2 ? esc(e2[1]) : done ? 'Mosaic ' + j : 'Next') + '</div>' + (st2 ? '<span class="stars">' + '★★★'.slice(0, st2) + '</span>' : '') + '</button>';
    }
    $('packGrid').innerHTML = h;
    Array.prototype.forEach.call($('packGrid').querySelectorAll('canvas[data-t]'), function (c) {
      var k = c.getAttribute('data-t'), p = parseKey(k), e = p && (p.gen ? genEntry(p.n, p.j) : BYID[k].e);
      if (e) paintPic(c, NG.parsePic(e));
    });
  }
  // how far along an unfinished puzzle is: its filled squares against the picture's
  function progressOf(g, k) {
    var p = parseKey(k), e = p && (p.gen ? genEntry(p.n, p.j) : BYID[k] && BYID[k].e); if (!e || typeof g.c !== 'string') return 0;
    var f = 0, ink = 0; for (var i = 0; i < g.c.length; i++) { if (g.c[i] === '1' || g.c[i] === '4') f++; }
    String(e[6]).replace(/\//g, '').split('').forEach(function (ch) { if (NG.isInk(ch)) ink++; });
    return ink ? Math.min(100, Math.round(f * 100 / ink)) : 0;
  }

  // ================= stats, settings, help =================
  function openStats() {
    var tot = 0, clean = 0, ms = 0, rows = '';
    SIZES.forEach(function (n) {
      var s = packSolved(n), st = stats[n]; tot += s.bank + s.gen; clean += st.clean; ms += st.total;
      rows += '<div class="packrow"><span class="pn">' + PNAME[n] + ' ' + n + '×' + n + '</span><span class="pv">' + (BANK[n].length ? s.bank + '/' + BANK[n].length + ' pictures · ' : '') + s.gen + ' mosaic' + (s.gen === 1 ? '' : 's') + '</span>' +
        '<span class="pd">' + (st.solves ? 'best ' + clock(st.best) + ' · average ' + clock(st.total / st.solves) + ' · ' + st.clean + ' with three stars' : 'nothing solved yet') + '</span></div>';
    });
    $('statsBody').innerHTML = '<div class="tiles"><div class="tile"><b>' + tot + '</b><span>' + (tot === 1 ? 'picture' : 'pictures') + ' solved</span></div><div class="tile"><b>' + clean + '</b><span>no mistakes, no hints</span></div><div class="tile"><b>' + clock(ms) + '</b><span>total time</span></div></div>' +
      rows + '<p class="stnote">Times count every solve, replays too. Hints used in all: ' + meta.hints + '.</p>';
    $('ovStats').classList.add('show');
  }
  function syncSettings() {
    $('setSound').checked = settings.sound; $('setCatch').checked = settings.catchM; $('setAutoX').checked = settings.autoX; $('setTimer').checked = settings.timer;
    $('setAds').checked = Goobs.adsOn(); $('adEvery').textContent = settings.adEvery; $('rowAdEvery').classList.toggle('off', !Goobs.adsOn());
  }
  // the worked example in How to play: a little house (5x5), line-solvable, the door an empty square that gets a colour
  var EX = ['..r..', '.rrr.', 'rrrrr', '.bDb.', '.bbb.'];
  function openHelp() {
    $('helpBody').innerHTML = '<div class="help">' +
      '<p>Each row and column has <b>clue numbers</b>: the lengths of its runs of filled squares, in order, with at least one empty square between runs. Work out which squares are filled. When every clue fits, the picture appears in colour.</p>' +
      '<div class="exrow"><div class="ex"><canvas id="ex1" width="264" height="264"></canvas>The puzzle</div><div class="ex"><canvas id="ex2" width="264" height="264"></canvas>First steps</div><div class="ex"><canvas id="ex3" width="264" height="264"></canvas>Solved</div></div>' +
      '<p><b>Row 3 is 5</b> in 5 squares: the whole row is filled. <b>Column 3 is 3 1</b>: that needs all 5 squares (3, a gap, 1), so it fits one way only. <b>Columns 2 and 4 are 4</b>: however a 4 sits in 5 squares, the middle 3 are filled. Then rows 1 and 2 have all their squares, so the rest are empty <span class="mx">✕</span>, and so on. Every puzzle works out this way, one line at a time, with no guessing.</p>' +
      '<h3>Playing</h3><ul>' +
      '<li><b>Tap</b> a square to fill it <span class="mk"></span>. In <b>Cross</b> mode a tap marks a square you know is empty <span class="mx">✕</span>.</li>' +
      '<li><b>Drag</b> to paint a straight line along a row or column (the number by your finger counts the squares). The first square decides: an empty one paints, a filled or crossed one clears that kind. Other squares are skipped, never painted over.</li>' +
      '<li>A clue number turns grey when its run is clearly done; a whole clue when the line matches. <b>Auto-cross</b> (Settings) crosses the rest of a finished line.</li>' +
      '<li><b>Catch mistakes</b> (Settings, on): a wrong fill turns into a red cross, a wrong cross into a red-marked fill, and counts as a mistake. Off: nothing is judged until the picture is done.</li>' +
      '<li><b>Hint</b> shows the next step a line at a time; <b>Do it</b> fills it in. <b>Undo</b> and <b>Redo</b> go back and forth as far as you like.</li>' +
      '<li>Big boards: <b>pinch</b> or tap <b>Zoom</b> (or double-tap the clues) to zoom, slide with <b>two fingers</b> or along the clues. One finger always paints.</li>' +
      '<li><b>Stars</b>: three with no mistakes and no hints, two with up to two of them, one otherwise.</li></ul>' +
      '<h3>Pictures and mosaics</h3><p>Four packs: 5×5, 10×10, 15×15 and 20×20. Play the pictures in any order (Menu → Pictures, or tap the name at the top). After them come <b>mosaics</b> made on this phone, the same on every phone, each one proven to work out by logic. They never run out. Your board is saved as you go.</p></div>';
    $('ovHelp').classList.add('show');
    drawExample($('ex1'), 0); drawExample($('ex2'), 1); drawExample($('ex3'), 2);
  }
  function drawExample(canvas, stage) {
    var c = canvas.getContext('2d'), n = 5, cs = 38, ox = 72, oy = 72, i, x, y;
    var g = EX.map(function (r) { return r.split('').map(function (ch) { return NG.isInk(ch) ? 1 : 0; }); });
    var flat = []; g.forEach(function (r) { flat = flat.concat(r); });
    var cl = NG.cluesOf(flat, n), col = { r: '#e8453c', b: '#2f80c0', D: '#8b5e3c', '.': '#cfe9f7' };

    // after the first steps: row 3, column 3, the middles of columns 2 and 4
    var known = {}; if (stage === 1) { for (x = 0; x < 5; x++) known[2 * 5 + x] = 1; for (y = 0; y < 5; y++) known[y * 5 + 2] = flat[y * 5 + 2] ? 1 : 2; [1, 3].forEach(function (cc) { for (y = 1; y < 4; y++) known[y * 5 + cc] = 1; }); }
    if (stage < 2) {
      c.fillStyle = T.clue; c.fillRect(0, oy, ox, n * cs); c.fillRect(ox, 0, n * cs, oy);
      c.font = '800 23px ' + FONT; c.fillStyle = T.num; c.textBaseline = 'middle';
      for (y = 0; y < n; y++) { c.textAlign = 'right'; c.fillText(cl.rows[y].join(' ') || '0', ox - 9, oy + y * cs + cs / 2 + 1); }
      c.textAlign = 'center';
      for (x = 0; x < n; x++) cl.cols[x].slice().reverse().forEach(function (v, q) { c.fillText(String(v), ox + x * cs + cs / 2, oy - 15 - q * 25); });
    }
    for (i = 0; i < 25; i++) {
      x = ox + (i % 5) * cs; y = oy + ((i / 5) | 0) * cs;
      // solved: the picture in colour, large and centred
      if (stage === 2) { var s2 = 46, o2 = (264 - 5 * s2) / 2; c.fillStyle = col[EX[(i / 5) | 0].charAt(i % 5)]; c.fillRect(o2 + (i % 5) * s2 - 0.3, o2 + ((i / 5) | 0) * s2 - 0.3, s2 + 0.6, s2 + 0.6); continue; }

  }
  function sheet(btn, ov, close, before) {
    $(btn).addEventListener('click', function () { if (before) before(); else $(ov).classList.add('show'); });
    $(close).addEventListener('click', function () { $(ov).classList.remove('show'); renderHud(); });
    $(ov).addEventListener('click', function (e) { if (e.target === this) { this.classList.remove('show'); renderHud(); } });
  }
  function setMode(m) { settings.mode = m; saveSettings(); renderHud(); }

  // ================= keyboard (iPad with a keyboard, desktop) =================
  function onKey(e) {
    if (!G || G.won || pending || sheetOpen()) return;
    var n = P.n, k = e.key;
    if ((e.metaKey || e.ctrlKey) && (k === 'z' || k === 'Z')) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var d = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] }[k];

  }

  // ================= start =================
  function init() {
    cv = $('cv'); cx = cv.getContext('2d');
    readTheme(); Goobs.onTheme(function () { setTimeout(function () { readTheme(); draw(); }, 0); });
    Goobs.themePicker($('themes'));
    menu = Goobs.fullscreen({ overlay: true, menu: ['btnPack', 'btnStats', 'btnHelp', 'btnSettings', 'btnRestart'], info: function () {
      var cur = pending || (P ? { key: P.key, n: P.n } : null); if (!cur) return '';
      return '<b>' + PNAME[cur.n] + ' ' + cur.n + '×' + cur.n + '</b> · ' + esc(label(cur.key, G && G.won)) + (pending ? ' · being made' : G && !G.won ? ' · clock paused at ' + clock(G.ms) : '');
    } });
    cv.addEventListener('pointerdown', onDown); cv.addEventListener('pointermove', onMove);
    cv.addEventListener('pointerup', onUp); cv.addEventListener('pointercancel', onUp);
    cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    $('boardarea').addEventListener('touchmove', function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false });

    $('mFill').addEventListener('click', function () { setMode('fill'); });
    $('mCross').addEventListener('click', function () { setMode('cross'); });
    $('btnUndo').addEventListener('click', undo); $('btnRedo').addEventListener('click', redo);
    $('btnHint').addEventListener('click', hint);
    $('hintGo').addEventListener('click', doHint); $('hintClose').addEventListener('click', closeHint);
    $('btnZoom').addEventListener('click', function () { toggleZoom(); setTimeout(renderHud, 260); });
    $('btnPack2').addEventListener('click', function () { openPack(); });
    $('btnPack3').addEventListener('click', function () { openPack(); });
    $('btnNext').addEventListener('click', function () { if (P && G && G.won) { var nk = nextKey(P.key); between(function () { open(nk); }); } });
    $('lvPill').addEventListener('click', function () { openPack(); });
    $('btnRestart').addEventListener('click', restart);
    $('btnHome').addEventListener('click', function () { tick(); saveGame(); saveMeta(); Goobs.home(); });
    sheet('btnPack', 'ovPack', 'btnClosePack', function () { openPack(); });
    sheet('btnStats', 'ovStats', 'btnCloseStats', openStats);
    sheet('btnHelp', 'ovHelp', 'btnCloseHelp', openHelp);
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings', function () { syncSettings(); $('ovSettings').classList.add('show'); });
    $('packTabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; listN = +b.dataset.n; renderPack(); $('packBody').scrollTop = 0; prefetch(listN, genDone(listN) + 1); });
    $('packGrid').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; $('ovPack').classList.remove('show'); $('ovEnd').classList.remove('show'); var k = b.getAttribute('data-k'); if (!(P && P.key === k && G && !G.won)) open(k); else renderHud(); });
    $('btnContinue').addEventListener('click', function () { $('ovPack').classList.remove('show'); $('ovEnd').classList.remove('show'); var k = firstKey(listN); if (!(P && P.key === k && G && !G.won)) between(function () { open(k); }); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); S.set(settings.sound); S.fill(); });
    $('setCatch').addEventListener('change', function () { settings.catchM = this.checked; saveSettings(); renderHud(); });
    $('setAutoX').addEventListener('change', function () { settings.autoX = this.checked; saveSettings(); });
    $('setTimer').addEventListener('change', function () { settings.timer = this.checked; saveSettings(); renderHud(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncSettings(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncSettings(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncSettings(); });
    document.addEventListener('keydown', onKey);
    S.set(settings.sound);
    var rq = 0; function refit() { if (rq) return; rq = requestAnimationFrame(function () { rq = 0; layout(false); }); }
    window.addEventListener('resize', refit); if (window.ResizeObserver) new ResizeObserver(refit).observe($('boardarea'));
    document.addEventListener('visibilitychange', function () { tick(); if (document.hidden) { saveGame(); saveMeta(); } });
    window.addEventListener('pagehide', function () { tick(); saveGame(); saveMeta(); });
    // instant play: the puzzle you were on (exactly as you left it); after a solved one, the next; first visit: the first
    // 5x5 and How to play
    try {
      var k = meta.cur;

    window.__ngReady = true;
  }
  init();

  // test hook (Playwright): the puzzle, the board, the answer, where each square is on screen
  window.__nonogram = {
    get P() { return P; }, get G() { return G; }, get CD() { return CD; }, get pending() { return pending; }, get hintNow() { return hintNow; }, get view() { return view; }, get fitCs() { return fitCs; },
    meta: meta, settings: settings, stats: stats, games: function () { return games; }, BANK: BANK,
    answer: function () { return P ? Array.prototype.slice.call(P.g) : null; },
    center: function (i) { var o = geo(), r = cv.getBoundingClientRect(); return { x: r.left + o.gx + (i % P.n + 0.5) * o.cs, y: r.top + o.gy + (((i / P.n) | 0) + 0.5) * o.cs }; },
    visible: function (i) { var o = geo(), x = o.gx + (i % P.n + 0.5) * o.cs, y = o.gy + (((i / P.n) | 0) + 0.5) * o.cs; return x > o.vx0 + 2 && x < o.vx1 - 2 && y > o.vy0 + 2 && y < o.vy1 - 2; },
    geo: function () { return geo(); }, isZoomed: isZoomed, zoomTo: function (cs) { var o = geo(); zoomTo(cs, (o.vx0 + o.vx1) / 2, (o.vy0 + o.vy1) / 2, false); }, lookAt: function (x, y) { lookAt(x, y); rememberView(); draw(); },
    open: open, nextKey: nextKey, firstKey: firstKey, hint: hint, doHint: doHint, undo: undo, redo: redo, setMode: setMode, openPack: openPack,
    gen: { cache: genCache, log: genLog, get jobs() { return jobs.slice(); }, get job() { return job; }, get workerDead() { return workerDead; }, get worker() { return !!worker; } }
  };
})();
