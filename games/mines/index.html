<script>
/* if Mine Meadow can't open, say so on screen (never a blank page) and offer a fresh start */
(function () {
  var shown = false;
  function fail(msg) {
    if (shown || window.__mmReady) return; shown = true;
    function put() {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:#eef7e6;color:#1b1f33;font:600 16px -apple-system,system-ui,sans-serif;text-align:center';
      d.innerHTML = '<b style="font-size:21px">Mine Meadow didn\u2019t open</b><div style="max-width:320px;opacity:.75;font-size:13px">' + String(msg).replace(/[<>&]/g, '') + '</div>';
      function btn(t, bg, go) { var b = document.createElement('button'); b.textContent = t; b.style.cssText = 'font:800 17px -apple-system,system-ui,sans-serif;padding:13px 24px;border-radius:14px;border:0;color:#fff;background:' + bg; b.onclick = go; d.appendChild(b); }
      btn('Start fresh', '#5a54f0', function () { try { localStorage.removeItem('mines.game'); localStorage.removeItem('mines.meta'); } catch (e) { /* ignore */ } location.reload(); });
      btn('All games', '#6b7080', function () { location.href = '../../'; });
      document.body.appendChild(d);
    }
    if (document.body) put(); else document.addEventListener('DOMContentLoaded', put);
  }
  window.addEventListener('error', function (e) { fail((e.message || 'Something went wrong') + (e.lineno ? ' (line ' + e.lineno + ')' : '')); });
  setTimeout(function () { if (!window.__mmReady) fail('It took too long to start.'); }, 6000);
})();
</script>

<script>
/* Mine Meadow logic: Minesweeper. The three classic sizes, a safe first dig, flood-opening blanks, flags, chording,
   and boards that can be solved without guessing (checked by a solver that only uses sure deductions). Runs in Node. */
var MM = (function () {
  'use strict';
  // the classic sizes (Expert is 30 x 16; here it stands upright, 16 wide and 30 tall)
  var LEVELS = { beginner: { w: 9, h: 9, n: 10, name: 'Beginner' }, intermediate: { w: 16, h: 16, n: 40, name: 'Intermediate' }, expert: { w: 16, h: 30, n: 99, name: 'Expert' } };
  function rng(seed) { var s = seed >>> 0 || 1; return function () { s = (s + 0x6D2B79F5) | 0; var t = Math.imul(s ^ (s >>> 15), s | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function nbrs(w, h, i) {
    var x = i % w, y = (i / w) | 0, out = [];
    for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue; var nx = x + dx, ny = y + dy;
      if (nx >= 0 && ny >= 0 && nx < w && ny < h) out.push(ny * w + nx);
    }
    return out;
  }
  // a new game; mines are placed on the first dig
  function create(level, opts) {
    var L = LEVELS[level] || LEVELS.beginner;
    return { level: level, w: L.w, h: L.h, n: L.n, mine: null, num: null, state: new Array(L.w * L.h).fill(0), // 0 hidden, 1 open, 2 flag
      started: false, over: false, won: false, boom: -1, ms: 0, noGuess: !opts || opts.noGuess !== false, seed: (opts && opts.seed) >>> 0 || 1, digs: 0 };
  }
  function place(g, first) {
    var R = rng(g.seed), size = g.w * g.h, tries = 0;
    var safe = {}; safe[first] = 1; nbrs(g.w, g.h, first).forEach(function (k) { safe[k] = 1; });
    while (true) {
      tries++;
      var mine = new Array(size).fill(0), cells = [];
      for (var i = 0; i < size; i++) if (!safe[i]) cells.push(i);
      for (var k = cells.length - 1; k > 0; k--) { var j = Math.floor(R() * (k + 1)), t = cells[k]; cells[k] = cells[j]; cells[j] = t; }
      for (var m = 0; m < g.n; m++) mine[cells[m]] = 1;
      var num = numbers(g.w, g.h, mine);
      if (!g.noGuess || tries > 4000 || solvable(g.w, g.h, g.n, mine, num, first)) { g.mine = mine; g.num = num; g.tries = tries; return; }
    }
  }
  function numbers(w, h, mine) { return mine.map(function (v, i) { if (v) return -1; var c = 0; nbrs(w, h, i).forEach(function (k) { c += mine[k]; }); return c; }); }

  // ---------- the solver: can the board be cleared from the first dig with sure steps only? ----------
  function solvable(w, h, total, mine, num, first) {
    var size = w * h, st = new Int8Array(size); // 0 unknown, 1 open, 2 known mine
    var open = function (i) {
      var stack = [i];
      while (stack.length) { var c = stack.pop(); if (st[c] === 1) continue; st[c] = 1; if (num[c] === 0) nbrs(w, h, c).forEach(function (k) { if (st[k] === 0) stack.push(k); }); }
    };
    open(first);
    var changed = true, guard = 0;
    while (changed && guard++ < 1000) {
      changed = false;
      // rule 1: a number whose hidden neighbours are all mines, or whose mines are all found
      var cons = [];
      for (var i = 0; i < size; i++) {
        if (st[i] !== 1 || num[i] <= 0) continue;
        var hid = [], flagged = 0;
        nbrs(w, h, i).forEach(function (k) { if (st[k] === 0) hid.push(k); else if (st[k] === 2) flagged++; });
        if (!hid.length) continue;
        var need = num[i] - flagged;
        if (need === hid.length) { hid.forEach(function (k) { st[k] = 2; }); changed = true; }
        else if (need === 0) { hid.forEach(function (k) { if (st[k] === 0) open(k); }); changed = true; }
        else cons.push({ cells: hid, n: need });
      }
      if (changed) continue;
      // rule 2: one number's hidden cells inside another's (the difference must hold the difference in mines)
      for (var a = 0; a < cons.length && !changed; a++) for (var b = 0; b < cons.length && !changed; b++) {
        if (a === b) continue;
        var A = cons[a], B = cons[b];
        if (A.cells.length >= B.cells.length) continue;
        if (!A.cells.every(function (c) { return B.cells.indexOf(c) >= 0; })) continue;
        var rest = B.cells.filter(function (c) { return A.cells.indexOf(c) < 0; }), dn = B.n - A.n;
        if (dn === 0) { rest.forEach(function (k) { if (st[k] === 0) open(k); }); changed = true; }
        else if (dn === rest.length) { rest.forEach(function (k) { st[k] = 2; }); changed = true; }
      }
      if (changed) continue;
      // rule 3: overlapping numbers (A has more mines than fit outside B -> some must be in the overlap)
      for (var a2 = 0; a2 < cons.length && !changed; a2++) for (var b2 = 0; b2 < cons.length && !changed; b2++) {
        if (a2 === b2) continue;
        var P = cons[a2], Q = cons[b2];
        var both = P.cells.filter(function (c) { return Q.cells.indexOf(c) >= 0; }); if (!both.length) continue;
        var pOnly = P.cells.filter(function (c) { return both.indexOf(c) < 0; }), qOnly = Q.cells.filter(function (c) { return both.indexOf(c) < 0; });
        // mines in the overlap are at least P.n - |pOnly| and at most min(|both|, Q.n)
        var minBoth = P.n - pOnly.length;
        if (minBoth > 0 && minBoth === Q.n) { qOnly.forEach(function (k) { if (st[k] === 0) { open(k); changed = true; } }); }
        if (!changed && P.n - Math.min(both.length, Q.n) === pOnly.length && pOnly.length) { pOnly.forEach(function (k) { if (st[k] === 0) { st[k] = 2; changed = true; } }); }
      }
      if (changed) continue;
      // the mine count: once every mine is known, the rest is safe; if the hidden cells equal the mines left, all are mines
      var known = 0, unknown = [];
      for (var q = 0; q < size; q++) { if (st[q] === 2) known++; else if (st[q] === 0) unknown.push(q); }
      if (unknown.length && known === total) { unknown.forEach(function (k) { open(k); }); changed = true; }
      else if (unknown.length && unknown.length === total - known) { unknown.forEach(function (k) { st[k] = 2; }); changed = true; }
    }
    for (var z = 0; z < size; z++) if (!mine[z] && st[z] !== 1) return false;
    return true;
  }

  // ---------- play ----------
  function flood(g, i) {
    var stack = [i], opened = 0;
    while (stack.length) {
      var c = stack.pop();
      if (g.state[c] !== 0) continue;
      g.state[c] = 1; opened++;
      if (g.num[c] === 0) nbrs(g.w, g.h, c).forEach(function (k) { if (g.state[k] === 0) stack.push(k); });
    }
    return opened;
  }
  function checkWin(g) {
    for (var i = 0; i < g.state.length; i++) if (!g.mine[i] && g.state[i] !== 1) return false;
    g.over = true; g.won = true;
    for (var k = 0; k < g.state.length; k++) if (g.mine[k]) g.state[k] = 2; // flag the rest, like the original
    return true;
  }
  // dig a cell: returns { opened, boom, won }
  function dig(g, i) {
    if (g.over || g.state[i] !== 0) return { opened: 0 };
    if (!g.started) { place(g, i); g.started = true; }
    g.digs++;
    if (g.mine[i]) { g.over = true; g.boom = i; return { opened: 0, boom: true }; }
    var n = flood(g, i);
    return { opened: n, won: checkWin(g) };
  }
  function flag(g, i) {
    if (g.over || g.state[i] === 1) return false;
    g.state[i] = g.state[i] === 2 ? 0 : 2;
    return true;
  }
  // tap an open number with that many flags around it: open everything else around it
  function chord(g, i) {
    if (g.over || g.state[i] !== 1 || g.num[i] <= 0) return { opened: 0 };
    var nb = nbrs(g.w, g.h, i), flags = 0;
    nb.forEach(function (k) { if (g.state[k] === 2) flags++; });
    if (flags !== g.num[i]) return { opened: 0, short: true };
    var opened = 0, boom = false;
    nb.forEach(function (k) {
      if (g.state[k] !== 0 || boom) return;

  function showCard(title, html, buttons) {
    $('cardIcon').innerHTML = '<svg viewBox="0 0 100 100"><use href="#mm-logo"/></svg>';
    $('endTitle').textContent = title; $('endText').innerHTML = html;
    var box = $('endActions'); box.innerHTML = '';
    buttons.forEach(function (b) {
      var el = document.createElement('button'); el.className = 'btn' + (b.red ? ' red' : ''); el.textContent = b.label;
      el.addEventListener('click', function () { $('ovEnd').classList.remove('show'); b.go(); });
      box.appendChild(el);
    });
    $('ovEnd').classList.add('show');
  }
  function showAd(done) { GoobsAds.show({ onShow: function () { S.ding(); }, onStep: function () { S.sign(); } }, done); }
  function between(next) {
    if (Goobs.adsOn() && meta.finished > 0 && meta.finished % settings.adEvery === 0 && meta.lastAdAt !== meta.finished) {
      meta.lastAdAt = meta.finished; saveMeta(); next(); showAd(function () {}); return;
    }
    next();
  }
  function openHelp() {
    $('helpTitle').textContent = 'How to play Mine Meadow';
    $('helpList').innerHTML = [
      'Mines are hidden under the grass. <b>Dig</b> up every square that <b>doesn’t</b> have one. Dig a mine and the game is over.',
      'A dug square shows how many mines touch it (sides and corners). A blank touches none, so everything around it opens by itself.',
      '<b>Flag</b> squares you know are mines: <b>press and hold</b> one, or switch the <b>Dig/Flag</b> button and tap. Tap a flag again (hold or Flag mode) to lift it.',
      'Tap a <b>number</b> that already has that many flags around it to dig all its other neighbors at once.',
      'Your first dig is always safe and opens an area. With <b>No guessing</b> on (Settings), every board can be solved by reasoning, never luck.',
      '<b>Beginner</b> 9×9 with 10 mines, <b>Middle</b> 16×16 with 40, <b>Expert</b> 16×30 with 99 (drag to scroll). Pinch to zoom in on small squares. Best times are kept.'
    ].map(function (x) { return '<li>' + x + '</li>'; }).join('');
    $('ovHelp').classList.add('show');
  }
  function renderStats() {
    var h = '';
    Object.keys(MM.LEVELS).forEach(function (l) {
      var st = stats[l];
      h += '<div class="themelabel">' + MM.LEVELS[l].name + '</div><div class="tiles"><div class="tile"><b>' + (st.best ? clock(st.best) : '–') + '</b><span>Best time</span></div>' +
        '<div class="tile"><b>' + st.won + '/' + st.played + '</b><span>Cleared</span></div><div class="tile"><b>' + st.maxStreak + '</b><span>Best run</span></div></div>';
    });
    $('statsBody').innerHTML = h;
  }

  // ================= wiring =================
  function syncSound() {
    $('btnSound').innerHTML = '<svg viewBox="0 0 24 24"><use href="#i-sound-' + (settings.sound ? 'on' : 'off') + '"/></svg>';
    $('btnSound').classList.toggle('on', settings.sound); $('setSound').checked = settings.sound; S.setEnabled(settings.sound);
  }
  function syncAds() { $('setAds').checked = Goobs.adsOn(); $('adEvery').textContent = settings.adEvery; $('rowAdEvery').classList.toggle('off', !Goobs.adsOn()); }
  function sheet(btn, ov, close, onOpen) {
    if (btn) $(btn).addEventListener('click', function () { if (onOpen) onOpen(); $(ov).classList.add('show'); });
    $(close).addEventListener('click', function () { $(ov).classList.remove('show'); });
    $(ov).addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  }
  function inGame() { return g && g.started && !g.over; }
  function init() {
    Goobs.themePicker($('themes'));
    // full screen: How to, Stats and Settings move into the Menu sheet; Dig/Flag and New game stay under the meadow
    Goobs.fullscreen({ menu: ['btnHelp', 'btnStats', 'btnSettings'], info: function () {
      if (!g) return '';
      return '<b>' + MM.LEVELS[g.level].name + '</b> \u00b7 ' + g.w + '\u00d7' + g.h + ' \u00b7 ' + g.n + ' mines' + (g.started && !g.over ? ' \u00b7 clock paused at ' + clock(g.ms) : '');
    } });
    cv = $('cv'); cx = cv.getContext('2d');
    cv.addEventListener('pointerdown', onDown); cv.addEventListener('pointermove', onMove); cv.addEventListener('pointerup', onUp);
    cv.addEventListener('pointercancel', function (e) { delete ptrs[e.pointerId]; if (press && press.timer) clearTimeout(press.timer); press = null; draw(); });
    cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) { document.addEventListener(ev, function () { S.unlock(); }, { passive: true }); });
    $('btnHome').addEventListener('click', function () { tick(); save(); Goobs.home(); });
    $('btnMode').addEventListener('click', function () { flagMode = !flagMode; syncMode(); });
    $('btnNew').addEventListener('click', function () {
      if (inGame()) { showCard('Start over?', 'This board counts as not cleared.', [{ label: 'New game', red: true, go: function () { record(false); between(function () { newGame(g.level); }); } }, { label: 'Keep playing', go: function () {} }]); return; }
      between(function () { newGame(g.level); });
    });
    $('modes').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b || b.dataset.mode === g.level) return;
      var l = b.dataset.mode;
      if (inGame()) { showCard('Leave this board?', 'It counts as not cleared.', [{ label: 'Leave it', red: true, go: function () { record(false); newGame(l); } }, { label: 'Keep playing', go: function () {} }]); return; }
      newGame(l);
    });
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings');
    sheet('btnStats', 'ovStats', 'btnCloseStats', renderStats);
    $('btnHelp').addEventListener('click', openHelp);
    function closeHelp() { $('ovHelp').classList.remove('show'); if (!meta.seen) { meta.seen = true; saveMeta(); } }
    $('btnCloseHelp').addEventListener('click', closeHelp);
    $('ovHelp').addEventListener('click', function (e) { if (e.target === this) closeHelp(); });
    $('btnSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncSound(); S.ding(); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); syncSound(); S.ding(); });
    $('setNoGuess').checked = settings.noGuess; $('setHold').checked = settings.hold;
    $('setNoGuess').addEventListener('change', function () { settings.noGuess = this.checked; saveSettings(); if (g && !g.started) g.noGuess = settings.noGuess; });
    $('setHold').addEventListener('change', function () { settings.hold = this.checked; saveSettings(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncAds(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncAds(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncAds(); });
    var fitQ = 0, refit = function () { if (fitQ) return; fitQ = requestAnimationFrame(function () { fitQ = 0; fit(); }); };
    if (window.ResizeObserver) new ResizeObserver(refit).observe($('stagewrap'));
    window.addEventListener('resize', refit);
    window.addEventListener('orientationchange', function () { setTimeout(refit, 300); });
    document.addEventListener('visibilitychange', function () { tick(); if (document.hidden) save(); });
    window.addEventListener('pagehide', function () { tick(); save(); });
    syncSound(); syncAds();
    try { if (!load()) newGame(meta.level); else { fit(); renderAll(); } }
    catch (e) { store.del('game'); g = null; newGame('beginner'); } // a bad save never keeps the game from opening
    if (!meta.seen) openHelp();
    lastTick = performance.now();
    Goobs.markPlayed('mines');
    Goobs.initUpdates({ beforeReload: function () { tick(); save(); }, onVersions: function (v) { $('version').textContent = 'Mine Meadow ' + (v.mines || '?') + ' · Goobs-Games ' + (v.shell || '?'); } });
    window.__mmReady = true;
  }

  // hook for automated tests
  window.__mm = { get g() { return g; }, act: act, MM: MM, stats: function () { return stats; }, newGame: newGame, cellPos: function (i) { return [view.x + (i % g.w + 0.5) * cell * view.s, view.y + (((i / g.w) | 0) + 0.5) * cell * view.s]; }, get view() { return view; } };

  init();
})();
</script>
</body>
</html>
