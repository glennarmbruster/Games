<script>
/* if Game Chest can't open, say so on screen (never a blank page) and offer a fresh start */
(function () {
  var shown = false;
  function fail(msg) {
    if (shown || window.__gcReady) return; shown = true;
    function put() {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:#eef4f0;color:#1b1f33;font:600 16px -apple-system,system-ui,sans-serif;text-align:center';
      d.innerHTML = '<b style="font-size:21px">Game Chest didn\u2019t open</b><div style="max-width:320px;opacity:.75;font-size:13px">' + String(msg).replace(/[<>&]/g, '') + '</div>';
      function btn(t, bg, go) { var b = document.createElement('button'); b.textContent = t; b.style.cssText = 'font:800 17px -apple-system,system-ui,sans-serif;padding:13px 24px;border-radius:14px;border:0;color:#fff;background:' + bg; b.onclick = go; d.appendChild(b); }
      btn('Start fresh', '#5a54f0', function () { try { ['chess', 'checkers', 'four'].forEach(function (k) { localStorage.removeItem('board.game_' + k); }); } catch (e) { /* ignore */ } location.reload(); });
      btn('All games', '#6b7080', function () { location.href = '../../'; });
      document.body.appendChild(d);
    }
    if (document.body) put(); else document.addEventListener('DOMContentLoaded', put);
  }
  window.addEventListener('error', function (e) { fail((e.message || 'Something went wrong') + (e.lineno ? ' (line ' + e.lineno + ')' : '')); });
  setTimeout(function () { if (!window.__gcReady) fail('It took too long to start.'); }, 6000);
})();
</script>
<title>Game Chest</title>
<style>
/* Game Chest styles (themes, UI kit and ad cards come from /shared/goobs.css) */
.brand h1 { font-size: 22px; }
.stagewrap { flex: 1 1 auto; min-height: 0; width: calc(100% + 20px); margin: 0 -10px; display: flex; align-items: stretch; justify-content: center; }
.stage { position: relative; flex: 1; border-radius: 18px; overflow: hidden; touch-action: none; margin: 0 10px; background: transparent; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.toast { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); max-width: 92%; text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: rgba(20,24,36,.85); color: #fff; font-weight: 700; font-size: 14px; padding: 8px 14px; border-radius: 14px; z-index: 2; }
.toast.show { opacity: 1; }
.cardicon svg { border-radius: 16px; }
.info .turn { display: flex; align-items: center; gap: 8px; }
.info .who { display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(0,0,0,.35); flex: none; }
.info .think { display: inline-block; animation: gcdots 1s infinite steps(4); overflow: hidden; vertical-align: bottom; width: 1.2em; white-space: nowrap; }
@keyframes gcdots { 0% { width: 0; } 100% { width: 1.2em; } }
.optlbl { font-weight: 800; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 14px 2px 6px; }
.optlbl:first-child { margin-top: 2px; }
.seg { display: flex; gap: 3px; background: var(--surface-2); border-radius: 14px; padding: 3px; }
.seg button { flex: 1; font: inherit; font-weight: 800; font-size: 15px; border: 0; border-radius: 11px; padding: 10px 4px; background: transparent; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.twonote { color: var(--muted); font-size: 14px; margin: 12px 2px 0; }
.promo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
.promo button { border: 0; border-radius: 14px; background: var(--surface-2); padding: 6px; }
.promo canvas { width: 100%; aspect-ratio: 1; display: block; }
.statmode { font-weight: 800; margin: 14px 2px 6px; font-size: 16px; }
.statline { color: var(--muted); font-size: 13px; margin: 6px 2px 0; }

/* full screen (Goobs.fullscreen): the board's canvas spans the whole screen width (the wooden frame may touch the
   edges) and all the height between the info row and Undo/Hint; the board itself stays square and whole (layout()) */
html.gg-fs .stagewrap { width: calc(100% + 16px + env(safe-area-inset-left, 0px) + env(safe-area-inset-right, 0px)); margin: 0 calc(-8px - env(safe-area-inset-right, 0px)) 0 calc(-8px - env(safe-area-inset-left, 0px)); }
html.gg-fs .stage { margin: 0; border-radius: 0; }
html.gg-fs .modes button { font-size: 14px; }
/* Board geometry is retained; materials are rendered inside its existing bounds. */
.stage { background:radial-gradient(ellipse at 50% 35%,var(--surface),var(--bg)); }
.promo button { box-shadow:inset 0 1px #ffffff40,0 2px 4px #0002; }

</style>

<script>
/* Game Chest: chess rules and the chess computer (no DOM; runs in Node for the tests).
   0x88 board: square = rank * 16 + file, rank 0 is White's back rank. Pieces: 1 pawn, 2 knight, 3 bishop, 4 rook,
   5 queen, 6 king; black pieces have 8 added. Full rules: castling, en passant, promotion, check, checkmate,
   stalemate, fifty moves, threefold repetition, not enough material. The computer is alpha-beta with
   quiescence, piece-square tables and move ordering. */
var CH = (function () {
  'use strict';
  var P = 1, N = 2, B = 3, R = 4, Q = 5, K = 6, BL = 8;
  var VAL = [0, 100, 320, 330, 500, 900, 0];
  var ND = [33, 31, 18, 14, -33, -31, -18, -14], KD = [1, -1, 16, -16, 15, 17, -15, -17], BD = [15, 17, -15, -17], RD = [1, -1, 16, -16];
  function type(p) { return p & 7; }
  function col(p) { return p & BL ? 1 : 0; }
  function on(s) { return (s & 0x88) === 0; }

  // ---------------- positions ----------------
  var START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
  function fromFEN(fen) {
    var f = fen.trim().split(/\s+/), s = { b: new Int8Array(128), turn: f[1] === 'b' ? 1 : 0, castle: 0, ep: -1, half: +(f[4] || 0), full: +(f[5] || 1), kings: [-1, -1], stack: [], keys: [] };
    var rows = f[0].split('/'), map = { p: 1, n: 2, b: 3, r: 4, q: 5, k: 6 };
    for (var i = 0; i < 8; i++) { var r = 7 - i, fl = 0; for (var j = 0; j < rows[i].length; j++) { var ch = rows[i][j]; if (/\d/.test(ch)) { fl += +ch; continue; } var lo = ch.toLowerCase(), p = map[lo] | (ch === lo ? BL : 0); s.b[r * 16 + fl] = p; if (type(p) === K) s.kings[col(p)] = r * 16 + fl; fl++; } }
    var c = f[2] || '-'; if (c.indexOf('K') >= 0) s.castle |= 1; if (c.indexOf('Q') >= 0) s.castle |= 2; if (c.indexOf('k') >= 0) s.castle |= 4; if (c.indexOf('q') >= 0) s.castle |= 8;
    if (f[3] && f[3] !== '-') s.ep = (+f[3][1] - 1) * 16 + (f[3].charCodeAt(0) - 97);
    s.keys.push(key(s)); return s;
  }
  function start() { return fromFEN(START); }
  function key(s) { var k = ''; for (var i = 0; i < 128; i++) if (on(i)) k += String.fromCharCode(65 + s.b[i]); return k + s.turn + s.castle + ',' + s.ep; }
  function name(sq) { return String.fromCharCode(97 + (sq & 7)) + ((sq >> 4) + 1); }

  // ---------------- attacks and moves ----------------
  function attacked(s, sq, by) {
    var b = s.b, i, t, p;
    if (by === 0) { t = sq - 15; if (on(t) && b[t] === P) return true; t = sq - 17; if (on(t) && b[t] === P) return true; }
    else { t = sq + 15; if (on(t) && b[t] === (P | BL)) return true; t = sq + 17; if (on(t) && b[t] === (P | BL)) return true; }
    var add = by ? BL : 0;
    for (i = 0; i < 8; i++) { t = sq + ND[i]; if (on(t) && b[t] === (N | add)) return true; t = sq + KD[i]; if (on(t) && b[t] === (K | add)) return true; }
    for (i = 0; i < 4; i++) { t = sq + BD[i]; while (on(t)) { p = b[t]; if (p) { if (col(p) === by && (type(p) === B || type(p) === Q)) return true; break; } t += BD[i]; } }
    for (i = 0; i < 4; i++) { t = sq + RD[i]; while (on(t)) { p = b[t]; if (p) { if (col(p) === by && (type(p) === R || type(p) === Q)) return true; break; } t += RD[i]; } }
    return false;
  }
  function inCheck(s, side) { side = side === undefined ? s.turn : side; return attacked(s, s.kings[side], side ^ 1); }
  function add(list, f, t, p, c, pr, fl) { list.push({ f: f, t: t, p: p, c: c, pr: pr || 0, fl: fl || 0 }); }
  function gen(s, capsOnly) {
    var b = s.b, me = s.turn, list = [], sq, p, i, t, q;
    for (sq = 0; sq < 128; sq++) {
      if (!on(sq)) { sq += 7; continue; }
      p = b[sq]; if (!p || col(p) !== me) continue;
      var ty = type(p);
      if (ty === P) {
        var dir = me ? -16 : 16, r = sq >> 4, last = me ? 0 : 7, first = me ? 6 : 1;
        t = sq + dir;
        if (on(t) && !b[t]) {
          if ((t >> 4) === last) { [Q, R, B, N].forEach(function (x) { add(list, sq, t, p, 0, x); }); }
          else if (!capsOnly) { add(list, sq, t, p, 0); if (r === first && !b[t + dir]) add(list, sq, t + dir, p, 0, 0, 1); }
        }
        [dir - 1, dir + 1].forEach(function (d) {
          var u = sq + d; if (!on(u)) return;
          if (b[u] && col(b[u]) !== me) { if ((u >> 4) === last) [Q, R, B, N].forEach(function (x) { add(list, sq, u, p, b[u], x); }); else add(list, sq, u, p, b[u]); }
          else if (u === s.ep) add(list, sq, u, p, P | (me ? 0 : BL), 0, 2);
        });
      } else if (ty === N || ty === K) {
        var D = ty === N ? ND : KD;
        for (i = 0; i < 8; i++) { t = sq + D[i]; if (!on(t)) continue; q = b[t]; if (!q) { if (!capsOnly) add(list, sq, t, p, 0); } else if (col(q) !== me) add(list, sq, t, p, q); }
      } else {
        var DS = ty === B ? BD : ty === R ? RD : KD;
        for (i = 0; i < DS.length; i++) { t = sq + DS[i]; while (on(t)) { q = b[t]; if (!q) { if (!capsOnly) add(list, sq, t, p, 0); } else { if (col(q) !== me) add(list, sq, t, p, q); break; } t += DS[i]; } }
      }
    }
    if (!capsOnly) { // castling

    for (r = 0; r < C4.H; r++) for (c = 0; c < C4.W; c++) { var q3 = c4xy(r, c); cx.beginPath(); cx.arc(q3[0], q3[1], cell * 0.4, 0, 7); cx.lineWidth = cell * 0.05; cx.strokeStyle = 'rgba(0,20,80,.35)'; cx.stroke(); }
    // feet
    cx.fillStyle = '#1d47b0'; GArt.rr(cx, bx - frame * 2, by + h + frame * 0.6, cell * 0.8, cell * 0.35, cell * 0.12); cx.fill(); GArt.rr(cx, bx + w + frame * 2 - cell * 0.8, by + h + frame * 0.6, cell * 0.8, cell * 0.35, cell * 0.12); cx.fill();
    // last disc marker and the winning line
    if (g.last && !anim && !win) { var lc = g.last[0], lr = s.h[lc] - 1; if (lr >= 0) { var q4 = c4xy(lr, lc); cx.beginPath(); cx.arc(q4[0], q4[1], cell * 0.1, 0, 7); cx.fillStyle = 'rgba(255,255,255,.7)'; cx.fill(); } }
    if (win && !anim) { var pulse = 0.6 + 0.4 * Math.sin(now / 150); win.forEach(function (p) { var q5 = c4xy(p[0], p[1]); cx.beginPath(); cx.arc(q5[0], q5[1], cell * 0.44, 0, 7); cx.lineWidth = cell * 0.09; cx.strokeStyle = 'rgba(255,255,255,' + pulse + ')'; cx.stroke(); }); }
  }
  function frameLoop(now) { requestAnimationFrame(frameLoop); draw(now); }

  // ================= info, cards, sheets =================
  function renderInfo() {
    var g = cur(); if (!g) return;
    var sd = SIDE[mode], t = turnOf(g), dot = '<span class="who" style="background:' + DOT[mode][g.over && g.over.winner >= 0 ? g.over.winner : t] + '"></span>', txt;
    if (g.over) { var et = endText(g); txt = et.title; }
    else if (thinking) txt = 'Phone is thinking<span class="think">…</span>';
    else if (g.opp === 'phone') txt = t === g.human ? 'Your turn' : 'Phone’s turn';
    else txt = sd[t] + ' to move';
    if (!g.over && mode === 'chess' && CH.inCheck(g.s)) txt += ' · Check!';
    var right = g.opp === 'phone' ? 'vs Phone · ' + LEVELS[g.level] : '2 players', mid;
    if (mode === 'chess') mid = 'Move ' + (Math.floor(g.hist.length / 2) + 1);
    else if (mode === 'checkers') { var cn = CK.count(g.s); mid = sd[0] + ' ' + (cn[0][0] + cn[0][1]) + ' · ' + sd[1] + ' ' + (cn[1][0] + cn[1][1]); }
    else mid = 'Disc ' + g.hist.length + ' of 42';
    $('info').innerHTML = '<div><div class="lbl">' + (g.opp === 'phone' ? 'You are ' + sd[g.human] : NAMES[mode]) + '</div><div class="mid turn">' + dot + '<span>' + txt + '</span></div></div>' +
      '<div class="right"><div class="lbl">' + right + '</div><div class="mid">' + mid + '</div></div>';
    Array.prototype.forEach.call(document.querySelectorAll('#modes button'), function (b) { b.classList.toggle('on', b.getAttribute('data-m') === mode); });
  }
  var toastT = 0;
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('show'); }, 2000); }
  function showCard(title, html, buttons) {
    $('cardIcon').innerHTML = '<svg viewBox="0 0 100 100"><use href="#gc-logo"/></svg>';
    $('endTitle').textContent = title; $('endText').innerHTML = html;
    var box = $('endActions'); box.innerHTML = '';
    buttons.forEach(function (b) { var el = document.createElement('button'); el.className = 'btn' + (b.red ? ' red' : ''); el.textContent = b.label; el.addEventListener('click', function () { $('ovEnd').classList.remove('show'); b.go(); }); box.appendChild(el); });
    $('ovEnd').classList.add('show');
  }
  function showAd(done2) { GoobsAds.show({ onShow: function () { S.ding(); }, onStep: function () { S.sign(); } }, done2); }
  function between(next) { if (Goobs.adsOn() && meta.finished > 0 && meta.finished % settings.adEvery === 0 && meta.lastAdAt !== meta.finished) { meta.lastAdAt = meta.finished; saveMeta(); next(); showAd(function () {}); return; } next(); }
  // new game sheet
  var pick = null;
  function segSet(id, v) { Array.prototype.forEach.call($(id).querySelectorAll('button'), function (b) { b.classList.toggle('on', b.getAttribute('data-v') === String(v)); }); }
  function syncNew() { segSet('segOpp', pick.opp); segSet('segLevel', pick.level); segSet('segSide', pick.human); $('phoneOpts').style.display = pick.opp === 'phone' ? '' : 'none'; $('twoNote').style.display = pick.opp === 'two' ? '' : 'none'; }
  function openNew() {
    var o = meta.opts[mode]; pick = { opp: o.opp, level: o.level, human: o.human };
    $('newTitle').textContent = 'New game of ' + NAMES[mode];
    $('side0').textContent = SIDE[mode][0] + ' (first)'; $('side1').textContent = SIDE[mode][1];
    syncNew(); $('ovNew').classList.add('show');
  }
  function openHelp() {
    $('helpList').innerHTML = [
      'Pick <b>Checkers</b>, <b>Chess</b> or <b>Four in a Row</b> at the top. Each keeps its own game going, so switch any time.',
      '<b>New game</b> sets who you play: the phone (Easy, Medium or Hard, and whether you go first) or <b>2 players</b> passing the phone back and forth.',
      '<b>Checkers and chess:</b> tap your piece, then tap where it goes. Dots show the moves (turn them off in Settings).',
      '<b>Checkers:</b> pieces move diagonally forward; jump over a piece to take it and keep jumping if you can (tap each landing). If you can jump, you have to (glowing rings show who can). Reach the far side to be crowned a king that moves both ways. Take all the pieces, or leave the other side with no move, to win.',
      '<b>Chess:</b> the usual rules. Castle by moving the king two squares. A pawn that reaches the end turns into the piece you pick. Checkmate wins; stalemate, repeats and bare kings are draws.',
      '<b>Four in a Row:</b> tap a column (or slide along the top) to drop a disc. Four in a line across, up or on a slant wins.',
      '<b>Undo</b> and <b>Hint</b> are free. Against the phone, Undo takes back your move and the phone’s.'
    ].map(function (x) { return '<li>' + x + '</li>'; }).join('');
    $('ovHelp').classList.add('show');
  }
  function renderStats() {
    var h = '';
    MODES.forEach(function (m) {
      var st = stats[m];
      h += '<div class="statmode">' + NAMES[m] + '</div><div class="tiles"><div class="tile"><b>' + sum(st.w) + '</b><span>Wins</span></div><div class="tile"><b>' + sum(st.l) + '</b><span>Losses</span></div><div class="tile"><b>' + sum(st.d) + '</b><span>Draws</span></div></div>' +
        '<div class="statline">vs the phone: ' + LEVELS.map(function (L, i) { return L + ' ' + st.w[i] + '–' + st.l[i] + (st.d[i] ? '–' + st.d[i] : ''); }).join(' · ') + (st.two ? ' · 2-player games ' + st.two : '') + '</div>';
    });
    $('statsBody').innerHTML = h;
  }
  function switchMode(m) {
    if (m === mode || anim) return; token++; thinking = false; sel = -1; partial = []; hint = null; hoverCol = -1;
    mode = m; meta.mode = m; saveMeta();
    if (!G[m]) G[m] = loadGame(m) || newGame(m, meta.opts[m]);
    layout(); renderInfo(); maybeAI();
  }

  // ================= wiring =================
  function syncSound() { $('btnSound').innerHTML = '<svg viewBox="0 0 24 24"><use href="#i-sound-' + (settings.sound ? 'on' : 'off') + '"/></svg>'; $('btnSound').classList.toggle('on', settings.sound); $('setSound').checked = settings.sound; S.setEnabled(settings.sound); }
  function syncAds() { $('setAds').checked = Goobs.adsOn(); $('adEvery').textContent = settings.adEvery; $('rowAdEvery').classList.toggle('off', !Goobs.adsOn()); }
  function sheet(btn, ov, close, onOpen) {
    if (btn) $(btn).addEventListener('click', function () { if (onOpen) onOpen(); $(ov).classList.add('show'); });
    $(close).addEventListener('click', function () { $(ov).classList.remove('show'); });
    $(ov).addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  }
  function menuInfo() {
    var g = cur(); if (!g) return '';
    return NAMES[mode] + ' · ' + (g.opp === 'phone' ? 'vs Phone, <b>' + LEVELS[g.level] + '</b>' : '<b>2 players</b>') + ' · Move <b>' + (g.hist.length + 1) + '</b>';
  }
  function init() {
    // full screen: New game (also on the game-over card), How to (new button; tapping the info row still opens it too),
    // Stats and Settings go into the Menu; Undo and Hint stay under the board, which runs edge to edge (style.css)
    Goobs.fullscreen({ menu: ['btnNew', 'btnHelp', 'btnStats', 'btnSettings'], info: menuInfo });
    Goobs.themePicker($('themes'));
    cv = $('cv'); cx = cv.getContext('2d');
    cv.addEventListener('pointerdown', onDown); window.addEventListener('pointermove', onMove, { passive: true }); window.addEventListener('pointerup', onUp); window.addEventListener('pointercancel', function () { downId = null; hoverCol = -1; });
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) { document.addEventListener(ev, function () { S.unlock(); }, { passive: true }); });
    $('btnHome').addEventListener('click', function () { Goobs.home(); });
    $('modes').addEventListener('click', function (e) { var b = e.target.closest('button[data-m]'); if (b) switchMode(b.getAttribute('data-m')); });
    $('btnNew').addEventListener('click', function () { if (!anim) openNew(); });
    $('btnUndo').addEventListener('click', undo); $('btnHint').addEventListener('click', giveHint);
    ['segOpp', 'segLevel', 'segSide'].forEach(function (id) { $(id).addEventListener('click', function (e) { var b = e.target.closest('button[data-v]'); if (!b) return; var v = b.getAttribute('data-v'); if (id === 'segOpp') pick.opp = v; else if (id === 'segLevel') pick.level = +v; else pick.human = +v; syncNew(); }); });
    $('btnStart').addEventListener('click', function () { $('ovNew').classList.remove('show'); meta.opts[mode] = { opp: pick.opp, level: pick.level, human: pick.human }; saveMeta(); var m = mode; between(function () { startNew(m, meta.opts[m]); }); });
    $('btnCloseNew').addEventListener('click', function () { $('ovNew').classList.remove('show'); }); $('ovNew').addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings');
    sheet('btnStats', 'ovStats', 'btnCloseStats', renderStats);
    function closeHelp() { $('ovHelp').classList.remove('show'); if (!meta.seen) { meta.seen = true; saveMeta(); } }
    $('btnCloseHelp').addEventListener('click', closeHelp); $('ovHelp').addEventListener('click', function (e) { if (e.target === this) closeHelp(); });
    $('info').addEventListener('click', openHelp); $('btnHelp').addEventListener('click', openHelp);
    $('btnSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncSound(); S.ding(); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); syncSound(); S.ding(); });
    $('setDots').checked = settings.dots; $('setDots').addEventListener('change', function () { settings.dots = this.checked; saveSettings(); });
    $('setForced').checked = settings.forced; $('setForced').addEventListener('change', function () { settings.forced = this.checked; saveSettings(); toast('Starts with the next checkers game'); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncAds(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncAds(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncAds(); });
    if (window.ResizeObserver) new ResizeObserver(fit).observe($('stagewrap'));
    window.addEventListener('resize', fit);
    syncSound(); syncAds();
    G[mode] = loadGame(mode) || newGame(mode, meta.opts[mode]);
    fit(); renderInfo();
    if (!meta.seen) openHelp();
    requestAnimationFrame(frameLoop);
    maybeAI();
    window.__gcReady = true;
    Goobs.markPlayed('board');
    Goobs.initUpdates({ onVersions: function (v) { $('version').textContent = 'Game Chest ' + (v.board || '?') + ' · Goobs-Games ' + (v.shell || '?'); } });
  }
  window.__gc = { get g() { return cur(); }, get mode() { return mode; }, get thinking() { return thinking; }, get anim() { return anim; }, switchMode: switchMode, startNew: startNew, tapSquare: function (sq) { tapSquare(cur(), sq); }, undo: undo, hint: giveHint, CH: CH, CK: CK, C4: C4,
    drop: function (c) { var g = cur(); if (g && humanTurn(g) && !anim && !thinking && C4.canDrop(g.s, c)) applyMove(g, c, true); }, xy: function (sq) { return xy(sq); } };
  init();
})();
</script>
