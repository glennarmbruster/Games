<style>
/* Topple Fair styles (themes, UI kit and ad cards come from /shared/goobs.css) */
.brand svg { border-radius: 10px; }
/* Full screen (1.5.0, Glenn: "every game full screen"): the scene fills the whole screen, edge to edge; the buttons
   and counters float on top, clear of the notch and the home bar. */
html, body { height: 100%; overflow: hidden; background: #8fd3ff; }
.stage { position: fixed; inset: 0; overflow: hidden; touch-action: none;
  background: linear-gradient(#5fb8f5 0%, #9fd8fb 45%, #d9f1ff 62%, #bfe6a0 62.1%, #7dcf5a 100%); }
.stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
.hud { position: absolute; left: 0; right: 0; top: 0; z-index: 3; display: flex; justify-content: space-between; align-items: center; pointer-events: none;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) calc(env(safe-area-inset-right, 0px) + 10px) 0 calc(env(safe-area-inset-left, 0px) + 10px); }
.hudl, .hudr { display: flex; gap: 8px; align-items: center; pointer-events: auto; }
.hbtn { width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,.9); color: #1b2130; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 3px 10px rgba(0,0,0,.2); padding: 0; flex: none; }
.hbtn svg { width: 22px; height: 22px; }
.hbtn:active { transform: scale(.93); }
.hbtn.on { color: #5a54f0; }
.pill { letter-spacing: -.025em; background: rgba(255,255,255,.9); color: #1b1f33; font-weight: 750; font-size: 17px; padding: 8px 13px; border-radius: 20px; box-shadow: 0 3px 10px rgba(0,0,0,.18); white-space: nowrap; }
.pill small { font-size: 14px; color: #ffb000; letter-spacing: 1px; margin-left: 4px; }
.hud2 { position: absolute; left: 0; right: 0; z-index: 3; pointer-events: none; display: flex; justify-content: space-between; align-items: center;
  top: calc(env(safe-area-inset-top, 0px) + 60px); padding: 0 calc(env(safe-area-inset-right, 0px) + 10px) 0 calc(env(safe-area-inset-left, 0px) + 10px); }
.ballsleft { background: rgba(255,255,255,.9); color: #1b1f33; font-weight: 900; font-size: 20px; padding: 5px 12px 5px 8px; border-radius: 16px; display: flex; align-items: center; gap: 6px;
  box-shadow: 0 3px 10px rgba(0,0,0,.18); }
.ballsleft i { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c8 0 15%, #ffc53d 40%, #e0772a 100%); display: inline-block; }
.ballsleft.low { background: #ffe1e5; color: #c81e3a; }
.onstand { font-size: 15px; padding: 6px 11px; }
.menutop { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.menutop svg { width: 36px; height: 36px; border-radius: 10px; }
.menutop h2 { margin: 0; }
.menuinfo { color: var(--muted); font-weight: 700; font-size: 15px; margin: 2px 2px 4px; }
.menuinfo b { color: var(--ink); }
.menugrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.menugrid .tool { width: 100%; font-size: 13px; }
.loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; color: #1b3a6b; pointer-events: none; }
.loading.hide { display: none; }
.toast { position: absolute; z-index: 3; left: 50%; top: 32%; transform: translateX(-50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: rgba(10,14,36,.78); color: #fff; font-weight: 800; font-size: 16px; padding: 8px 15px; border-radius: 14px; white-space: nowrap; }
.toast.show { opacity: 1; }
.lvgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.lv { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); height: 52px; font-weight: 800; font-size: 16px; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
/* 1.8.0: the levels never run out, so long numbers get a smaller size to fit the button */
.lv { min-width: 0; padding: 0; overflow: hidden; }
.lv.l5 { font-size: 14px; } .lv.l6 { font-size: 12.5px; } .lv.l7 { font-size: 11px; letter-spacing: -0.3px; }
.lv small { font-size: 11px; color: #e0a800; letter-spacing: -1px; }
.lv.cur { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.lv:disabled { opacity: .35; }
.stars { font-size: 26px; color: #ffc83d; letter-spacing: 2px; }
.stars .off { color: var(--line-strong); }
.cardicon svg { border-radius: 16px; }
.brand h1 { font-size: 21px; }
@media (max-width: 385px) { .brand h1 { font-size: 19px; } }
.lvpages { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.lvpages button { font: inherit; font-weight: 800; font-size: 13px; border: 0; border-radius: 10px; padding: 7px 9px; background: var(--surface-2); color: var(--muted); }
.lvpages button.on { background: var(--accent); color: #fff; }
.lvpages button[disabled] { opacity: .35; }

<script>
/* Topple Fair logic: the carnival knock-down stand. A stack of prizes sits on a stand; throw balls at it and knock
   every piece off before the balls run out. cannon-es does the physics (passed in with TF.use, so this file runs in
   the browser and in Node). Levels are made from rules here and proven by tools/gen.mjs / gen2.mjs: a bot has to
   clear each one with the physics the game uses, and the level gets a few more balls than the bot needed.
   1.4.0: the prizes change every 25 levels (tin cans, milk bottles, soda pop, gifts, barrels, hardware, pumpkins,
   trophies) and get heavier as the levels go; some levels have a spinning round table, some have two tables.
   A spinning table is done in the table's own frame: the physics never moves the table, the cannon goes round it
   instead (so stacks stay perfectly steady until hit), and the app turns the whole table on screen.
   1.6.0 (harder, Cindy asked for heavier pieces): the weights climb from level 11 to about 2.4 times by level 150 and 3
   times from level 300, some bottom blocks become iron anchors (extra heavy), spinning tables and two tables come
   sooner, and a level gives fewer spare balls (tools/gen3.mjs proves them all again).
   1.7.0 (Glenn: a stack falls when he hits another one, "it falls too easily"): only pieces next to something moving
   are woken (1.1.1 woke every piece on the table), and the solver runs 30 iterations (was 12) so a stack that is awake
   but not pushed stands still instead of slowly slumping. tools/gen4.mjs proves every level again.
   1.8.0 (unlimited levels): levels after the 500 of the bank are made on the phone from the level number (genStart /
   genRun below, run by the app in a Web Worker) and proven by the same bot proof before they are played. */
// 1.8.0: the whole of TF is made by TFMake, so the app can hand its source to a Web Worker (a Blob of
// TFMake.toString()) that makes and proves the levels past the bank without slowing the game down.
function TFMake() {
  'use strict';
  var C = null;
  // the stand: top at y = 0, centered on x = 0 and z = 0
  var PW = 5.4, PD = 1.5, PT = 0.3, GROUND = -3.4, GRAV = -24;
  var LAUNCH = [0, 0.55, 8.5], SPEED = 30, BALLR = 0.27, BALLM = 4.5, BALL_LIFE = 3.2;
  // the pieces: half sizes (the physics shape is a box; cans are drawn round), mass, points
  var KINDS = {
    r: { name: 'can', hx: 0.2, hy: 0.25, hz: 0.2, m: 0.45, can: true },    // red can
    u: { name: 'can', hx: 0.2, hy: 0.25, hz: 0.2, m: 0.45, can: true },    // blue can
    y: { name: 'can', hx: 0.2, hy: 0.25, hz: 0.2, m: 0.45, can: true },    // yellow can
    b: { name: 'block', hx: 0.245, hy: 0.245, hz: 0.245, m: 0.8 },          // wood block
    p: { name: 'plank', hx: 0.74, hy: 0.09, hz: 0.24, m: 0.9 },             // board across three columns
    h: { name: 'heavy', hx: 0.245, hy: 0.245, hz: 0.245, m: 2.6 },          // heavy ice block
    a: { name: 'anchor', hx: 0.245, hy: 0.245, hz: 0.245, m: 3.9 }          // 1.6.0: iron anchor (same size, half as heavy again)
  };
  var ROWH = { can: 0.5, block: 0.49, plank: 0.18, heavy: 0.49 };
  // the prize sets: every 25 levels a new look, with its own weights (small prize, block, board, heavy piece)
  var THEMES = [
    { id: 'tin', name: 'Tin cans', m: [0.45, 0.8, 0.9, 2.6] },
    { id: 'milk', name: 'Milk bottles', m: [0.6, 1.0, 0.9, 2.8] },
    { id: 'soda', name: 'Soda pop', m: [0.7, 0.9, 0.9, 3.2] },
    { id: 'gift', name: 'Gift shop', m: [0.75, 1.2, 1.0, 3.2] },
    { id: 'barn', name: 'Barnyard', m: [0.9, 1.3, 1.0, 3.6] },
    { id: 'tools', name: 'Hardware', m: [1.0, 1.6, 1.3, 3.8] },
    { id: 'pumpkin', name: 'Pumpkin patch', m: [1.0, 1.4, 1.0, 3.6] },
    { id: 'trophy', name: 'Trophy room', m: [1.1, 1.8, 1.4, 4.0] }
  ];
  function themeOf(n) { var b = Math.floor(((n || 1) - 1) / 25); return b < THEMES.length ? b : 1 + (b - THEMES.length) % (THEMES.length - 1); }
  // everything gets heavier as the levels go. 1.6.0: levels 1-10 (the intro) keep their weights; from 11 it climbs to
  // 2.4 times by level 150 and 3 times from level 300 (1.4.0 was 1.6 times from level 250). A ball (4.5) still sends a
  // lone piece flying at 3 times; stacks hold together much more, so it takes cleaner hits low down.
  function massMul(n) { n = n || 1; return n <= 10 ? 1 : n <= 150 ? 1 + 1.4 * (n - 10) / 140 : 2.4 + 0.6 * Math.min(1, (n - 150) / 150); }
  // an iron anchor weighs half as much again as the set's heaviest piece
  function massOf(k, n) { var t = THEMES[themeOf(n)].m, i = k === 'b' ? 1 : k === 'p' ? 2 : k === 'h' || k === 'a' ? 3 : 0; return t[i] * massMul(n) * (k === 'a' ? 1.5 : 1); }
  // how many balls a level gives: 1.6.0 levels 11 and up get fewer to spare (bot + 30%, at least 2); the intro keeps

<script>
/* Topple Fair app: the fairground scene (three.js), the throwing cannon, touch-to-shoot aiming, the physics loop
   (cannon-es, through TF in logic.js), levels with stars, stats, saves and house ads.
   three.js and cannon-es come from /shared and load when the game opens. */
(function () {
  'use strict';
  var S = TFSound, LEVELS = window.TF_LEVELS || [];
  // 1.8.0: levels never run out. The bank (src/levels.json) is levels 1-BANK; every level after it is made on the phone
  // from its number (TF.genStart/genRun in logic.js, in a Web Worker) and proven by the bot before it is played.
  var BANK = LEVELS.length, MAXLV = 9999999;
  var STEP = 1 / 60, T = null, C = null;
  var PIECE_COL = TFScene.PIECE_COL;

  // ================= storage =================
  var store = Goobs.store('topple');
  var settings = { sound: false, adEvery: 3, fancy: true };
  (function () {
    var s = store.get('settings', {}) || {};
    for (var k in settings) if (typeof s[k] === typeof settings[k]) settings[k] = s[k];
    settings.adEvery = Math.min(10, Math.max(1, settings.adEvery | 0));
  })();
  function saveSettings() { store.set('settings', settings); }
  var meta = store.get('meta', null) || {};
  var MD = { level: 1, open: 1, stars: {}, seen: false, finished: 0, lastAdAt: 0 };
  for (var mk in MD) if (meta[mk] === undefined) meta[mk] = MD[mk];
  if (typeof meta.stars !== 'object' || !meta.stars) meta.stars = {};
  meta.open = Math.max(1, Math.min(MAXLV, meta.open | 0));
  // more levels arrived: if the last open level is already cleared, the next one opens (1.8.0: level 500 cleared opens 501)
  while (meta.open < MAXLV && meta.stars[meta.open]) meta.open++;
  meta.level = Math.max(1, Math.min(meta.open, meta.level | 0));
  function saveMeta() { store.set('meta', meta); }
  var stats = store.get('stats', null) || {};
  var SD = { throws: 0, knocked: 0, cleared: 0, tries: 0 };
  for (var sk in SD) if (typeof stats[sk] !== 'number') stats[sk] = SD[sk];
  function saveStats() { store.set('stats', stats); }

  // ================= levels past the bank (1.8.0) =================
  // Made levels are kept on the phone (topple.gen, the most recent GEN_KEEP), so a level opens straight away when it is
  // played again; any one that was dropped is simply made again (level n always comes out the same). GENV marks the
  // level maker: if a later version changes it, the old saved levels are not mixed in.
  var GENV = 1, GEN_KEEP = 40, genCache = {}, genWaiting = 0, genLog = [], genSkip = null, GW = null;
  (function () { var g = store.get('gen', null); if (g && g.v === GENV && g.lv) for (var k in g.lv) if (g.lv[k] && g.lv[k].items) genCache[k] = g.lv[k]; })();
  function saveGen() {
    var ks = Object.keys(genCache).map(Number).sort(function (a, b) { return a - b; });
    // drop the lowest numbers first, but never the level being played
    while (ks.length > GEN_KEEP) { var i = ks[0] === levelNo ? 1 : 0; delete genCache[ks[i]]; ks.splice(i, 1); }
    store.set('gen', { v: GENV, lv: genCache });
  }
  function levelAt(n) { return n <= BANK ? LEVELS[n - 1] || null : genCache[n] || null; }
  // the bank's layouts, so a made level never repeats one of them
  function bankSkip() { if (!genSkip) { genSkip = {}; LEVELS.forEach(function (l) { genSkip[TF.layoutKey(l.items)] = 1; }); } return genSkip; }
  // The level maker. It runs in a Web Worker built from a Blob: cannon-es (its text, read from the app's own copy and
  // turned from a module into a plain script) + TFMake's source + TFGenHost's source. If a worker can't be made it runs
  // here instead, a few physics steps at a time between frames. Either way it takes requests {want: n, pri} and answers
  // {level, ms}; the most urgent (pri), then lowest level number, is worked on first.
  // In the worker it keeps itself going with setTimeout (slice: physics steps per turn). On the page (no worker) it is
  // run from the game's frame loop instead (pump, about `budget` ms a frame): timers between frames can be slowed right
  // down by the browser, frames can't while the game is on screen. canRun (page only): false until the physics loads.
  function TFGenHost(post, TF, slice, canRun, budget) {
    var jobs = {}, busy = false, skip = {}, page = !!canRun;
    // one turn of work on the most urgent job; false when there is nothing to do (yet)
    function once(ms) {
      var best = null, k, j;
      for (k in jobs) { j = jobs[k]; if (!best || j.pri > best.pri || (j.pri === best.pri && j.n < best.n)) best = j; }
      if (!best || (page && !canRun())) return false;
      var t0 = Date.now(), lv;
      try { do { lv = TF.genRun(best, slice); } while (!lv && (ms || budget) && Date.now() - t0 < (ms || budget)); } catch (e) {
        if (!page) throw e; // in the worker: its onerror moves the work to the page
        delete jobs[best.n]; return true; // on the page: give up on that one rather than stall the rest
      }
      best.ms += Date.now() - t0;
      if (lv) { delete jobs[best.n]; post({ level: lv, ms: best.ms, tries: best.tries, steps: best.steps }); }
      return true;
    }
    function work() { if (once()) setTimeout(work, 0); else busy = false; }
    var h = function (m) {
      if (m.skip) skip = m.skip;
      // keep: the levels still wanted (the one being waited for and the next two); any other half-made job is dropped,
      // so a player who jumps elsewhere doesn't leave the phone making levels nobody asked for
      if (m.keep) for (var k in jobs) if (m.keep.indexOf(jobs[k].n) < 0) delete jobs[k];
      if (m.want) { if (!jobs[m.want]) { jobs[m.want] = TF.genStart(m.want, skip); jobs[m.want].ms = 0; } jobs[m.want].pri = m.pri || 0; }
      if (!page && !busy) { busy = true; setTimeout(work, 0); }
    };
    h.pump = once;
    return h;
  }
  function genGot(m) {
    var lv = m.level; if (!lv || genCache[lv.n]) return;
    genCache[lv.n] = lv; saveGen();
    genLog.push({ n: lv.n, ms: m.ms, tries: m.tries, steps: m.steps, where: GW && GW.worker ? 'worker' : 'page' });
    if (genWaiting === lv.n) { genWaiting = 0; startLevel(lv.n); }
  }
  function genLocal() { var h = TFGenHost(genGot, TF, 4, function () { return !!C; }, 7); h({ skip: bankSkip() }); return { send: h, worker: false, pump: h.pump }; }
  function genSetup() {
    if (GW) return;
    GW = { send: function (m) { (GW.q = GW.q || []).push(m); }, worker: false, q: [] }; // requests wait here until the worker is up
    var fallback = function () {
      var q = (GW && GW.q) || []; GW = genLocal(); q.forEach(function (m) { GW.send(m); });
      // a worker that broke mid-way loses its requests: ask again for what is needed now
      genNeed();
    };
    if (!window.Worker || !window.Blob || !window.fetch) { fallback(); return; }
    fetch('../../shared/cannon-es.min.js').then(function (r) { if (!r.ok) throw new Error('cannon'); return r.text(); }).then(function (txt) {
      var m = /export\s*\{([^}]*)\}\s*;?\s*$/.exec(txt); if (!m) throw new Error('cannon exports');
      var names = m[1].split(',').map(function (p) { var a = p.trim().split(/\s+as\s+/); return JSON.stringify(a[1] || a[0]) + ':' + a[0]; });
      var src = 'var CANNON = (function () {\n' + txt.slice(0, m.index) + '\nreturn {' + names.join(',') + '};\n})();\n' + TFMake.toString() +
        '\nvar TF = TFMake(); TF.use(CANNON);\nvar H = (' + TFGenHost.toString() + ')(function (m) { self.postMessage(m); }, TF, 240);\n' +
        'self.onmessage = function (e) { H(e.data); };\n';
      var url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' })), w = new Worker(url), q = GW.q || [];
      w.onmessage = function (e) { genGot(e.data); };
      w.onerror = function (e) { if (e && e.preventDefault) e.preventDefault(); w.terminate(); fallback(); }; // anything wrong in the worker: make levels here instead
      GW = { send: function (msg) { w.postMessage(msg); }, worker: w };
      GW.send({ skip: bankSkip() }); q.forEach(function (msg) { GW.send(msg); });
    }).catch(fallback);
  }
  // ask for what the player needs now: the level shown if it isn't made yet (pri 1: the player is waiting for it), and
  // the next two (pri 0: made ahead while this one is played, two so that one slow level to make, often a spinning
  // table, is ready in time after a quick one). Anything else still being made is dropped.
  function genNeed() {
    var want = [], keep = [];
    [[levelNo, 1], [levelNo + 1, 0], [levelNo + 2, 0]].forEach(function (w) { if (w[0] > BANK && w[0] <= MAXLV && !genCache[w[0]] && (w[1] === 0 || genWaiting === w[0])) { want.push(w); keep.push(w[0]); } });
    if (!want.length && !GW) return; // nothing past the bank yet: no worker needed
    genSetup(); GW.send({ keep: keep });
    want.forEach(function (w) { GW.send({ want: w[0], pri: w[1] }); });
  }

  // ================= helpers =================
  function $(id) { return document.getElementById(id); }
  function isOpen(id) { return $(id).classList.contains('show'); }
  function sheetOpen() { return isOpen('ovEnd') || isOpen('ovMenu') || isOpen('ovSettings') || isOpen('ovStats') || isOpen('ovHelp') || isOpen('ovLevels') || GoobsAds.isOpen(); }
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  // ================= the scene (scene.js) =================
  var host, canvas, renderer, scene, camera, raycaster, ready = false, SC = null;
  var geos = {}, pieceMeshes = [], ballMeshes = [], cannon = null, barrel = null, reticle = null, fx = [];
  function build() {
    SC = TFScene.build(T, canvas, TF, { fancy: settings.fancy });
    renderer = SC.renderer; scene = SC.scene; camera = SC.camera; cannon = SC.cannon; barrel = SC.barrel; reticle = SC.reticle; geos = SC.geos;
    raycaster = new T.Raycaster();
    resize();
  }
  function resize() {
    if (!SC) return;
    var r = host.getBoundingClientRect();
    // the free space: below the counters row at the top, above a strip at the bottom where the cannon sits
    var h2 = document.querySelector('.hud2'), top = h2 ? h2.getBoundingClientRect().bottom - r.top + 10 : 110;
    SC.resize(Math.max(10, r.width), Math.max(10, r.height), { top: Math.max(60, top), bottom: Math.round(r.height * 0.1), side: 14 });
  }

  // ================= game =================
  var sim = null, levelNo = 1, state = 'idle', endT = 0, acc = 0, lastT = 0, levelData = null, cannonAim = [0, 1.5, -8.5], recoil = 0;
  function clearScene() {
    pieceMeshes.forEach(function (m) { SC.table.remove(m); }); pieceMeshes = [];
    ballMeshes.forEach(function (m) { scene.remove(m.mesh); }); ballMeshes = [];
    fx.parts = [];
  }
  function startLevel(n) {
    levelNo = Math.max(1, Math.min(MAXLV, n | 0));
    meta.level = levelNo; saveMeta();
    levelData = levelAt(levelNo);
    if (!ready) { renderInfo(); return; }
    clearScene();
    // 1.8.0: a level past the bank that isn't made yet: say so and start it the moment it's ready
    if (!levelData) { sim = null; state = 'idle'; genWaiting = levelNo; genNeed(); making(true); renderInfo(); return; }
    genWaiting = 0; making(false);
    genNeed(); // make the next ones while this one is played
    sim = TF.create(levelData);
    SC.setStands(TF.standsOf(levelData)); SC.table.rotation.y = sim.theta;
    SC.fit(fitBox(levelData));
    var set = TF.themeOf(levelNo);
    sim.items.forEach(function (it) {
      var m = SC.pieceMesh(it.k, set);
      m.position.copy(it.b.position); m.quaternion.copy(it.b.quaternion); m.userData.item = it; it.mesh = m;
      m.scale.set(0.01, 0.01, 0.01); m.userData.pop = performance.now() + (it.b.position.y * 60 + Math.abs(it.b.position.x) * 25);
      SC.table.add(m); pieceMeshes.push(m);
    });
    state = 'play'; acc = 0; stats.tries++; saveStats();
    // say what's new about this stand
    var sk = TF.standKind(levelNo), msgs = [];
    if ((levelNo - 1) % 25 === 0 && levelNo > 1) msgs.push('New prizes: ' + TF.THEMES[set].name + (levelNo > 25 ? ', and heavier' : ''));
    if (sk === 'spin') msgs.push('The table spins!'); else if (sk === 'side' || sk === 'back') msgs.push(sk === 'back' ? 'Two tables: one high at the back!' : 'Two tables!');
    // 1.6.0: iron anchors, said on a level that has them when the one before didn't (no save needed)
    var prevLv = levelAt(levelNo - 1), hasA = TF.anchors(levelData.items), prevA = levelNo > 1 && prevLv ? TF.anchors(prevLv.items) : hasA;
    if (hasA && !prevA) msgs.push(hasA > 1 ? hasA + ' iron anchors: extra heavy!' : 'Iron anchor: extra heavy!');
    if (msgs.length) setTimeout(function () { toast(msgs.join(' \u00b7 ')); }, 400);
    aim = clampAimPt(aimHome()); showReticle();
    renderInfo();
  }
  // the points the camera must keep on screen (1.5.1): every platform (its top, trim and valance) and every piece; a
  // spinning table: its whole circle and everything that can turn round on it
  function fitBox(lv) {
    var pts = [], R = 0, yTop = 0;
    lv.items.forEach(function (it) { var K = TF.KINDS[it[0]]; yTop = Math.max(yTop, it[2] + K.hy); R = Math.max(R, Math.hypot(it[1], it[3]) + Math.max(K.hx, K.hz || K.hx)); });
    TF.standsOf(lv).forEach(function (st) {
      var yb = st.y - TF.PT - 0.42;
      if (st.r) { var r = Math.max(st.r + 0.08, R); for (var i = 0; i < 16; i++) { var a = i * Math.PI / 8, x = Math.cos(a) * r, z = Math.sin(a) * r; pts.push([x, st.y, z], [x, yb, z], [x, yTop, z]); } }
      else { var x0 = st.x - st.w / 2 - 0.1, x1 = st.x + st.w / 2 + 0.1, z0 = st.z - st.d / 2 - 0.1, z1 = st.z + st.d / 2 + 0.12;
        [[x0, z0], [x1, z0], [x0, z1], [x1, z1]].forEach(function (c) { pts.push([c[0], st.y, c[1]]); });
        pts.push([x0, yb, z1], [x1, yb, z1]); }
    });
    if (!lv.round) lv.items.forEach(function (it) { var K = TF.KINDS[it[0]], hz = K.hz || K.hx;
      [-1, 1].forEach(function (sx) { [-1, 1].forEach(function (sz) { pts.push([it[1] + sx * K.hx, it[2] + K.hy, it[3] + sz * hz]); }); }); });
    return pts;
  }
  function throwAt(p) {
    if (!sim || state !== 'play' || sim.ballsLeft <= 0) return false;
    if (sim.t - sim.lastShotT < 0.28) return false;
    var ball = TF.shoot(sim, p);
    if (!ball) return false;
    var m = SC.ballMesh(); ballPos(ball, m); scene.add(m);
    ballMeshes.push({ ball: ball, mesh: m });
    var w = TF.rot(p[0], p[2], sim.theta);
    cannonAim = [w[0] - TF.LAUNCH[0], p[1] - TF.LAUNCH[1] + 0.8, w[1] - TF.LAUNCH[2]]; recoil = 1;
    stats.throws++; saveStats();
    S.shoot(); puff(TF.LAUNCH[0], TF.LAUNCH[1], TF.LAUNCH[2] - 0.2, ['#ffffff', '#fff3c4'], 8, 1.2);
    renderInfo();
    return true;
  }
  // a ball on screen: it leaves the cannon where the cannon is and turns with the table as it gets there
  function ballPos(ball, m) {
    var f = Math.min(1, Math.max(0, (sim.t - ball.born) / (ball.flight || 0.3))), th = ball.theta + (sim.theta - ball.theta) * f, p = ball.b.position, q = TF.rot(p.x, p.z, th);
    m.position.set(q[0], p.y, q[1]);
  }
  function onEvents() {
    TF.takeEvents(sim).forEach(function (e) {
      if (e.t === 'hit') S.hit(e.k, e.v);
      else if (e.t === 'off') { stats.knocked++; S.off(); var p0 = e.item.b.position, q0 = TF.rot(p0.x, p0.z, sim.theta), p = { x: q0[0], z: q0[1] }; puff(p.x, Math.min(-0.4, p0.y), p.z, [PIECE_COL[e.k] || '#f0c27a', '#ffffff', '#ffc53d'], 5, 2.2); renderInfo(); }
    });
  }
  function checkEnd() {
    if (state !== 'play') return;
    if (TF.cleared(sim)) { state = 'won'; endT = performance.now(); saveStats(); setTimeout(won, 900); burst(); return; }
    if (sim.ballsLeft <= 0 && !TF.flying(sim) && (TF.settled(sim) || sim.t - sim.lastShotT > 6)) { state = 'lost'; saveStats(); setTimeout(lost, 500); }
  }
  // 1.6.0: levels 11+ give fewer spare balls, so 2 stars is "not the last ball or two" (the old rule gave 2 stars for
  // any clear there); the intro keeps the old rule
  function starsFor(used) { var bot = levelData.bot || 10; if (used <= bot + 1) return 3; return levelNo <= 10 ? (used <= bot + Math.ceil(bot * 0.3) + 2 ? 2 : 1) : (used <= Math.max(bot + 1, levelData.balls - 2) ? 2 : 1); }
  function won() {
    S.win(); stats.cleared++; meta.finished++; saveStats();
    var st = starsFor(sim.shots), before = meta.stars[levelNo] || 0;
    meta.stars[levelNo] = Math.max(before, st);
    if (meta.open <= levelNo) meta.open = Math.min(MAXLV, levelNo + 1);
    saveMeta();
    // 1.8.0: there is always a next level (no "last stand" card)
    showCard('Level ' + fmt(levelNo) + ' cleared!', '<div class="stars">' + [0, 1, 2].map(function (i) { return i < st ? '★' : '<span class="off">★</span>'; }).join('') + '</div>' +
      sim.shots + ' of ' + levelData.balls + ' balls used',
      [{ label: 'Next: level ' + fmt(levelNo + 1), red: true, go: function () { between(function () { startLevel(levelNo + 1); }); } }, { label: 'Play it again', go: function () { between(function () { startLevel(levelNo); }); } }]);
  }
  function lost() {
    S.lose(); meta.finished++; saveMeta(); saveStats();
    var n = TF.left(sim);
    showCard('Out of balls', n + (n === 1 ? ' piece is' : ' pieces are') + ' still on the stand.', [{ label: 'Try again', red: true, go: function () { between(function () { startLevel(levelNo); }); } }, { label: 'Pick a level', go: openLevels }]);
  }

  // ================= effects =================
  function puff(x, y, z, cols, n, sp) {
    if (!fx.parts) fx.parts = [];
    for (var i = 0; i < n && fx.parts.length < 160; i++) {
      var m = new T.Mesh(geos.confetti, new T.MeshBasicMaterial({ color: cols[i % cols.length], side: T.DoubleSide, transparent: true }));
      m.position.set(x, y, z); scene.add(m);
      fx.parts.push({ m: m, v: [(Math.random() - 0.5) * sp * 2, Math.random() * sp * 2 + 1, (Math.random() - 0.5) * sp], spin: [Math.random() * 8, Math.random() * 8], life: 0.9 + Math.random() * 0.5, t: 0 });
    }
  }
  function burst() { for (var i = 0; i < 5; i++) puff((i - 2) * 1.1, 0.5 + Math.random() * 1.5, 0, ['#e8354a', '#3a86ff', '#ffc53d', '#2ec27e', '#ffffff'], 14, 4); }
  function stepFx(dt) {
    if (!fx.parts) return;
    fx.parts = fx.parts.filter(function (p) {
      p.t += dt; p.v[1] -= 9 * dt;
      p.m.position.x += p.v[0] * dt; p.m.position.y += p.v[1] * dt; p.m.position.z += p.v[2] * dt;
      p.m.rotation.x += p.spin[0] * dt; p.m.rotation.y += p.spin[1] * dt;
      p.m.material.opacity = Math.max(0, 1 - p.t / p.life);
      if (p.t >= p.life) { scene.remove(p.m); p.m.material.dispose(); return false; }
      return true;
    });
  }

  // ================= loop =================
  function frame(tms) {
    requestAnimationFrame(frame);
    if (!ready) return;
    var dt = Math.min(0.1, lastT ? (tms - lastT) / 1000 : 0); lastT = tms;
    var paused = sheetOpen() || document.hidden;
    // no worker: levels past the bank are made here, a few ms a frame (more while the player is waiting for one)
    if (GW && GW.pump) GW.pump(state === 'play' ? 6 : 30);
    if (sim && !paused && state !== 'idle') {
      acc += dt; var n = 0;
      while (acc >= STEP && n < 3) { TF.step(sim, STEP); onEvents(); acc -= STEP; n++; }
      if (n === 3) acc = 0;
      checkEnd();
    }
    var now = performance.now();
    pieceMeshes = pieceMeshes.filter(function (m) {
      var it = m.userData.item, b = it.b;
      m.position.copy(b.position); m.quaternion.copy(b.quaternion);
      var s = m.scale.x;
      if (it.gone) { s -= dt * 3; if (s <= 0.02) { SC.table.remove(m); return false; } m.scale.set(s, s, s); }
      else if (s < 1 && now >= m.userData.pop) { s = Math.min(1, s + dt * 5); m.scale.set(s, s, s); }
      return true;
    });
    ballMeshes = ballMeshes.filter(function (bm) {
      ballPos(bm.ball, bm.mesh); bm.mesh.quaternion.copy(bm.ball.b.quaternion);
      if (bm.ball.gone) { var s = bm.mesh.scale.x - dt * 4; if (s <= 0.05) { scene.remove(bm.mesh); return false; } bm.mesh.scale.set(s, s, s); }
      return true;
    });
    if (!paused) stepFx(dt);
    // the cannon turns toward the aim and kicks back on a throw
    var ax = cannonAim[0], ay = cannonAim[1], az = cannonAim[2];
    var yaw = Math.atan2(-ax, -az), pitch = Math.atan2(ay, Math.hypot(ax, az));
    barrel.rotation.set(0, 0, 0); cannon.rotation.y += (yaw - cannon.rotation.y) * Math.min(1, dt * 14);
    barrel.rotation.x = pitch; recoil = Math.max(0, recoil - dt * 4); barrel.position.z = recoil * 0.35;
    if (sim) SC.table.rotation.y = sim.theta;
    SC.update(dt);
    if (reticle) { var mk = markT < 0 ? 1 : (now - markT) / 450; reticle.visible = state === 'play' && mk < 1; if (reticle.visible) { var sc = 1.3 + mk * 1.2; reticle.scale.set(sc, sc, sc); reticle.children.forEach(function (c) { c.material.transparent = true; c.material.opacity = 1 - mk; }); } }
    renderer.render(scene, camera);
  }

  // ================= touch to shoot =================
  // Touch the screen where you want the ball to go: it fires the moment your finger lands. A quick marker flashes
  // where you touched. The ball flies at the front of the piece you touched (or the spot in the air above the stand).
  var aim = [0, 1, 0], markT = -1;
  function clampAimPt(p) { p[0] = Math.max(-4.5, Math.min(4.5, p[0])); p[1] = Math.max(0.3, Math.min(8, p[1])); return p; }
  function aimHome() { return [0, 1, 0]; }
  function pointAt(clientX, clientY) {
    var r = canvas.getBoundingClientRect(), nx = (clientX - r.left) / r.width * 2 - 1, ny = -((clientY - r.top) / r.height * 2 - 1);
    raycaster.setFromCamera(new T.Vector2(nx, ny), camera);
    var live = pieceMeshes.filter(function (m) { return !m.userData.item.off; });
    var hit = raycaster.intersectObjects(live, true)[0];
    var th = sim ? sim.theta : 0, q;
    if (hit) { aim = clampAimPt([hit.point.x, hit.point.y, 0]); q = TF.rot(hit.point.x, hit.point.z, -th); return [q[0], Math.max(0.3, hit.point.y), q[1]]; }

  function showReticle() {

  function onDown(e) {

  }
  function onMove() {}
  function onUp() {}

  // ================= info and sheets =================
  // the small note while a level past the bank is still being made (only if the player got there first)
  function making(on) { var el = $('loading'); if (on) { el.textContent = 'Making the next level\u2026'; el.classList.remove('hide'); } else if (ready) el.classList.add('hide'); }
  function renderInfo() {
    var lv = levelData || levelAt(levelNo), balls = sim ? sim.ballsLeft : lv ? lv.balls : 0, left = sim ? TF.left(sim) : lv ? lv.items.length : 0, st = meta.stars[levelNo] || 0;
    $('lvPill').innerHTML = 'Level ' + fmt(levelNo) + (st ? '<small>' + '\u2605\u2605\u2605'.slice(0, st) + '</small>' : '');
    $('onStand').textContent = lv ? left + (left === 1 ? ' piece' : ' pieces') + ' left' : 'Making\u2026';
    var bl = $('ballsLeft'); bl.innerHTML = '<i></i>' + (lv ? balls : '\u2013'); bl.classList.toggle('low', !!lv && balls <= 3);
    // 1.8.0: no "of 500" any more: the furthest level reached instead
    $('menuInfo').innerHTML = 'Level <b>' + fmt(levelNo) + '</b> \u00b7 furthest <b>' + fmt(meta.open) + '</b> \u00b7 ' + (st ? '\u2605\u2605\u2605'.slice(0, st) + ' here' : 'not cleared yet');
  }
  var lvPage = -1, PAGE = 50;
  // 1.8.0: the list runs to 30 past the furthest level reached (at least the whole bank) and grows as you go. With many
  // pages only the first, the last and the ones near the page shown get a tab (at most about ten).
  function lvShown() { return Math.max(BANK, meta.open + 30, levelNo); }
  function openLevels(keepPage) {
    if (keepPage !== true) lvPage = -1;
    var top = lvShown(), pages = Math.ceil(top / PAGE); if (lvPage < 0 || lvPage >= pages) lvPage = Math.floor((levelNo - 1) / PAGE);
    var tabs = '<div class="lvpages">', lo = Math.max(1, Math.min(lvPage - 3, pages - 8)), hi = Math.min(pages - 2, lo + 6);
    for (var q = 0; q < pages; q++) {
      if (q > 0 && q < pages - 1 && (q < lo || q > hi)) continue;
      var a = q * PAGE + 1, b = Math.min(top, (q + 1) * PAGE); tabs += '<button data-p="' + q + '" class="' + (q === lvPage ? 'on' : '') + '"' + (a > meta.open ? ' disabled' : '') + '>' + fmt(a) + '\u2013' + fmt(b) + '</button>'; }
    tabs += '</div>';
    var h = '';
    for (var n = lvPage * PAGE + 1; n <= Math.min(top, (lvPage + 1) * PAGE); n++) {
      var st = meta.stars[n] || 0;
      var dg = String(n).length;
      h += '<button class="lv' + (dg >= 5 ? ' l' + Math.min(7, dg) : '') + (n === levelNo ? ' cur' : '') + '" data-n="' + n + '"' + (n > meta.open ? ' disabled' : '') + '>' + n + '<small>' + '\u2605\u2605\u2605'.slice(0, st) + '</small></button>';
    }
    $('lvpagesBox').innerHTML = tabs; $('lvgrid').innerHTML = h;
    $('ovLevels').classList.add('show');
  }
  var toastT = 0;
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('show'); }, 1500); }
  function showCard(title, html, buttons) {
    $('cardIcon').innerHTML = '<svg viewBox="0 0 100 100"><use href="#tf-logo"/></svg>';
    $('endTitle').textContent = title; $('endText').innerHTML = html;
    var box = $('endActions'); box.innerHTML = '';
    buttons.forEach(function (b) {
      var el = document.createElement('button'); el.className = 'btn' + (b.red ? ' red' : ''); el.textContent = b.label;
      el.addEventListener('click', function () { $('ovEnd').classList.remove('show'); b.go(); });
      box.appendChild(el);
    });
    $('ovEnd').classList.add('show');
  }
  function showAd(done) { GoobsAds.show({ onShow: function () { S.ding(); }, onStep: function () { S.sign(); } }, done); }
  function between(next) {
    if (Goobs.adsOn() && meta.finished > 0 && meta.finished % settings.adEvery === 0 && meta.lastAdAt !== meta.finished) {
      meta.lastAdAt = meta.finished; saveMeta(); next(); showAd(function () {}); return;
    }
    next();
  }
  function openHelp() {
    $('helpTitle').textContent = 'How to play Topple Fair';
    $('helpList').innerHTML = [
      'Knock <b>every piece</b> off the stand. Every 25 levels the prizes change (tin cans, milk bottles, soda pop, gifts, barrels, hardware, pumpkins, trophies).',
      '<b>Heavy pieces</b>: from level 11 everything gets heavier as you go (about three times as heavy by level 300), so one ball knocks less over. Hit low and square. Dark <b>iron anchors</b> with a yellow band are the heaviest of all: they may take a few hits.',
      'Some tables <b>spin</b>: pieces turn away from you, so pick your moment. Some levels have <b>two tables</b>, side by side or one high at the back.',
      '<b>Touch where you want the ball to go</b>: it fires right away at the spot you touch. Tap as fast as you like (a few throws a second).',
      'You have a set number of <b>balls</b> (top left). You can throw again before the pieces stop moving.',
      'Hit low to bring a stack down. Ice blocks are heavy, and pieces in the back row hide behind the front.',
      'A piece that lands on the grass is out. A piece left hanging on the edge still counts, so finish it off.',
      'Fewer balls earn more stars. Balls are tight: only a few to spare. The levels never run out: every level is checked first (a computer player cleared it twice with the same physics, within the balls you get). After level ' + BANK + ' new ones are made and checked on your phone while you play.'
    ].map(function (x) { return '<li>' + x + '</li>'; }).join('');
    $('ovHelp').classList.add('show');
  }
  function renderStats() {
    var stars = 0; for (var n in meta.stars) stars += meta.stars[n];
    $('statsBody').innerHTML = '<div class="tiles"><div class="tile"><b>' + Math.max(0, meta.open - 1) + '</b><span>Levels cleared</span></div><div class="tile"><b>' + stars + '</b><span>Stars</span></div><div class="tile"><b>' + stats.cleared + '</b><span>Wins</span></div></div>' +
      '<div class="tiles"><div class="tile"><b>' + fmt(stats.throws) + '</b><span>Balls thrown</span></div><div class="tile"><b>' + fmt(stats.knocked) + '</b><span>Knocked off</span></div><div class="tile"><b>' + fmt(stats.tries) + '</b><span>Tries</span></div></div>';
  }

  // ================= wiring =================
  function syncSound() {
    $('btnSound').innerHTML = '<svg viewBox="0 0 24 24"><use href="#i-sound-' + (settings.sound ? 'on' : 'off') + '"/></svg>';
    $('btnSound').classList.toggle('on', settings.sound); $('setSound').checked = settings.sound; S.setEnabled(settings.sound);
  }
  function syncAds() { $('setAds').checked = Goobs.adsOn(); $('adEvery').textContent = settings.adEvery; $('rowAdEvery').classList.toggle('off', !Goobs.adsOn()); }
  function sheet(btn, ov, close, onOpen) {
    if (btn) $(btn).addEventListener('click', function () { if (onOpen) onOpen(); $(ov).classList.add('show'); });
    $(close).addEventListener('click', function () { $(ov).classList.remove('show'); });
    $(ov).addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  }
  function inGame() { return sim && state === 'play' && sim.shots > 0; }
  function init() {
    Goobs.themePicker($('themes'));
    host = $('stage'); canvas = $('cv');
    canvas.addEventListener('pointerdown', onDown); canvas.addEventListener('pointermove', onMove); canvas.addEventListener('pointerup', onUp);
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) { document.addEventListener(ev, function () { S.unlock(); }, { passive: true }); });
    $('btnHome').addEventListener('click', function () { Goobs.home(); });
    $('btnAll').addEventListener('click', function () { Goobs.home(); });
    // the menu: open it from the top-right button; its buttons close it first
    $('btnMenu').addEventListener('click', function () { renderInfo(); $('ovMenu').classList.add('show'); });
    $('btnCloseMenu').addEventListener('click', function () { $('ovMenu').classList.remove('show'); });
    $('ovMenu').addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
    ['btnLevels', 'btnHelp', 'btnStats', 'btnSettings', 'btnNew'].forEach(function (id) { $(id).addEventListener('click', function () { $('ovMenu').classList.remove('show'); }, true); });
    $('btnNew').addEventListener('click', function () {
      if (inGame()) { showCard('Restart?', 'This stand starts over with all its balls.', [{ label: 'Restart', red: true, go: function () { startLevel(levelNo); } }, { label: 'Keep playing', go: function () {} }]); return; }
      startLevel(levelNo);
    });
    $('btnLevels').addEventListener('click', function () { openLevels(); });
    $('lvpagesBox').addEventListener('click', function (e) { var b = e.target.closest('button[data-p]'); if (!b || b.disabled) return; lvPage = +b.dataset.p; openLevels(true); });
    $('lvgrid').addEventListener('click', function (e) { var b = e.target.closest('button[data-n]'); if (!b) return; $('ovLevels').classList.remove('show'); startLevel(+b.dataset.n); });
    sheet(null, 'ovLevels', 'btnCloseLevels');
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings');
    sheet('btnStats', 'ovStats', 'btnCloseStats', renderStats);
    $('btnHelp').addEventListener('click', openHelp);
    function closeHelp() { $('ovHelp').classList.remove('show'); if (!meta.seen) { meta.seen = true; saveMeta(); } }
    $('btnCloseHelp').addEventListener('click', closeHelp);
    $('ovHelp').addEventListener('click', function (e) { if (e.target === this) closeHelp(); });
    $('btnSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncSound(); S.ding(); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); syncSound(); S.ding(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncAds(); });
    $('setFancy').checked = settings.fancy;
    $('setFancy').addEventListener('change', function () { settings.fancy = this.checked; saveSettings(); location.reload(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncAds(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncAds(); });
    var rq = 0, refit = function () { if (rq) return; rq = requestAnimationFrame(function () { rq = 0; resize(); }); };
    if (window.ResizeObserver) new ResizeObserver(refit).observe(host);
    window.addEventListener('resize', refit);
    syncSound(); syncAds();
    levelNo = meta.level; levelData = levelAt(levelNo); renderInfo();
    if (!levelData) { genWaiting = levelNo; genNeed(); } // reopened on a made level that was dropped: start making it now
    if (!meta.seen) openHelp();
    Goobs.markPlayed('topple');
    Goobs.initUpdates({ onVersions: function (v) { $('version').textContent = 'Topple Fair ' + (v.topple || '?') + ' · Goobs-Games ' + (v.shell || '?'); } });
    // three.js and the physics load from /shared (kept on the phone by the app)
    Promise.all([import('../../shared/three.module.min.js'), import('../../shared/cannon-es.min.js')]).then(function (m) {
      T = m[0]; C = m[1]; TF.use(C);
      build(); ready = true; $('loading').classList.add('hide');
      startLevel(levelNo);
      requestAnimationFrame(frame);
    }).catch(function () { $('loading').textContent = 'Couldn’t load the game. Check the connection once, then it works offline.'; });
  }

  // hook for automated tests
  window.__tf = { get sim() { return sim; }, get state() { return state; }, throwAt: throwAt, startLevel: startLevel, TF: TF, BANK: BANK, levelAt: levelAt, genLog: genLog, get gen() { return { worker: !!(GW && GW.worker), waiting: genWaiting, cached: Object.keys(genCache).map(Number) }; }, meta: function () { return meta; }, stats: function () { return stats; },
    fitPts: function () { return levelData ? fitBox(levelData) : null; }, bot: function () { if (!sim) return false; var t = TF.botTarget(sim); return t ? throwAt(t) : false; }, project: function (x, y, z) { var v = new T.Vector3(x, y, z).project(camera), r = canvas.getBoundingClientRect(); return [r.left + (v.x + 1) / 2 * r.width, r.top + (1 - v.y) / 2 * r.height]; }, get ready() { return ready; }, ring: function () { return aim; }, marker: function () { return { visible: !!(reticle && reticle.visible), age: markT < 0 ? -1 : performance.now() - markT }; } };

  init();
})();
