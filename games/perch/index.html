<script>
/* if Perch Pals can't open, say so on screen (never a blank page) and offer a fresh start */
(function () {
  var shown = false;
  function fail(msg) {
    if (shown || window.__ppReady) return; shown = true;
    function put() {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:#e6f5ff;color:#1b1f33;font:600 16px -apple-system,system-ui,sans-serif;text-align:center';
      d.innerHTML = '<b style="font-size:21px">Perch Pals didn’t open</b><div style="max-width:320px;opacity:.75;font-size:13px">' + String(msg).replace(/[<>&]/g, '') + '</div>';
      function btn(t, bg, go) { var b = document.createElement('button'); b.textContent = t; b.style.cssText = 'font:800 17px -apple-system,system-ui,sans-serif;padding:13px 24px;border-radius:14px;border:0;color:#fff;background:' + bg; b.onclick = go; d.appendChild(b); }
      btn('Start fresh', '#5a54f0', function () { try { localStorage.removeItem('perch.game'); } catch (e) { /* ignore */ } location.reload(); });
      btn('All games', '#6b7080', function () { location.href = '../../'; });
      document.body.appendChild(d);
    }
    if (document.body) put(); else document.addEventListener('DOMContentLoaded', put);
  }
  window.addEventListener('error', function (e) { fail((e.message || 'Something went wrong') + (e.lineno ? ' (line ' + e.lineno + ')' : '')); });
  setTimeout(function () { if (!window.__ppReady) fail('It took too long to start.'); }, 8000);
})();
</script>

/* Perch Pals styles (themes, UI kit and ad cards come from /shared/goobs.css).
   Full screen (kit overlay mode): the scene fills the phone edge to edge; the top row (back, Level and Moves-left pills,
   sound, Menu) and the helper buttons float on it; the branches are laid out in the free box between them (app.js fit()). */
.brand h1 { font-size: 22px; }
html.gg-fs-over, html.gg-fs-over body { background: #7cc8ff; }
.stagewrap { position: fixed; inset: 0; z-index: 0; }
.stage { position: absolute; inset: 0; overflow: hidden; touch-action: none; background: #9fd6ff; }
.stage canvas { position: absolute; left: 0; top: 0; display: block; width: 100%; height: 100%; touch-action: none; }
.stage #bg { pointer-events: none; }
.toast { position: absolute; z-index: 3; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 80px); transform: translateX(-50%); max-width: 92%; text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: rgba(20,24,36,.84); color: #fff; font-weight: 700; font-size: 14px; padding: 8px 14px; border-radius: 14px; }
.toast.show { opacity: 1; }
/* the top row pills: level (with a thin bar: sets flown of this level) and moves left */
.pills { flex: 1 1 auto; min-width: 0; display: flex; justify-content: center; gap: 6px; }
.pills .ggpill { position: relative; font-size: 17px; padding: 4px 13px 6px; line-height: 18px; min-width: 0; overflow: hidden; text-align: center; }
.pills button.ggpill { font-family: inherit; cursor: pointer; }
.pills .ggpill small { display: block; font-size: 10px; line-height: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; opacity: .6; }
.pills .ggpill i { font-style: normal; font-size: 13px; opacity: .6; }
.pills .ggpill .bar { position: absolute; left: 10px; right: 10px; bottom: 3px; height: 3px; border-radius: 2px; background: rgba(0,0,0,.1); overflow: hidden; }
.pills .ggpill .bar b { display: block; height: 100%; width: 0; background: #3fae4a; border-radius: 2px; transition: width .4s; }
.pills .ggpill.warn { background: #ffb020; color: #3a2400; }
.pills .ggpill.out { background: #ef3b4f; color: #fff; }
/* Restart / Undo / Shuffle / Branch float at the bottom, clear of the home bar */
html.gg-fs-over .toolbar { position: fixed; z-index: 5; left: calc(env(safe-area-inset-left, 0px) + 10px); right: calc(env(safe-area-inset-right, 0px) + 10px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); width: auto; max-width: 560px; margin: 0 auto; }
html.gg-fs-over .toolbar .tool { box-shadow: 0 4px 12px rgba(0,0,0,.18); }
html.gg-fs-over .toolbar .tool:not(.red) { background: rgba(255,255,255,.93); color: #1b2130; border-color: transparent; }
html.gg-fs-over .toolbar .tool:disabled { opacity: .55; }
.tool { position: relative; }
.tool .cnt { position: absolute; top: 4px; right: 8px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--gold); color: #3a2a00; font-style: normal; font-weight: 800; font-size: 12px; line-height: 20px; }
.tool.red .cnt { background: #ffffff; color: var(--accent); }
.cardicon svg { border-radius: 16px; }
.card .btn small { display: block; font-size: 12px; font-weight: 700; opacity: .8; }
.tippic { display: block; width: 240px; height: 120px; margin: 0 auto 6px; border-radius: 16px; background: linear-gradient(#9fd6ff, #dff3ff); }
.helplist canvas { display: block; margin: 6px 0 2px; border-radius: 12px; }
.statsnote { color: var(--muted); text-align: center; margin: 4px 0 0; }

<script>
/* Perch Pals rules, solver and level maker (no DOM; runs in Node for tools/gen.js and tools/check.js).
   A level is a set of branches. Each branch lists its birds from the trunk (index 0) out to the free end (last);
   the end bird is the one you can pick. Every colour has exactly `cap` birds, and a branch holds `cap` birds, so a
   full branch of one colour is a set: those birds fly away and the branch is empty again. Clear every bird to win.
   A move: tap a branch, the run of same-colour birds at its free end is picked; tap another branch: as many as fit fly
   there, if it is empty or its end bird is the same colour.
   Twists (each modelled here and by the solver):
     sleepy birds  - colour hidden (grey, eyes shut) until the bird is the end bird; then it wakes up. A sleeping bird
                     stops a run (you can't pick what you can't see). A full branch of one colour still flies (they wake).
     big branches  - a level whose branches hold 5 or 6 (and 5 or 6 birds of each colour).
     cages         - a caged bird can't be picked, and nothing can land on it, until the cage opens after N moves
                     (moves on the board: an undo closes it again). Birds above it move normally.
     leafy branch  - covered in leaves until N sets have flown away: nothing can be picked from it or land on it.
   Cells are small ints: colour (0..13) | 16 if asleep | (cage opens at move t) << 5.
   Level strings: branches joined by '.', '~N' at a branch's start = leafy (needs N sets), a letter a-n per bird
   (trunk first), UPPERCASE = asleep, '#t' after a letter = caged until move t. Example: "abCd.~1bbca.da#6c.." */
var PP = (function () {
  'use strict';
  var HID = 16, MAXC = 14;
  function col(x) { return x & 15; }
  function hid(x) { return (x & HID) !== 0; }
  function cageT(x) { return x >> 5; }

  // ---------------- level strings ----------------
  function parse(str) {
    var br = [], leaf = [];
    str.split('.').forEach(function (s) {
      var cells = [], i = 0, need = 0;
      if (s.charAt(0) === '~') { i = 1; var d = ''; while (/[0-9]/.test(s.charAt(i))) d += s.charAt(i++); need = +d || 1; }
      for (; i < s.length; i++) {
        var ch = s.charAt(i), lo = ch.toLowerCase(), c = lo.charCodeAt(0) - 97, v = c | (ch !== lo ? HID : 0);
        if (s.charAt(i + 1) === '#') { var t = ''; i += 2; while (/[0-9]/.test(s.charAt(i))) t += s.charAt(i++); i--; v |= (+t) << 5; }
        cells.push(v);
      }
      br.push(cells); leaf.push(need);
    });
    return { br: br, leaf: leaf };
  }
  function serial(br, leaf) {
    return br.map(function (b, i) {
      return (leaf && leaf[i] ? '~' + leaf[i] : '') + b.map(function (v) {
        var ch = String.fromCharCode(97 + col(v)); if (hid(v)) ch = ch.toUpperCase();
        return ch + (cageT(v) ? '#' + cageT(v) : '');
      }).join('');
    }).join('.');
  }
  function colours(br) { var m = 0; br.forEach(function (b) { b.forEach(function (v) { if (col(v) + 1 > m) m = col(v) + 1; }); }); return m; }
  function birds(br) { var n = 0; br.forEach(function (b) { n += b.length; }); return n; }
  function capOf(br) { return Math.max(1, Math.round(birds(br) / Math.max(1, colours(br)))); }
  // the move limit: the solver's count plus a little slack (Splash Sort's rule), and a Continue's bonus
  function limitFor(m) { return m + Math.max(3, Math.ceil(m * 0.2)); }
  function bonusFor(limit) { return Math.max(8, Math.ceil(limit * 0.25)); }

  // ---------------- the rules (on any object with br, leaf, cap, used, flown) ----------------
  function open(s, i) { return (s.leaf[i] || 0) <= s.flown; }
  function locked(s, v) { return cageT(v) > s.used; }
  function endOf(b) { return b.length ? b[b.length - 1] : -1; }
  // how many birds at the free end of branch i can be picked
  function run(s, i) {
    var b = s.br[i]; if (!b.length || !open(s, i)) return 0;
    var e = b[b.length - 1]; if (hid(e) || locked(s, e)) return 0;
    var c = col(e), n = 0;
    for (var k = b.length - 1; k >= 0; k--) { var v = b[k]; if (col(v) !== c || hid(v) || locked(s, v)) break; n++; }
    return n;
  }
  // how many birds a move a -> b would carry (0 = not allowed)
  function canMove(s, a, b) {
    if (a === b || a < 0 || b < 0 || a >= s.br.length || b >= s.br.length) return 0;
    var n = run(s, a); if (!n) return 0;
    var B = s.br[b]; if (!open(s, b) || B.length >= s.cap) return 0;
    if (B.length) { var e = B[B.length - 1]; if (locked(s, e) || hid(e) || col(e) !== col(endOf(s.br[a]))) return 0; }
    return Math.min(n, s.cap - B.length);
  }
  function full(s, b) { if (b.length !== s.cap) return false; var c = col(b[0]); for (var i = 1; i < b.length; i++) if (col(b[i]) !== c) return false; return true; }
  // apply a move (already checked): returns what happened, for the animation
  function apply(s, a, b, n) {
    var A = s.br[a], B = s.br[b], c = col(endOf(A));

<script>
/* Perch Pals app: layout (branches on two trunks), drawing (scene, birds, flights, flocks flying away), taps,

(function () {
  'use strict';

  // ================= storage =================

  function saveSettings() { store.set('settings', settings); }
  var meta = store.get('meta', null) || {};
  var MD = { level: 1, seen: false, finished: 0, lastAdAt: 0, tips: {} };
  for (var mk in MD) if (meta[mk] === undefined || meta[mk] === null) meta[mk] = MD[mk];
  if (!(meta.level >= 1)) meta.level = 1;
  if (typeof meta.tips !== 'object') meta.tips = {};
  function saveMeta() { store.set('meta', meta); }
  var stats = store.get('stats', null) || {};
  ['cleared', 'sets', 'moves', 'undos', 'branches', 'shuffles', 'conts', 'restarts'].forEach(function (k) { if (typeof stats[k] !== 'number') stats[k] = 0; });
  function saveStats() { store.set('stats', stats); }

  // ================= helpers =================
  function $(id) { return document.getElementById(id); }
  function isOpen(id) { return $(id).classList.contains('show'); }
  function sheetOpen() { return isOpen('ovEnd') || isOpen('ovSettings') || isOpen('ovStats') || isOpen('ovHelp') || isOpen('ovTip') || isOpen('ggMenu') || GoobsAds.isOpen(); }
  function fmt(n) { return (n || 0).toLocaleString(); }
  var made = {};
  function entryFor(n) { if (n <= PP.BANK.length) return PP.BANK[n - 1]; return made[n] || (made[n] = PP.levelBeyond(n)); }
  function now() { return performance.now(); }

  // ================= game =================
  var g = null, levelNo = 1, sel = -1, ending = false;
  var flights = [], flocks = [], parts = [], arrive = {}, hops = {}, wakes = {}, cageOpenT = {}, leafOpenT = {}, shakes = {}, pendingCheck = false, pendingWin = false, shuffleT = 0;
  function resetFx() { flights = []; flocks = []; arrive = {}; hops = {}; wakes = {}; cageOpenT = {}; leafOpenT = {}; shakes = {}; sel = -1; pendingCheck = false; pendingWin = false; }
  function startLevel(n) {
    levelNo = n; meta.level = n; saveMeta();
    var e = entryFor(n);

  function save() { if (g && !ending) store.set('game', g); }

    if (r.start !== entryFor(r.level)[0] || !(r.cap >= 1) || !(r.limit > 0) || !Array.isArray(r.hist)) return false;
    if (r.br.length !== r.leaf.length || !r.br.every(function (b) { return Array.isArray(b) && b.length <= r.cap; }) || PP.solved(r)) return false;

  }
  function busy(i) {

    return false;

  function animating() { var t = now(); return flights.length > 0 || flocks.some(function (f) { return t < f.tGo + 250; }); }

  }
  function addBranch() {
    if (!g || ending || sheetOpen()) return;

    var i = g.br.length - 1, p = slotPos(i, 0); for (var k = 0; k < 16; k++) parts.push({ x: p.x + Math.random() * L.bl * L.br[i].dir, y: p.y, vx: (Math.random() - 0.5) * 2, vy: -1 - Math.random() * 2, life: 50, t: 0, c: ['#3fae4a', '#5cc85a', '#ffffff'][k % 3], r: 2 + Math.random() * 2.5, g: 0.06 });
    toast('A new branch grew!'); pendingCheck = true;
  }
  function shuffle() {
    if (!g || ending || animating() || sheetOpen()) return;
    if (g.shuf <= 0) { toast('One shuffle per level'); S.nope(); return; }
    if (!PP.shuffle(g)) { toast('These birds can’t be mixed any better right now'); S.nope(); return; }
    stats.shuffles++; saveStats(); resetFx(); shuffleT = now(); S.shuffle(); save(); renderInfo();
    g.br.forEach(function (b, i) { b.forEach(function (v, k) { var p = slotPos(i, k); for (var q = 0; q < 2; q++) parts.push({ x: p.x, y: p.y - L.s * 0.5, vx: (Math.random() - 0.5) * 3, vy: -Math.random() * 2.5, life: 36, t: 0, c: PA.COLORS[PP.col(v)], r: 1.8 + Math.random() * 2, g: 0.1, feather: true }); }); });
    pendingCheck = true;

  // ================= layout =================
  // the canvases cover the whole screen; FR = the free box between the floating top row and the helper buttons.
  // Branches alternate left / right, top to bottom; birds on left branches face right (in), on right branches face left.
  var cv, cx, bg, bx, W = 300, H = 400, DPR = 1, FR = { x: 0, y: 0, w: 300, h: 400 };
  var L = { s: 30, sp: 30, bl: 120, rowH: 60, y0: 0, tw: 24, tl: 12, tr: 288, br: [] };
  function fit() {

    var tp = document.querySelector('.top').getBoundingClientRect(), tb = document.querySelector('.toolbar').getBoundingClientRect();
    var y0 = Math.max(0, tp.bottom - r.top) + 8, y1 = (tb.height ? tb.top - r.top : H) - 6;

  function layout() {
    if (!g) return;

    var tw = Math.max(18, Math.min(40, W * 0.07)), gapHalf = 10;

    var rowH = Math.min(FR.h / rows, s * 2.15), y0 = FR.y + (FR.h - rowH * rows) / 2;

  }

  function hit(px, py) {

  function newScene() { PA.setLevel(levelNo, g.nc); sceneNo = Math.floor((levelNo - 1) / 3) % PA.SCENES.length; layout(); drawBg(); PA.fxInit(sceneNo, W, H, Goobs.skin()); }
  // the still layer: scene, trunks, branches

  // ================= drawing =================

    var sc = PA.SCENES[sceneNo];
    // birds on their branches
    for (var i = 0; i < g.br.length; i++) {
      var b = g.br[i], run = i === sel ? PP.run(g, i) : 0;
      for (var k = 0; k < b.length; k++) {
        var ar = arrive[i + ':' + k]; if (ar && t < ar) continue; // still flying in
        drawBirdAt(i, k, b[k], t, k >= b.length - run ? { lift: true } : null);
      }
      // leaves over a covered branch (and blowing away when they clear)
      var B = L.br[i];
      if (g.leaf[i]) {
        var open = PP.open(g, i), lo = leafOpenT[i];
        if (!open) PA.leafCover(cx, B.x0, B.x1, B.y, L.s, g.leaf[i] - g.flown, 1, sc, t / 1000);
        else if (lo && t < lo) PA.leafCover(cx, B.x0, B.x1, B.y, L.s, 0, 1, sc, t / 1000);
        else if (lo && t - lo < 700) PA.leafCover(cx, B.x0, B.x1, B.y, L.s, 0, 1 - (t - lo) / 700, sc, t / 1000);
      }
    }
    // flocks: a finished set sits, sings with a happy hop, then flies off the screen together
    flocks.forEach(function (f) {
      var B = L.br[f.b]; if (!B) return;
      f.cols.forEach(function (v, k) {
        var p = slotPos(f.b, k), ar = arrive[f.b + ':' + k];
        if (k >= f.d0 && ar && t < ar) return;
        var o = { face: p.face, sym: settings.symbols, happy: t > f.tSing };
        if (t < f.tGo) { if (t > f.tSing) o.hop = Math.abs(Math.sin((t - f.tSing) / 130 + k * 0.6)) * 0.55; PA.bird(cx, p.x, p.y, L.s, PP.col(v), o); return; }
        var u = (t - f.tGo - k * 70) / 1300; if (u < 0) { o.hop = 0.3; PA.bird(cx, p.x, p.y, L.s, PP.col(v), o); return; }
        if (u > 1) return;
        var e = u * u, x = p.x + f.dir * (W * 0.15 + k * L.s * 0.3) * e - f.dir * W * 0.05 * Math.sin(u * Math.PI), y = p.y - (H * 0.9) * e - Math.sin(u * Math.PI) * L.s;
        o.fly = true; o.flap = 0.5 + 0.5 * Math.sin(t / 45 + k); o.tilt = -0.25 * f.dir; o.face = f.dir; o.happy = false;
        PA.bird(cx, x, y, L.s * (1 - u * 0.2), PP.col(v), o);
      });
    });
    // birds in the air
    flights.forEach(function (f) {
      var Q = slotPos(f.b, f.k1), P = f.P, u = (t - f.t0) / f.dur;
      if (u < 0) { PA.bird(cx, P.x, P.y, L.s, f.c, { face: P.face, hop: 0.3, sym: settings.symbols }); return; }
      u = Math.min(1, u); var e = ease(u);
      var mx = (P.x + Q.x) / 2, my = Math.min(P.y, Q.y) - L.s * 1.2 - Math.abs(Q.x - P.x) * 0.18;
      var x = (1 - e) * (1 - e) * P.x + 2 * (1 - e) * e * mx + e * e * Q.x, y = (1 - e) * (1 - e) * P.y + 2 * (1 - e) * e * my + e * e * Q.y;
      var face = Math.abs(Q.x - P.x) > 2 ? (Q.x > P.x ? 1 : -1) : Q.face;
      if (u > 0.85) face = Q.face;
      PA.bird(cx, x, y, L.s, f.c, { face: face, fly: u < 0.92, flap: 0.5 + 0.5 * Math.sin(t / 38 + f.j), tilt: u < 0.5 ? -0.15 : 0.1, sym: settings.symbols });
    });
    drawParts();
  }
  // ================= particles =================
  function confetti() { parts.push({ x: Math.random() * W, y: -10 - Math.random() * H * 0.4, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3, life: 170, t: 0, c: PA.COLORS[Math.floor(Math.random() * PA.COLORS.length)], r: 3 + Math.random() * 3, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, flake: true, g: 0.03 }); }
  function feathers(i, col) { var p = slotPos(i, 1); for (var k = 0; k < 12; k++) parts.push({ x: p.x + (Math.random() - 0.5) * L.bl * 0.6, y: p.y - L.s * 0.5, vx: (Math.random() - 0.5) * 2.4, vy: -1 - Math.random() * 2, life: 70, t: 0, c: k % 3 ? col : '#ffffff', r: 2 + Math.random() * 2.5, g: 0.05, feather: true, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.2 }); }
  function burstLeaves(i) { var B = L.br[i]; if (!B) return; for (var k = 0; k < 22; k++) parts.push({ x: B.x0 + B.dir * Math.random() * L.bl, y: B.y - L.s * Math.random() * 0.8, vx: B.dir * (1 + Math.random() * 3), vy: -1 - Math.random() * 2, life: 80, t: 0, c: ['#2f8a3a', '#3fa84a', '#56c25b'][k % 3], r: 3 + Math.random() * 3, g: 0.04, feather: true, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3 }); }
  function stepParts() { parts = parts.filter(function (p) { p.t++; p.x += p.vx; p.y += p.vy; p.vy += p.g || 0.12; if (p.flake || p.feather) { p.vx *= 0.985; p.rot = (p.rot || 0) + (p.vr || 0); } return p.t < p.life && p.y < H + 20; }); }
  function drawParts() {
    parts.forEach(function (p) {
      cx.globalAlpha = Math.max(0, 1 - p.t / p.life); cx.fillStyle = p.c;
      if (p.flake) { cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillRect(-p.r, -p.r * 0.5, p.r * 2, p.r); cx.restore(); }
      else if (p.feather) { cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot || 0); cx.beginPath(); cx.ellipse(0, 0, p.r * 1.6, p.r * 0.7, 0, 0, Math.PI * 2); cx.fill(); cx.restore(); }
      else { cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, Math.PI * 2); cx.fill(); }
    });
    cx.globalAlpha = 1;
  }

  // ================= loop =================
  var lastT = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    var dt = lastT ? Math.min(60, t - lastT) : 16; lastT = t;
    // landings: a chirp, and the neighbour hops
    flights = flights.filter(function (f) {
      if (t < f.t0 + f.dur) return true;
      S.land(f.c, f.j); hops[f.b + ':' + (f.k1 - 1)] = t; hops[f.b + ':' + f.k1] = t + 40;
      return false;
    });
    flocks = flocks.filter(function (f) {
      if (!f.sung && t >= f.tSing) { f.sung = true; S.song(PP.col(f.cols[0])); }
      if (!f.gone && t >= f.tGo) { f.gone = true; feathers(f.b, PA.COLORS[PP.col(f.cols[0])]); }
      return t < f.tGo + 70 * f.cols.length + 1400;
    });
    stepParts(); draw(t, dt); settle();
  }

  // ================= info, cards, sheets =================
  function renderInfo() {
    if (!g) return;
    var left = PP.movesLeft(g), pm = $('pillMoves');
    $('pillLevel').innerHTML = '<small>Level</small>' + fmt(levelNo) + '<span class="bar"><b style="width:' + Math.round(100 * g.flown / Math.max(1, g.nc)) + '%"></b></span>';
    pm.innerHTML = '<small>Moves left</small>' + Math.max(0, left) + '<i> / ' + g.limit + '</i>';
    pm.classList.toggle('warn', left > 0 && left <= Math.max(3, Math.round(g.limit * 0.1)));
    pm.classList.toggle('out', left <= 0);
    $('undoCnt').textContent = g.undos; $('branchCnt').textContent = g.extra; $('shufCnt').textContent = g.shuf;
    $('btnUndo').disabled = g.undos <= 0; $('btnBranch').disabled = g.extra <= 0; $('btnShuffle').disabled = g.shuf <= 0;
  }
  var toastT = 0;
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('show'); }, 2300); }
  function showCard(title, html, buttons) {
    $('cardIcon').innerHTML = '<svg viewBox="0 0 100 100"><use href="#pp-logo"/></svg>';
    $('endTitle').textContent = title; $('endText').innerHTML = html;
    var box = $('endActions'); box.innerHTML = '';
    buttons.forEach(function (b) { var el = document.createElement('button'); el.className = 'btn' + (b.red ? ' red' : ''); el.textContent = b.label;
      if (b.sub) { var sm = document.createElement('small'); sm.textContent = b.sub; el.appendChild(sm); } el.addEventListener('click', function () { $('ovEnd').classList.remove('show'); b.go(); }); box.appendChild(el); });
    $('ovEnd').classList.add('show');
  }
  function showAd(done) { GoobsAds.show({ onShow: function () { S.ding(); }, onStep: function () { S.sign(); } }, done); }
  function between(next) {
    if (Goobs.adsOn() && meta.finished > 0 && meta.finished % settings.adEvery === 0 && meta.lastAdAt !== meta.finished) { meta.lastAdAt = meta.finished; saveMeta(); next(); showAd(function () {}); return; }
    next();
  }
  // ---- twist tips: one line the first time each twist shows up ----
  var TIPS = {
    sleepy: ['Sleepy birds', 'Birds with tucked heads are fast asleep: their species is hidden and they can’t move yet. They wake up when they reach the end of their branch.'],
    big: ['Bigger branches', 'These branches hold more birds, and each species has that many birds. A full branch of one species flies away.'],
    cage: ['Caged birds', 'A caged bird can’t move and nobody can land on it. The number counts the moves until the cage opens (birds above it move as usual).'],
    leaves: ['Leafy branch', 'A branch hidden in leaves can’t be used until the number of sets on it have flown away. Then the leaves blow off.']
  };
  var tipQueue = [];
  function tipsFor() {
    if (!g) return;
    var tw = PP.twistsOf(g.start); tipQueue = [];
    if (tw.sleepy) tipQueue.push('sleepy'); if (g.cap > 4) tipQueue.push('big'); if (tw.cages) tipQueue.push('cage'); if (tw.leaves) tipQueue.push('leaves');
    tipQueue = tipQueue.filter(function (k) { return !meta.tips[k]; });
    nextTip();
  }
  function nextTip() {
    if (!tipQueue.length || !meta.seen) return;
    var k = tipQueue.shift(); meta.tips[k] = 1; saveMeta();
    $('tipTitle').textContent = 'New: ' + TIPS[k][0]; $('tipText').textContent = TIPS[k][1];
    var c = $('tipPic'), x = c.getContext('2d'), d = 2; c.width = 240 * d; c.height = 120 * d; x.setTransform(d, 0, 0, d, 0, 0); x.clearRect(0, 0, 240, 120);
    var sc = PA.SCENES[0]; PA.branch(x, 12, 228, 96, 6, 1, sc, 2);
    var s = 44, xs = [52, 96, 140, 184];
    if (k === 'sleepy') { PA.bird(x, xs[0], 93, s, 3, { face: 1 }); PA.bird(x, xs[1], 93, s, 7, { face: 1, sleepy: true, t: 0.3 }); PA.bird(x, xs[2], 93, s, 7, { face: 1, sleepy: true, t: 0.9 }); PA.bird(x, xs[3], 93, s, 0, { face: 1 }); }
    else if (k === 'big') { [40, 76, 112, 148, 184].forEach(function (px) { PA.bird(x, px, 93, 40, 6, { face: 1, happy: px === 184 }); }); }
    else if (k === 'cage') { PA.bird(x, xs[0], 93, s, 1, { face: 1 }); PA.bird(x, xs[1], 93, s, 5, { face: 1 }); PA.bird(x, xs[2], 93, s, 8, { face: 1 }); PA.cage(x, xs[2], 93, s, 4, 1); }
    else { PA.bird(x, xs[0], 93, s, 2, { face: 1 }); PA.bird(x, xs[1], 93, s, 10, { face: 1 }); PA.bird(x, xs[2], 93, s, 4, { face: 1 }); PA.leafCover(x, 20, 220, 96, s, 1, 1, sc, 0); }
    $('ovTip').classList.add('show');
  }
  function openHelp() {
    $('helpList').innerHTML = [
      '<b>Tap a branch</b> to pick up the birds at its free end (all the same species in a row). <b>Tap another branch</b> and they fly over.',
      'Birds only land on an <b>empty branch</b> or next to a bird of the <b>same species</b>, and only as many as there is room for.',
      'When a branch is <b>full of one species</b>, that little flock sings and <b>flies away</b>, and the branch is free again. Clear every bird to finish the level.',
      'Each level has a <b>move limit</b> (top: moves left). It is a little more than our solver needed, so it can always be done. An <b>Undo</b> gives its move back. Out of moves? <b>Continue</b> with extra moves after a short ad (twice per try), or <b>Restart</b>.',
      'Helpers on every level: <b>Undo</b> (5), <b>Branch</b> (one extra branch), <b>Shuffle</b> (mixes the birds again into a mix that can still be solved), and <b>Restart</b>. Every level is checked to be solvable.',
      'Later on: <b>sleepy birds</b> (tucked heads, species hidden until they reach the end), <b>bigger branches</b> (5 or 6), <b>caged birds</b> (open after a few moves) and <b>leafy branches</b> (open when sets fly away).',
      'Settings: <b>Colour symbols</b> put a small matching shape on each species. Each species has its own feather pattern and shape. Cardinals and blue jays visit occasionally; bald eagles are rare.',
      '500 levels are built in, then new ones are made on the phone, without end.'
    ].map(function (x) { return '<li>' + x + '</li>'; }).join('');
    $('ovHelp').classList.add('show');
  }
  function renderStats() {
    $('statsBody').innerHTML = '<div class="tiles"><div class="tile"><b>' + fmt(stats.cleared) + '</b><span>Levels cleared</span></div><div class="tile"><b>' + fmt(stats.sets) + '</b><span>Flocks flown</span></div><div class="tile"><b>' + fmt(stats.moves) + '</b><span>Moves</span></div></div>' +
      '<div class="tiles"><div class="tile"><b>' + fmt(stats.undos) + '</b><span>Undos</span></div><div class="tile"><b>' + fmt(stats.branches) + '</b><span>Branches added</span></div><div class="tile"><b>' + fmt(stats.shuffles) + '</b><span>Shuffles</span></div></div>' +
      '<div class="tiles"><div class="tile"><b>' + fmt(stats.conts) + '</b><span>Continues</span></div><div class="tile"><b>' + fmt(stats.restarts) + '</b><span>Restarts</span></div><div class="tile"><b>' + fmt(meta.level) + '</b><span>Next level</span></div></div>';
  }

  // ================= wiring =================
  function syncSound() { $('btnSound').innerHTML = '<svg viewBox="0 0 24 24"><use href="#i-sound-' + (settings.sound ? 'on' : 'off') + '"/></svg>'; $('btnSound').classList.toggle('on', settings.sound); $('setSound').checked = settings.sound; S.setEnabled(settings.sound); }
  function syncAds() { $('setAds').checked = Goobs.adsOn(); $('adEvery').textContent = settings.adEvery; $('rowAdEvery').classList.toggle('off', !Goobs.adsOn()); }
  function sheet(btn, ov, close, onOpen) {
    if (btn) $(btn).addEventListener('click', function () { if (onOpen) onOpen(); $(ov).classList.add('show'); });
    $(close).addEventListener('click', function () { $(ov).classList.remove('show'); });
    $(ov).addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  }
  function init() {
    Goobs.fullscreen({ overlay: true, menu: ['btnHelp', 'btnStats', 'btnSettings'], info: function () {
      if (!g) return '';
      return '<b>Level ' + fmt(g.level) + '</b> · ' + g.used + ' of ' + g.limit + ' moves · ' + g.flown + ' of ' + g.nc + ' flocks flown · ' + PA.SCENES[sceneNo].name;
    } });
    Goobs.themePicker($('themes'));
    Goobs.onTheme(function () { drawBg(); PA.fxInit(sceneNo, W, H, Goobs.skin()); });
    cv = $('cv'); cx = cv.getContext('2d'); bg = $('bg'); bx = bg.getContext('2d');
    cv.addEventListener('pointerdown', function (e) { var r = cv.getBoundingClientRect(); tap(hit(e.clientX - r.left, e.clientY - r.top)); e.preventDefault(); });
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) { document.addEventListener(ev, function () { S.unlock(); }, { passive: true }); });
    $('btnHome').addEventListener('click', function () { save(); Goobs.home(); });
    $('btnRestart').addEventListener('click', function () { if (!g || ending) return; if (g.hist.length || g.extra < 1 || g.shuf < 1) showCard('Restart this level?', 'The birds go back to where they started.', [{ label: 'Restart', red: true, go: restart }, { label: 'Keep playing', go: function () {} }]); });
    $('btnUndo').addEventListener('click', undo);
    $('btnBranch').addEventListener('click', addBranch);
    $('btnShuffle').addEventListener('click', shuffle);
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings');
    sheet('btnStats', 'ovStats', 'btnCloseStats', renderStats);
    function closeHelp() { $('ovHelp').classList.remove('show'); if (!meta.seen) { meta.seen = true; saveMeta(); nextTip(); } }
    $('btnHelp').addEventListener('click', openHelp);
    $('btnCloseHelp').addEventListener('click', closeHelp);
    $('ovHelp').addEventListener('click', function (e) { if (e.target === this) closeHelp(); });
    $('pillLevel').addEventListener('click', openHelp);
    function closeTip() { $('ovTip').classList.remove('show'); setTimeout(nextTip, 200); }
    $('btnTip').addEventListener('click', closeTip);
    $('ovTip').addEventListener('click', function (e) { if (e.target === this) closeTip(); });
    $('btnSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncSound(); S.ding(); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); syncSound(); S.ding(); });
    $('setMusic').checked = settings.music;
    $('setMusic').addEventListener('change', function () { settings.music = this.checked; saveSettings(); S.setMusic(settings.music); });
    $('setSymbols').checked = settings.symbols;
    $('setSymbols').addEventListener('change', function () { settings.symbols = this.checked; saveSettings(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncAds(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncAds(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncAds(); });
    if (window.ResizeObserver) { var ro = new ResizeObserver(fit); ro.observe($('stagewrap')); ro.observe(document.querySelector('.toolbar')); ro.observe(document.querySelector('.top')); }
    window.addEventListener('resize', fit);
    document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });
    window.addEventListener('pagehide', save);
    syncSound(); syncAds(); if (settings.music) S.setMusic(true);
    fit();
    if (!load()) startLevel(meta.level);
    fit();
    if (!meta.seen) openHelp();
    requestAnimationFrame(frame);
    window.__ppReady = true;
    PA.ready.then(function(){ fit(); }).catch(function(){});
    Goobs.markPlayed('perch');
    Goobs.initUpdates({ beforeReload: save, onVersions: function (v) { $('version').textContent = 'Perch Pals ' + (v.perch || '1.0.0') + ' · Goobs-Games ' + (v.shell || '?'); } });
  }
  // hook for automated tests
  window.__perch = { get g() { return g; }, tap: tap, hit: hit, slotPos: slotPos, startLevel: startLevel, undo: undo, addBranch: addBranch, shuffle: shuffle, restart: restart, outOfMoves: outOfMoves,
    solution: function () { return g ? PP.shortSolveState({ br: g.br, leaf: g.leaf, cap: g.cap, used: g.used, flown: g.flown }, 10, 150000, g.level) : null; }, check: function () { pendingCheck = true; }, ending: function () { return ending; }, busy: function () { return animating(); }, get L() { return L; }, get FR() { return FR; }, meta: function () { return meta; }, stats: function () { return stats; },
    // the screen point to tap for branch i (middle of its free birds area, in client coordinates)
    point: function (i) { var b = L.br[i], r = cv.getBoundingClientRect(); return { x: r.left + (b.x0 + b.x1) / 2, y: r.top + b.y - L.s * 0.5 }; }, PP: PP };
  init();
})();
</script>
