<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#5a54f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="../../icons/icon-180.png">

<title>Roll Call</title>
<style>
/* Roll Call styles (themes, UI kit and ad cards come from /shared/goobs.css) */
:root { --rc-die: #ffffff; --rc-pip: #1d2238; --rc-red: #e05a3a; --rc-held: #ffe7a3; }
:root[data-theme="dark"] { --rc-die: #f1f2f6; }
.brand svg { border-radius: 10px; }
.app { gap: 8px; }

/* players strip */
.players { width: 100%; display: flex; gap: 6px; flex: none; min-height: 40px; }
.players .pl { flex: 1; min-width: 0; border-radius: 12px; background: var(--surface-2); padding: 5px 8px; display: flex; flex-direction: column; justify-content: center; }
.players .pl b { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.players .pl span { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
.players .pl.on { background: var(--accent); color: var(--accent-ink); }
.players .pl.on b { color: var(--accent-ink); opacity: .9; }
.players .solo { flex: 1; display: flex; justify-content: space-between; align-items: center; padding: 0 2px; }
.players .solo .lbl { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .6px; text-transform: uppercase; }
.players .solo .v { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }

/* the scorecard: numbers on the left, the rest on the right */
.card5 { width: 100%; flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(7, minmax(0, 64px)) auto; align-content: center; gap: 5px 8px; }
.cat {
  display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 0; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); padding: 0 10px; font-size: 14px; font-weight: 700; text-align: left; box-shadow: var(--shadow-sm);
}
.cat .nm { display: flex; align-items: center; gap: 7px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat .nm svg { width: 20px; height: 20px; flex: none; }
.cat .v { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 26px; text-align: right; }
.cat.done { background: var(--surface-2); box-shadow: none; border-color: transparent; }
.cat.done .nm { color: var(--muted); }
.cat.can .v { color: var(--accent); }
.cat.can.zero .v { color: var(--muted); }
.cat.pick { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.cat.pick .v, .cat.pick .nm { color: var(--accent-ink); }
.cat.off { opacity: .45; }
.cat.flash { animation: catflash .7s ease-out; }
@keyframes catflash { 0% { transform: scale(1.06); background: var(--gold); } 100% { transform: none; } }
.sub { grid-column: span 1; display: flex; justify-content: space-between; align-items: center; padding: 2px 10px; font-size: 13px; font-weight: 700; color: var(--muted); }
.sub b { color: var(--ink); font-variant-numeric: tabular-nums; }
.sub .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); margin: 0 8px; overflow: hidden; }
.sub .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.sub.got { color: #1f9d55; }

/* dice */
.tray { width: 100%; display: flex; justify-content: center; gap: 10px; flex: none; padding: 4px 0 14px; }
.die { width: 58px; height: 58px; border-radius: 14px; border: 0; padding: 0; background: var(--rc-die); box-shadow: 0 3px 0 #d8d2c8, 0 6px 14px -4px rgba(0,0,0,.3); position: relative; transition: transform .12s; }
.die svg { width: 100%; height: 100%; display: block; }
.die .pip { fill: var(--rc-pip); }
.die .pip.r { fill: var(--rc-red); }
.die.held { transform: translateY(-8px); background: var(--rc-held); box-shadow: 0 3px 0 #e0b94a, 0 10px 18px -6px rgba(0,0,0,.35); }
.die.held::after { content: "HELD"; position: absolute; left: 0; right: 0; bottom: -19px; font-size: 11px; font-weight: 900; letter-spacing: 1px; color: #c48a00; }
.die.blank svg { opacity: .18; }
.die.rolling { animation: tumble .45s ease-out; }
@keyframes tumble { 0% { transform: rotate(0) translateY(0); } 25% { transform: rotate(-25deg) translateY(-12px); } 50% { transform: rotate(18deg) translateY(-4px); } 75% { transform: rotate(-8deg) translateY(-6px); } 100% { transform: none; } }
.rollbtn { width: 100%; flex: none; min-height: 54px; font-size: 18px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.rollbtn .dots { display: inline-flex; gap: 4px; }
.rollbtn .dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.95); }
.rollbtn .dots i.used { background: rgba(255,255,255,.3); }
.rollbtn.score { background: #1f9d55; box-shadow: 0 4px 0 #146b39; }
.names { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.names input { font: inherit; font-size: 17px; font-weight: 600; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.pop5 { position: fixed; left: 0; right: 0; top: 38%; text-align: center; pointer-events: none; font-weight: 900; font-size: 40px; color: var(--rc-red); text-shadow: 0 3px 0 rgba(0,0,0,.12); animation: pop5 1.6s ease-out forwards; z-index: 5; }
.pop5 small { display: block; font-size: 20px; color: #c48a00; }
@keyframes pop5 { 0% { opacity: 0; transform: scale(.6); } 15% { opacity: 1; transform: scale(1.1); } 75% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-20px); } }
.cardicon svg { border-radius: 16px; }
.results { text-align: left; margin: 6px auto 0; max-width: 260px; }
.results div { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--line); }
.results div:first-child b { color: var(--accent); }
@media (max-height: 700px) {
  .die { width: 50px; height: 50px; border-radius: 12px; }
  .cat { font-size: 13px; padding: 0 8px; }
  .cat .v { font-size: 16px; }
  .rollbtn { min-height: 48px; }
  .tray { padding-bottom: 12px; }
}
@media (min-width: 700px) and (min-height: 900px) { .die { width: 76px; height: 76px; border-radius: 18px; } .cat { font-size: 17px; } .cat .v { font-size: 21px; } }
@media (max-width: 370px) { .cat .nm svg { display: none; } }

/* full screen (Goobs.fullscreen): the scorecard rows may grow to 76px and their text with the screen's height; the dice
   are as big as five fit across (up to 76px), a bit smaller on short phones so the card keeps its room */
html.gg-fs #turnPill { margin-left: auto; font-size: 15px; padding: 7px 11px; }
html.gg-fs .card5 { grid-template-rows: repeat(7, minmax(0, 76px)) auto; gap: 6px 8px; }
html.gg-fs .cat { font-size: clamp(13px, 2dvh, 18px); border-radius: 14px; }
html.gg-fs .cat .v { font-size: clamp(16px, 2.6dvh, 23px); }
html.gg-fs .cat .nm svg { width: clamp(18px, 2.8dvh, 26px); height: clamp(18px, 2.8dvh, 26px); }
html.gg-fs .sub { font-size: clamp(13px, 1.8dvh, 16px); }
html.gg-fs .die { width: clamp(48px, min(17vw, 8dvh), 76px); height: clamp(48px, min(17vw, 8dvh), 76px); border-radius: 22%; }
html.gg-fs .tray { padding: 2px 0 14px; }
</style>
</head>

<script>
/* Roll Call logic: the five-dice category game (the classic rules). Scoring, the upper bonus, extra five-of-a-kinds
   and the joker rule, turns for 1-4 players. Runs in Node (tools/check.js). */
var RC = (function () {
  'use strict';
  var CATS = [
    { id: 'ones', name: 'Ones', up: 1 }, { id: 'twos', name: 'Twos', up: 2 }, { id: 'threes', name: 'Threes', up: 3 },
    { id: 'fours', name: 'Fours', up: 4 }, { id: 'fives', name: 'Fives', up: 5 }, { id: 'sixes', name: 'Sixes', up: 6 },
    { id: 'three', name: '3 of a kind' }, { id: 'four', name: '4 of a kind' }, { id: 'full', name: 'Full house' },
    { id: 'small', name: 'Small straight' }, { id: 'large', name: 'Large straight' }, { id: 'five', name: '5 of a kind' }, { id: 'chance', name: 'Chance' }
  ];
  var BY = {}; CATS.forEach(function (c) { BY[c.id] = c; });
  var UPPER = CATS.slice(0, 6), LOWER = CATS.slice(6);
  var BONUS_AT = 63, BONUS = 35, FIVE = 50, FIVE_BONUS = 100;

  function counts(d) { var c = [0, 0, 0, 0, 0, 0, 0]; d.forEach(function (v) { c[v]++; }); return c; }
  function sum(d) { return d.reduce(function (a, b) { return a + b; }, 0); }
  function isFive(d) { return d.every(function (v) { return v === d[0]; }); }
  function run(c, len) { for (var s = 1; s + len - 1 <= 6; s++) { var ok = true; for (var k = 0; k < len; k++) if (!c[s + k]) ok = false; if (ok) return true; } return false; }
  // points for these dice in this box, by the plain rules (no joker)
  function raw(cat, d) {
    var c = counts(d), b = BY[cat];
    if (b.up) return c[b.up] * b.up;
    var mx = Math.max.apply(null, c);
    switch (cat) {
      case 'three': return mx >= 3 ? sum(d) : 0;
      case 'four': return mx >= 4 ? sum(d) : 0;
      case 'full': { var h = c.filter(function (x) { return x; }).sort(); return (h.length === 2 && h[0] === 2 && h[1] === 3) ? 25 : 0; }
      case 'small': return run(c, 4) ? 30 : 0;
      case 'large': return run(c, 5) ? 40 : 0;
      case 'five': return mx === 5 ? FIVE : 0;
      case 'chance': return sum(d);
    }
    return 0;
  }
  // The joker rule: a five-of-a-kind rolled when the 5-of-a-kind box is already used must go in its number's
  // upper box if that's open; if not, any open lower box scores in full (full house 25, straights 30 and 40);
  // if those are all used too, it must take a zero in an open upper box.
  function options(card, d) {
    var out = {}, open = function (id) { return card.scores[id] == null; };
    var joker = isFive(d) && !open('five');
    if (!joker) { CATS.forEach(function (c) { if (open(c.id)) out[c.id] = raw(c.id, d); }); return { pts: out, joker: false }; }
    var face = UPPER[d[0] - 1].id;
    if (open(face)) { out[face] = raw(face, d); return { pts: out, joker: true }; }
    var lowerOpen = LOWER.filter(function (c) { return open(c.id); });
    if (lowerOpen.length) {
      lowerOpen.forEach(function (c) { out[c.id] = c.id === 'full' ? 25 : c.id === 'small' ? 30 : c.id === 'large' ? 40 : raw(c.id, d); });
      return { pts: out, joker: true };
    }
    UPPER.forEach(function (c) { if (open(c.id)) out[c.id] = 0; });
    return { pts: out, joker: true };
  }
  function upperTotal(card) { var t = 0; UPPER.forEach(function (c) { t += card.scores[c.id] || 0; }); return t; }
  function lowerTotal(card) { var t = 0; LOWER.forEach(function (c) { t += card.scores[c.id] || 0; }); return t; }
  function bonus(card) { return upperTotal(card) >= BONUS_AT ? BONUS : 0; }
  function total(card) { return upperTotal(card) + bonus(card) + lowerTotal(card) + card.fiveBonus; }
  function filled(card) { return CATS.every(function (c) { return card.scores[c.id] != null; }); }

  // ---------- a game ----------
  function rnd(g) { var t = (g.seed = (g.seed + 0x6D2B79F5) | 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  function newCard(name) { var sc = {}; CATS.forEach(function (c) { sc[c.id] = null; }); return { name: name, scores: sc, fiveBonus: 0, fives: 0 }; }
  function create(names, seed) {
    return { players: names.map(newCard), turn: 0, round: 1, dice: [1, 2, 3, 4, 5], held: [false, false, false, false, false], rolls: 0, seed: (seed >>> 0) || 1, over: false };
  }
  function cur(g) { return g.players[g.turn]; }

  function menuInfo() {
    if (!g) return '';
    if (g.players.length === 1) return 'Turn <b>' + Math.min(13, g.round) + '</b> of 13 · Total <b>' + RC.total(g.players[0]) + '</b> · Best <b>' + (stats.best || '–') + '</b>';
    return g.players.map(function (p) { return esc(p.name) + ' <b>' + RC.total(p) + '</b>'; }).join(' · ');
  }
  function init() {
    // full screen: How to, New game, Stats and Settings go into the Menu (the game-over card has Play again); the
    // scorecard rows, their text and the dice grow with the screen (style.css)
    fs = Goobs.fullscreen({ menu: ['btnHelp', 'btnNew', 'btnStats', 'btnSettings'], info: menuInfo });
    var tp = document.createElement('span'); tp.className = 'ggpill'; tp.id = 'turnPill';
    $('app').querySelector('.top').insertBefore(tp, $('app').querySelector('.topbtns'));
    Goobs.themePicker($('themes'));
    $('btnRoll').addEventListener('click', roll);
    $('tray').addEventListener('click', function (e) { var b = e.target.closest('.die'); if (b) toggle(+b.dataset.i); });
    $('card').addEventListener('click', function (e) { var b = e.target.closest('.cat'); if (b) tapCat(b.dataset.id); });
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) { document.addEventListener(ev, function () { S.unlock(); }, { passive: true }); });
    $('btnHome').addEventListener('click', function () { save(); Goobs.home(); });
    $('btnNew').addEventListener('click', function () {
      if (g && !g.over && (g.rolls || g.players.some(function (p) { return RC.CATS.some(function (c) { return p.scores[c.id] != null; }); }))) {
        showCard('Start a new game?', 'This game ends here without a result.', [{ label: 'New game', red: true, go: openNew }, { label: 'Keep playing', go: function () {} }]);
        return;
      }
      openNew();
    });
    $('pcount').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      Array.prototype.forEach.call($('names').querySelectorAll('input'), function (inp) { settings.names[+inp.dataset.i] = inp.value; });
      newCount = +b.dataset.n; renderNew();
    });
    $('btnStart').addEventListener('click', startNew);
    sheet(null, 'ovNew', 'btnCloseNew');
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings');
    sheet('btnStats', 'ovStats', 'btnCloseStats', renderStats);
    $('btnHelp').addEventListener('click', openHelp);
    function closeHelp() { $('ovHelp').classList.remove('show'); if (!meta.seen) { meta.seen = true; saveMeta(); } }
    $('btnCloseHelp').addEventListener('click', closeHelp);
    $('ovHelp').addEventListener('click', function (e) { if (e.target === this) closeHelp(); });
    $('btnSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncSound(); S.ding(); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); syncSound(); S.ding(); });
    $('setTwice').checked = settings.twice;
    $('setTwice').addEventListener('change', function () { settings.twice = this.checked; saveSettings(); pick = null; renderAll(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncAds(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncAds(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncAds(); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });
    window.addEventListener('pagehide', save);
    syncSound(); syncAds();
    if (!load()) newGame(); else renderAll();
    if (!meta.seen) openHelp();
    Goobs.markPlayed('dice');
    Goobs.initUpdates({ beforeReload: save, onVersions: function (v) { $('version').textContent = 'Roll Call ' + (v.dice || '?') + ' · Goobs-Games ' + (v.shell || '?'); } });
  }

  // hook for automated tests
  window.__rc = { get g() { return g; }, roll: roll, toggle: toggle, tapCat: tapCat, commit: commit, RC: RC, stats: function () { return stats; }, get rolling() { return rolling; } };

  init();
})();
</script>
</body>
</html>
