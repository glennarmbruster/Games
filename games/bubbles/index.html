/* Fizz Pop styles (themes, UI kit and ad cards come from /shared/goobs.css) */
.brand svg { border-radius: 10px; }
.modes button { font-size: 15px; }
/* full screen (1.2.0): Glenn: "not full screen yet". The soda blue covers the whole phone (behind the notch and the home
   bar), the kit floats back / Sound / Menu over it with the counters as pills between them, and the field (launcher and
   next bubble included) is centred in the free space as big as it fits (fit() in app.js). The canvas is see-through, so
   the field and the space round it are the same backdrop; a thin line marks the walls the bubbles bounce off. */
html.gg-fs-over, html.gg-fs-over body { background: #1e2a5a; }
.stagewrap { position: fixed; inset: 0; background: linear-gradient(#26336b, #1a2350); touch-action: none; overflow: hidden; }
.stage { position: absolute; left: 0; top: 0; box-shadow: 0 0 0 1.5px rgba(170,185,255,.3); touch-action: none; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
/* the free space the field may use (read by fit(); CSS knows the safe areas, JS doesn't) */
.fitbox { position: absolute; left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px); top: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); visibility: hidden; pointer-events: none; }
.hud { flex: 1 1 auto; min-width: 0; display: flex; justify-content: center; gap: 5px; }
.hud .ggpill { height: 44px; box-sizing: border-box; min-width: 50px; padding: 3px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  line-height: 1.05; font-size: 17px; border-radius: 22px; }
.hud .ggpill small { font-size: 10px; font-weight: 800; color: #6b7080; letter-spacing: .4px; text-transform: uppercase; }
.ggmenu .modes { margin: 4px 0 2px; }
@media (max-width: 385px) { .hud { gap: 4px; } .hud .ggpill { padding: 3px 8px; min-width: 46px; } }
.toast { position: absolute; left: 50%; top: 42%; transform: translateX(-50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: rgba(10,14,36,.78); color: #fff; font-weight: 800; font-size: 16px; padding: 8px 15px; border-radius: 14px; white-space: nowrap; }
.toast.show { opacity: 1; }
.lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.lv { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); height: 52px; font-weight: 800; font-size: 16px; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.lv small { font-size: 11px; color: #e0a800; letter-spacing: -1px; }
.lv.cur { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.lv:disabled { opacity: .35; }
.lv { min-width: 0; }
.lv.long { font-size: 12px; letter-spacing: -.3px; } /* 1.3.0: five- and six-digit level numbers past the bank */
.lvmore { grid-column: 1 / -1; }
.stars { font-size: 26px; color: #ffc83d; letter-spacing: 2px; }
.stars .off { color: var(--line-strong); }
.cardicon svg { border-radius: 16px; }
html.gg-fs-over,html.gg-fs-over body {background:#082332;}
.stagewrap {background:radial-gradient(ellipse at 25% 20%,#20576a,#0b293f 55%,#101d36);}
.stage {border-radius:14px;box-shadow:0 0 0 1px #b4ebed55,inset 8px 0 18px #9cecff08,inset -8px 0 18px #9cecff08,0 15px 40px #0005;background:linear-gradient(110deg,#c6ffff09,transparent 20%,transparent 80%,#c6ffff08);}
html.gg-fs-over .top .hud .ggpill {background:#12394beF;color:#e8fcff;border:1px solid #5c9daa77;border-radius:12px;}
html.gg-fs-over .top .hud .ggpill small {color:#abd6df;}
html.gg-fs-over .top .iconbtn,html.gg-fs-over .top .brand {background:#14384a;color:#e9ffff;border-color:#5c9daa77;}
html.gg-fs-over .top .brand .chev {color:#e9ffff;}

<script>
/* Fizz Pop logic: the bubble shooter (Puzzle Bobble rules). A hex grid 8 bubbles wide (rows of 8 and 7), a
   launcher at the bottom, bank shots off the side walls, 3 or more of a color pop, bubbles cut off from the top fall,
   the ceiling comes down every few shots, and it's over when a bubble passes the line. Units: bubble diameter = 1.
   Runs in Node (tools/gen.js checks every level with a bot). */
// 1.3.0: the module is a named function (FPModule) so the app can rebuild it inside a Web Worker from its own source
// (a Blob, no extra file) to check the levels it makes past the bank without stalling the page.
function FPModule() {
  'use strict';
  var COLS = 8, R = 0.5, ROWH = Math.sqrt(3) / 2, LINE = 12;      // rows 0..11 fit above the line
  var WIDTH = COLS;                                                // the playfield is 8 bubbles wide
  var LAUNCH_Y = LINE * ROWH + 1.7;                                // the launcher, below the line
  var SPEED = 0.34;                                                // bubble diameters per frame (about 20 a second)
  var COLORS = 6;

  function rng(seed) { var s = seed >>> 0 || 1; return function () { s = (s + 0x6D2B79F5) | 0; var t = Math.imul(s ^ (s >>> 15), s | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  // rows alternate 8 and 7 bubbles; "odd" rows sit half a bubble to the right. The parity is fixed to the
  // grid (not the screen), so it doesn't change when the ceiling comes down.
  function rowLen(r) { return r % 2 ? COLS - 1 : COLS; }
  function cellXY(g, r, c) { return [R + c + (r % 2 ? R : 0), R + (r + g.drop) * ROWH]; }
  function key(r, c) { return r * COLS + c; }
  function nbrs(r, c) {
    var o = r % 2, out = [[r, c - 1], [r, c + 1]];
    if (o) out.push([r - 1, c], [r - 1, c + 1], [r + 1, c], [r + 1, c + 1]);
    else out.push([r - 1, c - 1], [r - 1, c], [r + 1, c - 1], [r + 1, c]);
    return out.filter(function (p) { return p[0] >= 0 && p[1] >= 0 && p[1] < rowLen(p[0]); });
  }

  // ---------- a game ----------
  // level: { rows: ['01.2...', ...] (digits = colors, . = empty), drop: shots per ceiling drop, seed }
  function create(level, mode) {
    var g = { mode: mode || 'levels', grid: {}, drop: 0, shots: 0, sinceDrop: 0, dropEvery: level.drop || 8, score: 0, over: false, won: false,
      seed: level.seed >>> 0 || 1, draws: 0, cur: 0, next: 0, pops: 0, fell: 0, maxRows: 0 };
    level.rows.forEach(function (row, r) { for (var c = 0; c < row.length && c < rowLen(r); c++) if (row[c] !== '.') g.grid[key(r, c)] = +row[c]; });
    g.cur = draw(g); g.next = draw(g);
    return g;
  }
  function colorsLeft(g) { var s = {}; for (var k in g.grid) s[g.grid[k]] = 1; return Object.keys(s).map(Number).sort(); }
  // the next bubble: a color still on the board (seeded, so a level plays the same for the same shots)
  function draw(g) {
    var cs = colorsLeft(g); if (!cs.length) cs = [0];
    var R2 = rng(g.seed + g.draws * 2654435761); g.draws++;
    return cs[Math.floor(R2() * cs.length)];
  }
  function occupied(g, r, c) { return g.grid[key(r, c)] !== undefined; }

  // ---------- flight ----------
  // the path of a shot at angle a (radians from straight up, left negative) until it sticks: returns
  // { cell: [r, c], path: [[x, y], ...] } (path = bounce points, for the aim line)
  function trace(g, a, maxBounces) {
    var x = WIDTH / 2, y = LAUNCH_Y, dx = Math.sin(a), dy = -Math.cos(a), path = [[x, y]], step = 0.1, bounces = 0;
    for (var n = 0; n < 4000; n++) {
      x += dx * step; y += dy * step;
      if (x < R) { x = 2 * R - x; dx = -dx; path.push([x, y]); if (++bounces > (maxBounces == null ? 99 : maxBounces)) return { cell: null, path: path }; }
      else if (x > WIDTH - R) { x = 2 * (WIDTH - R) - x; dx = -dx; path.push([x, y]); if (++bounces > (maxBounces == null ? 99 : maxBounces)) return { cell: null, path: path }; }
      // the ceiling
      if (y <= R + g.drop * ROWH) { path.push([x, y]); return { cell: snap(g, x, y), path: path, at: [x, y] }; }
      // touching a bubble
      var hit = false;
      var rr = Math.round((y - R) / ROWH - g.drop);
      for (var r = rr - 1; r <= rr + 1 && !hit; r++) {
        if (r < 0) continue;
        for (var c = 0; c < rowLen(r); c++) {
          if (!occupied(g, r, c)) continue;
          var p = cellXY(g, r, c), ddx = p[0] - x, ddy = p[1] - y;
          if (ddx * ddx + ddy * ddy < 0.8 * 0.8) { hit = true; break; }
        }
      }
      if (hit) { path.push([x, y]); return { cell: snap(g, x, y), path: path, at: [x, y] }; }
    }
    return { cell: null, path: path };
  }
  // the empty cell nearest to where the bubble stopped, that touches the ceiling or another bubble
  function snap(g, x, y) {
    var best = null, bd = Infinity, rr = Math.round((y - R) / ROWH - g.drop);
    for (var r = Math.max(0, rr - 1); r <= rr + 1; r++) for (var c = 0; c < rowLen(r); c++) {
      if (occupied(g, r, c)) continue;
      var anchored = r === 0 || nbrs(r, c).some(function (p) { return occupied(g, p[0], p[1]); });
      if (!anchored) continue;
      var p = cellXY(g, r, c), d = (p[0] - x) * (p[0] - x) + (p[1] - y) * (p[1] - y);
      if (d < bd) { bd = d; best = [r, c]; }
    }
    return best;
  }

  // ---------- placing a bubble: pops, falls, the ceiling ----------
  function place(g, cell, color) {
    var res = { popped: [], fell: [], points: 0, dropped: false };
    g.grid[key(cell[0], cell[1])] = color;
    // same color group
    var group = [cell], seen = {}; seen[key(cell[0], cell[1])] = 1;
    for (var i = 0; i < group.length; i++) nbrs(group[i][0], group[i][1]).forEach(function (p) {
      var k = key(p[0], p[1]); if (!seen[k] && g.grid[k] === color) { seen[k] = 1; group.push(p); }
    });
    if (group.length >= 3) {
      group.forEach(function (p) { delete g.grid[key(p[0], p[1])]; res.popped.push({ r: p[0], c: p[1], color: color }); });
      // anything no longer hanging from the top falls
      var hung = {}, stack = [];
      for (var c = 0; c < rowLen(0); c++) if (occupied(g, 0, c)) { hung[key(0, c)] = 1; stack.push([0, c]); }
      while (stack.length) { var q = stack.pop(); nbrs(q[0], q[1]).forEach(function (p) { var k = key(p[0], p[1]); if (!hung[k] && occupied(g, p[0], p[1])) { hung[k] = 1; stack.push(p); } }); }
      for (var k2 in g.grid) if (!hung[k2]) { var r2 = Math.floor(k2 / COLS), c2 = k2 % COLS; res.fell.push({ r: r2, c: c2, color: g.grid[k2] }); delete g.grid[k2]; }
      res.points = res.popped.length * 10 + (res.fell.length ? 10 * Math.pow(2, Math.min(res.fell.length, 14)) : 0);
      g.score += res.points; g.pops += res.popped.length; g.fell += res.fell.length;
    }
    g.shots++;
    if (Object.keys(g.grid).length === 0) {
      if (g.mode !== 'endless') { g.won = true; g.over = true; return res; }
      // endless: a cleared board earns a bonus and fills back up
      res.cleared = true; g.score += 1000; res.points += 1000; pushRow(g); pushRow(g); g.sinceDrop = 0;
      g.cur = draw(g); g.next = draw(g);
      return res;
    }
    // the ceiling comes down (levels), or a new row pushes in (endless)
    if (++g.sinceDrop >= g.dropEvery) {
      g.sinceDrop = 0; res.dropped = true;
      if (g.mode === 'endless') pushRow(g); else g.drop++;
    }
    if (lowest(g) >= LINE) { g.over = true; g.won = false; }
    // the next bubbles: keep them to colors still on the board
    var cs = colorsLeft(g);
    g.cur = cs.indexOf(g.next) >= 0 ? g.next : draw(g);
    g.next = draw(g);
    return res;
  }

/* Fizz Pop sounds: synthesized with Web Audio (no audio files). */
var FPSound = (function () {
  'use strict';
  var ac = null, master = null, on = false;

    if (!on) return null;

      var AC = window.AudioContext || window.webkitAudioContext;

      try { ac = new AC(); } catch (e) { return null; }
      master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
    }
    if (ac.state === 'suspended') { try { ac.resume(); } catch (e) { /* ignore */ } }

  }
  function tone(type, f0, f1, dur, gain, delay) {

    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(freq, q, dur, gain, delay) {
    var a = ctx(); if (!a) return;
    var t = a.currentTime + (delay || 0), len = Math.floor(a.sampleRate * dur);
    var buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
    var s = a.createBufferSource(); s.buffer = buf;
    var bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;

  }

    setEnabled: function (v) { on = !!v; if (on) ctx(); },
    unlock: function () { if (on) ctx(); },
    shoot: function () { if (on) { noise(1600, 2, 0.08, 0.25); tone('sine', 300, 700, 0.1, 0.1); } },
    bounce: function () { if (on) tone('triangle', 900, 700, 0.05, 0.08); },

<script>
/* Fizz Pop app: aiming and shooting, the flight along the traced path, pops and falls, the ceiling, levels with

(function () {
  'use strict';
  var S = FPSound, LEVELS = window.FP_LEVELS || [];
  var COLORS = ['#ff4d6d', '#ff9f1c', '#ffd23f', '#2ec27e', '#3a86ff', '#9b5de5'];
  var STEP = 1000 / 60, MAXA = 78 * Math.PI / 180;

  // ================= storage =================
  var store = Goobs.store('bubbles');
  var settings = { sound: false, adEvery: 3, guide: true, shapes: true };
  (function () {
    var s = store.get('settings', {}) || {};
    for (var k in settings) if (typeof s[k] === typeof settings[k]) settings[k] = s[k];
    settings.adEvery = Math.min(10, Math.max(1, settings.adEvery | 0));
  })();
  function saveSettings() { store.set('settings', settings); }
  var meta = store.get('meta', null) || {};
  var MD = { mode: 'levels', level: 1, open: 1, stars: {}, seen: false, finished: 0, lastAdAt: 0, endlessBest: 0 };
  for (var mk in MD) if (meta[mk] === undefined) meta[mk] = MD[mk];
  function saveMeta() { store.set('meta', meta); }
  var stats = store.get('stats', null) || {};
  var SD = { shots: 0, pops: 0, fell: 0, cleared: 0, games: 0 };
  for (var sk in SD) if (typeof stats[sk] !== 'number') stats[sk] = SD[sk];
  function saveStats() { store.set('stats', stats); }

  // ================= helpers =================
  function $(id) { return document.getElementById(id); }
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function isOpen(id) { return $(id).classList.contains('show'); }
  function sheetOpen() { return isOpen('ggMenu') || isOpen('ovEnd') || isOpen('ovSettings') || isOpen('ovStats') || isOpen('ovHelp') || isOpen('ovLevels') || GoobsAds.isOpen(); }
  function newSeed() { try { return crypto.getRandomValues(new Uint32Array(1))[0]; } catch (e) { return Math.floor(Math.random() * 4294967296); } }

  // ================= game =================
  var g = null, levelNo = 1, flight = null, fx = [], aim = null, shake = 0, done = false, curBot = 20;

  // ================= 1.3.0: levels past the bank, made on the phone =================
  // Levels 1-100 are the bank (levels.json). From 101 on (no end), level n is made from its number by FP.levelPast
  // (seeded, so it is the same level on every phone) and only kept once the bot clears it. That takes about a tenth of
  // a second, sometimes more, so it runs in a Web Worker built from FP's own source (a Blob: no extra file), and the
  // next level is made while this one is played. If the player gets there first, a small note shows until it's ready.
  var made = {}, waiting = {}, worker = null, workerBroken = false, wantToken = 0;
  (function () { var c = store.get('made', null); if (c && typeof c === 'object') for (var n in c) if (c[n] && c[n].rows) made[n] = c[n]; })();
  function keepMade(n, lv) {
    made[n] = lv;
    // keep the last few made levels in the save, so reopening the app on a level past the bank needs no wait
    var keys = Object.keys(made).map(Number).sort(function (a, b) { return b - a; }), keep = {};
    keys.forEach(function (k2) { if (Math.abs(k2 - levelNo) <= 3 || k2 === meta.open) keep[k2] = made[k2]; });
    store.set('made', keep);
  }
  function levelReady(n) { return n <= LEVELS.length ? LEVELS[n - 1] : made[n] || null; }
  function gotLevel(lv) {
    if (!lv || !lv.rows) return;
    keepMade(lv.n, lv);
    var cbs = waiting[lv.n] || []; delete waiting[lv.n];
    cbs.forEach(function (cb) { cb(lv); });
  }
  function makeWorker() {
    if (worker || workerBroken) return worker;
    try {
      var src = 'var FP = (' + FP.source + ')();\nonmessage = function (e) { postMessage(FP.levelPast(e.data)); };';
      worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
      worker.onmessage = function (e) { gotLevel(e.data); };
      worker.onerror = function () { workerBroken = true; worker = null; for (var n in waiting) makeHere(+n); };
    } catch (e) { workerBroken = true; worker = null; }
    return worker;
  }
  // no Worker (very old phone, or it failed): make it on the page, after a beat so the note can show first
  function makeHere(n) { setTimeout(function () { if (waiting[n]) gotLevel(FP.levelPast(n)); }, 40); }
  function needLevel(n, cb) {
    var lv = levelReady(n);
    if (lv) { if (cb) cb(lv); return; }
    var first = !waiting[n]; waiting[n] = waiting[n] || []; if (cb) waiting[n].push(cb);
    if (!first) return;
    if (makeWorker()) worker.postMessage(n); else makeHere(n);
  }
  function prefetch(n) { if (n > LEVELS.length && !levelReady(n)) needLevel(n, null); }
  var noteT = 0;
  function note(t) {
    clearTimeout(noteT); var el = $('toast');
    if (!t) { if (el.dataset.note) { el.classList.remove('show'); el.dataset.note = ''; } return; }
    // only if it takes a moment: a level that's ready in a blink shows no note
    noteT = setTimeout(function () { el.textContent = t; el.dataset.note = '1'; el.classList.add('show'); }, 250);
  }
  function startLevel(n) {
    n = Math.max(1, Math.floor(n) || 1);
    levelNo = n; meta.mode = 'levels'; meta.level = n; saveMeta();
    var token = ++wantToken, lv = levelReady(n);
    // not made yet: the old board goes (so nothing can be shot or saved under the new number) until it's ready
    if (!lv) { g = null; flight = null; aim = null; fx = []; if (cx) cx.clearRect(0, 0, cv.width, cv.height); store.del('game'); note('Making level ' + fmt(n) + '\u2026'); $('hud').innerHTML = pill('Level', fmt(n)); }
    needLevel(n, function (lv2) {
      if (token !== wantToken) return;   // the player picked another level meanwhile
      note(null);
      curBot = lv2.bot || 20;
      g = FP.create(lv2, 'levels');
      reset();
      prefetch(n + 1);
    });
  }
  function startEndless() {
    meta.mode = 'endless'; saveMeta();
    wantToken++; note(null);
    var seed = newSeed(), rows = [];
    // six rows of four colors to start with
    var lv = FP.makeLevel(12, seed); lv.rows = lv.rows.slice(0, 6).map(function (r) { return r.replace(/\./g, '0').replace(/[4-9]/g, function (d) { return String(d % 4); }); });
    lv.drop = 6;
    g = FP.create(lv, 'endless');

  }
  function reset() { flight = null; fx = []; aim = null; done = false; save(); renderAll(); }
  function save() { if (g && !g.over) store.set('game', { g: g, level: levelNo, mode: meta.mode, bot: curBot }); else store.del('game'); }
  function load() {
    var r = store.get('game', null);
    if (!r || !r.g || !r.g.grid || r.g.over) return false;
    g = r.g; levelNo = r.level || 1; meta.mode = r.mode === 'endless' ? 'endless' : 'levels';
    curBot = r.bot || (LEVELS[levelNo - 1] && LEVELS[levelNo - 1].bot) || 20;
    if (meta.mode === 'levels') prefetch(levelNo + 1);
    return true;
  }

  // ================= loop =================
  var acc = 0, lastT = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    var dt = Math.min(100, t - lastT); lastT = t;
    if (!sheetOpen()) { acc += dt; var n = 0; while (acc >= STEP && n++ < 6) { acc -= STEP; step(); } }
    draw();
  }
  function step() {
    if (flight) {
      // move along the traced path
      var left = FP.SPEED * 1.0;
      while (left > 0 && flight) {
        var tgt = flight.path[flight.i + 1];
        if (!tgt) { land(); break; }
        var dx = tgt[0] - flight.x, dy = tgt[1] - flight.y, d = Math.hypot(dx, dy);
        if (d <= left) { flight.x = tgt[0]; flight.y = tgt[1]; flight.i++; left -= d; if (flight.i < flight.path.length - 1) S.bounce(); }
        else { flight.x += dx / d * left; flight.y += dy / d * left; left = 0; }
      }
    }
    fx.forEach(function (f) { f.t++; if (f.kind === 'fall') { f.vy += 0.018; f.y += f.vy; f.x += f.vx; } });
    fx = fx.filter(function (f) { return f.kind === 'pop' ? f.t < 18 : f.kind === 'text' ? f.t < 60 : f.y < 20; });
    if (shake > 0) shake--;
  }
  function shoot(a) {
    if (!g || g.over || flight || done) return;
    var t = FP.trace(g, a);
    if (!t.cell) return;
    // end the path at the cell the bubble will take
    var end = FP.cellXY(g, t.cell[0], t.cell[1]);
    t.path[t.path.length - 1] = end;
    flight = { path: t.path, i: 0, x: t.path[0][0], y: t.path[0][1], cell: t.cell, color: g.cur };
    stats.shots++;
    S.shoot();
  }
  function land() {
    var f = flight; flight = null;
    var dropBefore = g.drop, res = FP.place(g, f.cell, f.color);
    S.stick();
    res.popped.forEach(function (b, i) { var p = FP.cellXY({ drop: dropBefore }, b.r, b.c); fx.push({ kind: 'pop', x: p[0], y: p[1], color: b.color, t: -Math.floor(i * 1.5) }); });
    res.fell.forEach(function (b) { var p = FP.cellXY({ drop: dropBefore }, b.r, b.c); fx.push({ kind: 'fall', x: p[0], y: p[1], vx: (Math.random() - 0.5) * 0.05, vy: -0.05 - Math.random() * 0.08, color: b.color, t: 0 }); });
    if (res.popped.length) { S.pop(res.popped.length); stats.pops += res.popped.length; }
    if (res.fell.length) { S.fall(res.fell.length); stats.fell += res.fell.length; }
    if (res.points) fx.push({ kind: 'text', x: f.cell ? FP.cellXY(g, f.cell[0], f.cell[1])[0] : 4, y: FP.cellXY(g, f.cell[0], f.cell[1])[1], text: '+' + fmt(res.points), t: 0 });
    if (res.dropped) { S.ceiling(); shake = 18; }
    saveStats(); save(); renderInfo();
    if (g.over) { done = true; setTimeout(g.won ? won : lost, g.won ? 700 : 900); }
  }
  function starsFor(n, shots) { var bot = curBot || 20; return shots <= Math.round(bot * 1.15) + 2 ? 3 : shots <= Math.round(bot * 1.7) + 5 ? 2 : 1; }
  function won() {
    S.win(); stats.cleared++; stats.games++; saveStats();
    meta.finished++;
    var st = starsFor(levelNo, g.shots), before = meta.stars[levelNo] || 0;
    meta.stars[levelNo] = Math.max(before, st);
    // 1.3.0: no last level: the next one is always there (made on the phone past 100)
    if (meta.open <= levelNo) meta.open = levelNo + 1;
    saveMeta(); store.del('game');
    prefetch(levelNo + 1);
    showCard('Level ' + fmt(levelNo) + ' cleared!', '<div class="stars">' + [0, 1, 2].map(function (i) { return i < st ? '★' : '<span class="off">★</span>'; }).join('') + '</div>' +
      g.shots + ' shots &middot; ' + fmt(g.score) + ' points',
      [{ label: 'Next: level ' + fmt(levelNo + 1), red: true, go: function () { between(function () { startLevel(levelNo + 1); }); } }, { label: 'Play it again', go: function () { between(function () { startLevel(levelNo); }); } }]);
  }
  function lost() {
    S.lose(); stats.games++; saveStats(); meta.finished++;
    if (g.mode === 'endless') {
      var nb = g.score > meta.endlessBest; if (nb) meta.endlessBest = g.score; saveMeta(); store.del('game');
      showCard('Over the line', 'Score <b>' + fmt(g.score) + '</b>' + (nb ? '<br><span class="newbest">New best!</span>' : '<br>Best: ' + fmt(meta.endlessBest)), [{ label: 'Play again', red: true, go: function () { between(startEndless); } }]);
      return;

  // ================= info and sheets =================
  function pill(lbl, v) { return '<div class="ggpill"><small>' + lbl + '</small>' + v + '</div>'; }
  function renderInfo() {
    if (!g) return;

    $('hud').innerHTML = meta.mode === 'levels' ? pill('Level', fmt(levelNo)) + pill('Bubbles', FP.count(g)) + pill('Score', fmt(g.score))

  }
  function renderAll() { renderInfo(); draw(); }
  function openLevels(all) {
    // 1.3.0: the bank plus the levels made past it, up to 30 past the furthest one open (the list grows as you go).

    var h = '', top = Math.max(LEVELS.length, meta.open + 30), from = all === true || top <= 600 ? 1 : Math.floor((top - 600) / 5) * 5 + 1;

      h += '<button class="lv' + (n === levelNo && meta.mode === 'levels' ? ' cur' : '') + (n >= 10000 ? ' long' : '') + '" data-n="' + n + '"' + (n > meta.open ? ' disabled' : '') + '>' + n + '<small>' + '★★★'.slice(0, st) + '</small></button>';

    $('ovLevels').classList.add('show');

      '<b>Drag</b> anywhere above the launcher to aim (the dotted line shows the way, off one wall), and <b>let go</b> to shoot. Slide your finger back down below the launcher to cancel.',
      'Bubbles stick where they touch. Make a group of <b>3 or more</b> of one color and they <b>pop</b>. Anything left hanging with nothing holding it to the top <b>falls</b>, for big points (each extra falling bubble doubles them).',
      'Bank shots off the side walls to reach tricky spots. <b>Tap the NEXT bubble</b> (or the launcher) to swap the two.',

  }
