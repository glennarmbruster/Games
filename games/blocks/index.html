<title>Tumbledown</title>
<style>
/* Tumbledown styles (themes, UI kit and ad cards come from /shared/goobs.css) */
:root {
  --td-well: #1d2140; --td-well-2: #232849; --td-grid: rgba(255,255,255,.045); --td-edge: #2d335c; --td-strip: #262b52; --td-label: #aab1d6;
}
:root[data-theme="dark"] { --td-well: #12141f; --td-well-2: #171a28; --td-edge: #262a3d; --td-strip: #1a1d2c; }
:root[data-theme="blue"] { --td-well: #0c1d33; --td-well-2: #10243d; --td-edge: #1d3a5c; --td-strip: #12283f; }

.brand svg { border-radius: 10px; }
.brand h1 { font-size: 23px; }
.modes button { font-size: 15px; }
.info .mid .of { color: var(--muted); font-weight: 600; }

.stagewrap { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
.stage { position: relative; border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); background: var(--td-well); touch-action: none; }
.stage canvas { display: block; width: 100%; height: 100%; }

/* start / pause panel over the board */
.ready {
  position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  background: rgba(20,22,44,.72); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); color: #fff;
  text-align: center; padding: 18px;
}
.ready.show { display: flex; }
.ready h2 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.3px; }
.ready p { margin: 0; color: #d6daf2; font-size: 15px; line-height: 1.4; max-width: 270px; }
.ready .pick { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.12); border-radius: 16px; padding: 6px 8px; }
.ready .pick button { width: 42px; height: 42px; border-radius: 12px; border: 0; background: rgba(255,255,255,.16); color: #fff; font-size: 20px; font-weight: 800; padding: 0; }
.ready .pick button:disabled { opacity: .3; }
.ready .pick div { min-width: 110px; }
.ready .pick b { display: block; font-size: 20px; }
.ready .pick small { display: block; font-size: 12px; color: #c3c8e6; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; }
.ready .go { min-height: 52px; width: 200px; flex: none; }
.ready .or { font-size: 13px; color: #c3c8e6; }
.ready .gest { display: grid; grid-template-columns: auto auto; gap: 3px 12px; font-size: 13px; color: #d6daf2; text-align: left; }
.ready .gest b { color: #fff; }
.ready.compact { gap: 8px; padding: 10px; }
.ready.compact h2 { font-size: 22px; }
.ready.compact .gest { display: none; }
.ready.compact > p { font-size: 14px; }
.ready.compact .pick { padding: 4px 6px; gap: 6px; }
.ready.compact .pick button { width: 36px; height: 36px; }
.ready.compact .pick div { min-width: 90px; }
.ready.compact .go { min-height: 44px; width: 170px; }

/* on-screen buttons */
.pad { display: none; width: 100%; max-width: 420px; flex: none; grid-template-columns: 1fr 1fr .25fr 1fr 1fr; grid-template-rows: 50px 50px; gap: 6px; }
.pad.show { display: grid; }
.pad button {
  border-radius: 14px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-sm);
  font-size: 19px; font-weight: 800; color: var(--ink); padding: 0; touch-action: none; display: flex; align-items: center; justify-content: center;
  -webkit-user-select: none; user-select: none;
}
.pad button svg { width: 24px; height: 24px; }
.pad button:active, .pad button.held { background: var(--accent-soft); color: var(--accent); }
.pad [data-b="left"] { grid-column: 1; grid-row: 1; }
.pad [data-b="right"] { grid-column: 2; grid-row: 1; }
.pad [data-b="soft"] { grid-column: 1; grid-row: 2; }
.pad [data-b="hard"] { grid-column: 2; grid-row: 2; }
.pad [data-b="ccw"] { grid-column: 4; grid-row: 1; }
.pad [data-b="cw"] { grid-column: 5; grid-row: 1; }
.pad [data-b="hold"] { grid-column: 4 / span 2; grid-row: 2; font-size: 15px; letter-spacing: 1px; }

.pop {
  position: absolute; left: 0; right: 0; text-align: center; pointer-events: none; font-weight: 900; color: #fff; line-height: 1.15;
  text-shadow: 0 2px 0 rgba(0,0,0,.35), 0 0 12px rgba(0,0,0,.3); animation: tdpop 1.3s ease-out forwards; z-index: 2;
}
.pop small { display: block; font-size: .55em; color: #ffe08a; }
@keyframes tdpop { 0% { opacity: 0; transform: scale(.7); } 12% { opacity: 1; transform: scale(1.08); } 70% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-24px); } }
.cardicon svg { border-radius: 16px; }
@media (max-width: 385px) { .modes button { font-size: 14px; } .brand h1 { font-size: 21px; } }

/* full screen (Goobs.fullscreen, 2026-09-29): Pause sits in the top row as a round button (icon only) */
html.gg-fs .top #btnPause span { display: none; }
html.gg-fs .top #btnPause:disabled { opacity: .4; }
/* the score row lives in the top row (full screen only): the back button shows just its chevron */
html.gg-fs .top .brand h1 { display: none; }
html.gg-fs .top .homebtn { min-width: 30px; height: 44px; flex: none; }
html.gg-fs .top .info { flex: 1 1 auto; width: auto; min-width: 0; min-height: 0; gap: 6px; padding: 0 2px 0 0; }
html.gg-fs .top .info > div { white-space: nowrap; }
html.gg-fs .top .info .lbl { font-size: 10px; letter-spacing: .3px; }
html.gg-fs .top .info .big { font-size: 20px; letter-spacing: -.6px; }
html.gg-fs .top .info .mid { font-size: 15px; letter-spacing: -.3px; }
html.gg-fs .top .info .of { font-size: 12px; }
/* no room for a Pause button next to the score: the Menu button pauses the game (the board then shows Resume) */
html.gg-fs .top #btnPause { display: none; }

/* Full screen, take two (1.2.0, Glenn: "not full screen yet"): the kit's overlay mode (html.gg-fs-over). The well's color
   covers the whole phone, edge to edge behind the status bar and the home bar; the back button, the counters (one pill)
   and Sound / Menu float on it; the hold / next strip and the well take all the space under that row. */
html.gg-fs-over, html.gg-fs-over body { background: var(--td-well); }
html.gg-fs-over .app { background: var(--td-well); }
html.gg-fs-over .stagewrap { position: fixed; z-index: 1;
  top: calc(env(safe-area-inset-top, 0px) + 56px); bottom: calc(env(safe-area-inset-bottom, 0px) + 6px);
  left: calc(env(safe-area-inset-left, 0px) + 6px); right: calc(env(safe-area-inset-right, 0px) + 6px); }
html.gg-fs-over .stage { background: transparent; box-shadow: none; border-radius: 0; overflow: visible; }
html.gg-fs-over .ready { border-radius: 12px; }
/* the counters: one white pill between the back button and the round buttons */
html.gg-fs-over .top .info { height: 44px; padding: 0 11px; border-radius: 22px; gap: 6px; color: #1b1f33; justify-content: space-between; overflow: hidden; }
html.gg-fs-over .top .info .lbl, html.gg-fs-over .top .info .of { color: #6b7080; }
html.gg-fs-over .top .info .big { font-size: 18px; letter-spacing: -.5px; }
html.gg-fs-over .top .info .mid { font-size: 15px; }
html.gg-fs-over .top .info .of { font-size: 11px; }
html.gg-fs-over .top .homebtn { min-width: 44px; }
/* the on-screen buttons (Settings) sit at the bottom; the well makes room for them */
html.gg-fs-over .pad { position: fixed; z-index: 2; left: 50%; transform: translateX(-50%); width: calc(100% - 20px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); }
html.gg-fs-over .pad button { background: rgba(255,255,255,.9); color: #1b1f33; border: 0; }
html.gg-fs-over .app.padon .stagewrap { bottom: calc(env(safe-area-inset-bottom, 0px) + 118px); }
/* the Marathon / Sprint / Ultra tabs live in the Menu sheet */
.ggmenu .modes { margin: 4px 0 2px; }
@media (max-width: 385px) {
  html.gg-fs-over .top .info { padding: 0 8px; gap: 4px; }
  html.gg-fs-over .top .info .big { font-size: 17px; }
  html.gg-fs-over .top .info .mid { font-size: 14px; }
}
.stage {border-radius:12px;box-shadow:0 0 0 1px #839bad55,0 0 0 4px #16253022,0 12px 30px #09101b44;}
:root:not([data-theme="dark"]):not([data-theme="blue"]) {--td-well:#182b3a;--td-well-2:#7bafcc08;--td-strip:#23384a;--td-edge:#698598;--td-label:#c5dce7;}
.ready {background:rgba(10,24,37,.88);}
</style>

<script>
/* Tumbledown logic: the falling-block rules (modern standard rules: 7-piece bag, standard rotation with wall kicks,
   hold, ghost, lock delay, T-spins, back-to-back, combos, all clears). One call to tick() = one frame at 60 Hz.
   Runs in the browser and in Node (tools/bot.js). Our own names: a four-line clear is a "Quad". */
var TD = (function () {
  'use strict';
  var W = 10, H = 22, HIDDEN = 2;            // rows 0-1 are above the visible field
  var KINDS = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];
  var SHAPES = {
    I: ['....', '####', '....', '....'],
    O: ['.##.', '.##.', '....', '....'],
    T: ['.#.', '###', '...'],
    S: ['.##', '##.', '...'],
    Z: ['##.', '.##', '...'],
    J: ['#..', '###', '...'],
    L: ['..#', '###', '...']
  };
  // cells for each kind and rotation (0 spawn, 1 right, 2 reverse, 3 left): [[x, y], ...] inside the box
  var CELLS = {};
  KINDS.forEach(function (k) {
    var m = SHAPES[k].map(function (r) { return r.split(''); }), n = m.length, rots = [];
    for (var r = 0; r < 4; r++) {
      var cells = [];
      for (var y = 0; y < m.length; y++) for (var x = 0; x < m[y].length; x++) if (m[y][x] === '#') cells.push([x, y]);
      rots.push(cells);
      if (k !== 'O') { var nm = []; for (var yy = 0; yy < n; yy++) { nm.push([]); for (var xx = 0; xx < n; xx++) nm[yy].push(m[n - 1 - xx][yy]); } m = nm; }
    }
    CELLS[k] = rots;
  });
  // wall kicks (x right, y UP as usually written; flipped when used because our rows go down)
  var KICK = {
    '01': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]], '10': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
    '12': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]], '21': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],

  function renderAll() { renderModes(); renderInfo(); renderTools(); renderReady(); draw(); }
  function pop(html, sub, scale) {
    var f = document.createElement('div'), st = $('stage');
    f.className = 'pop'; f.innerHTML = html + (sub ? '<small>' + sub + '</small>' : '');
    var busyPops = st.querySelectorAll('.pop').length, fs = Math.round(Math.max(22, cell * 1.15) * (scale || 1));
    f.style.top = (L.by + L.bh * 0.26 + busyPops * fs * 1.6) + 'px'; f.style.fontSize = fs + 'px';
    st.appendChild(f);
    setTimeout(function () { f.remove(); }, 1350);
  }

  // ================= end of a game =================
  function record() {
    var m = stats[s.mode], a = stats.all, nb = false;
    m.games++;
    a.lines += s.lines; a.pieces += s.count.pieces; a.quads += s.count.quads; a.tspins += s.count.tspins; a.allClears += s.count.allClears;
    if (s.count.maxCombo > a.maxCombo) a.maxCombo = s.count.maxCombo;
    a.ms += Math.round(s.frames * STEP);
    if (s.mode === 'marathon') {
      if (s.score > m.best) { m.best = s.score; nb = true; }
      if (s.level > m.bestLevel) m.bestLevel = s.level;
      if (s.lines > m.bestLines) m.bestLines = s.lines;
      if (s.won || s.endless) m.done++;
    } else if (s.mode === 'sprint') {
      if (s.won) { m.done++; if (!m.best || s.frames < m.best) { m.best = s.frames; nb = true; } }
    } else {
      if (s.score > m.best) { m.best = s.score; nb = true; }
      if (s.lines > m.bestLines) m.bestLines = s.lines;
    }
    saveStats();
    meta.finished++; saveMeta();
    store.del('run');
    return nb;
  }
  function endCard() {
    var m = s.mode, html, title, btns = [{ label: 'Play again', red: true, go: again }];
    // a finished Marathon can carry on (endless), so it's recorded when you choose
    var deferred = m === 'marathon' && s.won, nb = deferred ? s.score > stats.marathon.best : record();
    var tail = '<br><small>' + s.count.quads + ' quad' + (s.count.quads === 1 ? '' : 's') + ' &middot; ' + s.count.tspins + ' T-spin' + (s.count.tspins === 1 ? '' : 's') + (s.count.maxCombo > 1 ? ' &middot; best combo ' + s.count.maxCombo : '') + '</small>';
    if (m === 'marathon') {
      if (s.won) {
        S.win(); title = 'Marathon complete!';
        html = '150 lines! Score <b>' + fmt(s.score) + '</b>' + (nb ? '<br><span class="newbest">New best!</span>' : '<br>Best: ' + fmt(stats.marathon.best)) + tail;
        btns = [{ label: 'Keep going (endless)', red: true, go: function () { TD.keepGoing(s); phase = 'run'; lastT = performance.now(); acc = 0; renderInfo(); renderTools(); } },
          { label: 'Play again', go: function () { record(); again(); } }];
      } else {
        title = 'Game over';
        html = 'Score <b>' + fmt(s.score) + '</b> &middot; level ' + s.level + ' &middot; ' + s.lines + ' lines' + (nb ? '<br><span class="newbest">New best!</span>' : '<br>Best: ' + fmt(stats.marathon.best)) + tail;
      }
    } else if (m === 'sprint') {
      if (s.won) { S.win(); title = '40 lines!'; html = 'Time <b>' + clock(s.frames, true) + '</b>' + (nb ? '<br><span class="newbest">New best time!</span>' : '<br>Best: ' + clock(stats.sprint.best, true)) + tail; }
      else { title = 'Topped out'; html = s.lines + ' of 40 lines in ' + clock(s.frames, true) + '.' + (stats.sprint.best ? '<br>Best: ' + clock(stats.sprint.best, true) : '') + tail; }
    } else {
      if (s.won) { S.win(); title = 'Time’s up!'; } else title = 'Topped out';
      html = 'Score <b>' + fmt(s.score) + '</b> &middot; ' + s.lines + ' lines' + (nb ? '<br><span class="newbest">New best!</span>' : '<br>Best: ' + fmt(stats.ultra.best)) + tail;
    }
    showCard(title, html, btns);
    renderTools();
  }
  function showCard(title, html, buttons) {
    $('cardIcon').innerHTML = '<svg viewBox="0 0 100 100"><use href="#td-logo"/></svg>';
    $('endTitle').textContent = title;
    $('endText').innerHTML = html;
    var box = $('endActions'); box.innerHTML = '';
    buttons.forEach(function (b) {
      var el = document.createElement('button');
      el.className = 'btn' + (b.red ? ' red' : ''); el.textContent = b.label;
      el.addEventListener('click', function () { $('ovEnd').classList.remove('show'); b.go(); });
      box.appendChild(el);
    });
    $('ovEnd').classList.add('show');
  }
  function again() { between(function () { newGame(s.mode); }); }
  function showAd(done) { GoobsAds.show({ onShow: function () { S.ding(); }, onStep: function () { S.sign(); } }, done); }
  function between(next) {
    if (Goobs.adsOn() && meta.finished > 0 && meta.finished % settings.adEvery === 0 && meta.lastAdAt !== meta.finished) {
      meta.lastAdAt = meta.finished; saveMeta();
      next(); showAd(function () {});
      return;
    }
    next();
  }

  // ================= sheets =================
  function openHelp() {
    $('helpTitle').textContent = 'How to play Tumbledown';
    $('helpList').innerHTML = [
      'Pieces of four blocks fall into the well. <b>Fill a whole row</b> across and it clears. Don’t let the stack reach the top.',
      'On the board: <b>tap</b> to turn the piece, <b>drag</b> sideways to move it (it follows your finger), <b>drag down</b> to drop it faster, <b>flick down</b> to drop it at once, <b>flick up</b> to put it on <b>hold</b> (tap the hold box works too). Prefer buttons? Turn on <b>on-screen buttons</b> in Settings.',
      'The <b>ghost</b> outline shows where the piece will land. The strip at the top shows the <b>next</b> pieces and the one on <b>hold</b>; you can hold once per piece.',
      'A piece that lands still has a moment to slide or turn before it locks.',
      '<b>Points</b> (times the level): 1 line 100, 2 lines 300, 3 lines 500, 4 lines (a <b>Quad</b>) 800. A <b>T-spin</b> (turning the T into a tight slot) scores more: 800, 1,200, 1,600. Quads and T-spins in a row are <b>back-to-back</b>: half as much again. Clearing lines with piece after piece is a <b>combo</b> (+50 each). Clear the whole well for an <b>all clear</b> bonus. Dropping scores 1 point a row, flicking down 2.',
      '<b>Marathon</b>: 150 lines, 15 levels, faster each level (pick a starting level). <b>Sprint</b>: 40 lines against the clock. <b>Ultra</b>: the best score in 2 minutes. Switch modes at the top of the <b>Menu</b>.'
    ].map(function (x) { return '<li>' + x + '</li>'; }).join('');
    $('ovHelp').classList.add('show');
  }
  function renderStats() {
    var m = stats.marathon, sp = stats.sprint, u = stats.ultra, a = stats.all;
    $('statsBody').innerHTML =
      '<div class="themelabel">Marathon</div><div class="tiles"><div class="tile"><b>' + fmt(m.best) + '</b><span>Best score</span></div><div class="tile"><b>' + (m.bestLevel || '–') + '</b><span>Top level</span></div><div class="tile"><b>' + m.done + '</b><span>Finished</span></div></div>' +
      '<div class="themelabel">Sprint and Ultra</div><div class="tiles"><div class="tile"><b>' + (sp.best ? clock(sp.best, true) : '–') + '</b><span>Best 40 lines</span></div><div class="tile"><b>' + fmt(u.best) + '</b><span>Best Ultra</span></div><div class="tile"><b>' + (m.games + sp.games + u.games) + '</b><span>Games</span></div></div>' +
      '<div class="themelabel">All games</div><div class="tiles"><div class="tile"><b>' + fmt(a.lines) + '</b><span>Lines</span></div><div class="tile"><b>' + fmt(a.quads) + '</b><span>Quads</span></div><div class="tile"><b>' + fmt(a.tspins) + '</b><span>T-spins</span></div></div>' +
      '<p class="version">' + fmt(a.pieces) + ' pieces &middot; ' + a.allClears + ' all clears &middot; best combo ' + a.maxCombo + ' &middot; ' + Math.round(a.ms / 60000) + ' min played</p>';
  }

  // ================= wiring =================
  function syncSound() {
    $('btnSound').innerHTML = '<svg viewBox="0 0 24 24"><use href="#i-sound-' + (settings.sound ? 'on' : 'off') + '"/></svg>';
    $('btnSound').classList.toggle('on', settings.sound); $('setSound').checked = settings.sound; S.setEnabled(settings.sound);
  }
  function syncAds() { $('setAds').checked = Goobs.adsOn(); $('adEvery').textContent = settings.adEvery; $('rowAdEvery').classList.toggle('off', !Goobs.adsOn()); }
  function syncPad() { $('setPad').checked = settings.pad; $('pad').classList.toggle('show', settings.pad); $('app').classList.toggle('padon', settings.pad); $('setGhost').checked = settings.ghost; requestAnimationFrame(function () { fit(); draw(); }); }
  function sheet(btn, ov, close, onOpen) {
    if (btn) $(btn).addEventListener('click', function () { pause(); if (onOpen) onOpen(); $(ov).classList.add('show'); });
    $(close).addEventListener('click', function () { $(ov).classList.remove('show'); });
    $(ov).addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  }
  function inGame() { return (phase === 'run' || phase === 'paused') && s && (s.score > 0 || s.lines > 0 || s.frames > 600); }
  function switchMode(m) {
    if (phase === 'run') pause();
    if (inGame()) {
      showCard('Leave this game?', 'This game ends now' + (s.score ? ' with ' + fmt(s.score) + ' points' : '') + '.', [
        { label: 'Leave it', red: true, go: function () { record(); meta.mode = m; saveMeta(); between(function () { newGame(m); }); } },
        { label: 'Keep playing', go: function () {} }]);
      return;
    }
    meta.mode = m; saveMeta(); newGame(m);
  }
  var KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowDown: 'soft', ArrowUp: 'cw', x: 'cw', X: 'cw', z: 'ccw', Z: 'ccw', ' ': 'hard', c: 'hold', C: 'hold', Shift: 'hold' };
  function press(b) {
    if (b === 'soft') { held.soft = { f: 0 }; act('soft'); return; }
    if (b === 'left' || b === 'right') { held[b] = { f: 0 }; delete held[b === 'left' ? 'right' : 'left']; }
    act(b);
  }
  function release(b) { delete held[b]; }
  function init() {
    Goobs.themePicker($('themes'));
    cv = $('cv'); cx = cv.getContext('2d');
    document.addEventListener('pointerdown', onDown);
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', function () { g = null; });
    document.addEventListener('touchmove', function (e) { if (g) e.preventDefault(); }, { passive: false });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { if (phase === 'run') pause(); else if (phase === 'paused') resume(); return; }
      var b = KEYS[e.key]; if (!b) return;
      e.preventDefault(); if (e.repeat) return;
      if (phase === 'ready' || phase === 'paused') { act('tap'); return; }
      press(b);
    });
    document.addEventListener('keyup', function (e) { var b = KEYS[e.key]; if (b) release(b); });
    Array.prototype.forEach.call($('pad').children, function (btn) {
      var b = btn.dataset.b;
      btn.addEventListener('pointerdown', function (e) { e.preventDefault(); btn.classList.add('held'); press(b); });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { btn.addEventListener(ev, function () { btn.classList.remove('held'); release(b); }); });
    });
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) { document.addEventListener(ev, function () { S.unlock(); }, { passive: true }); });
    $('btnHome').addEventListener('click', function () { pause(); saveRun(); Goobs.home(); });
    $('btnPause').addEventListener('click', function () { if (phase === 'run') pause(); else if (phase === 'paused') resume(); });
    $('btnNew').addEventListener('click', function () {
      if (phase === 'run') pause();
      if (inGame()) {
        showCard('Start over?', 'This game ends now' + (s.score ? ' with ' + fmt(s.score) + ' points' : '') + '.', [
          { label: 'Start over', red: true, go: function () { record(); between(function () { newGame(s.mode); }); } },
          { label: 'Keep playing', go: function () {} }]);
        return;
      }
      newGame(s.mode);
    });
    $('modes').addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (!btn || btn.dataset.mode === meta.mode) return;
      $('ggMenu').classList.remove('show'); // the tabs live in the Menu sheet (1.2.0): close it first
      switchMode(btn.dataset.mode);
    });
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings');
    sheet('btnStats', 'ovStats', 'btnCloseStats', renderStats);
    // full screen (2026-09-29): How to, Restart, Stats and Settings live in the Menu (the empty toolbar hides itself), so the
    // well gets the toolbar's height. The game pauses while the Menu is open, so the Menu button is the pause button here:
    // the Pause button moves to the top row but stays hidden there (style.css), the score row needs the room.
    var pb = $('btnPause'); pb.className = 'iconbtn'; pb.setAttribute('aria-label', 'Pause');
    $('btnSound').parentNode.insertBefore(pb, $('btnSound'));
    // the score row moves up into the top row in place of the name (the Menu shows the name): the well is limited by the
    // height on every phone, so those 50 points make the blocks bigger (30 -> 32 points on an iPhone 15, 22 -> 24 on an SE)
    $('btnHome').parentNode.insertBefore($('info'), $('btnSound').parentNode);
    // 1.2.0 (Glenn: "not full screen yet"): overlay mode. The well's color covers the whole screen, edge to edge; back,
    // the counters pill, Sound and Menu float on it. The Marathon / Sprint / Ultra tabs move into the Menu sheet.
    var FS = Goobs.fullscreen({
      overlay: true,
      menu: ['btnNew', 'btnHelp', 'btnStats', 'btnSettings'],
      onOpen: function () { pause(); },
      info: function () { return s ? MODE_NAMES[s.mode] + (s.mode === 'marathon' ? ' &middot; level <b>' + s.level + '</b>' : '') : ''; }
    });
    FS.list.parentNode.insertBefore($('modes'), FS.list);
    $('info').classList.add('ggpill');
    $('btnHelp').addEventListener('click', function () { pause(); openHelp(); });
    function closeHelp() { $('ovHelp').classList.remove('show'); if (!meta.seen) { meta.seen = true; saveMeta(); } }
    $('btnCloseHelp').addEventListener('click', closeHelp);
    $('ovHelp').addEventListener('click', function (e) { if (e.target === this) closeHelp(); });
    $('btnSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncSound(); S.ding(); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); syncSound(); S.ding(); });
    $('setPad').addEventListener('change', function () { settings.pad = this.checked; saveSettings(); syncPad(); });
    $('setGhost').addEventListener('change', function () { settings.ghost = this.checked; saveSettings(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncAds(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncAds(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncAds(); });
    new MutationObserver(function () { readColors(); draw(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    if (window.ResizeObserver) new ResizeObserver(function () { fit(); draw(); }).observe($('stagewrap'));
    window.addEventListener('resize', function () { fit(); draw(); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) { pause(); saveRun(); } });
    window.addEventListener('pagehide', function () { pause(); saveRun(); });
    syncSound(); syncAds(); syncPad();
    fit();
    if (!resumeRun()) newGame(meta.mode);
    if (!meta.seen) openHelp();
    lastT = performance.now();
    requestAnimationFrame(frame);
    Goobs.markPlayed('blocks');
    Goobs.initUpdates({
      beforeReload: function () { pause(); saveRun(); },
      onVersions: function (v) { $('version').textContent = 'Tumbledown ' + (v.blocks || '?') + ' · Goobs-Games ' + (v.shell || '?'); }
    });
  }

  // hook for automated tests
  window.__td = { get s() { return s; }, get phase() { return phase; }, act: act, begin: begin, pause: pause, newGame: newGame, stats: function () { return stats; }, settings: settings, TD: TD, layout: function () { return { cell: cell, L: L }; } };

  init();
})();
</script>
<script src="../../shared/collection-batch4.js"></script>
