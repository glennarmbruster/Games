<style>
/* Brickyard styles (themes, UI kit and ad cards come from /shared/goobs.css) */
.brand svg { border-radius: 10px; }
.cardicon svg { border-radius: 16px; }

/* Full screen (1.2.0, Glenn: "not full screen yet"): the canvas covers the whole phone, edge to edge behind the status bar
   and the home bar, painted with the level's backdrop; the field sits in it with its walls (fit() in app.js). The kit's
   html.gg-fs-over floats the back / Sound / Pause / Menu buttons; the counters are pills. --bk-bg is the level's color. */
html.gg-fs-over, html.gg-fs-over body { background: var(--bk-bg, #1c1f3a); }
.stage { position: fixed; inset: 0; background: var(--bk-bg, #1c1f3a); touch-action: none; }
.stage canvas { position: absolute; left: 0; top: 0; display: block; width: 100%; height: 100%; touch-action: none; }
.playarea { position: fixed; visibility: hidden; pointer-events: none;
  top: calc(env(safe-area-inset-top, 0px) + 92px); bottom: calc(env(safe-area-inset-bottom, 0px) + 6px);
  left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px); }
/* the score pill sits in the top row between the back button and the round buttons; touches go through to the game */
.scorepill { pointer-events: none !important; height: 44px; box-sizing: border-box; display: flex; align-items: baseline; justify-content: center; gap: 6px;
  padding: 0 14px; line-height: 44px; font-size: 22px; font-weight: 900; min-width: 0; overflow: hidden; letter-spacing: -.3px; }
.scorepill small, .hud small { font-size: 11px; font-weight: 800; color: #6b7080; letter-spacing: .3px; text-transform: uppercase; }
/* level (with the paddles left) and best, just under the top row */
.hud { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 56px); z-index: 5; pointer-events: none;
  display: flex; justify-content: center; gap: 8px; padding: 0 10px; }
.hud .ggpill { height: 30px; box-sizing: border-box; padding: 0 12px; font-size: 15px; line-height: 30px; display: flex; align-items: center; gap: 6px; }
.hud .of { color: #6b7080; font-weight: 700; }
.hud .lives { display: flex; gap: 3px; margin-left: 2px; }
.hud .lives i { width: 14px; height: 6px; border-radius: 3px; background: #7c5cff; }
html.gg-fs-over .top #btnPause:disabled { opacity: .5; }
.ready { position: absolute; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 18px; color: #fff;
  border-radius: 12px; background: rgba(14,16,40,.72); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.ready.show { display: flex; }
.ready h2 { margin: 0; font-size: 28px; font-weight: 800; }
.ready p { margin: 0; color: #d6daf2; font-size: 15px; line-height: 1.4; max-width: 270px; }
.ready .go { min-height: 50px; width: 210px; flex: none; }
.ready .caps { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; text-align: left; font-size: 13px; color: #d6daf2; }
.ready .caps b { display: inline-block; width: 30px; text-align: center; border-radius: 8px; color: #fff; font-size: 12px; padding: 1px 0; }
.ready.compact .caps { display: none; }

/* 1.3.0: the power-up line above the bricks: what the falling capsule is and does (and if it would end yours), or the
   power-up you have now. Touches go through to the game. */
.powerline { position: fixed; z-index: 4; height: 26px; box-sizing: border-box; display: none; align-items: center; justify-content: center; gap: 6px;
  pointer-events: none; color: #e8ebff; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; padding: 0 6px; }
.powerline.show { display: flex; }
.powerline > span { overflow: hidden; text-overflow: ellipsis; }
.powerline b { flex: none; width: 26px; height: 18px; border-radius: 9px; color: #fff; font-size: 12px; font-weight: 900; line-height: 18px; text-align: center;
  box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); }
.powerline strong { font-weight: 900; color: #fff; }
.powerline small { flex: none; font-size: 11px; font-weight: 800; letter-spacing: .3px; text-transform: uppercase; color: #9aa0c8; }
.powerline em { font-style: normal; font-weight: 800; color: #ffd43b; }
.powerline.falling { animation: plpulse 1s ease-in-out infinite alternate; }
@keyframes plpulse { from { opacity: .82; } to { opacity: 1; } }
@media (max-width: 380px) { .powerline { font-size: 13px; gap: 5px; } }
</style>

<script>
/* Brickyard logic: the brick breaker (Arkanoid rules). A 13-brick-wide field, a paddle, balls, colored bricks
   (one hit), silver bricks (several hits), gold bricks (can't be broken), falling capsules (Slow, Catch, Expand,
   Divide, Laser, Break, Player), extra lives, and levels made from patterns and checked by a bot.
   Units: a brick is 1 wide and 0.5 tall. One tick() = one frame at 60 Hz. Runs in Node. */
var BK = (function () {
  'use strict';
  var FW = 13, FH = 18.2, TOP = 2, BH = 0.5, PADY = 16.6, PADH = 0.42, BALLR = 0.17;
  var PADW = 2.3, PADW_BIG = 3.4, SPEED0 = 0.15, SPEEDMAX = 0.28, SPEEDSLOW = 0.11, CAPV = 0.055;
  // brick kinds: 1-8 colors, 9 silver, 10 gold
  var POINTS = [0, 50, 60, 70, 80, 90, 100, 110, 120];
  var CAPS = ['S', 'C', 'E', 'D', 'L', 'B', 'P'];
  var CAPW = [16, 14, 16, 16, 14, 3, 5];     // how often each capsule comes (the original makes Break and Player rare)

  function rng(seed) { var s = seed >>> 0 || 1; return function () { s = (s + 0x6D2B79F5) | 0; var t = Math.imul(s ^ (s >>> 15), s | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  // ---------- levels made from patterns ----------
  // each pattern says, for a brick at (col, row) of a 13 x rows grid, what goes there ('.' empty, 1-8 color, 'S' silver, 'G' gold)
  var PATTERNS = [
    function (c, r) { return r === 0 ? 'S' : String(1 + (r % 8)); },                                              // rows of color, a silver top
    function (c, r, n) { return Math.abs(c - 6) <= r ? String(1 + ((r + n) % 8)) : '.'; },                        // a pyramid
    function (c, r) { return (c + r) % 2 ? String(1 + (c % 8)) : '.'; },                                           // a checkerboard
    function (c, r, n, R) { var m = Math.floor(R / 2), d = Math.abs(c - 6) + Math.abs(r - m); return d <= m + 1 ? (d === m + 1 ? 'S' : String(1 + (d % 8))) : '.'; }, // a diamond
    function (c, r) { return c % 4 === 0 ? (r % 3 === 2 ? 'G' : r % 3 === 0 ? 'S' : String(1 + ((r + 4) % 8))) : String(1 + (r % 8)); },                   // pillars
    function (c, r, n, R) { var y = r / R, x = (c - 6) / 6.5, v = Math.pow(x * x + y * y * 1.1 - 0.55, 3) - x * x * Math.pow(1 - y, 3) * 1.2; return v < 0.02 ? String(5 + (r % 2)) : '.'; }, // a heart
    function (c, r) { return r % 2 === 0 ? String(1 + ((c + r) % 8)) : (c === 0 || c === 12 ? 'G' : '.'); },       // stripes
    function (c, r, n, R) { return r === R - 1 && c % 3 !== 1 ? 'G' : r < R - 1 ? String(1 + ((c * 3 + r) % 8)) : '.'; } // a floor with gaps
  ];
  function makeLevel(n) {
    var R = Math.min(12, 5 + Math.floor(n / 3)), p = PATTERNS[(n - 1) % PATTERNS.length], rows = [];
    for (var r = 0; r < R; r++) {
      var row = '';
      for (var c = 0; c < FW; c++) {
        var v = p(c, r, n, R);
        if (v !== '.' && v !== 'G' && v !== 'S' && n > 4 && ((c * 7 + r * 13 + n) % 17 === 0)) v = 'S'; // more silver as levels go on
        row += v;
      }
      rows.push(row);
    }
    rows = rows.map(function (row) { return row.slice(0, FW); });
    return { rows: rows, n: n };
  }

  // ---------- a game ----------
  function create(level, opts) {
    var g = { level: level.n, bricks: [], balls: [], caps: [], shots: [], score: (opts && opts.score) || 0, lives: (opts && opts.lives != null) ? opts.lives : 3,
      pad: { x: FW / 2, w: PADW, want: PADW }, power: '', catchT: 0, laserT: 0, breakOpen: false, t: 0, seed: ((opts && opts.seed) >>> 0) || 1, over: false, cleared: false,
      warped: false, nextLife: (opts && opts.nextLife) || 20000, speedUp: 0, sinceHit: 0, ev: [] };
    g.rnd = rng(g.seed);
    var silverHits = Math.min(4, 2 + Math.floor((level.n - 1) / 12));
    level.rows.forEach(function (row, r) {
      for (var c = 0; c < row.length; c++) {
        var ch = row[c]; if (ch === '.') continue;
        var kind = ch === 'S' ? 9 : ch === 'G' ? 10 : +ch;
        g.bricks.push({ c: c, r: r, x: c, y: TOP + r * BH, kind: kind, hits: kind === 9 ? silverHits : kind === 10 ? Infinity : 1, flash: 0 });
      }
    });
    serve(g);
    return g;
  }
  function serve(g) {
    g.balls = [{ x: g.pad.x, y: PADY - BALLR - 0.01, vx: 0, vy: 0, speed: SPEED0, stuck: true, off: 0.3 }];
    g.caps = []; g.shots = []; g.power = ''; g.pad.want = PADW; g.pad.w = PADW;
  }
  function breakable(b) { return b.kind !== 10; }
  function left(g) { var n = 0; g.bricks.forEach(function (b) { if (breakable(b)) n++; }); return n; }

  // ---------- controls ----------
  function movePad(g, x) { g.pad.x = Math.max(g.pad.w / 2, Math.min(FW - g.pad.w / 2 + (g.breakOpen ? g.pad.w : 0), x)); }
  // launch a stuck ball (at the start, or after Catch)
  function release(g) {
    var any = false;
    g.balls.forEach(function (b) {
      if (!b.stuck) return;
      b.stuck = false; any = true;
      var a = b.off / (g.pad.w / 2) * 1.0; // the angle from where it sits on the paddle
      a = Math.max(-1.0, Math.min(1.0, a)) || 0.35;
      b.vx = Math.sin(a) * b.speed; b.vy = -Math.cos(a) * b.speed;
    });
    return any;
  }
  function fire(g) {
    if (g.power !== 'L' || g.laserT > 0) return false;
    g.laserT = 18;
    g.shots.push({ x: g.pad.x - g.pad.w / 2 + 0.25, y: PADY - 0.3 }, { x: g.pad.x + g.pad.w / 2 - 0.25, y: PADY - 0.3 });
    g.ev.push({ t: 'laser' });
    return true;
  }

  // ---------- bricks being hit ----------
  function hitBrick(g, b, byLaser) {
    b.flash = 8;
    if (b.kind === 10) { g.ev.push({ t: 'gold' }); return; }
    b.hits--;
    if (b.hits > 0) { g.ev.push({ t: 'silver' }); return; }
    g.bricks.splice(g.bricks.indexOf(b), 1);
    addScore(g, b.kind === 9 ? 50 * g.level : POINTS[b.kind]);
    g.ev.push({ t: 'brick', kind: b.kind, x: b.x + 0.5, y: b.y + BH / 2 });
    // a capsule, now and then (not while a capsule is falling or while there are several balls, like the original)
    if (b.kind !== 9 && !g.caps.length && g.balls.length === 1 && g.rnd() < 0.16) {
      var tot = 0, i; for (i = 0; i < CAPS.length; i++) tot += CAPW[i];
      var pick = g.rnd() * tot, k = 0; for (i = 0; i < CAPS.length; i++) { pick -= CAPW[i]; if (pick < 0) { k = i; break; } }
      if (CAPS[k] === g.power && CAPS[k] !== 'P') k = (k + 1) % CAPS.length;
      g.caps.push({ x: b.x + 0.5, y: b.y + BH / 2, kind: CAPS[k] });
    }
    if (left(g) === 0) { g.cleared = true; g.ev.push({ t: 'cleared' }); }
  }
  function addScore(g, n) {
    g.score += n;
    while (g.score >= g.nextLife) { g.lives++; g.nextLife = g.nextLife === 20000 ? 60000 : g.nextLife + 60000; g.ev.push({ t: 'life' }); }
  }
  function catchPower(g, k) {
    g.ev.push({ t: 'cap', kind: k });
    addScore(g, 1000);
    if (k === 'P') { g.lives++; g.ev.push({ t: 'life' }); return; }

      if (phase === 'paused' && g.score > 0) { showCard('Start over?', 'This game ends now with ' + fmt(g.score) + ' points.', [{ label: 'Start over', red: true, go: function () { stats.games++; saveStats(); if (g.score > meta.best) { meta.best = g.score; saveMeta(); } between(function () { newRun(1); }); } }, { label: 'Keep playing', go: function () {} }]); return; }
      newRun(1);
    });
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings');
    sheet('btnStats', 'ovStats', 'btnCloseStats', renderStats);
    $('btnHelp').addEventListener('click', function () { pause(); openHelp(); });
    function closeHelp() { $('ovHelp').classList.remove('show'); if (!meta.seen) { meta.seen = true; saveMeta(); } }
    $('btnCloseHelp').addEventListener('click', closeHelp);
    $('ovHelp').addEventListener('click', function (e) { if (e.target === this) closeHelp(); });
    $('btnSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncSound(); S.ding(); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); syncSound(); S.ding(); });
    $('spLess').addEventListener('click', function () { settings.speed = Math.max(0.5, Math.round((settings.speed - 0.1) * 10) / 10); saveSettings(); syncSpeed(); });
    $('spMore').addEventListener('click', function () { settings.speed = Math.min(2, Math.round((settings.speed + 0.1) * 10) / 10); saveSettings(); syncSpeed(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncAds(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncAds(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncAds(); });
    if (window.ResizeObserver) new ResizeObserver(function () { fit(); draw(); }).observe($('stage'));
    window.addEventListener('resize', function () { fit(); draw(); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) { pause(); save(); } });
    window.addEventListener('pagehide', function () { pause(); save(); });
    syncSound(); syncAds(); syncSpeed(); fit();
    if (!load()) newRun(1);
    if (!meta.seen) openHelp(true);
    lastT = performance.now(); requestAnimationFrame(frame);
    Goobs.markPlayed('bricks');
    Goobs.initUpdates({ beforeReload: function () { pause(); save(); }, onVersions: function (v) { $('version').textContent = 'Brickyard ' + (v.bricks || '?') + ' · Goobs-Games ' + (v.shell || '?'); } });
  }

  // hook for automated tests
  window.__bk = { get g() { return g; }, get phase() { return phase; }, BK: BK, begin: begin, newRun: newRun, meta: function () { return meta; }, get k() { return k; }, field: function () { return { x: OX, y: OY, w: W * k, h: H * k, k: k }; } };

  init();
})();
</script>
