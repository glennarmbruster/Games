<script>
/* if Triple Treat can't open, say so on screen (never a blank page) and offer a fresh start */
(function () {
  var shown = false;
  function fail(msg) {
    if (shown || window.__ttReady) return; shown = true;
    function put() {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:#fff3e8;color:#1b1f33;font:600 16px -apple-system,system-ui,sans-serif;text-align:center';
      d.innerHTML = '<b style="font-size:21px">Triple Treat didn\u2019t open</b><div style="max-width:320px;opacity:.75;font-size:13px">' + String(msg).replace(/[<>&]/g, '') + '</div>';
      function btn(t, bg, go) { var b = document.createElement('button'); b.textContent = t; b.style.cssText = 'font:800 17px -apple-system,system-ui,sans-serif;padding:13px 24px;border-radius:14px;border:0;color:#fff;background:' + bg; b.onclick = go; d.appendChild(b); }
      btn('Start fresh', '#5a54f0', function () { try { localStorage.removeItem('triple.game'); } catch (e) { /* ignore */ } location.reload(); });
      btn('All games', '#6b7080', function () { location.href = '../../'; });
      document.body.appendChild(d);
    }
    if (document.body) put(); else document.addEventListener('DOMContentLoaded', put);
  }
  window.addEventListener('error', function (e) { fail((e.message || 'Something went wrong') + (e.lineno ? ' (line ' + e.lineno + ')' : '')); });
  setTimeout(function () { if (!window.__ttReady) fail('It took too long to start.'); }, 6000);
})();
</script>

  background: rgba(20,24,36,.82); color: #fff; font-weight: 700; font-size: 14px; padding: 8px 14px; border-radius: 14px; }

.tool.red .cnt { background: #ffffff; color: var(--accent); }

.lv { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); height: 52px; font-weight: 800; font-size: 16px; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }

<script>
/* Triple Treat rules (no DOM; runs in Node for the tests).
   Tiles sit in layers on a half-tile grid. A tile is free when no tile on a higher layer overlaps it. Tap a free tile
   and it moves to the tray (7 slots), next to any tiles of the same kind; three of a kind clear. A full tray with no
   match ends the level. Clear every tile to win.
   Levels are made from the level number: a shape, layers, then a removal order that only ever takes free tiles, with
   kinds dealt out along that order so that someone following it never has more than 6 tiles in the tray. So every
   level can be cleared. */
var TT = (function () {
  'use strict';
  var TRAY = 7, FACES = 24;
  function rng(seed) { var s = (seed >>> 0) || 1; return function () { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
  function shuffle(a, r) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  // ---------------- shapes (on a grid of whole-tile cells, 7 wide × 8 tall) ----------------
  var GW = 7, GH = 8;
  var SHAPES = [
    function (x, y) { return true; },                                                            // block
    function (x, y) { return Math.abs(x - 3) + Math.abs(y - 3.5) <= 4.5; },                      // diamond
    function (x, y) { return Math.abs(x - 3) <= 1 || Math.abs(y - 3.5) <= 1.5; },               // plus
    function (x, y) { var dx = (x - 3) / 3.6, dy = (y - 3.5) / 4.2; return dx * dx + dy * dy <= 1; },   // round
    function (x, y) { return y >= 1 && Math.abs(x - 3) <= (y + 1) / 2; },                       // pyramid
    function (x, y) { var dx = Math.abs(x - 3), yy = y - 1; return (yy < 3 && (Math.hypot(dx - 1.6, yy - 1.2) < 1.9)) || (yy >= 2 && dx <= 3.5 - (yy - 2) * 0.62); }, // heart
    function (x, y) { return x === 0 || x === 6 || y === 0 || y === 7 || (x === 3) || (y === 3 || y === 4); }, // window
    function (x, y) { return (x + y) % 2 === 0 || y === 0 || y === 7; },                          // checker
    function (x, y) { return y <= 1 || x <= 1 || x >= 5; },                                      // arch
    function (x, y) { return Math.abs(x - 3) >= (y < 4 ? 3 - y : y - 4) - 0.1 ? Math.abs(x - 3) <= 3 : false; }, // hourglass-ish
    function (x, y) { return (x <= 2 && y <= 3) || (x >= 4 && y >= 4) || (x >= 2 && x <= 4 && y >= 2 && y <= 5); }, // bowtie
    function (x, y) { return Math.hypot(x - 3, y - 3.5) >= 1.6; }                                // ring
  ];
  // the level recipe: tiles, kinds and how much the kinds are interleaved
  function recipe(n) {
    var tiles = n <= 1 ? 18 : n <= 3 ? 27 : n <= 6 ? 36 : n <= 10 ? 45 : n <= 20 ? 54 + (n % 3) * 6 : n <= 40 ? 66 + (n % 4) * 6 : n <= 80 ? 78 + (n % 5) * 6 : n <= 150 ? 90 + (n % 6) * 6 : 102 + (n % 7) * 6;
    var kinds = Math.min(FACES, n <= 1 ? 3 : n <= 3 ? 5 : n <= 6 ? 7 : n <= 10 ? 8 : n <= 20 ? 10 : n <= 40 ? 12 : n <= 80 ? 14 : n <= 150 ? 17 : 20);
    var layers = n <= 2 ? 2 : n <= 8 ? 3 : n <= 30 ? 4 : n <= 100 ? 5 : 6;
    var mix = n <= 2 ? 1 : n <= 5 ? 2 : n <= 12 ? 3 : 4;   // how many kinds may be "open" at once along the hidden order
    if (n % 10 === 0 && n > 10) { tiles = Math.max(45, tiles - 30); mix = 2; } // a breather every tenth level
    return { tiles: tiles, kinds: kinds, layers: layers, mix: mix };
  }
  // positions: layer 0 on whole cells of the shape (scaled to a w × h window); higher layers on a half-offset or whole
  // grid, resting on the layer below
  function positions(shape, w, h, R, r) {
    var base = [];
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      var sx = w > 1 ? x * (GW - 1) / (w - 1) : 3, sy = h > 1 ? y * (GH - 1) / (h - 1) : 3.5;
      if (shape(Math.round(sx), Math.round(sy))) base.push({ x: x, y: y, z: 0 });
    }
    var all = base.slice(), prev = base;
    for (var z = 1; z < R.layers; z++) {
      var half = r() < 0.6, cand = [], sx2 = half ? 0.5 : 0, sy2 = half ? (r() < 0.5 ? 0.5 : 0) : 0;
      for (var yy = 0; yy < h; yy++) for (var xx = 0; xx < w; xx++) {
        var px = xx + sx2, py = yy + sy2; if (px > w - 1 || py > h - 1) continue;
        var sup = prev.filter(function (p) { return Math.abs(p.x - px) < 1 && Math.abs(p.y - py) < 1; }).length;
        if (sup >= (sx2 && sy2 ? 3 : sx2 || sy2 ? 2 : 1)) cand.push({ x: px, y: py, z: z });
      }
      shuffle(cand, r); cand = cand.slice(0, Math.round(cand.length * (0.9 - z * 0.08)));
      if (!cand.length) break;
      all = all.concat(cand); prev = cand;
    }
    return all;
  }
  var WINDOWS = [[3, 3], [4, 3], [4, 4], [5, 4], [5, 5], [6, 5], [6, 6], [7, 6], [7, 7], [7, 8]];
  function overlaps(a, b) { return Math.abs(a.x - b.x) < 0.999 && Math.abs(a.y - b.y) < 0.999; }
  function buildLevel(n) {
    var R = recipe(n), r = rng(n * 2246822519 + 7);
    for (var attempt = 0; attempt < 60; attempt++) {
      var shape = SHAPES[(n * 7 + 3 + attempt) % SHAPES.length], pos = null;
      for (var wi = 0; wi < WINDOWS.length && !pos; wi++) { var p0 = positions(shape, WINDOWS[wi][0], WINDOWS[wi][1], R, r); if (p0.length >= R.tiles) pos = p0; }
      if (!pos) pos = positions(shape, GW, GH, R, r);
      // trim to the wanted count (a multiple of 3), taking from the top layer first
      pos.sort(function (a, b) { return a.z - b.z || r() - 0.5; });
      var want = Math.min(R.tiles, pos.length - pos.length % 3);
      if (want < 9) continue;
      pos = pos.slice(0, want);
      // centre the board
      var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
      pos.forEach(function (p) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); });

    cx.restore();
  }
  function draw(now) {
    cx.setTransform(DPR, 0, 0, DPR, 0, 0); cx.clearRect(0, 0, W, H);
    if (!g) return;
    TStudio.draw(cx,W,H);
    // board
    var st = shuffleT && now - shuffleT < 420 ? (now - shuffleT) / 420 : 1, scX = st < 1 ? Math.abs(Math.cos(st * Math.PI)) : 1;
    var list = g.tiles.filter(function (t) { return !t.gone; }).sort(drawOrder);
    list.forEach(function (t) {
      if (back.some(function (b) { return b.id === t.id; })) return;
      var r = tileRect(t), dx = 0;
      if (shakes[t.id] && now - shakes[t.id] < 300) dx = Math.sin((now - shakes[t.id]) / 22) * S0 * 0.06 * (1 - (now - shakes[t.id]) / 300);
      drawTile(t.k, r.x + dx, r.y, S0, !TT.isFree(g, t), scX);
    });
    // tiles flying back to the board
    back.forEach(function (b) { var t = g.tiles[b.id], r = tileRect(t), k = ease(Math.min(1, b.t)); drawTile(t.k, b.x0 + (r.x - b.x0) * k, b.y0 + (r.y - b.y0) * k, TS + (S0 - TS) * k, false); });
    // the tray
    cx.fillStyle='#faf0d5';cx.font='700 12px system-ui';cx.textAlign='center';cx.fillText('TRAY '+g.tray.length+'/7'+(g.tray.length>=5?' · Make a match before it fills':''),W/2,trayY-20);
    cx.save(); rr(cx, trayX, trayY - (trayH - TS * 1.1) / 2, trayW, trayH, trayH * 0.28);
    cx.fillStyle = g.tray.length>=5?'#75454c':'#264e4d'; cx.fill(); cx.lineWidth = 3; cx.strokeStyle = g.tray.length>=5?'#f2bc80':'#c2b184'; cx.stroke(); cx.restore();
    for (var i = 0; i < TT.TRAY; i++) { rr(cx, slotX(i), trayY, TS, TS * 1.1, TS * 0.16); cx.fillStyle = 'rgba(255,240,220,.16)'; cx.fill(); }
    var idx = 0;
    vt.forEach(function (v) {
      var tx = slotX(v.pop != null ? (v.slot != null ? v.slot : idx) : idx);
      if (v.pop == null) { v.slot = idx; idx++; }
      if (v.x == null) { v.x = tx; v.y = trayY; }
      if (v.fly) { var k = ease(Math.min(1, v.fly.t)); v.x = v.fly.x0 + (tx - v.fly.x0) * k; v.y = v.fly.y0 + (trayY - v.fly.y0) * k - Math.sin(k * Math.PI) * TS * 0.6; }
      else if (v.pop == null) { v.x += (tx - v.x) * 0.3; v.y += (trayY - v.y) * 0.3; }
      var s = v.fly ? v.s0 + (TS - v.s0) * ease(Math.min(1, v.fly.t)) : TS, sc = 1, al = 1;
      if (v.pop != null && v.pop > 0) { sc = 1 + Math.sin(Math.min(1, v.pop) * Math.PI) * 0.25; al = 1 - Math.max(0, v.pop - 0.5) * 2; }
      cx.save(); cx.translate(v.x + s / 2, v.y + s * 0.55); cx.scale(sc, sc); cx.translate(-(v.x + s / 2), -(v.y + s * 0.55));
      drawTile(v.k, v.x, v.y, s, false, 1, al); cx.restore();
    });
    // magic: tiles zip from the board to the tray and pop
    magic.forEach(function (m) { if (m.t < 0) return; var k = ease(Math.min(1, m.t)), al = m.t > 1 ? Math.max(0, 1 - (m.t - 1) * 3) : 1; drawTile(m.k, m.x0 + (m.x1 - m.x0) * k, m.y0 + (m.y1 - m.y0) * k, S0 + (TS - S0) * k, false, 1, al); });
    // particles
    parts.forEach(function (p) { cx.globalAlpha = Math.max(0, 1 - p.t / p.life); cx.fillStyle = p.c; if (p.flake) { cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillRect(-p.r, -p.r * 0.5, p.r * 2, p.r); cx.restore(); } else { cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, Math.PI * 2); cx.fill(); } });
    cx.globalAlpha = 1;
  }

  // ================= loop =================
  var lastT = 0, infoT = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = lastT ? Math.min(60, now - lastT) : 16; lastT = now;
    if (g && !g.won && !g.lost && !ending && !sheetOpen() && !document.hidden && g.cleared + vt.length > 0) g.ms += dt;
    vt.forEach(function (v) { if (v.fly) { v.fly.t += dt / 230; if (v.fly.t >= 1) { v.fly = null; afterLand(v); } } });
    var popped = [];
    vt.forEach(function (v) { if (v.pop != null) { v.pop += dt / 280; if (v.pop >= 1) popped.push(v); } });
    popped.forEach(function (v) { vt.splice(vt.indexOf(v), 1); popDone(v); });
    back = back.filter(function (b) { b.t += dt / 260; return b.t < 1; });
    magic = magic.filter(function (m) { m.t += dt / 300; if (m.t >= 1.33) { popDone({ x: m.x1, y: m.y1 }); return false; } return true; });
    if (g && g.won && !ending && !busy()) win();
    parts = parts.filter(function (p) { p.t++; p.x += p.vx; p.y += p.vy; p.vy += p.flake ? 0.03 : 0.14; if (p.flake) p.rot += p.vr; return p.t < p.life && p.y < H + 20; });
    draw(now);
    if (now - infoT > 250) { infoT = now; var el = $('clock'); if (el && g) el.textContent = clock(g.ms); }
  }

  // ================= info, cards, sheets =================
  // full screen: when the pills don't fit the top row (an SE with big numbers), drop their unit words
  function fitPills() {
    var el = $('info'), w = 0; if (!el) return; el.classList.remove('tight');
    Array.prototype.forEach.call(el.children, function (c) { w += c.offsetWidth + 6; });
    if (w > el.clientWidth + 6) el.classList.add('tight');
  }
  function renderInfo() {
    if (!g) return;
    var left = g.total - g.cleared - vt.filter(function (v) { return v.pop == null && !v.match; }).length;
    // full screen: two pills in the top row instead of the old LEVEL / TILES LEFT row (frees ~50px for the board)
    $('info').innerHTML = '<span class="ggpill"><small>Lv</small> ' + g.n + '</span>' +
      '<span class="ggpill">' + Math.max(0, g.total - g.cleared - g.tray.length) + ' <small>left</small>' + (settings.timer ? ' · <span id="clock">' + clock(g.ms) + '</span>' : '') + '</span>';
    fitPills();
    $('planStatus').textContent='★★★'.slice(0,TT.stars(g))+'☆☆☆'.slice(TT.stars(g))+' · '+((g.assists||0)+(g.recoveries||0))+' assists · Undo allowed';$('cntUndo').textContent = meta.boost.undo; $('cntShuffle').textContent = meta.boost.shuffle; $('cntHint').textContent = meta.boost.hint;
  }
  var toastT = 0;
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('show'); }, 2200); }
  function showCard(title, html, buttons) {
    $('cardIcon').innerHTML = '<svg viewBox="0 0 100 100"><use href="#tt-logo"/></svg>';
    $('endTitle').textContent = title; $('endText').innerHTML = html;
    var box = $('endActions'); box.innerHTML = '';
    buttons.forEach(function (b) { var el = document.createElement('button'); el.className = 'btn' + (b.red ? ' red' : ''); el.textContent = b.label; el.addEventListener('click', function () { $('ovEnd').classList.remove('show'); b.go(); }); box.appendChild(el); });
    $('ovEnd').classList.add('show');
  }
  function showAd(done2) { GoobsAds.show({ onShow: function () { S.ding(); }, onStep: function () { S.sign(); } }, done2); }
  function between(next) {
    if (Goobs.adsOn() && meta.finished > 0 && meta.finished % settings.adEvery === 0 && meta.lastAdAt !== meta.finished) { meta.lastAdAt = meta.finished; saveMeta(); next(); showAd(function () {}); return; }
    next();
  }
  function openLevels() {
    var h = '', top = Math.max(20, Math.ceil((meta.open + 5) / 20) * 20);
    for (var n = 1; n <= top; n++) { var st = meta.stars[n] || 0; h += '<button class="lv' + (g && n === g.n ? ' cur' : '') + '" data-n="' + n + '"' + (n > meta.open ? ' disabled' : '') + '>' + n + '<small>' + '★★★'.slice(0, st) + '</small></button>'; }
    $('lvgrid').innerHTML = h; $('ovLevels').classList.add('show');
  }
  function openHelp() {
    $('helpList').innerHTML = [
      '<b>Tap a tile</b> to move it down into the <b>tray</b>. Only tiles with nothing on top can be taken; the darker ones are covered.',
      'Three of the same kind in the tray <b>clear</b>. Clear every tile to win the level.',
      'The tray holds <b>7</b>. Fill it without a match and you\'re <b>out of room</b> (once per level you can send the last three tiles back).',
      '<b>Undo</b> takes back the last tile. <b>Shuffle</b> re-deals the remaining board with a safe solution from your current tray. <b>Magic</b> clears a set of three. You win one booster each level.',
      '<b>Three stars</b> for solving without Magic, Shuffle or a full-tray recovery; two with up to two assists. Undo is allowed. Take your time—speed does not affect stars. Every fresh board has a legal solution.'
    ].map(function (x) { return '<li>' + x + '</li>'; }).join('');
    $('ovHelp').classList.add('show');
  }
  function renderStats() {
    var stars = 0; for (var n in meta.stars) stars += meta.stars[n];
    $('statsBody').innerHTML = '<div class="tiles"><div class="tile"><b>' + fmt(meta.open - 1) + '</b><span>Levels cleared</span></div><div class="tile"><b>' + fmt(stars) + '</b><span>Stars</span></div><div class="tile"><b>' + fmt(stats.bestStreak) + '</b><span>Best streak</span></div></div>' +
      '<div class="tiles"><div class="tile"><b>' + fmt(stats.matches) + '</b><span>Matches</span></div><div class="tile"><b>' + fmt(stats.lost) + '</b><span>Out of room</span></div><div class="tile"><b>' + fmt(stats.boosters) + '</b><span>Boosters used</span></div></div>';
  }

  // ================= wiring =================
  function syncSound() { $('btnSound').innerHTML = '<svg viewBox="0 0 24 24"><use href="#i-sound-' + (settings.sound ? 'on' : 'off') + '"/></svg>'; $('btnSound').classList.toggle('on', settings.sound); $('setSound').checked = settings.sound; S.setEnabled(settings.sound); }
  function syncAds() { $('setAds').checked = Goobs.adsOn(); $('adEvery').textContent = settings.adEvery; $('rowAdEvery').classList.toggle('off', !Goobs.adsOn()); }
  function sheet(btn, ov, close, onOpen) {
    if (btn) $(btn).addEventListener('click', function () { if (onOpen) onOpen(); $(ov).classList.add('show'); });
    $(close).addEventListener('click', function () { $(ov).classList.remove('show'); });
    $(ov).addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  }
  function init() {
    Goobs.themePicker($('themes'));
    cv = $('cv'); cx = cv.getContext('2d');
    cv.addEventListener('pointerdown', function (e) { var r = cv.getBoundingClientRect(); if (g) { var id = hit(e.clientX - r.left, e.clientY - r.top); if (id >= 0) tap(id); } e.preventDefault(); });
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) { document.addEventListener(ev, function () { S.unlock(); }, { passive: true }); });
    $('btnHome').addEventListener('click', function () { save(); Goobs.home(); });
    $('btnUndo').addEventListener('click', useUndo); $('btnShuffle').addEventListener('click', useShuffle); $('btnHint').addEventListener('click', useHint);
    $('btnLevels').addEventListener('click', openLevels);
    $('btnHelp').addEventListener('click', openHelp);
    // full screen (kit): Levels, How to, Stats and Settings live in the Menu; Undo / Shuffle / Magic stay on screen.
    // The clock stops while the Menu is open (sheetOpen() checks 'ggMenu').
    Goobs.fullscreen({ menu: ['btnLevels', 'btnHelp', 'btnStats', 'btnSettings'],
      info: function () { return g ? 'Level <b>' + g.n + '</b> · <b>' + Math.max(0, g.total - g.cleared - g.tray.length) + '</b> tiles left' : ''; } });
    $('lvgrid').addEventListener('click', function (e) { var b = e.target.closest('button[data-n]'); if (!b) return; $('ovLevels').classList.remove('show'); startLevel(+b.dataset.n); });
    sheet(null, 'ovLevels', 'btnCloseLevels');
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings');
    sheet('btnStats', 'ovStats', 'btnCloseStats', renderStats);
    function closeHelp() { $('ovHelp').classList.remove('show'); if (!meta.seen) { meta.seen = true; saveMeta(); } }
    $('btnCloseHelp').addEventListener('click', closeHelp);
    $('ovHelp').addEventListener('click', function (e) { if (e.target === this) closeHelp(); });
    $('info').addEventListener('click', openHelp);
    $('btnSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncSound(); S.ding(); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); syncSound(); S.ding(); });
    $('setTimer').checked = settings.timer;
    $('setTimer').addEventListener('change', function () { settings.timer = this.checked; saveSettings(); renderInfo(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncAds(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncAds(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncAds(); });
    if (window.ResizeObserver) new ResizeObserver(fit).observe($('stagewrap'));
    window.addEventListener('resize', fit);
    document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });
    window.addEventListener('pagehide', save);
    syncSound(); syncAds(); fit();
    if (!load()) startLevel(Math.min(meta.level, meta.open));
    fit();
    if (!meta.seen) openHelp();
    requestAnimationFrame(frame);
    window.__ttReady = true;
    Goobs.markPlayed('triple');
    Goobs.initUpdates({ beforeReload: save, onVersions: function (v) { $('version').textContent = 'Triple Treat ' + (v.triple || '?') + ' · Goobs-Games ' + (v.shell || '?'); } });
  }
  window.__tt = { get g() { return g; }, tap: tap, startLevel: startLevel, useUndo: useUndo, useShuffle: useShuffle, useHint: useHint, TT: TT, meta: function () { return meta; }, get vt() { return vt; } };
  init();
})();
</script>
