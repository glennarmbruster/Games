<title>Lettermind</title>
<style>
/* Lettermind styles (themes, UI kit and ad cards come from /shared/goobs.css) */
:root { --lm-c: #2fb67c; --lm-p: #e9a21f; --lm-a: #8a91a6; --lm-empty: var(--surface); --lm-edge: #c9cee0; --lm-key: #dfe3ef; }
:root[data-theme="dark"], :root[data-theme="blue"] { --lm-a: #4a5064; --lm-edge: #3b4158; --lm-key: #3a4056; }
html.lm-contrast { --lm-c: #f08c2c; --lm-p: #4da3ff; }
.brand svg { border-radius: 10px; }
.app { gap: 8px; }
.modes button { font-size: 15px; }

.gridwrap { position: relative; flex: 1 1 auto; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
.grid { display: grid; grid-template-rows: repeat(6, 1fr); gap: 6px; }
.lrow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.lrow.shake { animation: shake .45s; }
@keyframes shake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); } 30%, 50%, 70% { transform: translateX(-7px); } 40%, 60% { transform: translateX(7px); } }
.cell {
  display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 2px solid var(--lm-edge); background: var(--lm-empty);
  font-weight: 900; text-transform: uppercase; color: var(--ink); -webkit-user-select: none; user-select: none;
}
.cell.full { border-color: var(--muted); animation: typed .1s ease-out; }
@keyframes typed { 50% { transform: scale(1.1); } }
.cell.c, .cell.p, .cell.a { color: #fff; border-color: transparent; }
.cell.c { background: var(--lm-c); } .cell.p { background: var(--lm-p); } .cell.a { background: var(--lm-a); }
.cell.flip { animation: flip .5s ease-in-out both; }
@keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
.cell.win { animation: hop .5s ease-out both; }
@keyframes hop { 40% { transform: translateY(-14px); } 70% { transform: translateY(3px); } }

.toast { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); background: var(--ink); color: var(--bg); font-weight: 800; font-size: 15px;
  padding: 8px 14px; border-radius: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; z-index: 3; }
.toast.show { opacity: 1; }

/* keyboard */
.kb { width: 100%; max-width: 520px; flex: none; display: flex; flex-direction: column; gap: 7px; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
.kb .kr { display: flex; gap: 5px; justify-content: center; }
.kb button { flex: 1; height: 54px; min-width: 0; border: 0; border-radius: 8px; background: var(--lm-key); color: var(--ink); font-weight: 800; font-size: 17px; text-transform: uppercase; padding: 0; }
.kb button.wide { flex: 1.55; font-size: 13px; }
.kb button.hint { background: #3d6fd8; color: #fff; font-size: 14px; text-transform: none; display: flex; align-items: center; justify-content: center; gap: 2px; }
.kb button.hint svg { width: 17px; height: 17px; }
.kb button.hint:disabled { opacity: .4; }
/* Lock key, unlocked for this row: outlined, grey letters typeable again */
.kb button.hint.open { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px #3d6fd8; }
.tool.go { background: #1f9d55; color: #fff; border-color: transparent; box-shadow: 0 6px 16px -8px #1f9d55; }
.kb button { position: relative; }
.kb button.off, .kb button.off:disabled { background: var(--lm-a); color: #fff; opacity: .28; }
.newword { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 7px 11px; font-weight: 800; font-size: 14px; }
.newword svg { width: 17px; height: 17px; }
.newword:active { filter: brightness(.92); }
.kb button svg { width: 24px; height: 24px; }
.kb button.c, .kb button.p, .kb button.a { color: #fff; }
.kb button.c { background: var(--lm-c); } .kb button.p { background: var(--lm-p); } .kb button.a { background: var(--lm-a); opacity: .75; }
.kb button:active { filter: brightness(.9); }
.kb .half { flex: .5; visibility: hidden; }

/* stats */
.dist { display: flex; flex-direction: column; gap: 4px; margin: 6px 0 4px; }
.dist div { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 14px; }
.dist i { display: block; height: 20px; min-width: 22px; border-radius: 5px; background: var(--lm-a); color: #fff; font-style: normal; font-size: 12px; text-align: right; padding: 2px 6px; box-sizing: border-box; }
.dist i.now { background: var(--lm-c); }
.nextword { font-size: 14px; color: var(--muted); margin-top: 6px; }
.nextword b { color: var(--ink); font-variant-numeric: tabular-nums; }
.cardicon svg { border-radius: 16px; }
@media (max-height: 700px) { .kb button { height: 46px; } .kb { gap: 6px; } }

/* full screen (Goobs.fullscreen): the info row lives in the top row as a pill (or the New word button); the keys grow
   with the screen's height (46px on an iPhone SE, ~62px on a tall phone) and the grid takes the rest */
html.gg-fs .top .info { width: auto; min-height: 0; flex: 1 1 auto; justify-content: flex-end; padding: 0; }
html.gg-fs .top .info .ggpill { font-size: 15px; padding: 7px 11px; }
html.gg-fs .top .info .newword { white-space: nowrap; flex: none; height: 40px; padding: 0 10px; border-radius: 20px; font-size: 13px; gap: 4px; }
html.gg-fs .top .info .newword svg { width: 15px; height: 15px; }
html.gg-fs .kb { max-width: 640px; }
html.gg-fs .kb button { height: clamp(46px, 7.4dvh, 64px); font-size: clamp(17px, 2.5dvh, 21px); }
html.gg-fs .kb button.wide { font-size: 14px; }

/* Dark and Blue themes (1.3.1, Glenn: grey letters "look great on a light theme ... but in a dark theme they are
   indistinguishable"). In the dark, untried keys were #3a4056 and grey (not-in-word) keys #4a5064 at 75%: almost the
   same. Now untried keys are lighter and raised, grey letters sink into the background (dark key, dim letter), and
   locked letters are just a faint outline, so the three states read at a glance. */
:root[data-theme="dark"] .kb button { background: #5a6280; color: #fff; }
:root[data-theme="dark"] .kb button.a { background: #1c1f28; color: #6f7790; opacity: 1; }
:root[data-theme="dark"] .kb button.off, :root[data-theme="dark"] .kb button.off:disabled { background: transparent; color: #3f4558; opacity: 1; box-shadow: inset 0 0 0 1.5px #2b303d; }
:root[data-theme="blue"] .kb button { background: #3f6496; color: #fff; }
:root[data-theme="blue"] .kb button.a { background: #0e1c31; color: #5f7aa0; opacity: 1; }
:root[data-theme="blue"] .kb button.off, :root[data-theme="blue"] .kb button.off:disabled { background: transparent; color: #33496a; opacity: 1; box-shadow: inset 0 0 0 1.5px #1c3050; }
:root[data-theme="dark"] .kb button.c, :root[data-theme="blue"] .kb button.c { background: var(--lm-c); }
:root[data-theme="dark"] .kb button.p, :root[data-theme="blue"] .kb button.p { background: var(--lm-p); }
:root[data-theme="dark"] .kb button.hint, :root[data-theme="blue"] .kb button.hint { background: #3d6fd8; color: #fff; }
:root[data-theme="dark"] .kb button.hint.open, :root[data-theme="blue"] .kb button.hint.open { background: transparent; color: var(--ink); }
</style>
</head>

<div class="app" id="app">

    <button class="brand homebtn" id="btnHome" aria-label="Back to all games">
      <span class="chev" aria-hidden="true">&#8249;</span>
      <svg viewBox="0 0 100 100" aria-hidden="true"><use href="#lm-logo"/></svg>
      <h1>Lettermind</h1>
    </button>
    <div class="topbtns">
      <button class="iconbtn" id="btnSound" aria-label="Sound"><svg viewBox="0 0 24 24"><use href="#i-sound-off"/></svg></button>
      <button class="iconbtn" id="btnStats" aria-label="Stats"><svg viewBox="0 0 24 24"><use href="#i-stats"/></svg></button>
      <button class="iconbtn" id="btnSettings" aria-label="Settings"><svg viewBox="0 0 24 24"><use href="#i-gear"/></svg></button>
    </div>
  </div>

  <div class="modes" id="modes">
    <button data-mode="daily">Word 1</button>
    <button data-mode="daily2">Word 2</button>
    <button data-mode="practice">Practice</button>
  </div>

  <div class="info" id="info"></div>

  <div class="gridwrap" id="gridwrap"><div class="grid" id="grid"></div><div class="toast" id="toast"></div></div>

  <div class="kb" id="kb"></div>

  <div class="toolbar">
    <button class="tool" id="btnHelp"><svg viewBox="0 0 24 24"><use href="#i-help"/></svg><span>How to</span></button>
    <button class="tool" id="btnShare"><svg viewBox="0 0 24 24"><use href="#i-share"/></svg><span>Share</span></button>
    <button class="tool go" id="btnEnter"><svg viewBox="0 0 24 24"><use href="#i-enter"/></svg><span>Enter</span></button>
  </div>
</div>

<!-- Settings -->
<div class="overlay" id="ovSettings">
  <div class="sheet" role="dialog" aria-label="Settings">
    <h2>Settings</h2>
    <div class="sheetbody">
      <div class="themelabel">Theme (all games)</div>
      <div class="themes" id="themes"></div>
      <label class="row"><div>Hard mode<small>Letters you’ve found must be used in the next guesses (green ones in their place). Changes can’t be made halfway through today’s word.</small></div>
        <span class="switch"><input type="checkbox" id="setHard"><span></span></span></label>
      <label class="row"><div>Lock out grey letters<small>Letters your guesses show grey can’t be typed (the Lock key). Tap Lock to type one anyway, until your next guess.</small></div>
        <span class="switch"><input type="checkbox" id="setLock"><span></span></span></label>
      <label class="row"><div>High-contrast colors<small>Orange and blue instead of green and gold.</small></div>
        <span class="switch"><input type="checkbox" id="setContrast"><span></span></span></label>
      <label class="row"><div>Sound<small>Soft clicks and chimes.</small></div>
        <span class="switch"><input type="checkbox" id="setSound"><span></span></span></label>
      <label class="row"><div>Old-time ads<small>Joke ads between games. This switch is shared by all Goobs-Games.</small></div>
        <span class="switch"><input type="checkbox" id="setAds"><span></span></span></label>
      <div class="row" id="rowAdEvery"><div>Show an ad every<small>Counted in finished games.</small></div>
        <div class="stepper"><button id="adLess" aria-label="Fewer">&minus;</button><b id="adEvery">3</b><button id="adMore" aria-label="More">+</button></div></div>
      <div class="version" id="version">Lettermind</div>
    </div>
    <div class="actions"><button class="btn red" id="btnCloseSettings">Done</button></div>
  </div>
</div>

<!-- Stats -->
<div class="overlay" id="ovStats">
  <div class="sheet" role="dialog" aria-label="Stats">
    <h2>Your Lettermind records</h2>
    <div class="sheetbody" id="statsBody"></div>
    <div class="actions"><button class="btn red" id="btnCloseStats">Done</button></div>
  </div>
</div>

<!-- How to play -->
<div class="overlay" id="ovHelp">
  <div class="sheet" role="dialog" aria-label="How to play">
    <h2 id="helpTitle">How to play</h2>
    <div class="sheetbody"><ol class="helplist" id="helpList"></ol></div>
    <div class="actions"><button class="btn red" id="btnCloseHelp">Let's play</button></div>
  </div>
</div>

<!-- Cards -->
<div class="overlay center" id="ovEnd">
  <div class="card" role="dialog">
    <div class="cardicon" id="cardIcon"></div>
    <h2 id="endTitle"></h2>
    <p id="endText"></p>
    <div class="actions" id="endActions"></div>
  </div>
</div>

    buttons.forEach(function (b) {
      var el = document.createElement('button'); el.className = 'btn' + (b.red ? ' red' : ''); el.textContent = b.label;
      el.addEventListener('click', function () { $('ovEnd').classList.remove('show'); b.go(); });
      box.appendChild(el);
    });
    $('ovEnd').classList.add('show');
  }
  function showAd(done) { GoobsAds.show({ onShow: function () { S.ding(); }, onStep: function () { S.sign(); } }, done); }
  function between(next) {
    if (Goobs.adsOn() && meta.finished > 0 && meta.finished % settings.adEvery === 0 && meta.lastAdAt !== meta.finished) {
      meta.lastAdAt = meta.finished; saveMeta(); next(); showAd(function () {}); return;
    }
    next();
  }
  function switchMode(m) { if (m === meta.mode) return; open(m, false); if (g.done) setTimeout(function () { showResult(false); }, 300); }
  function openHelp() {
    $('helpTitle').textContent = 'How to play Lettermind';
    $('helpList').innerHTML = [
      'Guess the hidden <b>five-letter word</b> in <b>six tries</b>. Type a real word and tap <b>Enter</b> (bottom right).',
      'Each letter then changes color: <b style="color:var(--lm-c)">green</b> means right letter, right place; <b style="color:var(--lm-p)">gold</b> means it’s in the word but somewhere else; <b>grey</b> means it isn’t in the word (or not that many times). The keyboard keeps track.',
      'There are <b>two words of the day</b> (<b>Word 1</b> and <b>Word 2</b> at the top), the same for everyone, so you and Cindy can compare. New ones come at midnight. Each word has its own <b>streak</b> for days in a row solved. <b>Share</b> sends your colored squares (not the letters).',
      '<b>Practice</b> gives as many extra words as you like; it has its own records and doesn’t touch the streak.',
      '<b>Enter</b> is the green button at the bottom right. Letters your guesses show grey fade on the keyboard and are <b>locked</b>, so you can’t type one by mistake. Want one anyway? Tap the blue <b>Lock</b> key (bottom left) to unlock them until your next guess. (Settings can turn Lock off.)',
      '<b>Hard mode</b> (Settings): whatever you’ve found must be used in the next guesses. <b>High-contrast colors</b> swap green and gold for orange and blue.'
    ].map(function (x) { return '<li>' + x + '</li>'; }).join('');
    $('ovHelp').classList.add('show');
  }

  // ================= wiring =================
  function syncSound() {
    $('btnSound').innerHTML = '<svg viewBox="0 0 24 24"><use href="#i-sound-' + (settings.sound ? 'on' : 'off') + '"/></svg>';
    $('btnSound').classList.toggle('on', settings.sound); $('setSound').checked = settings.sound; S.setEnabled(settings.sound);
  }
  function syncAds() { $('setAds').checked = Goobs.adsOn(); $('adEvery').textContent = settings.adEvery; $('rowAdEvery').classList.toggle('off', !Goobs.adsOn()); }
  function syncLook() { document.documentElement.classList.toggle('lm-contrast', settings.contrast); $('setContrast').checked = settings.contrast; $('setHard').checked = settings.hard; $('setLock').checked = settings.lock; }
  function sheet(btn, ov, close, onOpen) {
    if (btn) $(btn).addEventListener('click', function () { if (onOpen) onOpen(); $(ov).classList.add('show'); });
    $(close).addEventListener('click', function () { $(ov).classList.remove('show'); });
    $(ov).addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  }
  function init() {
    // full screen: How to, Share (also on the result card), Stats and Settings go into the Menu; the info row moves into
    // the top row (see renderInfo) so the grid and the keyboard get the height
    fs = Goobs.fullscreen({ menu: ['btnHelp', 'btnShare', 'btnStats', 'btnSettings'], info: menuInfo });
    $('app').querySelector('.top').insertBefore($('info'), $('app').querySelector('.topbtns'));
    Goobs.themePicker($('themes'));
    buildKeys();
    $('kb').addEventListener('click', function (e) { var b = e.target.closest('button[data-k]'); if (b) type(b.dataset.k); });
    document.addEventListener('keydown', function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'Enter') { e.preventDefault(); type('enter'); }
      else if (e.key === 'Backspace') { e.preventDefault(); type('back'); }
      else if (/^[a-z]$/i.test(e.key)) type(e.key.toLowerCase());
    });
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) { document.addEventListener(ev, function () { S.unlock(); }, { passive: true }); });
    $('btnHome').addEventListener('click', function () { save(); Goobs.home(); });
    $('modes').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) switchMode(b.dataset.mode); });
    // New word lives at the top (in the info row, Practice only), away from the keyboard's Enter key
    $('info').addEventListener('click', function (e) {
      if (!e.target.closest('#btnNew')) return;
      if (g.rows.length && !g.done) { showCard('New word?', 'This one ends unsolved (practice only, no streak lost).', [{ label: 'New word', red: true, go: function () { stats.practice.played++; saveStats(); open('practice', true); } }, { label: 'Keep going', go: function () {} }]); return; }
      between(function () { open('practice', true); });
    });
    $('btnShare').addEventListener('click', share);
    $('btnEnter').addEventListener('click', function () { type('enter'); });
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings');
    sheet('btnStats', 'ovStats', 'btnCloseStats', renderStats);
    $('btnHelp').addEventListener('click', openHelp);
    function closeHelp() { $('ovHelp').classList.remove('show'); if (!meta.seen) { meta.seen = true; saveMeta(); } }
    $('btnCloseHelp').addEventListener('click', closeHelp);
    $('ovHelp').addEventListener('click', function (e) { if (e.target === this) closeHelp(); });
    $('btnSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncSound(); S.ding(); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); syncSound(); S.ding(); });
    $('setHard').addEventListener('change', function () {
      if (g && g.rows.length && !g.done && this.checked !== g.hard) { this.checked = settings.hard; toast('Finish this word first'); return; }
      settings.hard = this.checked; saveSettings(); if (g && !g.rows.length) { g.hard = settings.hard; save(); renderInfo(); }
    });
    $('setContrast').addEventListener('change', function () { settings.contrast = this.checked; saveSettings(); syncLook(); });
    $('setLock').addEventListener('change', function () { settings.lock = this.checked; saveSettings(); if (g) renderKeys(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncAds(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncAds(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncAds(); });
    if (window.ResizeObserver) new ResizeObserver(layout).observe($('gridwrap'));
    window.addEventListener('resize', layout);
    // the clock, and a new word at midnight
    setInterval(function () {
      var cd = $('countdown'); if (cd) cd.textContent = countdown();
      var cd2 = $('cd2'); if (cd2) cd2.textContent = countdown();
      if (isDaily(meta.mode) && g && g.day !== today() && !busy) { $('ovEnd').classList.remove('show'); open(meta.mode); toast('New words!'); }
    }, 1000);
    document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });
    window.addEventListener('pagehide', save);
    syncSound(); syncAds(); syncLook();
    open(meta.mode === 'practice' || meta.mode === 'daily2' ? meta.mode : 'daily', false);
    if (!meta.seen) openHelp();
    else if (g.done && isDaily(meta.mode)) setTimeout(function () { showResult(false); }, 400);
    Goobs.markPlayed('daily');
    Goobs.initUpdates({ beforeReload: save, onVersions: function (v) { $('version').textContent = 'Lettermind ' + (v.daily || '?') + ' · Goobs-Games ' + (v.shell || '?'); } });
  }

  // hook for automated tests
  window.__lm = { get g() { return g; }, type: type, LM: LM, stats: function () { return stats; }, open: open, shareText: shareText };

  init();
})();
</script>
</body>
</html>
