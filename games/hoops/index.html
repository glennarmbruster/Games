<style>
/* Pool Party Hoops styles (themes, UI kit and ad cards come from /shared/goobs.css) */
.brand svg { border-radius: 10px; }
.brand h1 { font-size: 19px; white-space: nowrap; }
.modes button { font-size: 14px; }
.stagewrap { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; align-items: stretch; justify-content: center; }
.stage { position: relative; flex: 1 1 auto; max-width: 620px; border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); touch-action: none;
  background: linear-gradient(#5fb8f5, #cdeafc 55%, #6cc04a 55.2%); }
.stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
#ink { pointer-events: none; }
.wind { position: absolute; left: 10px; top: 10px; display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.88); color: #1b3a6b; border-radius: 14px; padding: 5px 10px 5px 7px; font-weight: 900; font-size: 14px; pointer-events: none; box-shadow: 0 2px 0 rgba(0,0,0,.1); }
.wind.hidden { display: none; }
.wind svg { width: 22px; height: 22px; transition: transform .3s; }
.spotname { position: absolute; right: 10px; top: 10px; background: rgba(255,255,255,.88); color: #1b3a6b; border-radius: 14px; padding: 5px 11px; font-weight: 800; font-size: 13px; pointer-events: none; box-shadow: 0 2px 0 rgba(0,0,0,.1); }
.spotname .long { color: #e0303f; }
.label { position: absolute; left: 50%; top: 9%; transform: translate(-50%, 0) scale(.8); opacity: 0; transition: opacity .2s, transform .25s; pointer-events: none; text-align: center;
  font-weight: 900; font-size: 30px; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.25), 0 0 18px rgba(0,60,120,.5); white-space: nowrap; }
.label small { display: block; font-size: 16px; font-weight: 800; }
.label.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
.label.miss { color: #e8f6ff; font-size: 24px; }
.flickhint { position: absolute; left: 50%; bottom: 3.5%; transform: translateX(-50%); background: rgba(10,30,60,.55); color: #fff; font-weight: 800; font-size: 15px; padding: 7px 14px; border-radius: 16px; pointer-events: none; opacity: 0; transition: opacity .3s; }
.flickhint.show { opacity: 1; animation: hpbob 1.4s ease-in-out infinite; }
@keyframes hpbob { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -8px); } }
.loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; color: #1b3a6b; pointer-events: none; }
.loading.hide { display: none; }
.toast { position: absolute; left: 50%; top: 42%; transform: translateX(-50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: rgba(10,14,36,.78); color: #fff; font-weight: 800; font-size: 15px; padding: 8px 15px; border-radius: 14px; white-space: nowrap; }
.toast.show { opacity: 1; }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 3px 9px; font-weight: 800; font-size: 15px; color: var(--ink); }
.chip:after { content: '▾'; font-size: 11px; color: var(--muted); }
.dots { letter-spacing: 2px; color: #e0303f; }
.lvgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lv { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); min-height: 56px; font-weight: 800; font-size: 15px; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; padding: 6px; }
.lv small { font-size: 12px; color: var(--muted); font-weight: 700; }
.lv.cur { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.lv.cur small { color: inherit; opacity: .8; }
.tool.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.cardicon svg { border-radius: 16px; }
.ptable { width: 100%; border-collapse: collapse; font-size: 14px; }
.ptable th { text-align: right; font-size: 12px; color: var(--muted); padding: 4px; }
.ptable td { text-align: right; padding: 6px 4px; border-top: 1px solid var(--line); font-weight: 700; }
.ptable td:first-child, .ptable th:first-child { text-align: left; }
@media (max-width: 430px) { .brand h1 { font-size: 16.5px; } }
/* Full screen (1.1.0, Glenn: "every game full screen"): the pool fills the whole screen; the counters ride in the
   floating top row as white pills, the spot and wind tags float just under it, the flick hint sits clear of the home
   bar. Mode tabs, How to, Spot, Wind, Reset, Stats and Settings live in the Menu sheet. */
html.gg-fs-over, html.gg-fs-over body { background: #8fd3ff; }
html.gg-fs-over .stagewrap { position: fixed; inset: 0; z-index: 0; }
html.gg-fs-over .stage { max-width: none; border-radius: 0; box-shadow: none; }
html.gg-fs-over .top .info { flex: 1 1 auto; width: auto; min-width: 0; min-height: 44px; gap: 5px; justify-content: center; padding: 0; }
html.gg-fs-over .top .info > div { background: rgba(255,255,255,.9); color: #1b1f33; border-radius: 16px; box-shadow: 0 3px 10px rgba(0,0,0,.18); height: 44px; box-sizing: border-box;
  padding: 3px 9px; min-width: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
html.gg-fs-over .top .info .lbl { font-size: 10px; color: #5b6280; letter-spacing: .3px; line-height: 1.1; }
html.gg-fs-over .top .info .mid { font-size: 16px; color: #1b1f33; white-space: nowrap; }
html.gg-fs-over .top .info .chip { border: 0; background: none; padding: 0; font-size: 16px; color: #1b1f33; }
html.gg-fs-over .wind { left: calc(env(safe-area-inset-left, 0px) + 10px); top: calc(env(safe-area-inset-top, 0px) + 58px); }
html.gg-fs-over .spotname { right: calc(env(safe-area-inset-right, 0px) + 10px); top: calc(env(safe-area-inset-top, 0px) + 58px); }
html.gg-fs-over .label { top: calc(env(safe-area-inset-top, 0px) + 96px); }
html.gg-fs-over .flickhint { bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); }
.ggmenu .modes { margin: 2px 0 4px; }
@media (max-width: 385px) { html.gg-fs-over .top .info > div { padding: 3px 7px; } html.gg-fs-over .top .info { gap: 4px; } }
@media (max-width: 385px) { .brand h1 { font-size: 15px; } .modes button { font-size: 13px; } }
.ballpicker {padding:8px 0 14px;} .ballchoices {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0;}
.ballchoices button {min-height:76px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;font:700 13px system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;touch-action:manipulation;}
.ballchoices button[aria-pressed="true"] {border:2px solid var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
.ballchoices button:focus-visible {outline:3px solid var(--accent);outline-offset:3px;}
.ballpicker small {color:var(--muted);font-size:12px;}
.ballthumb {display:block;width:30px;height:30px;border-radius:50%;box-shadow:inset -5px -5px 7px #0005,inset 3px 3px 5px #fff5,0 2px 3px #0002;}
.ballthumb.beach {background:conic-gradient(#f34a38 0 60deg,#fff 60deg 120deg,#ffca32 120deg 180deg,#168fe0 180deg 240deg,#fff 240deg 300deg,#27a65b 300deg);}
.ballthumb.basketball {background:linear-gradient(transparent 46%,#301c16 47% 52%,transparent 53%),linear-gradient(90deg,transparent 46%,#301c16 47% 52%,transparent 53%),#d36321;}
.ballthumb.football {width:38px;height:24px;margin:3px 0;border-radius:50%;background:repeating-linear-gradient(90deg,transparent 0 4px,#eee 4px 6px) center / 18px 6px no-repeat,linear-gradient(90deg,#fff0 15%,#f4e7d3 16% 23%,#fff0 24% 76%,#f4e7d3 77% 84%,#fff0 85%),#81411f;}

<script>
/* Pool Party Hoops logic: the backyard pool, the floating hoop, beach-ball flight (drag, wind, spin), collisions with
   the rim, board, post, float, deck and water, make/swish detection, scoring, spots and modes. No drawing, so it also
   runs in Node (tools/check.js proves every spot can be made with a comfortable window).
   Units metres and seconds. x right, y up, z toward the far end of the pool. Deck at y = 0. */
var PH = (function () {
  'use strict';
  var DT = 1 / 120, G = 9.8;
  var POOL = { x0: -2.5, x1: 2.5, z0: -4.5, z1: 4.5 }, WATER = -0.3;
  var BR = 0.12;                         // beach ball radius
  var KD = 0.12, KM = 0.022, SPIN_DECAY = 0.35;
  var RIM_R = 0.24, RIM_T = 0.015, RIM_H = 1.05, RIM_OUT = 0.3;   // rim radius, tube, height above the water, in front of the board
  var BOARD_W = 0.72, BOARD_H = 0.5, BOARD_T = 0.03, BOARD_Y = 1.3; // board centre height above the water
  var BASE_R = 0.42, BASE_H = 0.16, POST_R = 0.03;
  var ANCHOR = [0, -1.2];                // where the hoop floats (x, z)
  var RELEASE_H = 1.15, RELEASE_BACK = 0.1; // the ball leaves the hands 1.15 m above the deck

  // ---------------- the spots around the deck (in Around the World order) ----------------
  var SPOTS = [
    { name: 'Shallow end', x: 0, z: -5.0 },
    { name: 'Right corner', x: 2.9, z: -4.1 },
    { name: 'Right side', x: 3.0, z: -1.3 },
    { name: 'Right far side', x: 3.0, z: 2.3 },
    { name: 'Deep end', x: 0.2, z: 5.0 },
    { name: 'Left far side', x: -3.0, z: 2.3 },
    { name: 'Left side', x: -3.0, z: -1.0 }
  ];
  SPOTS.forEach(function (s) { s.dist = Math.hypot(s.x - ANCHOR[0], s.z - ANCHOR[1]); s.long = s.dist >= 5.5; });

  function rng(seed) { var s = seed >>> 0 || 1; return function () { s = (s + 0x6D2B79F5) | 0; var t = Math.imul(s ^ (s >>> 15), s | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  // ---------------- water ----------------
  function waterY(x, z, t) { return WATER + 0.025 * Math.sin(1.3 * x + 1.7 * t) + 0.02 * Math.sin(0.9 * z - 1.2 * t + 0.5) + 0.01 * Math.sin(2.1 * (x + z) + 2.3 * t); }
  function inPool(x, z) { return x > POOL.x0 && x < POOL.x1 && z > POOL.z0 && z < POOL.z1; }

  // ---------------- the hoop ----------------
  // world state: the hoop's float drifts in a slow loop, bobs, turns to face the shooter; splashes push it (a spring)

  function between(next) {
    if (Goobs.adsOn() && meta.finished > 0 && meta.finished % settings.adEvery === 0 && meta.lastAdAt !== meta.finished) { meta.lastAdAt = meta.finished; saveMeta(); next(); showAd(function () {}); return; }
    next();
  }
  function openSpots() {
    $('lvgrid').innerHTML = SPOTS.map(function (s, i) { return '<button class="lv' + (i === meta.spot ? ' cur' : '') + '" data-n="' + i + '">' + (i + 1) + '. ' + s.name + '<small>' + ft(s.dist) + ' ft' + (s.long ? ' · long +1' : '') + '</small></button>'; }).join('');
    $('ovLevels').classList.add('show');
  }
  function openHelp() {
    $('helpTitle').textContent = 'How to play Pool Party Hoops';
    $('helpList').innerHTML = [
      '<b>Flick up</b> from the bottom of the screen to shoot. A faster flick throws farther; flick a little left or right to aim; <b>bend</b> your flick to put spin on the ball (it curves the way you bend).',
      'It\'s a beach ball: light and floaty, soft off the rim, and the wind pushes it around. The hoop floats and bobs, and splashes nudge it.',
      '<b>Scoring</b>: a make is 2, a <b>swish</b> (no rim, no board) is 3, a long shot from the deep end +1. Make 3 in a row and the ball heats up: points ×2 (×3 from 6 in a row). A miss cools it off.',
      '<b>Free Shoot</b>: any spot (Spot button), wind on or off (Wind button). Just practice.',
      '<b>Around the World</b>: 7 spots in order. Stay at each spot until you make a basket, then move on. There is no miss limit or backward move. The clock starts with your first shot. Fastest time wins.',
      '<b>Tap the screen</b> while the ball is flying to skip to the result, and again to get the next ball.',
      'Tap the <b>shooter</b> name to switch between Glenn, Cindy and Guest. Each has their own stats (trophy button).'
    ].map(function (x) { return '<li>' + x + '</li>'; }).join('');
    $('ovHelp').classList.add('show');
  }
  function renderStats() {
    var rows = Object.keys(meta.players).map(function (id) { var s = stats[id]; return '<tr><td>' + meta.players[id] + '</td><td>' + s.makes + '/' + s.att + '</td><td>' + (s.makes ? Math.round(s.swish / s.makes * 100) : 0) + '%</td><td>' + (s.longest ? ft(s.longest) + ' ft' : '–') + '</td><td>' + s.bestStreak + '</td><td>' + (s.atpBest ? clock(s.atpBest) : '–') + '</td></tr>'; }).join('');
    $('statsBody').innerHTML = '<table class="ptable"><tr><th>Shooter</th><th>Makes</th><th>Swish</th><th>Longest</th><th>Streak</th><th>Around</th></tr>' + rows + '</table><p class="version">Swish % is swishes out of makes. Around = best Around the World time.</p>';
  }

  // ================= wiring =================
  function syncSound() { $('btnSound').innerHTML = '<svg viewBox="0 0 24 24"><use href="#i-sound-' + (settings.sound ? 'on' : 'off') + '"/></svg>'; $('btnSound').classList.toggle('on', settings.sound); $('setSound').checked = settings.sound; S.setEnabled(settings.sound); }
  function syncAds() { $('setAds').checked = Goobs.adsOn(); $('adEvery').textContent = settings.adEvery; $('rowAdEvery').classList.toggle('off', !Goobs.adsOn()); }
  function sheet(btn, ov, close, onOpen) {
    if (btn) $(btn).addEventListener('click', function () { if (onOpen) onOpen(); $(ov).classList.add('show'); });
    $(close).addEventListener('click', function () { $(ov).classList.remove('show'); });
    $(ov).addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  }
  function resize() { if (!SC) return; var r = host.getBoundingClientRect(); SC.resize(Math.max(10, r.width), Math.max(10, r.height)); }
  function menuInfo() {
    if (meta.mode === 'around' && around) return '<b>Around the World</b> · ' + meta.players[meta.player] + ' · spot <b>' + (around.spot + 1) + '</b> of ' + SPOTS.length;
    return '<b>Free Shoot</b> · ' + meta.players[meta.player] + ' · ' + session.makes + '/' + session.att + ' makes';
  }
  function init() {
    Goobs.themePicker($('themes'));
    // Full screen (1.1.0): the pool fills the screen; the counters join the floating top row, the mode tabs and the
    // rarely used buttons go into the Menu sheet (the frame loop pauses while it's open: sheetOpen() checks ggMenu)
    var fs = Goobs.fullscreen({ overlay: true, menu: ['btnHelp', 'btnSpot', 'btnWind', 'btnNew', 'btnStats', 'btnSettings'], info: menuInfo });
    document.querySelector('.top').insertBefore($('info'), document.querySelector('.top .topbtns'));
    fs.el.querySelector('.sheet').insertBefore($('modes'), fs.list);
    fs.el.querySelector('.sheet').insertBefore($('ballPicker'), fs.list);
    function syncBallChoice(){document.querySelectorAll('[data-ball]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.ball===settings.ball));});}
    syncBallChoice();
    $('ballPicker').addEventListener('click',function(e){var b=e.target.closest('button[data-ball]');if(!b)return;settings.ball=b.dataset.ball;saveSettings();syncBallChoice();if(SC&&state==='ready')SC.setBallStyle(settings.ball);fs.close();toast(state==='ready'?b.textContent.trim():b.textContent.trim()+' next shot');});
    $('modes').addEventListener('click', function (e) { if (e.target.closest('button')) fs.close(); });
    host = $('stage'); canvas = $('cv');
    canvas.addEventListener('pointerdown', onDown); canvas.addEventListener('pointermove', onMove); canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { stroke = null; });
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) { document.addEventListener(ev, function () { S.unlock(); }, { passive: true }); });
    $('btnHome').addEventListener('click', function () { Goobs.home(); });
    $('modes').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b || b.dataset.mode === meta.mode || state === 'flying') return;
      var go = b.dataset.mode === 'around' ? startAround : startFree;
      if (around && around.started && !around.done) { showCard('Leave this round?', 'The clock stops and it won\'t count.', [{ label: 'Leave it', red: true, go: go }, { label: 'Keep going', go: function () {} }]); return; }
      go();
    });
    $('btnNew').addEventListener('click', function () {
      if (state === 'flying') return;
      if (meta.mode === 'around') { if (around && around.started && !around.done) { showCard('Restart?', 'Back to spot 1, clock reset.', [{ label: 'Restart', red: true, go: startAround }, { label: 'Keep going', go: function () {} }]); return; } startAround(); }
      else { session = { att: 0, makes: 0 }; streak = 0; renderAll(); toast('Tally reset'); }
    });
    $('btnSpot').addEventListener('click', openSpots);
    $('lvgrid').addEventListener('click', function (e) { var b = e.target.closest('button[data-n]'); if (!b) return; $('ovLevels').classList.remove('show'); if (state === 'flying') return; goSpot(+b.dataset.n); S.whoosh(); });
    $('btnWind').addEventListener('click', function () { setWind(((meta.wind || 0) + 1) % 3); toast(['No wind', 'A light breeze', 'Gusty!'][meta.wind]); });
    sheet(null, 'ovLevels', 'btnCloseLevels');
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings');
    sheet('btnStats', 'ovStats', 'btnCloseStats', renderStats);
    $('btnHelp').addEventListener('click', openHelp);
    function closeHelp() { $('ovHelp').classList.remove('show'); if (!meta.seen) { meta.seen = true; saveMeta(); } }
    $('btnCloseHelp').addEventListener('click', closeHelp);
    $('ovHelp').addEventListener('click', function (e) { if (e.target === this) closeHelp(); });
    $('btnSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncSound(); S.ding(); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); syncSound(); S.ding(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncAds(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncAds(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncAds(); });
    var rq = 0, refit = function () { if (rq) return; rq = requestAnimationFrame(function () { rq = 0; resize(); }); };
    if (window.ResizeObserver) new ResizeObserver(refit).observe(host);
    window.addEventListener('resize', refit);
    syncSound(); syncAds();
    if (!meta.seen) openHelp();
    Goobs.markPlayed('hoops');
    Goobs.initUpdates({ onVersions: function (v) { $('version').textContent = 'Pool Party Hoops ' + (v.hoops || '?') + ' · Goobs-Games ' + (v.shell || '?'); } });
    renderAll();
    import('../../shared/three.module.min.js').then(function (m) {
      T = m; SC = HPScene.build(T, canvas, PH); SC.setBallStyle(settings.ball); $('loading').classList.add('hide');
      resize();
      if (meta.mode === 'around') startAround(); else startFree();
      requestAnimationFrame(frame);
    }).catch(function () { $('loading').textContent = 'Couldn’t load the pool. Check the connection once, then it works offline.'; });
  }

  // hook for automated tests
  window.__hp = { PH: PH, get W() { return W; }, get ball() { return ball; }, get state() { return state; }, shoot: shoot, flick: function (speed, dx, curve) { return shoot({ speed: speed, dx: dx || 0, curve: curve || 0 }); },
    get around() { return around; }, meta: function () { return meta; }, stats: function () { return stats; }, spot: spot, startAround: startAround, startFree: startFree, goSpot: goSpot,
    project: function (x, y, z) { return SC ? SC.project(x, y, z) : null; }, get ready() { return !!SC; }, get SC() { return SC; }, set speed(v) { SPEED = v; }, get streak() { return streak; } };

  init();
})();
</script>
<script src="../../shared/collection-batch4.js"></script>
</body>
</html>
