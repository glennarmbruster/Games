<script>
/* if Shelf Life can't open, say so on screen (never a blank page) and offer a fresh start */
(function () {
  var shown = false;
  function fail(msg) {
    if (shown || window.__slReady) return; shown = true;
    function put() {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:#eef6ff;color:#1b1f33;font:600 16px -apple-system,system-ui,sans-serif;text-align:center';
      d.innerHTML = '<b style="font-size:21px">Shelf Life didn\u2019t open</b><div style="max-width:320px;opacity:.75;font-size:13px">' + String(msg).replace(/[<>&]/g, '') + '</div>';
      function btn(t, bg, go) { var b = document.createElement('button'); b.textContent = t; b.style.cssText = 'font:800 17px -apple-system,system-ui,sans-serif;padding:13px 24px;border-radius:14px;border:0;color:#fff;background:' + bg; b.onclick = go; d.appendChild(b); }
      btn('Start fresh', '#5a54f0', function () { try { localStorage.removeItem('shelf.game'); } catch (e) { /* ignore */ } location.reload(); });
      btn('All games', '#6b7080', function () { location.href = '../../'; });
      document.body.appendChild(d);
    }
    if (document.body) put(); else document.addEventListener('DOMContentLoaded', put);
  }
  window.addEventListener('error', function (e) { fail((e.message || 'Something went wrong') + (e.lineno ? ' (line ' + e.lineno + ')' : '')); });
  setTimeout(function () { if (!window.__slReady) fail('It took too long to start.'); }, 30000);
})();
</script>

.brand h1 { font-size: 22px; }
.stagewrap { flex: 1 1 auto; min-height: 0; width: calc(100% + 20px); margin: 0 -10px; display: flex; align-items: stretch; justify-content: center; }
.stage { position: relative; flex: 1; border-radius: 18px; overflow: hidden; touch-action: none; margin: 0 10px;
  background: linear-gradient(180deg, #dff4ff 0%, #c9e6ff 55%, #b7d5ff 100%); box-shadow: var(--shadow); }
[data-theme="dark"] .stage, [data-theme="blue"] .stage { background: linear-gradient(180deg, #2c3a5c 0%, #22304e 60%, #1a2440 100%); }

.toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); max-width: 92%; text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: rgba(20,24,36,.82); color: #fff; font-weight: 700; font-size: 14px; padding: 8px 14px; border-radius: 14px; }
.toast.show { opacity: 1; }
.toolbar .tool { position: relative; font-size: 13px; }
.tool .cnt { position: absolute; top: 3px; right: 5px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--gold); color: #3a2a00; font-style: normal; font-weight: 800; font-size: 12px; line-height: 20px; }
.tool.red .cnt { background: #ffffff; color: var(--accent); }
.cardicon svg { border-radius: 16px; }
.lv { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); height: 52px; font-weight: 800; font-size: 16px; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.lv small { font-size: 11px; color: #e0a800; letter-spacing: -1px; }
.lv.cur { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.lv:disabled { opacity: .35; }
.stars { font-size: 34px; color: #ffb224; letter-spacing: 4px; margin: -4px 0 4px; }
.stars i { font-style: normal; color: var(--line-strong); }
/* full screen (kit): the counters are pills in the top row, so the game's name is hidden there (the Menu shows it)
   and the stage runs to the very edges of the screen (three cubbies to a shelf make the items width-bound on a phone). */
html.gg-fs .top .brand h1 { display: none; }
html.gg-fs .top .brand { flex: none; }
.ttpills { flex: 1 1 auto; width: auto; min-width: 0; min-height: 0; justify-content: flex-end; gap: 6px; padding: 0; cursor: pointer; }
.ttpills .ggpill { flex: none; }
@media (max-width: 385px) { .ttpills { gap: 4px; } .ttpills .ggpill { padding: 7px 8px; font-size: 15px; } .ttpills .ggpill small { font-size: 12px; } } /* pills fit an SE */
.ttpills.tight .ggpill { padding-left: 7px; padding-right: 7px; }
.ttpills.tight .ggpill small { display: none; }
.ttpills .ggpill small { font-size: 13px; font-weight: 700; color: var(--muted); }
html.gg-fs .stagewrap { width: auto; align-self: stretch; margin: 0 calc(-8px - env(safe-area-inset-right, 0px)) 0 calc(-8px - env(safe-area-inset-left, 0px)); }
html.gg-fs .stage { margin: 0; border-radius: 0; }

html.gg-fs,html.gg-fs body { background:#263e34; }
html.gg-fs .top { padding-bottom:4px; }
.top .iconbtn,.top .homebtn { background:#f2e8d5;color:#344e41;box-shadow:0 2px 5px #0002; }
.ttpills .ggpill { background:#efe7d5;color:#344638;border:1px solid #b9ab8b;border-radius:10px;box-shadow:0 2px 3px #0002; }
.ttpills .ggpill small { color:#676e5e; }
html.gg-fs .toolbar .tool { background:#f0e5cc;color:#3f4e3b;border:1px solid #b5a585;border-radius:10px;box-shadow:0 3px 0 #0003; }

.stage { background:#73826c!important; }

<script>
/* Shelf Life rules (no DOM; runs in Node for the checks).
   The store has cubbies. Each cubby shows a front row of 3 slots; more rows wait behind it (the next one shows
   through, darker). Move any front item into an empty front slot of any open cubby. Three of the same item in a
   cubby's front row clear. When a front row is empty the row behind slides forward. Some cubbies are locked
   behind glass until you've made enough matches. Clear every item to win; with no empty slot left you're stuck.
   Levels are made from the level number (seeded) by playing backwards from the finished, empty store: every step
   undoes a legal move, a clear or a row sliding forward. The steps played forward are a solution, and each level
   is checked by replaying them with the real rules before it's used, so every level can be cleared. */
var SH = (function () {
  'use strict';
  var KINDS = 30, E = -1;
  function rng(seed) { var s = (seed >>> 0) || 1; return function () { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
  function shuffle(a, r) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  // ---------------- the level recipe ----------------
  function recipe(n) {
    var b = n % 10 === 0 && n > 10 ? n - 6 : n; // every tenth level is a breather
    // cubbies: a few at first, then shelves of three filling up to 8 shelves (24 cubbies) by level 45
    var raw = b <= 1 ? 3 : b <= 2 ? 4 : b <= 3 ? 5 : b <= 5 ? 6 : Math.min(24, 6 + Math.floor((b - 5) * 0.45));
    var boxes = raw >= 9 ? 3 * Math.floor(raw / 3) : raw;
    // threes to clear: about 1.7 per cubby early, rising to 2.6 per cubby (60+ matches on a full store)
    var triples = b <= 1 ? 2 : b <= 2 ? 4 : b <= 4 ? 6 : Math.round(boxes * (1.6 + Math.min(1, b / 55)));
    var kinds = Math.min(KINDS, b <= 1 ? 2 : b <= 2 ? 3 : b <= 4 ? 5 : 5 + Math.floor(b * 0.35));
    var depth = b <= 1 ? 1 : b <= 8 ? 3 : b <= 30 ? 4 : 5;        // most rows a cubby may hold
    var mix = b <= 20 ? 0 : b <= 60 ? (b % 3 === 0 ? 1 : 0) : (b % 4 === 3 ? 2 : 1); // extra shuffling moves per three
    var locks = b < 15 ? 0 : b < 40 ? 1 : b < 70 ? 2 : 3;
    return { boxes: boxes, triples: triples, kinds: kinds, depth: depth, mix: mix, locks: locks, breather: b !== n };
  }
  // One roll of level n, built backwards from the finished (empty) store: every step undoes a legal forward step
  // (a move, a three clearing, a row sliding forward), so playing the steps back in order clears the level.
  // Returns { n, boxes: [{ L: [[k,k,k], ...], need }], plan: [[from, to, kind], ...] } or null.
  function roll(n, attempt, tune) {
    var R = rng(n * 7919 + attempt * 104729 + 17), rc = recipe(n), nb, i;
    if (tune) for (var tk in tune) rc[tk] = typeof tune[tk] === 'function' ? tune[tk](rc) : tune[tk];
    nb = rc.boxes;
    var boxes = []; for (i = 0; i < nb; i++) boxes.push({ L: [[E, E, E]], need: 0 });
    var log = [];
    var pick = function (a) { return a[Math.floor(R() * a.length)]; };
    var items = function (row) { return 3 - emptyIn(row); };
    // push a cubby's front row back one (undoing a row sliding forward); its front is then empty
    function pushBack(b) { boxes[b].L.unshift([E, E, E]); }
    // undo a forward move to->from: take kind k out of box "to" and put it back in box "from"
    function unMove(from, to, k) { var f = boxes[to].L[0], s = f.indexOf(k); f[s] = E; var g2 = boxes[from].L[0], t = g2.indexOf(E); g2[t] = k; log.push([from, to, k]); }
    // where an item can be put back: a cubby with room in front (optionally pushing its row back first to make room)
    function homes(except, allowPush) {
      var out = [];
      boxes.forEach(function (bx, b) {
        if (b === except) return; var f = bx.L[0], it = items(f);
        if (it < 3 && (it > 0 || bx.L.length === 1)) out.push({ b: b, push: false });
        if (allowPush && it > 0 && bx.L.length < rc.depth) out.push({ b: b, push: true });
      });
      return out;
    }
    var kindsList = shuffle(Array.apply(null, { length: KINDS }).map(function (_, k) { return k; }), R).slice(0, rc.kinds);
    var seq = []; for (i = 0; i < rc.triples; i++) seq.push(i < kindsList.length ? kindsList[i] : pick(kindsList));
    shuffle(seq, R);
    for (var t = 0; t < seq.length; t++) {
      var k = seq[t];
      // a cubby for the three: an empty one, else push a row back (the three cleared there and that row came forward)
      var empty = []; boxes.forEach(function (bx, b) { if (items(bx.L[0]) === 0) empty.push(b); });
      var B;
      if (empty.length && (R() < 0.6 || !boxes.some(function (bx) { return bx.L.length < rc.depth && items(bx.L[0]) > 0; }))) B = pick(empty);
      else { var can = []; boxes.forEach(function (bx, b) { if (bx.L.length < rc.depth && items(bx.L[0]) > 0) can.push(b); }); if (!can.length) return null; B = pick(can); pushBack(B); }
      boxes[B].L[0] = [k, k, k];
      // the third one arrived from somewhere
      var hs = homes(B, true); if (!hs.length) return null;
      var h = pick(hs); if (h.push) pushBack(h.b); unMove(h.b, B, k);
      // extra moves that mixed things up (undone the same way)
      for (var m = 0; m < rc.mix; m++) {

      '<span class="ggpill">' + Math.max(0, g.total - g.cleared) + ' <small>left</small>' + (settings.timer ? ' · <span id="clock">' + clock(g.ms) + '</span>' : '') + '</span>';
    fitPills();
    $('cntUndo').textContent = meta.boost.undo; $('cntShuffle').textContent = meta.boost.shuffle; $('cntHint').textContent = meta.boost.hint;
  }
  var toastT = 0;
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('show'); }, 2200); }
  function showCard(title, html, buttons) {
    $('cardIcon').innerHTML = '<svg viewBox="0 0 100 100"><use href="#sl-logo"/></svg>';
    $('endTitle').textContent = title; $('endText').innerHTML = html;
    var box = $('endActions'); box.innerHTML = ''; box.style.flexDirection = buttons.length > 1 ? 'column' : '';
    buttons.forEach(function (b) { var el = document.createElement('button'); el.className = 'btn' + (b.red ? ' red' : ''); el.textContent = b.label; el.addEventListener('click', function () { $('ovEnd').classList.remove('show'); b.go(); }); box.appendChild(el); });
    $('ovEnd').classList.add('show');
  }
  function showAd(done2) { GoobsAds.show({ onShow: function () { S.ding(); }, onStep: function () { S.sign(); } }, done2); }
  function between(next) {
    if (Goobs.adsOn() && meta.finished > 0 && meta.finished % settings.adEvery === 0 && meta.lastAdAt !== meta.finished) { meta.lastAdAt = meta.finished; saveMeta(); next(); showAd(function () {}); return; }
    next();
  }
  function openLevels() {
    var h = '', top = Math.max(20, Math.ceil((meta.open + 5) / 20) * 20);
    for (var n = 1; n <= top; n++) { var st = meta.stars[n] || 0; h += '<button class="lv' + (g && n === g.n ? ' cur' : '') + '" data-n="' + n + '"' + (n > meta.open ? ' disabled' : '') + '>' + n + '<small>' + '★★★'.slice(0, st) + '</small></button>'; }
    $('lvgrid').innerHTML = h; $('ovLevels').classList.add('show');
  }
  function openHelp() {
    $('helpList').innerHTML = [
      '<b>Drag</b> an item from a cubby\'s front row into an empty slot in any other cubby. (Or <b>tap</b> an item to pick it up, then tap where it goes.)',
      'Put <b>three of the same</b> item in one cubby and they clear.',
      'Rows wait <b>behind</b> the front one (you can see the next, darker). When a front row is empty, the row behind slides forward. The dots at the top of a cubby count the rows left behind.',
      '<b>Locked</b> cubbies (behind glass) open after the number of matches shown on the lock.',
      'Fill every front slot without a match and you\'re <b>out of room</b>. <b>Undo</b> takes a move back, <b>Shuffle</b> mixes the front rows, <b>Hint</b> shows a good move. Each level you clear adds one of them (they take turns).',
      'Faster clears earn more <b>stars</b>. Every level has been checked: it can be cleared.'
    ].map(function (x) { return '<li>' + x + '</li>'; }).join('');
    $('ovHelp').classList.add('show');
  }
  function renderStats() {
    var stars = 0; for (var n in meta.stars) stars += meta.stars[n];
    $('statsBody').innerHTML = '<div class="tiles"><div class="tile"><b>' + fmt(meta.open - 1) + '</b><span>Levels cleared</span></div><div class="tile"><b>' + fmt(stars) + '</b><span>Stars</span></div><div class="tile"><b>' + fmt(stats.bestStreak) + '</b><span>Best streak</span></div></div>' +
      '<div class="tiles"><div class="tile"><b>' + fmt(stats.matches) + '</b><span>Matches</span></div><div class="tile"><b>' + fmt(stats.stuck) + '</b><span>Out of room</span></div><div class="tile"><b>' + fmt(stats.boosters) + '</b><span>Boosters used</span></div></div>';
  }

  // ================= wiring =================
  function syncSound() { $('btnSound').innerHTML = '<svg viewBox="0 0 24 24"><use href="#i-sound-' + (settings.sound ? 'on' : 'off') + '"/></svg>'; $('btnSound').classList.toggle('on', settings.sound); $('setSound').checked = settings.sound; S.setEnabled(settings.sound); }
  function syncAds() { $('setAds').checked = Goobs.adsOn(); $('adEvery').textContent = settings.adEvery; $('rowAdEvery').classList.toggle('off', !Goobs.adsOn()); }
  function sheet(btn, ov, close, onOpen) {
    if (btn) $(btn).addEventListener('click', function () { if (onOpen) onOpen(); $(ov).classList.add('show'); });
    $(close).addEventListener('click', function () { $(ov).classList.remove('show'); });
    $(ov).addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  }
  function init() {
    Goobs.themePicker($('themes'));
    cv = $('cv'); cx = cv.getContext('2d');
    cv.addEventListener('pointerdown', down); cv.addEventListener('pointermove', move2); cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) { document.addEventListener(ev, function () { S.unlock(); }, { passive: true }); });
    $('btnHome').addEventListener('click', function () { save(); Goobs.home(); });
    $('btnUndo').addEventListener('click', useUndo); $('btnShuffle').addEventListener('click', useShuffle); $('btnHint').addEventListener('click', useHint);
    $('btnLevels').addEventListener('click', openLevels);
    $('btnHelp').addEventListener('click', openHelp);
    // full screen (kit): Levels, How to, Stats and Settings live in the Menu; Undo / Shuffle / Hint stay on screen.
    // The clock stops and drags are ignored while the Menu is open (sheetOpen() checks 'ggMenu').
    Goobs.fullscreen({ menu: ['btnLevels', 'btnHelp', 'btnStats', 'btnSettings'],
      info: function () { return g ? 'Level <b>' + g.n + '</b> · <b>' + Math.max(0, g.total - g.cleared) + '</b> items left' : ''; } });
    $('btnRestart').addEventListener('click', function () { $('ovLevels').classList.remove('show'); if (g) startLevel(g.n); });
    $('lvgrid').addEventListener('click', function (e) { var b = e.target.closest('button[data-n]'); if (!b) return; $('ovLevels').classList.remove('show'); startLevel(+b.dataset.n); });
    sheet(null, 'ovLevels', 'btnCloseLevels');
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings');
    sheet('btnStats', 'ovStats', 'btnCloseStats', renderStats);
    function closeHelp() { $('ovHelp').classList.remove('show'); if (!meta.seen) { meta.seen = true; saveMeta(); } }
    $('btnCloseHelp').addEventListener('click', closeHelp);
    $('ovHelp').addEventListener('click', function (e) { if (e.target === this) closeHelp(); });
    $('info').addEventListener('click', openHelp);
    $('btnSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncSound(); S.ding(); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); syncSound(); S.ding(); });
    $('setTimer').checked = settings.timer;
    $('setTimer').addEventListener('change', function () { settings.timer = this.checked; saveSettings(); renderInfo(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncAds(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncAds(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncAds(); });
    if (window.ResizeObserver) new ResizeObserver(fit).observe($('stagewrap'));
    window.addEventListener('resize', fit);
    document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });
    window.addEventListener('pagehide', save);
    syncSound(); syncAds(); fit();
    if (!load()) startLevel(Math.min(meta.level, meta.open));
    fit();
    if (!meta.seen) openHelp();
    requestAnimationFrame(frame);
    window.__slReady = true;
    Goobs.markPlayed('shelf');
    Goobs.initUpdates({ beforeReload: save, onVersions: function (v) { $('version').textContent = 'Shelf Life ' + (v.shelf || '2.0.0') + ' · Goobs-Games ' + (v.shell || '?'); } });
  }
  window.__sl = { get g() { return g; }, startLevel: startLevel, useUndo: useUndo, useShuffle: useShuffle, useHint: useHint, SH: SH, meta: function () { return meta; }, slotPos: slotPos, get boxes() { return boxes; }, get SW() { return SW; },
    move: function (fb, fs, tb, ts) { var q = slotPos(fb, fs); return doMove(fb, fs, tb, ts, q.x, q.y, 1, 60); }, get busy() { return busy(); }, get hintM() { return hintM; },
    // timing checks: frames = redraw the store n times; cold = rebuild the store picture and every item bitmap first
    bench: function (n, cold) { var t0 = performance.now(); if (cold) { cache = {}; bgC = null; } draw(t0); var t1 = performance.now(); for (var i = 0; i < n; i++) draw(t1 + i * 16); return { first: t1 - t0, frame: (performance.now() - t1) / n }; }, amap: function () { return amap; } };
  ShelfStudio.ready.then(init).catch(function(e){window.dispatchEvent(new ErrorEvent("error",{message:e.message}));});
})();
</script>
</body>
</html>
