<title>Card Table</title>
<style>
/* Card Table styles (themes, UI kit and ad cards come from /shared/goobs.css) */
:root {
  --felt: #1f8150; --felt-2: #166a41; --felt-line: rgba(255,255,255,.28); --felt-ink: rgba(255,255,255,.55);
  --card: #ffffff; --card-edge: #d8dce6; --card-red: #dc2f47; --card-black: #1b2130;
  --back-1: #5a54f0; --back-2: #7a5cff;
}
:root[data-theme="dark"] { --felt: #17442f; --felt-2: #102f21; --card: #f4f5f8; --card-edge: #b9bfcc; }
:root[data-theme="blue"] { --felt: #1a4f7a; --felt-2: #123a5c; --card: #f7f9fd; --card-edge: #b9c6da; }

.brand svg { border-radius: 10px; }
.modes button { font-size: 13px; letter-spacing: -.2px; white-space: nowrap; }
@media (max-width: 380px) { .modes button { font-size: 12.5px; } }
.app { gap: 8px; }

.info { min-height: 40px; }
.info .stat { text-align: left; }
.info .stat .mid { font-size: 18px; }
.info .optbtn {
  display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 10px; border-radius: 11px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-weight: 700; font-size: 13px; box-shadow: var(--shadow-sm); white-space: nowrap; max-width: 150px;
}
.info .optbtn svg { width: 17px; height: 17px; flex: none; }
.info .optbtn span { overflow: hidden; text-overflow: ellipsis; }
.info .stats3 { display: flex; gap: 14px; }

/* ---------- table ---------- */
.table {
  position: relative; isolation: isolate; width: 100%; flex: 1 1 auto; min-height: 0; border-radius: 16px; overflow: hidden; touch-action: none;
  background: radial-gradient(120% 90% at 50% 20%, var(--felt) 0%, var(--felt-2) 100%);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.12), var(--shadow);
}
.slots, .cards { position: absolute; inset: 0; }
.cards { pointer-events: none; }
.cards .cd { pointer-events: auto; }
.slot {
  position: absolute; left: 0; top: 0; border-radius: calc(var(--cw) * .1); border: 1.5px solid var(--felt-line);
  display: grid; place-items: center; color: var(--felt-ink); font-weight: 800; font-size: calc(var(--cw) * .38);
}
.slot svg { width: 46%; height: 46%; opacity: .55; }
.slot.stockslot { border-style: dashed; }
.slot .count { position: absolute; bottom: -1.45em; left: -30px; right: -30px; white-space: nowrap; text-align: center; font-size: 11px; font-weight: 700; color: rgba(255,255,255,.75); }

/* ---------- cards ---------- */
.cd {
  position: absolute; left: 0; top: 0; width: var(--cw); height: var(--ch); border-radius: calc(var(--cw) * .1);
  background: var(--card); box-shadow: 0 0 0 .5px var(--card-edge), 0 1px 2px rgba(0,0,0,.25);
  transition: transform .2s cubic-bezier(.25,.8,.3,1); will-change: transform; -webkit-user-select: none; user-select: none;
  color: var(--card-black); overflow: hidden;
}
.cd.red { color: var(--card-red); }
.cd.nt { transition: none; }
.cd .rk { position: absolute; left: 7%; top: 2%; font-weight: 800; font-size: calc(var(--cw) * .38); line-height: 1; letter-spacing: -.06em; font-variant-numeric: tabular-nums; }
.cd .sm { position: absolute; right: 6%; top: 5%; width: calc(var(--cw) * .3); height: calc(var(--cw) * .3); }
.cd .big { position: absolute; left: 50%; bottom: 8%; width: calc(var(--cw) * .56); height: calc(var(--cw) * .56); margin-left: calc(var(--cw) * -.28); }
.cd .face { position: absolute; left: 12%; right: 12%; bottom: 7%; height: 52%; border-radius: calc(var(--cw) * .07); display: grid; place-items: center; font-weight: 900; font-size: calc(var(--cw) * .44); }
.cd.red .face { background: color-mix(in srgb, var(--card-red) 12%, transparent); }
.cd .face { background: color-mix(in srgb, var(--card-black) 9%, transparent); }
.cd .face svg { position: absolute; width: 40%; height: 40%; right: 6%; bottom: 6%; opacity: .5; }
.cd.small .sm { display: none; }
.cd .bk { display: none; position: absolute; inset: 0; border-radius: inherit; }
.cd.down .bk {
  display: block; background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.13) 0 2px, transparent 2px 7px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.13) 0 2px, transparent 2px 7px),
    linear-gradient(135deg, var(--back-1), var(--back-2));
  box-shadow: inset 0 0 0 calc(var(--cw) * .05) #fff;
}
.cd.down > :not(.bk) { visibility: hidden; }
.cd.lift { box-shadow: 0 0 0 .5px var(--card-edge), 0 10px 22px rgba(0,0,0,.35); }
.cd.sel { box-shadow: 0 0 0 3px #ffd84a, 0 4px 12px rgba(0,0,0,.3); }
.cd.hint { animation: hintglow 1s ease-in-out 2; }
@keyframes hintglow { 50% { box-shadow: 0 0 0 3px #ffd84a, 0 0 18px 4px rgba(255,216,74,.8); } }
.cd.dim::after { content: ""; position: absolute; inset: 0; background: rgba(20,30,40,.28); border-radius: inherit; }
.cd.shake { animation: cshake .28s; }
@keyframes cshake { 25% { translate: -4px 0; } 75% { translate: 4px 0; } }
.cd.flip { animation: cflip .22s ease-out; }
@keyframes cflip { 0% { scale: .2 1; } 100% { scale: 1 1; } }

/* spider's finished runs: a little king on the pile */
.msg {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: rgba(10,16,24,.78); color: #fff;
  padding: 8px 14px; border-radius: 12px; font-weight: 700; font-size: 14px; pointer-events: none; opacity: 0; transition: opacity .25s;
  white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis;
}
.msg.show { opacity: 1; }
.finish {
  position: absolute; right: 10px; bottom: 10px; display: none; height: 46px; padding: 0 20px; border-radius: 14px; border: 0;
  background: linear-gradient(135deg, #ffcf4a, #ffb224); color: #3a2a00; font-weight: 800; font-size: 16px; box-shadow: 0 6px 16px -4px rgba(0,0,0,.4);
}
.finish.show { display: block; animation: cardin .25s; }
.float { position: absolute; font-weight: 900; font-size: 18px; color: #ffe37a; text-shadow: 0 2px 0 rgba(0,0,0,.35); pointer-events: none; animation: crise .9s ease-out forwards; z-index: 900; }
@keyframes crise { 0% { opacity: 0; translate: 0 6px; } 20% { opacity: 1; } 100% { opacity: 0; translate: 0 -28px; } }

.toolbar .tool { position: relative; font-size: 12.5px; }
.toolbar .tool .dot { position: absolute; top: 7px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); display: none; }
.toolbar .tool .dot.show { display: block; }
.toolbar .tool.done svg { color: var(--ok); }

/* options sheet */
.seg { display: flex; gap: 3px; background: var(--surface-2); border-radius: 12px; padding: 3px; margin: 6px 0 12px; }
.seg button { flex: 1; height: 38px; border-radius: 10px; border: 0; background: none; color: var(--muted); font-weight: 700; font-size: 15px; padding: 0; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.optnote { color: var(--muted); font-size: 14px; margin: 4px 2px 10px; line-height: 1.4; }
.numrow { display: flex; gap: 8px; align-items: center; margin: 6px 0 12px; }
.numrow input { flex: 1; min-width: 0; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font-size: 18px; font-weight: 700; padding: 0 12px; }
.numrow .btn { flex: none; min-height: 44px; }
.cardicon svg { border-radius: 16px; }
.statgame { margin-bottom: 4px; }
.statgame .sub { font-size: 13px; color: var(--muted); margin: -4px 2px 10px; }

/* ---------- full screen (kit) ----------
   Score / time / moves are pills in the top row (the game's name is hidden there; the Menu shows it, with the variant),
   the felt runs to the very edges of the screen, and Options / New / How to / Stats / Settings live in the Menu.
   Undo, Hint and Daily stay under the table. */
html.gg-fs .top .brand h1 { display: none; }
html.gg-fs .top .brand { flex: none; }
.ttpills { flex: 1 1 auto; width: auto; min-width: 0; min-height: 0; justify-content: flex-end; gap: 5px; padding: 0; }
.ttpills .ggpill { flex: none; padding: 7px 10px; }
.ttpills .ggpill small { font-size: 13px; font-weight: 700; color: var(--muted); }
.ttpills.tight .ggpill { padding-left: 7px; padding-right: 7px; }
.ttpills.tight .ggpill small { display: none; }
@media (max-width: 385px) { .ttpills { gap: 4px; } .ttpills .ggpill { padding: 7px 8px; font-size: 15px; } .ttpills .ggpill small { font-size: 12px; } }
html.gg-fs .table { width: auto; align-self: stretch; margin: 0 calc(-8px - env(safe-area-inset-right, 0px)) 0 calc(-8px - env(safe-area-inset-left, 0px)); border-radius: 0; }
/* spider's "5 deals" under the stock at the right edge of the felt: right-aligned so it isn't cut off by the screen edge */
.slot.sstock .count { left: -40px; right: 0; text-align: right; }
/* Visual refinement: woven felt and printed card stock; card geometry is unchanged. */
:root { --felt:#287b58; --felt-2:#154c37; --card:#fffdf7; --card-edge:#c9c7bb; --card-red:#b72f43; --card-black:#202938; --back-1:#23446a; --back-2:#152e4d; }
.table { background-image:radial-gradient(ellipse at 40% 10%,var(--felt),var(--felt-2)),url('assets/cloth-v1.webp'); background-size:auto,240px; background-blend-mode:multiply; box-shadow:inset 0 0 0 1px #ffffff24,inset 0 3px 14px #0003,var(--shadow); }
.cd:not(.sel):not(.lift):not(.hint) { box-shadow:0 0 0 .5px var(--card-edge),0 1px 1px #0004,0 3px 5px #0003; }
.cd { background-image:linear-gradient(135deg,#ffffff55,transparent 55%,#9b87600c); }
.cd .rk { font-family:Georgia,'Times New Roman',serif; font-weight:700; letter-spacing:-.04em; top:3%; }
.cd .face { font-family:Georgia,'Times New Roman',serif; font-weight:700; border:1px solid currentColor; }
.cd.down .bk { background:repeating-linear-gradient(45deg,#ffffff10 0 1px,transparent 1px 5px),repeating-linear-gradient(-45deg,#ffffff10 0 1px,transparent 1px 5px),linear-gradient(135deg,var(--back-1),var(--back-2)); box-shadow:inset 0 0 0 calc(var(--cw) * .055) var(--card),inset 0 0 0 calc(var(--cw) * .075) #ffffff44; }
.slot { border-color:#ffffff38; box-shadow:inset 0 1px 5px #0002; }

</style>

<div class="app" id="app">
  <div class="top">
    <button class="brand homebtn" id="btnHome" aria-label="Back to all games">
      <span class="chev" aria-hidden="true">&#8249;</span>
      <svg viewBox="0 0 100 100" aria-hidden="true"><use href="#ct-logo"/></svg>
      <h1>Card Table</h1>
    </button>
    <!-- full screen: score / time / moves sit in the top row as pills (was its own row) -->
    <div class="info ttpills" id="info"></div>
    <div class="topbtns">
      <button class="iconbtn" id="btnSound" aria-label="Sound"><svg viewBox="0 0 24 24"><use href="#i-sound-off"/></svg></button>
      <button class="iconbtn" id="btnStats" aria-label="Stats"><svg viewBox="0 0 24 24"><use href="#i-stats"/></svg></button>
      <button class="iconbtn" id="btnSettings" aria-label="Settings"><svg viewBox="0 0 24 24"><use href="#i-gear"/></svg></button>
    </div>
  </div>

  <div class="modes" id="modes">
    <button data-g="klondike">Klondike</button>
    <button data-g="spider">Spider</button>
    <button data-g="freecell">FreeCell</button>
    <button data-g="tripeaks">TriPeaks</button>
    <button data-g="pyramid">Pyramid</button>
  </div>

  <div class="table" id="table">
    <div class="slots" id="slots"></div>
    <div class="cards" id="cards"></div>
    <div class="msg" id="msg"></div>
    <button class="finish" id="btnFinish">Finish</button>
  </div>

  <div class="toolbar">
    <button class="tool" id="btnUndo"><svg viewBox="0 0 24 24"><use href="#i-undo"/></svg><span>Undo</span></button>
    <button class="tool" id="btnHint"><svg viewBox="0 0 24 24"><use href="#i-hint"/></svg><span>Hint</span></button>
    <button class="tool" id="btnDaily"><svg viewBox="0 0 24 24"><use href="#i-cal"/></svg><span id="dailyLabel">Daily</span><i class="dot" id="dailyDot"></i></button>
    <button class="tool" id="btnOpts"><svg viewBox="0 0 24 24"><use href="#i-opts"/></svg><span>Options</span></button>
    <button class="tool" id="btnHelp"><svg viewBox="0 0 24 24"><use href="#i-help"/></svg><span>How to</span></button>
    <button class="tool red" id="btnNew"><svg viewBox="0 0 24 24"><use href="#i-new"/></svg><span>New</span></button>
  </div>
</div>

<!-- Game options -->
<div class="overlay" id="ovOpts">
  <div class="sheet" role="dialog" aria-label="Game options">

    <div class="actions"><button class="btn" id="btnCloseOpts">Done</button><button class="btn red" id="btnDealNow">Deal now</button></div>
  </div>
</div>

<div class="overlay" id="ovSettings">
  <div class="sheet" role="dialog" aria-label="Settings">
    <h2>Settings</h2>
    <div class="sheetbody">
      <div class="themelabel">Theme (all games)</div>
      <div class="themes" id="themes"></div>
      <label class="row"><div>Sound<small>Card flicks and chimes.</small></div>
        <span class="switch"><input type="checkbox" id="setSound"><span></span></span></label>
      <label class="row"><div>Old-time ads<small>Joke ads between games. This switch is shared by all Goobs-Games.</small></div>
        <span class="switch"><input type="checkbox" id="setAds"><span></span></span></label>
      <div class="row" id="rowAdEvery"><div>Show an ad every<small>Counted in finished games.</small></div>

</div>

    <div class="sheetbody" id="statsBody"></div>
    <div class="actions"><button class="btn red" id="btnCloseStats">Done</button></div>

</div>

    store.del(slotKey(game.g, game.daily));
    S.win(); renderInfo(); renderTools();
    // a little celebration: every card hops in turn
    Object.keys(els).forEach(function (id, i) { var el = els[id]; setTimeout(function () { el.animate([{ translate: '0 0' }, { translate: '0 -14px' }, { translate: '0 0' }], { duration: 380, easing: 'ease-out' }); }, (i % 52) * 18); });
    var s = statFor(game.key), lines = [];
    lines.push('Time <b>' + fmtTime(game.ms) + '</b> &middot; <b>' + game.st.moves + '</b> moves');
    if (hasScore(game.g, game.st)) lines.push((game.g === 'klondike' && game.st.opts.scoring === 'vegas' ? 'Money <b>$' + game.st.score + '</b>' : 'Score <b>' + fmt(game.st.score) + '</b>') + (bonus ? ' (time bonus ' + fmt(bonus) + ')' : ''));
    lines.push('Won ' + s.won + ' of ' + s.played + ' &middot; streak ' + s.streak);
    var daily = game.daily != null;
    setTimeout(function () {
      showCard(daily ? 'Daily deal done!' : 'You won!', lines.join('<br>'), [
        { label: daily ? 'Back to my game' : 'New game', red: true, go: function () { if (daily) { between(function () { load(game.g, null); }); } else startNew(game.g); } }
      ]);
    }, 900);
  }
  function stuckCard() {
    S.over();
    showCard('No more moves', 'There’s nothing left to play. Undo a few moves, or start a new game.', [
      { label: 'Undo', red: true, go: undo },
      { label: 'New game', go: function () { abandon(); if (game.daily != null) between(function () { load(game.g, null); }); else startNew(game.g); } },
      { label: 'Keep looking', go: function () {} }
    ]);
  }
  function showCard(title, html, buttons) {
    $('cardIcon').innerHTML = '<svg viewBox="0 0 100 100"><use href="#ct-logo"/></svg>';
    $('endTitle').textContent = title;
    $('endText').innerHTML = html;
    var box = $('endActions'); box.innerHTML = '';
    buttons.forEach(function (b) {
      var el = document.createElement('button');
      el.className = 'btn' + (b.red ? ' red' : '');
      el.textContent = b.label;
      el.addEventListener('click', function () { $('ovEnd').classList.remove('show'); b.go(); });
      box.appendChild(el);
    });
    $('ovEnd').classList.add('show');
  }
  function showAd(done) { GoobsAds.show({ onShow: function () { S.ding(); }, onStep: function () { S.sign(); } }, done); }
  function between(next) {
    if (Goobs.adsOn() && meta.finished > 0 && meta.finished % settings.adEvery === 0 && meta.lastAdAt !== meta.finished) {
      meta.lastAdAt = meta.finished; saveMeta();
      next(); showAd(function () {}); return;
    }
    next();
  }
  function confirmLeave(what, go) {
    if (!game.started || game.won || game.recorded) { go(); return; }
    showCard(what, 'This game counts as a loss.', [
      { label: 'Yes', red: true, go: function () { abandon(); go(); } },
      { label: 'Keep playing', go: function () {} }
    ]);
  }

  // ================= timer =================
  var lastTick = Date.now();
  function tickReset() { lastTick = Date.now(); }
  function tick() {
    var now = Date.now(), dt = Math.min(now - lastTick, 2000); lastTick = now;
    if (!game || !game.started || game.won || document.hidden || locked()) return;
    var prev = game.ms; game.ms += dt;
    if (game.g === 'klondike') { var pen = SOL.klondike.timePenalty(game.st, prev, game.ms); if (pen) { SOL.klondike.add(game.st, pen); renderInfo(); } }
    var c = $('clock'); if (c) c.textContent = fmtTime(game.ms);
    if (Math.floor(game.ms / 5000) !== Math.floor(prev / 5000)) saveGame();
  }

  // ================= sheets =================
  var HELP = {
    klondike: ['Klondike', [
      'Build four piles, one per suit, from <b>ace up to king</b> at the top right.',
      'In the seven columns, stack cards <b>down</b> in <b>alternating colors</b> (a red 9 on a black 10). Move a card, or a whole run of face-up cards, by <b>dragging</b> it, or <b>tap</b> it to send it to the best spot.',
      'Only a <b>king</b> (with its run) can go in an empty column. A face-down card turns over when it’s uncovered.',
      '<b>Tap the stock</b> (top left) to turn over 1 or 3 cards. When it’s empty, tap it to go through again.',
      '<b>Standard</b> scoring: +10 for each card up to a suit pile, +5 for waste to column or turning a card, &minus;15 for taking one back down, &minus;100 (draw 1) or &minus;20 (draw 3) for each new trip through the deck, &minus;2 every 10 seconds, and a time bonus when you win. <b>Vegas</b>: you start $52 down and win $5 a card; draw 1 goes through the deck once, draw 3 three times.',
      'When every card is face up and the stock is used, <b>Finish</b> sends them all up for you.'
    ]],
    spider: ['Spider', [
      'Two decks, ten columns. Build a run of <b>one suit from king down to ace</b> and it goes away by itself. Clear all eight runs to win.',
      'You can place any card on one that’s <b>one higher</b>, whatever the suit, but you can only <b>move several cards together</b> when they’re one suit in order.',
      'Any card or run can go in an empty column.',
      '<b>Tap the stock</b> (top right) to deal one card onto every column. Every column needs at least one card first.',
      'Score: you start at 500, lose 1 for every move and gain 100 for every finished run.',
      '1 suit is gentle, 2 suits is harder, 4 suits is tough. Pick in <b>Options</b> (in the Menu, top right).'
    ]],
    freecell: ['FreeCell', [
      'Every card is face up. Build four suit piles from <b>ace up to king</b> at the top right.',
      'In the eight columns, stack <b>down</b> in <b>alternating colors</b>. Any card can go in an empty column.',
      'The four <b>free cells</b> (top left) each hold one card.',
      'You can move several cards at once when there’s room to do it one by one: more free cells and empty columns let you move longer runs.',
      'Cards that are safe to put away go up by themselves.',
      'Every deal has a number (the same as the classic Windows game). All of them can be won except #11982.'
    ]],
    tripeaks: ['TriPeaks', [
      'Clear all three peaks. Tap an <b>uncovered</b> card that is <b>one higher or one lower</b> than the card on the waste pile (bottom). Suits don’t matter, and king and ace follow each other.',
      'Cards turn over when nothing covers them.',
      'Stuck? <b>Tap the stock</b> for a new waste card. It ends your run and costs 5 points. There’s one trip through the stock.',
      'Each card in a run scores one more than the last: 1, 2, 3 and so on. Clearing the top of a peak gives +15 (the last one +30).'
    ]],
    pyramid: ['Pyramid', [
      'Clear the pyramid by taking away <b>pairs that add up to 13</b>. Jack is 11, queen 12, and a <b>king</b> (13) goes away by itself. Ace is 1.',
      'A card can be used when no cards sit on it. Tap one card, then its partner (or drag one onto the other).',
      '<b>Tap the stock</b> to turn over its top card onto the waste. The waste’s top card can pair with the pyramid.',
      'You can go through the stock <b>3 times</b>.',
      'Score: +5 for every pyramid card, +1 for every stock card, +250 for clearing the pyramid.'
    ]]
  };
  function openHelp() {
    var h = HELP[game.g];
    $('helpTitle').textContent = 'How to play ' + h[0];
    $('helpList').innerHTML = h[1].map(function (x) { return '<li>' + x + '</li>'; }).join('') + '<li>A <b>Daily</b> deal for each game is the same on every phone and can always be won. <b>Undo</b> is unlimited.</li>';
    $('ovHelp').classList.add('show');
  }
  function segHTML(name, items, cur) { return '<div class="seg" data-name="' + name + '">' + items.map(function (it) { return '<button data-v="' + it[0] + '"' + (String(it[0]) === String(cur) ? ' class="on"' : '') + '>' + it[1] + '</button>'; }).join('') + '</div>'; }
  function openOpts() {
    if (locked()) return;
    var g = game.g, h = '';
    $('optsTitle').textContent = SOL.GAMES[g].name + ' options';
    if (g === 'klondike') {
      h += '<div class="themelabel">Draw</div>' + segHTML('draw', [[1, 'Draw 1'], [3, 'Draw 3']], settings.klondike.draw);
      h += '<div class="themelabel">Scoring</div>' + segHTML('scoring', [['standard', 'Standard'], ['vegas', 'Vegas'], ['none', 'None']], settings.klondike.scoring);
    }
    if (g === 'spider') h += '<div class="themelabel">Suits</div>' + segHTML('suits', [[1, '1 suit'], [2, '2 suits'], [4, '4 suits']], settings.spider.suits);
    if (g === 'freecell') {
      h += '<div class="themelabel">Play a game number</div><div class="numrow"><input id="fcNum" type="number" inputmode="numeric" min="1" max="32000" placeholder="1 to 32000" value="' + game.st.seed + '"><button class="btn red" id="fcGo">Play</button></div>';
      h += '<p class="optnote">The same numbers as the classic Windows FreeCell. Every one can be won except #11982.</p>';
    } else {
      h += '<label class="row"><div>Winnable deals only<small>Every deal has been played through to a win by the computer first.' + (g === 'spider' && !bankOK('spider', { suits: 4 }) ? ' (4 suits: deals are always random; they take too long to check.)' : '') + '</small></div><span class="switch"><input type="checkbox" id="setWin"' + (settings.winnable[g] ? ' checked' : '') + '><span></span></span></label>';
    }
    h += '<p class="optnote">Changes start with your next new game.</p>';
    $('optsBody').innerHTML = h;
    Array.prototype.forEach.call($('optsBody').querySelectorAll('.seg'), function (seg) {
      seg.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        var n = seg.dataset.name, v = b.dataset.v;
        if (n === 'draw') settings.klondike.draw = +v; else if (n === 'scoring') settings.klondike.scoring = v; else if (n === 'suits') settings.spider.suits = +v;
        saveSettings();
        Array.prototype.forEach.call(seg.children, function (x) { x.classList.toggle('on', x === b); });
      });
    });
    var sw = $('setWin'); if (sw) sw.addEventListener('change', function () { settings.winnable[g] = this.checked; saveSettings(); });
    var go = $('fcGo');
    if (go) go.addEventListener('click', function () {
      var n = Math.floor(+$('fcNum').value);
      if (!(n >= 1 && n <= 32000)) { toast('Pick a number from 1 to 32000'); return; }
      $('fcNum').blur(); if (Goobs.snap) Goobs.snap();
      $('ovOpts').classList.remove('show');
      confirmLeave('Play game #' + n + '?', function () { startNew('freecell', n); });
    });
    $('ovOpts').classList.add('show');
  }
  function renderStats() {
    var h = '';
    var rows = [['klondike-d1', 'Klondike, draw 1'], ['klondike-d3', 'Klondike, draw 3'], ['spider-1', 'Spider, 1 suit'], ['spider-2', 'Spider, 2 suits'], ['spider-4', 'Spider, 4 suits'], ['freecell', 'FreeCell'], ['tripeaks', 'TriPeaks'], ['pyramid', 'Pyramid']];
    rows.forEach(function (r) {
      var s = stats[r[0]];
      if (!s || !s.played) return;
      h += '<div class="statgame"><div class="themelabel">' + r[1] + '</div><div class="tiles"><div class="tile"><b>' + s.won + '/' + s.played + '</b><span>Won</span></div>' +
        '<div class="tile"><b>' + Math.round(100 * s.won / s.played) + '%</b><span>Win rate</span></div><div class="tile"><b>' + s.streak + '</b><span>Streak</span></div></div>' +
        '<div class="sub">Best streak ' + s.bestStreak + (s.bestMs ? ' &middot; best time ' + fmtTime(s.bestMs) : '') + (s.fewest ? ' &middot; fewest moves ' + s.fewest : '') + (s.bestScore !== null && s.bestScore !== undefined ? ' &middot; best score ' + fmt(s.bestScore) : '') + (s.daily ? ' &middot; ' + s.daily + ' daily' : '') + '</div></div>';
    });
    $('statsBody').innerHTML = h || '<p class="optnote">Play a game to start your records. Each game (and each draw or suit choice) keeps its own.</p>';
  }

  // ================= wiring =================
  function syncSound() {
    $('btnSound').innerHTML = '<svg viewBox="0 0 24 24"><use href="#i-sound-' + (settings.sound ? 'on' : 'off') + '"/></svg>';
    $('btnSound').classList.toggle('on', settings.sound);
    $('setSound').checked = settings.sound;
    S.setEnabled(settings.sound);
  }
  function syncAds() {
    $('setAds').checked = Goobs.adsOn();
    $('adEvery').textContent = settings.adEvery;
    $('rowAdEvery').classList.toggle('off', !Goobs.adsOn());
  }
  function sheet(btn, ov, close, onOpen) {
    if (btn) $(btn).addEventListener('click', function () { if (onOpen) onOpen(); $(ov).classList.add('show'); });
    $(close).addEventListener('click', function () { $(ov).classList.remove('show'); });
    $(ov).addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  }
  function init() {
    Goobs.themePicker($('themes'));
    var tb = $('table');
    tb.addEventListener('pointerdown', onDown);
    tb.addEventListener('pointermove', onMove);
    tb.addEventListener('pointerup', onUp);
    tb.addEventListener('pointercancel', onCancel);
    document.addEventListener('touchmove', function (e) { if (drag) e.preventDefault(); }, { passive: false });
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) { document.addEventListener(ev, function () { S.unlock(); }, { passive: true }); });
    $('btnHome').addEventListener('click', function () { saveGame(); Goobs.home(); });
    $('btnUndo').addEventListener('click', undo);
    $('btnHint').addEventListener('click', hint);
    $('btnFinish').addEventListener('click', finish);
    $('btnNew').addEventListener('click', function () {
      if (locked()) return;
      if (game.daily != null) { confirmLeave('Leave today\u2019s deal?', function () { load(game.g, null); }); return; }
      confirmLeave('Start a new game?', function () { startNew(game.g); });
    });
    $('btnDaily').addEventListener('click', function () {
      if (locked()) return;
      if (game.daily != null) { load(game.g, null); return; }
      var today = dayNum();
      if (meta.dailyDone[game.g] === today) {
        showCard('Today’s deal is done', 'You already won today’s ' + SOL.GAMES[game.g].name + '. Play it again? (It won’t count twice.)', [
          { label: 'Play it again', red: true, go: function () { load(game.g, today, true); } },
          { label: 'Not now', go: function () {} }]);
        return;
      }
      load(game.g, today);
    });
    $('modes').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b || b.dataset.g === game.g || locked()) return;
      var g = b.dataset.g;
      load(g, meta.playing[g] === 'daily' && store.get('daily.' + g, null) && store.get('daily.' + g, null).daily === dayNum() ? dayNum() : null);
    });
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings');
    sheet('btnStats', 'ovStats', 'btnCloseStats', renderStats);
    $('btnCloseOpts').addEventListener('click', function () { $('ovOpts').classList.remove('show'); });
    $('ovOpts').addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
    $('btnDealNow').addEventListener('click', function () { $('ovOpts').classList.remove('show'); confirmLeave('Deal a new game?', function () { startNew(game.g); }); });
    $('btnHelp').addEventListener('click', openHelp);
    $('btnOpts').addEventListener('click', openOpts);
    // full screen (kit): Options, New, How to, Stats and Settings live in the Menu; Undo / Hint / Daily stay under the table.
    // The clock stops while the Menu is open (locked() checks 'ggMenu'); the Menu closes before a moved button's handler runs.
    Goobs.fullscreen({ menu: ['btnOpts', 'btnNew', 'btnHelp', 'btnStats', 'btnSettings'],
      info: function () { if (!game) return ''; var v = variantLabel(); return '<b>' + SOL.GAMES[game.g].name + '</b>' + (v !== 'Options' ? ' &middot; ' + v : ''); } });
    function closeHelp() { $('ovHelp').classList.remove('show'); if (!meta.seen[game.g]) { meta.seen[game.g] = true; saveMeta(); } }
    $('btnCloseHelp').addEventListener('click', closeHelp);
    $('ovHelp').addEventListener('click', function (e) { if (e.target === this) closeHelp(); });
    $('btnSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncSound(); S.ding(); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); syncSound(); S.ding(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncAds(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncAds(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncAds(); });
    var lastW = 0, lastH = 0;
    function onResize() { if (!game) return; var r = $('table').getBoundingClientRect(); if (Math.abs(r.width - lastW) > 0.5 || Math.abs(r.height - lastH) > 0.5) { lastW = r.width; lastH = r.height; render(true); } }
    if (window.ResizeObserver) new ResizeObserver(onResize).observe($('table'));
    window.addEventListener('resize', onResize);
    document.addEventListener('visibilitychange', function () { if (document.hidden) saveGame(); else tickReset(); });
    window.addEventListener('pagehide', saveGame);
    setInterval(tick, 250);
    syncSound(); syncAds();
    var g0 = meta.g, dly = meta.playing[g0] === 'daily' ? dayNum() : null;
    if (dly != null) { var sv = store.get('daily.' + g0, null); if (!sv || sv.daily !== dly) dly = null; }
    load(g0, dly);
    Goobs.markPlayed('solitaire');
    Goobs.initUpdates({
      beforeReload: saveGame,
      onVersions: function (v) { $('version').textContent = 'Card Table ' + (v.solitaire || '?') + ' · Goobs-Games ' + (v.shell || '?'); }
    });
  }

  // hook for automated tests
  window.__ct = { get game() { return game; }, smartHint: function () { return smartHint(); }, load: load, startNew: startNew, doMove: doMove, stockTap: stockTap, undo: undo, hint: hint, finish: finish, stats: function () { return stats; }, meta: function () { return meta; }, settings: settings, render: render, tapCard: tapCard, get loc() { return loc; }, get T() { return T; } };

  init();
})();
</script>
</body>
</html>
