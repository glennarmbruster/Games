<script>
/* if Harbor Lights can't open, say so on screen (never a blank page) and offer a fresh start */
(function () {
  var shown = false;
  function fail(msg) {
    if (shown || window.__hlReady) return; shown = true;
    function put() {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:#0e1a33;color:#fff;color:#1b1f33;font:600 16px -apple-system,system-ui,sans-serif;text-align:center';
      d.innerHTML = '<b style="font-size:21px">Goober Ball didn\u2019t open</b><div style="max-width:320px;opacity:.75;font-size:13px">' + String(msg).replace(/[<>&]/g, '') + '</div>';
      function btn(t, bg, go) { var b = document.createElement('button'); b.textContent = t; b.style.cssText = 'font:800 17px -apple-system,system-ui,sans-serif;padding:13px 24px;border-radius:14px;border:0;color:#fff;background:' + bg; b.onclick = go; d.appendChild(b); }
      btn('Start fresh', '#5a54f0', function () { try { localStorage.removeItem('pinball.game'); } catch (e) { /* ignore */ } location.reload(); });
      btn('All games', '#6b7080', function () { location.href = '../../'; });
      document.body.appendChild(d);
    }
    if (document.body) put(); else document.addEventListener('DOMContentLoaded', put);
  }
  window.addEventListener('error', function (e) { fail((e.message || 'Something went wrong') + (e.lineno ? ' (line ' + e.lineno + ')' : '')); });
  setTimeout(function () { if (!window.__hlReady) fail('It took too long to start.'); }, 6000);
})();
</script>

/* Full screen (1.2.0, Glenn: "every game full screen"): Harbor Lights already had no header (just the DMD with Pause,

<script>
/* Harbor Lights pinball: the table, the physics and the rules (no DOM; runs in Node for the tests).
   Table units: 100 wide × 184 tall, y down (the bottom is the drain). The ball is 2.3 units in radius. The physics
   runs 12 sub-steps per 1/60 s frame: the ball against wall segments and posts (with a little thickness), against the
   flippers (tapered capsules turning about a pivot, pushing with their surface speed), pop bumpers and slingshots that
   kick, one-way gates, drop targets, sensors (rollovers, spinner-free lanes), the saucer, the plunger and the drain. */
var PB = (function () {
  'use strict';
  var R = 2.3, G = 230, SUB = 12, DT = 1 / 60 / SUB;
  var P = { flipUp: 26, flipDown: 15, flipLen: 15.2, flipR1: 2.4, flipR2: 1.25, restL: 0.5, upL: -0.44, wallE: 0.45, flipE: 0.28, bumperKick: 165, slingKick: 150,
    plungeMin: 190, plungeMax: 400, ballSave: 15, saucerHold: 1.3, maxSpeed: 520, kickback: 360 };

  // ---------------- geometry ----------------
  var segs = [], circles = [], flippers = [], sensors = [], drops = [], standups = [], bumpers = [], slings = [];
  function seg(x1, y1, x2, y2, o) { var s = { x1: x1, y1: y1, x2: x2, y2: y2, r: (o && o.r) || 0.6, e: (o && o.e) || P.wallE, kind: (o && o.kind) || 'wall', oneway: o && o.oneway }; segs.push(s); return s; }
  function poly(pts, o) { for (var i = 0; i < pts.length - 1; i++) seg(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], o); }
  function arc(cx, cy, r, a0, a1, n, o) { var pts = []; for (var i = 0; i <= n; i++) { var a = a0 + (a1 - a0) * i / n; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } poly(pts, o); return pts; }
  function post(x, y, r, o) { var c = { x: x, y: y, r: r, e: (o && o.e) || 0.6, kind: (o && o.kind) || 'post' }; circles.push(c); return c; }
  function mirror(x) { return 96 - x; }   // playfield runs x 4..92; the plunger lane is 92..98

  // outer shell: left wall, the top arc, the plunger lane
  var TOP = arc(51.6, 46, 47.6, Math.PI * 0.03, -Math.PI * 1.03, 44);       // from the plunger lane over the top to the left
  seg(99.2, 47.5, 99.2, 184); seg(4, 47.8, 4, 184);                          // outer walls
  seg(92, 53, 92, 184, { r: 0.7 });                                     // plunger lane divider
  seg(92, 53, 99.2, 46, { oneway: [-0.7, -0.72], r: 0.5, kind: 'gate' }); // one-way gate at the top of the lane: back-falls roll into the field
  // top lanes (S, E, A) between four short posts
  [34, 46, 58, 70].forEach(function (x) { seg(x, 27, x, 35, { r: 1.1 }); });
  var LANES = [40, 52, 64];
  LANES.forEach(function (x, i) { sensors.push({ id: 'top' + i, x: x, y: 33, r: 3.2, kind: 'top', i: i }); });
  // pop bumpers (buoys)
  [[37, 58], [59, 55], [48, 76]].forEach(function (b, i) { var c = post(b[0], b[1], 5.4, { e: 0.4, kind: 'bumper' }); c.i = i; c.flash = 0; bumpers.push(c); });
  // right: the lighthouse saucer (under a short guide)
  var SAUCER = { x: 81, y: 74, r: 3.4 };
  seg(73.5, 67.5, 91.3, 59.5, { r: 0.8 });                              // a sloped roof over the saucer sheds balls to the left
  // right standup target
  standups.push({ x1: 90.5, y1: 94, x2: 90.5, y2: 104, lit: false, flash: 0 }); seg(90.5, 94, 90.5, 104, { kind: 'standup', r: 0.9 });
  // left: drop target bank of three in front of the wall
  for (var d = 0; d < 3; d++) { var y0 = 74 + d * 8.2; var sg = seg(8.4, y0, 8.4, y0 + 6.6, { kind: 'drop', r: 1.0 }); sg.di = d; drops.push({ seg: sg, down: false, i: d, flash: 0 }); }
  seg(4, 70, 8.4, 73.4, { r: 0.7 }); seg(4, 102, 8.4, 97.6, { r: 0.7 });   // the bank's housing (sloped so nothing rests on it)
  // lower playfield: outlanes, inlanes, slingshots, guides into the flippers (left side, then its mirror)
  function lower(m) {
    var X = function (x) { return m ? mirror(x) : x; };
    seg(X(10.8), 118, X(10.8), 150, { r: 0.8 });                    // outlane / inlane divider
    post(X(10.8), 117.5, 1.2);
    seg(X(10.8), 150, X(29.4), 156.4, { r: 0.8 });                     // inlane guide onto the flipper's top surface
    seg(X(4), 150, X(12), 178, { r: 0.8 });                           // outlane narrowing to the drain
    // slingshot triangle: rubber face from (16,121) to (27,147) kicks up and out
    var s = seg(X(19), 122, X(28.4), 146.2, { kind: 'sling', r: 1.1, e: 0.5 }); s.side = m ? 1 : 0; slings.push(s);
    seg(X(19), 122, X(19), 140.5, { r: 0.9 }); seg(X(19), 140.5, X(28.4), 146.2, { r: 0.9 });
    post(X(19), 122, 1.2); post(X(28.4), 146.2, 1.2); post(X(19), 140.5, 1.0);
    sensors.push({ id: (m ? 'r' : 'l') + 'out', x: X(7.6), y: 136, r: 2.8, kind: 'out', side: m ? 1 : 0 });
    sensors.push({ id: (m ? 'r' : 'l') + 'in', x: X(15.1), y: 136, r: 2.6, kind: 'in', side: m ? 1 : 0 });
  }
  lower(false); lower(true);
  // flippers
  function flipper(px, py, side) { return { px: px, py: py, side: side, len: P.flipLen, a: side ? Math.PI - P.restL : P.restL, w: 0, up: false, rest: side ? Math.PI - P.restL : P.restL, top: side ? Math.PI - P.upL : P.upL }; }
  flippers.push(flipper(30.6, 159.6, 0), flipper(mirror(30.6), 159.6, 1));
  var PLUNGER = { x: 95.8, y: 176 };
  var W = 100, H = 184;

  // Geometry profiles retain shared physics; restore the classic table exactly on switch.
  var machineId='harbor';
  var classic=[segs,circles,flippers,sensors].map(function(list){return {list:list,items:list.slice(),data:list.map(function(o){return JSON.parse(JSON.stringify(o));})};});
  var classicBumpers=bumpers.slice();
  function setMachine(id){
    machineId=id;
    classic.forEach(function(group){group.list.length=0;group.items.forEach(function(o,i){Object.keys(o).forEach(function(k){delete o[k];});Object.assign(o,JSON.parse(JSON.stringify(group.data[i])));group.list.push(o);});});
    bumpers.length=0;classicBumpers.forEach(function(b){bumpers.push(b);});
    LANES.splice(0,3,40,52,64);Object.assign(SAUCER,{x:81,y:74,r:3.4});
    Object.assign(standups[0],{x1:90.5,y1:94,x2:90.5,y2:104});

    PB.flippers.forEach(function (f) {
      var ca = Math.cos(f.a), sa = Math.sin(f.a), ex = f.px + ca * f.len, ey = f.py + sa * f.len, r1 = PB.P.flipR1 + 0.3, r2 = PB.P.flipR2 + 0.3, nx = -sa, ny = ca;
      cx.beginPath(); cx.arc(X(f.px), X(f.py), X(r1), f.a + Math.PI / 2, f.a - Math.PI / 2); cx.lineTo(X(ex + nx * -r2), X(ey + ny * -r2)); cx.arc(X(ex), X(ey), X(r2), f.a - Math.PI / 2, f.a + Math.PI / 2); cx.closePath();
      cx.save(); cx.translate(X(0.5), X(1)); cx.fillStyle = 'rgba(0,0,20,.45)'; cx.fill(); cx.restore();
      var fg = cx.createLinearGradient(X(f.px + nx * r1), X(f.py + ny * r1), X(f.px - nx * r1), X(f.py - ny * r1)); fg.addColorStop(0, '#ffffff'); fg.addColorStop(1, '#d7dcea');
      cx.fillStyle = fg; cx.fill(); cx.lineWidth = X(0.9); cx.strokeStyle = '#e8354a'; cx.stroke();
      cx.beginPath(); cx.moveTo(X(f.px + ca * 1.5), X(f.py + sa * 1.5)); cx.lineTo(X(ex - ca * 0.8), X(ey - sa * 0.8)); cx.lineWidth = X(0.5); cx.strokeStyle = 'rgba(232,53,74,.45)'; cx.stroke();
      cx.beginPath(); cx.arc(X(f.px), X(f.py), X(1), 0, 7); cx.fillStyle = '#ffc53d'; cx.fill(); cx.lineWidth = X(0.3); cx.strokeStyle = '#8a5a00'; cx.stroke();
    });
    // the plunger power gauge (with the skill-shot band) while a ball waits
    if (waiting()) {
      var gy0 = 120, gy1 = 168, gh = gy1 - gy0, pw = g.plunge || 0;
      cx.fillStyle = 'rgba(0,0,0,.55)'; cx.fillRect(X(93.2), X(gy0), X(5), X(gh));
      if (g.skillOn) { cx.fillStyle = Math.floor(g.t * 4) % 2 ? 'rgba(90,255,150,.95)' : 'rgba(90,255,150,.6)'; cx.fillRect(X(93.2), X(gy1 - gh * (g.skillLo + 0.12)), X(5), X(gh * 0.12)); }
      var pg2 = cx.createLinearGradient(0, X(gy1), 0, X(gy0)); pg2.addColorStop(0, '#ffd24a'); pg2.addColorStop(1, '#ff4a4a'); cx.fillStyle = pg2; cx.fillRect(X(94.4), X(gy1 - gh * pw), X(2.6), X(gh * pw));
      cx.lineWidth = X(0.3); cx.strokeStyle = 'rgba(255,255,255,.6)'; cx.strokeRect(X(93.2), X(gy0), X(5), X(gh));
    }
    // plunger
    var pl = g.plunge || 0, py = PB.PLUNGER.y + pl * 6;
    cx.fillStyle = '#9aa6c0'; for (var i = 0; i < 5; i++) cx.fillRect(X(94.2), X(py + 1 + i * (184 - py - 1) / 5), X(3.2), X(0.6));
    cx.fillStyle = '#e8354a'; cx.fillRect(X(93.6), X(py), X(4.4), X(1.6));
    // balls
    g.balls_.forEach(function (b) {
      var tr = b._tr || (b._tr = []); tr.push([b.x, b.y]); if (tr.length > 8) tr.shift();
      if (Math.hypot(b.vx || 0, b.vy || 0) > 30) tr.forEach(function (p2, i2) { cx.beginPath(); cx.arc(X(p2[0]), X(p2[1]), X(R) * (0.4 + i2 / 16), 0, 7); cx.fillStyle = 'rgba(180,220,255,' + (i2 / tr.length * 0.22) + ')'; cx.fill(); });
    });
    g.balls_.forEach(function (b) {
      var bx = X(b.x), by = X(b.y), br = X(R);
      cx.beginPath(); cx.ellipse(bx + br * 0.25, by + br * 0.35, br, br * 0.8, 0, 0, 7); cx.fillStyle = 'rgba(0,0,0,.3)'; cx.fill();
      var bgd = cx.createRadialGradient(bx - br * 0.35, by - br * 0.4, br * 0.1, bx, by, br); bgd.addColorStop(0, '#ffffff'); bgd.addColorStop(0.35, '#dfe4ee'); bgd.addColorStop(0.8, '#7a8298'); bgd.addColorStop(1, '#3a4054');
      cx.beginPath(); cx.arc(bx, by, br, 0, 7); cx.fillStyle = bgd; cx.fill();
      cx.beginPath(); cx.arc(bx + br * 0.3, by + br * 0.35, br * 0.25, 0, 7); cx.fillStyle = 'rgba(255,200,120,.35)'; cx.fill();
    });
    drawFx();
  }
  // ================= sparks, score pop-ups, banners =================
  var fx = { parts: [], pops: [], flash: 0, flashCol: '255,220,120', banner: null };
  function sparks(x0, y0, col, n, sp) { for (var i = 0; i < n && fx.parts.length < 220; i++) { var a = Math.random() * Math.PI * 2, v = (0.4 + Math.random()) * (sp || 1); fx.parts.push({ x: x0, y: y0, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: 22 + Math.random() * 14, c: col }); } }
  function pop(x0, y0, txt, col) { fx.pops.push({ x: x0, y: y0, txt: txt, c: col || '#fff3b0', t: 0 }); if (fx.pops.length > 12) fx.pops.shift(); }
  function flashAll(col, text) { fx.flash = 1; fx.flashCol = col; if (text) fx.banner = { txt: machine==='goober'?text.replace(/LIGHTHOUSE/g,'POWER CORE'):text, t: 0 }; }
  function drawFx() {
    cx.save(); cx.globalCompositeOperation = 'lighter';
    fx.parts = fx.parts.filter(function (p) { p.t++; p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94; return p.t < p.life; });
    fx.parts.forEach(function (p) { cx.globalAlpha = 1 - p.t / p.life; cx.fillStyle = p.c; cx.beginPath(); cx.arc(X(p.x), X(p.y), X(0.45), 0, 7); cx.fill(); });
    cx.restore(); cx.globalAlpha = 1;
    cx.textAlign = 'center';
    fx.pops = fx.pops.filter(function (p) { p.t++; return p.t < 50; });
    fx.pops.forEach(function (p) { var a = 1 - Math.max(0, p.t - 30) / 20; cx.globalAlpha = a; cx.font = '900 ' + X(3) + 'px ui-rounded, system-ui, sans-serif'; cx.lineWidth = X(0.8); cx.strokeStyle = 'rgba(10,15,40,.85)'; cx.strokeText(p.txt, X(p.x), X(p.y - p.t * 0.12)); cx.fillStyle = p.c; cx.fillText(p.txt, X(p.x), X(p.y - p.t * 0.12)); });
    cx.globalAlpha = 1;
    if (fx.banner) {
      var bn = fx.banner; bn.t++; if (bn.t > 110) { fx.banner = null; return; }
      var sc = Math.min(1, bn.t / 10), a2 = bn.t > 85 ? 1 - (bn.t - 85) / 25 : 1;
      cx.save(); cx.globalAlpha = a2; cx.translate(X(48), X(108)); cx.scale(0.5 + sc * 0.5, 0.5 + sc * 0.5);
      cx.font = '900 ' + X(8) + 'px ui-rounded, system-ui, sans-serif'; cx.lineWidth = X(1.6); cx.strokeStyle = 'rgba(10,15,40,.9)'; cx.strokeText(bn.txt, 0, 0);
      var tg = cx.createLinearGradient(0, X(-7), 0, X(1)); tg.addColorStop(0, '#fff6c0'); tg.addColorStop(1, '#ffb020'); cx.fillStyle = tg; cx.fillText(bn.txt, 0, 0); cx.restore();
    }
  }

  // ================= game flow =================
  var g = null, paused = false, dispScore = 0;
  function newGame() { g = PB.newGame(); g.seed = (Date.now() & 0xffffff) + 1; PB.drops.forEach(function (d) { d.down = false; }); dispScore = 0; meta.games++; saveMeta(); hint(); }
  function hint() { $('hint').classList.toggle('show', !!(g && g.state === 'plunger' && waiting())); }
  function waiting() { return g.balls_.some(function (b) { return b.inLane && b.x > 92 && b.autoFire == null && b.y > PB.PLUNGER.y - R - 3; }); }
  function gameOver() {
    S.over(); meta.finished++;
    var sc = g.score, list = meta.scores.concat([{ s: sc, d: new Date().toISOString().slice(0, 10) }]).sort(function (a, b) { return b.s - a.s; }).slice(0, 5), best = list[0].s === sc && sc > 0;
    meta.scores = list; saveMeta();
    setTimeout(function () {
      showCard('Game over', 'Score <b>' + PB.fmt(sc) + '</b>' + (best ? ' <span class="newbest">New high score!</span>' : '') + '<br>Best ' + PB.fmt(list[0].s) + '.', [
        { label: 'Play again', red: true, go: function () { between(newGame); } },
        { label: 'All games', go: function () { Goobs.home(); } }]);
    }, 1200);
  }
  function showCard(title, html, buttons) {
    $('endTitle').textContent = title; $('endText').innerHTML = html;
    var box = $('endActions'); box.innerHTML = '';
    buttons.forEach(function (b) { var el = document.createElement('button'); el.className = 'btn' + (b.red ? ' red' : ''); el.textContent = b.label; el.addEventListener('click', function () { $('ovEnd').classList.remove('show'); b.go(); }); box.appendChild(el); });
    $('ovEnd').classList.add('show');
  }
  function showAd(done2) { GoobsAds.show({ onShow: function () { S.ding(); }, onStep: function () { S.sign(); } }, done2); }
  function between(next) {
    if (Goobs.adsOn() && meta.finished > 0 && meta.finished % settings.adEvery === 0 && meta.lastAdAt !== meta.finished) { meta.lastAdAt = meta.finished; saveMeta(); next(); showAd(function () {}); return; }
    next();
  }
  function mx(n) { return '+' + PB.fmt(n * (g.multiball ? 2 : 1)); }
  function handleEvents() {
    g.ev.forEach(function (e) {
      switch (e.t) {
        case 'flip': S.flip(); break; case 'flipDown': S.flipDown(); break;
        case 'bumper': S.bumper(e.i); var bb = PB.bumpers[e.i]; sparks(bb.x, bb.y, '#ffd24a', 10, 1.1); pop(bb.x, bb.y - 6, mx(100)); break;
        case 'sling': S.sling(); var sl = PB.slings[e.side || 0]; sparks((sl.x1 + sl.x2) / 2, (sl.y1 + sl.y2) / 2, '#ffffff', 7, 0.9); break;
        case 'thud': S.thud(e.v); break;
        case 'lane': S.lane(); sparks(PB.LANES[e.i], 36, '#ffb040', 12, 0.8); pop(PB.LANES[e.i], 30, mx(500)); break;
        case 'inlane': S.inlane(); break;
        case 'drop': S.drop(); var dd = PB.drops[e.i].seg; sparks(dd.x1, (dd.y1 + dd.y2) / 2, '#ffe060', 10, 0.9); pop(dd.x1 + 7, (dd.y1 + dd.y2) / 2, mx(500)); break;
        case 'dropsDone': S.dropsDone(); flashAll('200,120,255', 'KICKBACK!'); break;
        case 'standup': S.standup(); sparks(88, 99, '#5affd0', 10, 0.9); pop(82, 99, mx(1000), '#9dffe6'); break;
        case 'saucer': S.saucer(); sparks(PB.SAUCER.x, PB.SAUCER.y, '#fff0a0', 18, 1.3); pop(PB.SAUCER.x - 6, PB.SAUCER.y - 5, mx(3000)); break;
        case 'eject': S.eject(); break;
        case 'plunge': S.plunge(e.p); hint(); break; case 'outlane': S.outlane(); break; case 'kickback': S.kickback(); break;
        case 'drain': S.drain(); fx.flash = 0.6; fx.flashCol = '255,60,60'; break; case 'saved': S.saved(); flashAll('120,200,255', 'BALL SAVED'); break;
        case 'skill': S.skill(); flashAll('90,255,150', 'SKILL SHOT!'); break; case 'mult': S.mult(); flashAll('255,200,80', 'BONUS ' + g.mult + 'X'); break;
        case 'multiball': S.multiball(); flashAll('255,230,140', 'MULTIBALL!'); break; case 'jackpot': S.jackpot(); flashAll('255,200,60', 'JACKPOT!'); sparks(PB.SAUCER.x, PB.SAUCER.y, '#ffd24a', 40, 2); break;
        case 'extra': S.extra(); flashAll('120,255,160', 'EXTRA BALL!'); break; case 'nudge': S.nudge(); break;
        case 'gameOver': gameOver(); break;
      }
    });
  }
  function renderDmd() {
    if (!g) return;
    dispScore += Math.ceil((g.score - dispScore) * 0.25); if (g.score - dispScore < 3) dispScore = g.score;
    $('dScore').textContent = PB.fmt(dispScore);
    var m = g.msgs.length ? g.msgs[g.msgs.length - 1].text : g.over ? 'GAME OVER' : g.multiball ? 'MULTIBALL · JACKPOT ' + PB.fmt(g.jackpot) : g.state === 'plunger' && waiting() ? (g.skillOn ? 'SKILL: LET GO IN GREEN' : 'LAUNCH') : '';
    if(machine==='goober')m=m.replace(/LIGHTHOUSE/g,'POWER CORE');
    if ($('dMsg').textContent !== m) $('dMsg').textContent = m;
    var bl = 'BALL ' + g.ball + (g.extra ? ' +' + g.extra : ''); if ($('dBall').textContent !== bl) $('dBall').textContent = bl;
  }

  // ================= input =================
  var keys = {}, touches = {};
  var KEYS = { ShiftLeft: 'left', KeyZ: 'left', ArrowLeft: 'left', ShiftRight: 'right', Slash: 'right', KeyM: 'right', ArrowRight: 'right', Space: 'plunge', Enter: 'plunge', ArrowDown: 'plunge' };
  document.addEventListener('keydown', function (e) { if (e.code === 'Escape' || e.code === 'KeyP') { togglePause(); return; } var a = KEYS[e.code]; if (a) { keys[a] = true; e.preventDefault(); S.unlock(); } });
  document.addEventListener('keyup', function (e) { var a = KEYS[e.code]; if (a) keys[a] = false; });
  function onDown(e) {
    if (overlayOpen()) return; S.unlock();
    touches[e.pointerId] = e.clientX < window.innerWidth / 2 ? 'left' : 'right'; e.preventDefault();
  }
  function onUp(e) { delete touches[e.pointerId]; }
  function readPad() {
    var o = {}, list = navigator.getGamepads ? navigator.getGamepads() : [];
    for (var i = 0; i < list.length; i++) { var p = list[i]; if (!p) continue; var b = function (n) { return p.buttons[n] && p.buttons[n].pressed; };
      if (b(4) || b(6) || b(14)) o.left = true; if (b(5) || b(7) || b(15)) o.right = true; if (b(0) || b(13)) o.plunge = true; }
    return o;
  }
  function input() {
    var o = { left: !!keys.left, right: !!keys.right, plunge: !!keys.plunge }, pd = readPad(), anyTouch = false;
    for (var id in touches) { anyTouch = true; o[touches[id]] = true; }
    if (pd.left) o.left = true; if (pd.right) o.right = true; if (pd.plunge) o.plunge = true;
    // with a ball waiting in the shooter lane, a held touch pulls the plunger
    if (g && waiting() && anyTouch && !g.balls_.some(function (b) { return !b.inLane; })) { o.plunge = true; o.left = !!keys.left || pd.left; o.right = !!keys.right || pd.right; }
    return o;
  }

  // ================= pause, help =================
  function overlayOpen() { return ['ovPause', 'ovEnd', 'ovHelp'].some(function (id) { return $(id).classList.contains('show'); }) || GoobsAds.isOpen(); }
  function openPause() { machineUi(); touches = {}; keys = {}; renderScores(); syncSet(); $('ovPause').classList.add('show'); }
  function togglePause() { if ($('ovEnd').classList.contains('show')) return; if ($('ovPause').classList.contains('show')) $('ovPause').classList.remove('show'); else openPause(); }
  function renderScores() { $('scores').innerHTML = meta.scores.length ? '<h3>High scores</h3><ol>' + meta.scores.map(function (s) { return '<li>' + PB.fmt(s.s) + '<small>' + s.d + '</small></li>'; }).join('') + '</ol>' : ''; }
  function syncSet() { $('setSound').checked = settings.sound; $('setAds').checked = Goobs.adsOn(); $('adEvery').textContent = settings.adEvery; $('rowAdEvery').classList.toggle('off', !Goobs.adsOn()); }
  function openHelp() {
    var laneName=machine==='harbor'?'S E A':'G B L',feature=machine==='harbor'?'lighthouse':'power core';
    $('helpList').innerHTML = [
      '<b>Launch</b>: with the ball in the shooter lane, press and hold anywhere, then let go. Longer hold, harder shot.',
      '<b>Flippers</b>: touch the <b>left half</b> of the screen for the left flipper, the <b>right half</b> for the right one. Hold to cradle the ball.',
      '<b>Skill shot</b>: while you hold, the gauge beside the plunger fills. Let go while it is in the flashing <b>green band</b> for 10,000. Flipping moves the lit S E A lanes.',
      'Light all three <b>S E A</b> lanes to raise the bonus multiplier (up to 5×). Knock down the three yellow <b>drop targets</b> to light the <b>kickback</b>, which saves a ball from the left outlane.',
      'Shoot the <b>lighthouse saucer</b> on the right to collect the lighthouse value (the green target raises it). Three saucer shots start <b>Lighthouse Multiball</b>: then every saucer shot is a jackpot.',
      'Every ball has a <b>ball save</b> for 15 seconds after the launch. Three balls a game; extra balls at 500,000 and 1,500,000.',
      'Keyboard: Z / left Shift and M / right Shift flip, Space launches, Esc pauses. Game controllers: bumpers or triggers flip, A launches.'
    ].map(function (x) { if(machine!=='harbor')x=x.replace(/S E A/g,laneName).replace(/Lighthouse/g,'Power Core').replace(/lighthouse/g,feature);return '<li>' + x + '</li>'; }).join('');
    $('ovHelp').classList.add('show');
  }

  // ================= loop =================
  var lastT = 0, acc = 0, STEP = 1000 / 60;
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = lastT ? Math.min(100, now - lastT) : STEP; lastT = now;
    if (g && !overlayOpen() && !document.hidden) {
      acc += dt; var n = 0;
      while (acc >= STEP && n < 5) { acc -= STEP; var inp = input(); if (inp.plunge && waiting()) S.plungeCharge(g.plunge); PB.step(g, inp); handleEvents(); n++; }
      if (n >= 5) acc = 0;
      hint();
    } else acc = 0;
    draw(); renderDmd();
  }

  function init() {
    cv = $('cv'); cx = cv.getContext('2d');PB.setMachine(machine);syncInserts();machineUi();
    $('machinePicker').addEventListener('click',function(e){var b=e.target.closest('[data-machine]');if(b)selectMachine(b.dataset.machine);});
    import('./cabinet.js').then(function(m){cabinetFactory=m.create;rebuildCabinet();}).catch(function(){/* canvas fallback keeps the table playable */});
    document.addEventListener('pointerdown', function (e) { if (e.target.closest('button, .overlay, .dmdrow')) return; onDown(e); }, { passive: false });
    document.addEventListener('pointerup', onUp); document.addEventListener('pointercancel', onUp);
    document.addEventListener('touchmove', function (e) { if (!e.target.closest('.overlay')) e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    window.addEventListener('blur', function () { touches = {}; keys = {}; });
    $('btnPause').addEventListener('click', openPause);
    $('btnResume').addEventListener('click', function () { store.set('machine',machine);$('ovPause').classList.remove('show'); });
    $('btnNewGame').addEventListener('click', function () { $('ovPause').classList.remove('show'); newGame(); });
    $('btnHomeP').addEventListener('click', function () { Goobs.home(); });
    $('btnHelp2').addEventListener('click', function () { $('ovPause').classList.remove('show'); openHelp(); });
    function closeHelp() { $('ovHelp').classList.remove('show'); if (!meta.seen) { meta.seen = true; saveMeta(); } }
    $('btnCloseHelp').addEventListener('click', closeHelp); $('ovHelp').addEventListener('click', function (e) { if (e.target === this) closeHelp(); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); S.setEnabled(settings.sound); S.ding(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncSet(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncSet(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncSet(); });
    document.addEventListener('visibilitychange', function () { if (document.hidden && g && !g.over) openPause(); });
    if (window.ResizeObserver) new ResizeObserver(fit).observe($('stagewrap'));
    window.addEventListener('resize', fit);
    S.setEnabled(settings.sound); fit(); newGame();
    if(!store.get('machine',null))openPause();
    requestAnimationFrame(frame);
    window.__hlReady = true;
    Goobs.markPlayed('pinball');
    Goobs.initUpdates({ onVersions: function (v) { $('version').textContent = 'Goober Ball ' + (v.pinball || '?') + ' · Goobs-Games ' + (v.shell || '?'); } });
  }
  window.__hl = { get g() { return g; }, PB: PB, keys: keys, newGame: newGame, get machine(){return machine;}, get cabinet(){return cabinet;}, selectMachine:selectMachine };
  init();
})();
</script>
