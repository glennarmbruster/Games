<script>
/* if Lot Escape can't open, say so on screen (never a blank page) and offer a fresh start */
(function () {
  var shown = false;
  function fail(msg) {
    if (shown || window.__leReady) return; shown = true;
    function put() {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:#eef4f0;color:#1b1f33;font:600 16px -apple-system,system-ui,sans-serif;text-align:center';
      d.innerHTML = '<b style="font-size:21px">Lot Escape didn\u2019t open</b><div style="max-width:320px;opacity:.75;font-size:13px">' + String(msg).replace(/[<>&]/g, '') + '</div>';
      function btn(t, bg, go) { var b = document.createElement('button'); b.textContent = t; b.style.cssText = 'font:800 17px -apple-system,system-ui,sans-serif;padding:13px 24px;border-radius:14px;border:0;color:#fff;background:' + bg; b.onclick = go; d.appendChild(b); }
      btn('Start fresh', '#5a54f0', function () { try { localStorage.removeItem('parking.game'); } catch (e) { /* ignore */ } location.reload(); });
      btn('All games', '#6b7080', function () { location.href = '../../'; });
      document.body.appendChild(d);
    }
    if (document.body) put(); else document.addEventListener('DOMContentLoaded', put);
  }
  window.addEventListener('error', function (e) { fail((e.message || 'Something went wrong') + (e.lineno ? ' (line ' + e.lineno + ')' : '')); });
  setTimeout(function () { if (!window.__leReady) fail('It took too long to start.'); }, 6000);
})();
</script>

.brand h1 { font-size: 22px; }
.stagewrap { flex: 1 1 auto; min-height: 0; width: calc(100% + 20px); margin: 0 -10px; display: flex; align-items: stretch; justify-content: center; }
.stage { position: relative; flex: 1; border-radius: 18px; overflow: hidden; touch-action: none; margin: 0 10px; background: #7cc86a; box-shadow: var(--shadow); }
[data-theme="dark"] .stage, [data-theme="blue"] .stage { background: #2f5a3a; }

.toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); max-width: 92%; text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: rgba(20,24,36,.82); color: #fff; font-weight: 700; font-size: 14px; padding: 8px 14px; border-radius: 14px; }
.toast.show { opacity: 1; }
.cardicon svg { border-radius: 16px; }
/* full screen (kit): the counters are pills in the top row, so the game's name is hidden there (the Menu shows it)

.ttpills { flex: 1 1 auto; width: auto; min-width: 0; min-height: 0; justify-content: flex-end; gap: 6px; padding: 0; cursor: pointer; }

<script>
/* Lot Escape rules (no DOM; runs in Node for the tests).
   A parking lot is a w × h grid. Cars are 2 long (trucks 3), lying across ('h') or up-down ('v'), with a front.
   A car can only move along its own line: it slides until the next square is taken (a car, a tree, a cone) or it
   leaves the lot, and then it drives away. Moving into something right away is a bump. Empty the lot to win.
   Levels are made from the level number. A level is kept only if it can be emptied by driving cars straight out one
   after another (some car can always leave), so every level can be cleared. */
var PJ = (function () {
  'use strict';
  function rng(seed) { var s = (seed >>> 0) || 1; return function () { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
  var COLORS = 10;
  function cells(c) { var out = []; for (var i = 0; i < c.len; i++) out.push(c.dir === 'h' ? [c.x + i, c.y] : [c.x, c.y + i]); return out; }
  function grid(L) {
    var gd = []; for (var y = 0; y < L.h; y++) { gd.push([]); for (var x = 0; x < L.w; x++) gd[y].push(-1); }
    (L.rocks || []).forEach(function (r) { gd[r[1]][r[0]] = -2; });
    L.cars.forEach(function (c) { if (c.gone) return; cells(c).forEach(function (p) { gd[p[1]][p[0]] = c.id; }); });
    return gd;
  }
  // how far a car would go (sign +1 = right/down, -1 = left/up); exit = leaves the lot
  function slide(L, c, sign, gd) {
    gd = gd || grid(L);
    var n = 0, x = c.x, y = c.y;
    for (;;) {
      var hx, hy; // the square in front of the moving end
      if (c.dir === 'h') { hx = sign > 0 ? x + c.len + n : x - 1 - n; hy = y; } else { hx = x; hy = sign > 0 ? y + c.len + n : y - 1 - n; }
      if (hx < 0 || hy < 0 || hx >= L.w || hy >= L.h) return { dist: n, exit: true };
      var v = gd[hy][hx]; if (v !== -1) return { dist: n, exit: false, blocker: v };
      n++;
    }
  }
  function canExit(L, c, gd) { return slide(L, c, 1, gd).exit ? 1 : slide(L, c, -1, gd).exit ? -1 : 0; }

  // ---------------- levels ----------------
  function recipe(n) {
    var sizes = [[4, 4], [4, 5], [5, 5], [5, 6], [6, 6], [6, 7], [6, 8], [7, 8], [7, 9], [7, 10]];
    var si = Math.min(sizes.length - 1, n <= 1 ? 0 : n <= 3 ? 1 : n <= 6 ? 2 : n <= 10 ? 3 : n <= 18 ? 4 : n <= 30 ? 5 : n <= 50 ? 6 : n <= 80 ? 7 : n <= 130 ? 8 : 9);
    var fill = Math.min(0.86, 0.55 + n * 0.006), rounds = Math.min(9, 2 + Math.floor(Math.sqrt(n) * 0.7)), rocks = n < 12 ? 0 : Math.min(4, Math.floor((n - 8) / 15));
    if (n % 10 === 0 && n > 10) { rounds = Math.max(2, rounds - 3); fill -= 0.1; }
    return { w: sizes[si][0], h: sizes[si][1], fill: fill, rounds: rounds, rocks: rocks, trucks: n < 5 ? 0 : 0.18 };
  }
  // waves of cars that can drive straight out; returns the number of waves, or 0 if it gets stuck
  function waves(L) {
    var M = { w: L.w, h: L.h, rocks: L.rocks, cars: L.cars.map(function (c) { return { id: c.id, x: c.x, y: c.y, len: c.len, dir: c.dir, gone: false }; }) }, left = M.cars.length, rounds = 0, first = 0;
    while (left) {
      var gd = grid(M), out = M.cars.filter(function (c) { return !c.gone && canExit(M, c, gd); });
      if (!out.length) return { rounds: 0 };
      if (!rounds) first = out.length;
      out.forEach(function (c) { c.gone = true; }); left -= out.length; rounds++;
    }
    return { rounds: rounds, first: first };
  }
  function build(n) {
    var R = recipe(n), r = rng(n * 2654435761 + 11), best = null;
    for (var attempt = 0; attempt < 400; attempt++) {
      var L = { n: n, w: R.w, h: R.h, cars: [], rocks: [] }, occ = {};
      function free(x, y) { return x >= 0 && y >= 0 && x < L.w && y < L.h && !occ[x + ',' + y]; }
      for (var k = 0; k < R.rocks; k++) { var rx = Math.floor(r() * L.w), ry = Math.floor(r() * L.h); if (free(rx, ry)) { occ[rx + ',' + ry] = 1; L.rocks.push([rx, ry]); } }
      var target = Math.floor(L.w * L.h * R.fill), used = L.rocks.length, tries = 0;
      while (used < target && tries++ < 600) {
        var len = r() < R.trucks ? 3 : 2, dir = r() < 0.5 ? 'h' : 'v';
        var x = Math.floor(r() * (dir === 'h' ? L.w - len + 1 : L.w)), y = Math.floor(r() * (dir === 'v' ? L.h - len + 1 : L.h));
        var c = { id: L.cars.length, x: x, y: y, len: len, dir: dir }, ok = cells(c).every(function (p) { return free(p[0], p[1]); });
        if (!ok) continue;
        // no car may start parallel and right in line with an edge gap that lets everything leave at once: keep it mixed
        c.face = r() < 0.5 ? 1 : -1; c.color = Math.floor(r() * COLORS);
        cells(c).forEach(function (p) { occ[p[0] + ',' + p[1]] = 1; }); used += len; L.cars.push(c);
      }
      var wv = waves(L);
      if (!wv.rounds) continue;
      var score = Math.abs(wv.rounds - R.rounds) * 3 + Math.max(0, wv.first - Math.max(2, Math.ceil(L.cars.length / 4)));
      if (!best || score < best.score) best = { L: L, score: score, rounds: wv.rounds };
      if (score === 0) break;
    }
    best.L.rounds = best.rounds;
    return best.L;
  }

  // ---------------- play ----------------
  function create(n) { var L = build(n); return { n: n, w: L.w, h: L.h, rocks: L.rocks, cars: L.cars.map(function (c) { return { id: c.id, x: c.x, y: c.y, len: c.len, dir: c.dir, face: c.face, color: c.color, gone: false }; }), moves: 0, bumps: 0, hist: [], won: false }; }
  // move car id: sign +1/-1 along its line (or 0 = the way it faces). Returns { dist, exit, blocker, sign }
  function move(g, id, sign) {
    var c = g.cars[id]; if (!c || c.gone || g.won) return null;
    if (!sign) sign = c.face;
    var s = slide(g, c, sign);
    if (s.dist === 0 && !s.exit) { g.bumps++; return { dist: 0, exit: false, blocker: s.blocker, sign: sign, bump: true }; }
    g.hist.push({ id: id, x: c.x, y: c.y, face: c.face });
    if (c.dir === 'h') c.x += sign * s.dist; else c.y += sign * s.dist;
    c.face = sign; g.moves++;
    if (s.exit) c.gone = true;
    g.won = g.cars.every(function (q) { return q.gone; });
    return { dist: s.dist, exit: s.exit, blocker: s.blocker, sign: sign, won: g.won };
  }
  function undo(g) { var h = g.hist.pop(); if (!h) return null; var c = g.cars[h.id]; c.x = h.x; c.y = h.y; c.face = h.face; c.gone = false; g.won = false; g.moves++; return h.id; }
  function hint(g) { var gd = grid(g), best = null; g.cars.forEach(function (c) { if (c.gone || best) return; var e = canExit(g, c, gd); if (e) best = { id: c.id, sign: e }; }); return best; }
  function left(g) { return g.cars.filter(function (c) { return !c.gone; }).length; }
  return { rng: rng, COLORS: COLORS, cells: cells, grid: grid, slide: slide, canExit: canExit, recipe: recipe, waves: waves, build: build, create: create, move: move, undo: undo, hint: hint, left: left };
})();
if (typeof module !== 'undefined') module.exports = PJ;
</script>
<script>
/* Lot Escape art: top-down cars, trucks, trees and cones drawn in code. LArt.car(x, color, len, cs) draws a car
   pointing up (front at the top), centred on (0, 0), len squares long, cs px per square. */
var LArt = (function () {
  'use strict';

    signs.forEach(function (s) { var c = g.cars[s.id], v = view[s.id]; if (!c || c.gone) return; var w2 = c.dir === 'h' ? c.len * cs : cs; var bx = ox + v.x * cs + w2 / 2, by = oy + v.y * cs - cs * 0.2 - Math.sin(s.t * Math.PI) * cs * 0.2;
      cx.globalAlpha = 1 - Math.max(0, s.t - 0.7) / 0.3; cx.beginPath(); cx.arc(bx, by, cs * 0.28, 0, 7); cx.fillStyle = '#fff'; cx.fill(); cx.lineWidth = 2; cx.strokeStyle = '#e8354a'; cx.stroke();
      cx.fillStyle = '#e8354a'; cx.font = '900 ' + Math.round(cs * 0.4) + 'px system-ui, sans-serif'; cx.textAlign = 'center'; cx.fillText('!', bx, by + cs * 0.14); cx.globalAlpha = 1; });
    parts = parts.filter(function (p) { p.t++; p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.rot += p.vr; return p.t < p.life && p.y < H + 20; });
    parts.forEach(function (p) { cx.globalAlpha = Math.max(0, 1 - p.t / p.life); cx.fillStyle = p.c; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillRect(-p.r, -p.r * 0.5, p.r * 2, p.r); cx.restore(); });
    cx.globalAlpha = 1;
  }
  function frame(now) { requestAnimationFrame(frame); draw(now); }

  // ================= info, cards, sheets =================
  // full screen: when the pills don't fit the top row (an SE with big numbers), drop their unit words
  function fitPills() {
    var el = $('info'), w = 0; if (!el) return; el.classList.remove('tight');
    Array.prototype.forEach.call(el.children, function (c) { w += c.offsetWidth + 6; });
    if (w > el.clientWidth + 6) el.classList.add('tight');
  }
  // full screen: two pills in the top row instead of the old LEVEL / CARS LEFT row (frees ~50px)
  function renderInfo() { if (!g) return; $('info').innerHTML = '<span class="ggpill"><small>Lv</small> ' + g.n + '</span><span class="ggpill">' + PJ.left(g) + ' <small>cars</small> · ' + g.moves + ' <small>moves</small></span>'; fitPills(); }
  var toastT = 0;
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('show'); }, 2000); }
  function showCard(title, html, buttons) {
    $('cardIcon').innerHTML = '<svg viewBox="0 0 100 100"><use href="#le-logo"/></svg>';
    $('endTitle').textContent = title; $('endText').innerHTML = html;
    var box = $('endActions'); box.innerHTML = '';
    buttons.forEach(function (b) { var el = document.createElement('button'); el.className = 'btn' + (b.red ? ' red' : ''); el.textContent = b.label; el.addEventListener('click', function () { $('ovEnd').classList.remove('show'); b.go(); }); box.appendChild(el); });
    $('ovEnd').classList.add('show');
  }
  function showAd(done2) { GoobsAds.show({ onShow: function () { S.ding(); }, onStep: function () { S.sign(); } }, done2); }
  function between(next) { if (Goobs.adsOn() && meta.finished > 0 && meta.finished % settings.adEvery === 0 && meta.lastAdAt !== meta.finished) { meta.lastAdAt = meta.finished; saveMeta(); next(); showAd(function () {}); return; } next(); }
  function openHelp() {
    $('helpList').innerHTML = [
      '<b>Swipe a car</b> forward or backward to drive it. <b>Tap</b> a car to drive it the way it faces.',
      'Cars only move along their own line. A car keeps going until it touches something, or reaches the road and <b>drives away</b>.',
      'Driving straight into something is a <b>bump</b> (and a honk). Trees and cones never move.',
      '<b>Empty the lot</b> to win. Every level can be cleared by driving cars out one after another.',
      '<b>Undo</b> and <b>Hint</b> are free and unlimited. <b>Restart</b> puts the lot back how it started.'
    ].map(function (x) { return '<li>' + x + '</li>'; }).join('');
    $('ovHelp').classList.add('show');
  }
  function renderStats() {
    $('statsBody').innerHTML = '<div class="tiles"><div class="tile"><b>' + fmt(stats.cleared) + '</b><span>Lots cleared</span></div><div class="tile"><b>' + fmt(stats.cars) + '</b><span>Cars out</span></div><div class="tile"><b>' + fmt(stats.moves) + '</b><span>Moves</span></div></div>' +
      '<div class="tiles"><div class="tile"><b>' + fmt(stats.bumps) + '</b><span>Bumps</span></div><div class="tile"><b>' + fmt(stats.hints) + '</b><span>Hints</span></div><div class="tile"><b>' + fmt(stats.undos) + '</b><span>Undos</span></div></div>';
  }

  // ================= wiring =================
  function syncSound() { $('btnSound').innerHTML = '<svg viewBox="0 0 24 24"><use href="#i-sound-' + (settings.sound ? 'on' : 'off') + '"/></svg>'; $('btnSound').classList.toggle('on', settings.sound); $('setSound').checked = settings.sound; S.setEnabled(settings.sound); }
  function syncAds() { $('setAds').checked = Goobs.adsOn(); $('adEvery').textContent = settings.adEvery; $('rowAdEvery').classList.toggle('off', !Goobs.adsOn()); }
  function sheet(btn, ov, close, onOpen) {
    if (btn) $(btn).addEventListener('click', function () { if (onOpen) onOpen(); $(ov).classList.add('show'); });
    $(close).addEventListener('click', function () { $(ov).classList.remove('show'); });
    $(ov).addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  }
  function init() {
    Goobs.themePicker($('themes'));
    cv = $('cv'); cx = cv.getContext('2d');
    cv.addEventListener('pointerdown', onDown); window.addEventListener('pointerup', onUp); window.addEventListener('pointercancel', function () { down = null; });
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) { document.addEventListener(ev, function () { S.unlock(); }, { passive: true }); });
    $('btnHome').addEventListener('click', function () { save(); Goobs.home(); });
    $('btnRestart').addEventListener('click', function () { if (g && g.moves) showCard('Restart this lot?', 'All the cars go back where they started.', [{ label: 'Restart', red: true, go: restart }, { label: 'Keep playing', go: function () {} }]); });
    $('btnUndo').addEventListener('click', undo); $('btnHint').addEventListener('click', hint);
    $('btnHelp').addEventListener('click', openHelp);
    // full screen (kit): How to, Stats and Settings live in the Menu; Restart / Undo / Hint stay on screen
    Goobs.fullscreen({ menu: ['btnHelp', 'btnStats', 'btnSettings'],
      info: function () { return g ? 'Level <b>' + g.n + '</b> · <b>' + PJ.left(g) + '</b> cars left · <b>' + g.moves + '</b> moves' : ''; } });
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings');
    sheet('btnStats', 'ovStats', 'btnCloseStats', renderStats);
    function closeHelp() { $('ovHelp').classList.remove('show'); if (!meta.seen) { meta.seen = true; saveMeta(); } }
    $('btnCloseHelp').addEventListener('click', closeHelp); $('ovHelp').addEventListener('click', function (e) { if (e.target === this) closeHelp(); });
    $('info').addEventListener('click', openHelp);
    $('btnSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncSound(); S.ding(); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); syncSound(); S.ding(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncAds(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncAds(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncAds(); });
    if (window.ResizeObserver) new ResizeObserver(fit).observe($('stagewrap'));
    window.addEventListener('resize', fit);
    document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });
    window.addEventListener('pagehide', save);
    syncSound(); syncAds(); fit();
    if (!load()) startLevel(meta.level);
    fit();
    if (!meta.seen) openHelp();
    requestAnimationFrame(frame);
    window.__leReady = true;
    Goobs.markPlayed('parking');
    Goobs.initUpdates({ beforeReload: save, onVersions: function (v) { $('version').textContent = 'Lot Escape ' + (v.parking || '?') + ' · Goobs-Games ' + (v.shell || '?'); } });
  }
  window.__le = { get g() { return g; }, moveCar: moveCar, startLevel: startLevel, PJ: PJ, undo: undo, hint: hint };
  init();
})();
</script>
