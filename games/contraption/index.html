if(t==='gear'){ctx.fillStyle='#bd8834';ctx.strokeStyle='#76501e';ctx.lineWidth=3;ctx.beginPath();for(var k=0;k<32;k++){var a=k*Math.PI/16,rad=k%4<2?40:32;ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#697076';ctx.beginPath();ctx.arc(0,0,17,0,7);ctx.fill();bolt(0,0);rounded(-44,38,88,7,2,'#8e5929','#54321c')}
if(t==='magnet'){ctx.strokeStyle='#17456c';ctx.lineWidth=18;ctx.beginPath();ctx.moveTo(-29,-25);ctx.lineTo(-29,7);ctx.arc(0,7,29,Math.PI,0,true);ctx.lineTo(29,-25);ctx.stroke();ctx.strokeStyle='#388dc1';ctx.lineWidth=11;ctx.stroke();ctx.strokeStyle='#dcbd82';ctx.lineWidth=17;ctx.beginPath();ctx.moveTo(-29,-25);ctx.lineTo(-29,-14);ctx.moveTo(29,-25);ctx.lineTo(29,-14);ctx.stroke()}
ctx.restore()}
function drawGoal(){ctx.save();ctx.translate(target.x,target.y);if(glow>0){ctx.shadowColor='#ffe56b';ctx.shadowBlur=35*glow}if(level.goal.indexOf('bell')>=0){ctx.strokeStyle='#5b3920';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,-55);ctx.lineTo(0,-30);ctx.stroke();ctx.fillStyle='#c39237';ctx.beginPath();ctx.moveTo(-24,3);ctx.quadraticCurveTo(-10,-22,-10,-28);ctx.quadraticCurveTo(0,-40,10,-28);ctx.quadraticCurveTo(10,-22,24,3);ctx.closePath();ctx.fill();ctx.strokeStyle='#714719';ctx.stroke();rounded(-30,0,60,6,3,'#d9b257','#73491f');bolt(0,9)}else if(level.goal.indexOf('lighthouse')>=0){ctx.fillStyle='#ece3c6';ctx.strokeStyle='#6b5c44';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-24,33);ctx.lineTo(-14,-31);ctx.lineTo(14,-31);ctx.lineTo(24,33);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#a74727';ctx.beginPath();ctx.moveTo(-21,-32);ctx.lineTo(0,-51);ctx.lineTo(21,-32);ctx.fill();rounded(-12,-30,24,15,2,glow?'#fff4aa':'#193c50','#503f26');ctx.fillStyle='#173c56';ctx.fillRect(-7,7,14,24)}else if(level.goal.indexOf('flag')>=0){ctx.strokeStyle='#473926';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-13,34);ctx.lineTo(-13,-53);ctx.stroke();ctx.fillStyle='#1d7db3';ctx.beginPath();ctx.moveTo(-11,-51);ctx.lineTo(30,-41);ctx.lineTo(-11,-27);ctx.fill();rounded(-25,32,52,6,2,'#7f5528','#4b321b')}else{rounded(-26,-35,52,67,6,'#a36831','#67411f');rounded(-18,-28,36,37,4,glow?'#fff0a7':'#244054','#6b5536');ctx.fillStyle='#bf872d';ctx.beginPath();ctx.arc(0,-34,5,0,7);ctx.fill()}ctx.restore()}
function draw(){if(!canvas.width||!level)return;ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle='#39221344';ctx.fillRect(0,H-8,W,8);boardPath();ctx.save();ctx.shadowColor='#180d09';ctx.shadowBlur=12;rounded(source.x-45,source.y-13,90,15,4,'#a6733b','#603d22');ctx.restore();if(!running&&!failure)drawBall(source.x,source.y-22,17);if(failure)drawBall(failure.x,failure.y,17);drawGoal();for(var i=0;i<nodes.length;i++){var n=nodes[i],p=placements[i];ctx.save();ctx.translate(n.x,n.y);ctx.fillStyle='#44332688';ctx.beginPath();ctx.ellipse(0,38,49,12,0,0,7);ctx.fill();ctx.setLineDash([5,6]);ctx.strokeStyle=p?'#5cc7ff':'#f1e7c5';ctx.lineWidth=p?3:2;rounded(-56,-47,112,96,14,'#123d602a','#fff');ctx.setLineDash([]);rounded(-17,46,34,22,5,'#173e5b','#c08c4d');ctx.fillStyle='#fff0ce';ctx.font='bold 16px Georgia';ctx.textAlign='center';ctx.fillText(String(i+1),0,62);ctx.restore();if(p)drawMachine(p.type,n.x,n.y,p.dir,1);else{ctx.save();ctx.globalAlpha=.78;ctx.fillStyle='#f5ebd2';ctx.font='bold 18px Georgia';ctx.textAlign='center';ctx.fillText('?',n.x,n.y+7);ctx.restore()}}
if(drag&&drag.x!=null&&drag.type)drawMachine(drag.type,drag.x,drag.y,drag.dir||1,.9);if(glow>0)glow*=.96}
function curLevel(){return levelNo<=12?curated[levelNo-1]:randomLevel(levelNo)}
function load(number){stopTravel();levelNo=Math.max(1,Math.min(number,store.unlocked));store.level=levelNo;level=curLevel();var old=store.placements[levelNo]||[];placements=level.parts.map(function(_,i){var p=old[i];return p&&TYPES[p.type]?{type:p.type,dir:p.dir===-1?-1:1}:null});undo=[];selected=null;anim=null;running=false;paused=false;glow=0;failure=null;closeModal();$('goalText').textContent=level.goal;$('levelText').textContent='Level '+levelNo;layout();inventory();persist();message(level.name+' · '+level.clue)}
function saveBoard(){store.placements[levelNo]=placements.map(function(p){return p?{type:p.type,dir:p.dir}:null});persist()}
function snapshot(){undo.push(placements.map(function(p){return p?{type:p.type,dir:p.dir}:null}));if(undo.length>30)undo.shift()}
function place(i,t,dir){if(running||paused||i<0||i>=placements.length)return;failure=null;if(placements[i]&&placements[i].type===t){snapshot();placements[i].dir*=-1;sound(420,.07);message('Turned '+TYPES[t]);inventory();saveBoard();draw();return}if(stock(t)<=0){message('No '+TYPES[t]+' left in the tray');return}snapshot();placements[i]={type:t,dir:dir||1};sound(490,.08);selected=null;inventory();saveBoard();draw()}
function boardPoint(e){var r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height,inside:e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom}}
function nearest(p){var best=-1,dist=1e9;nodes.forEach(function(n,i){var d=Math.hypot(p.x-n.x,p.y-n.y);if(d<dist){dist=d;best=i}});return dist<Math.min(W*.13,92)?best:-1}
function stopTravel(){clearTimeout(runTimer);runTimer=0;if(ballAnimation){try{ballAnimation.cancel()}catch(e){}ballAnimation=null}travelBall.classList.remove('active')}
function ballPosition(segment,t){var p=curvePoint(segment,t),r=stage.getBoundingClientRect();return{x:p.x*r.width/W-12.5,y:(p.y-14)*r.height/H-12.5}}
function positionTravel(segment,t){var p=ballPosition(segment,t);travelBall.style.transform='translate3d('+p.x+'px,'+p.y+'px,0)'}
function scheduleSegment(){if(!running||paused||!anim)return;clearTimeout(runTimer);var segment=anim.segment,from=anim.progress||0,ms=Math.max(1,Math.round(840*(1-from)));positionTravel(segment,from);travelBall.classList.add('active');
 if(ballAnimation){try{ballAnimation.cancel()}catch(e){}ballAnimation=null}
 if(travelBall.animate){try{var frames=[];for(var i=0;i<=24;i++){var t=from+(1-from)*i/24,p=ballPosition(segment,t);frames.push({transform:'translate3d('+p.x+'px,'+p.y+'px,0)'})}ballAnimation=travelBall.animate(frames,{duration:ms,easing:'linear',fill:'forwards'})}catch(e){ballAnimation=null}}
 if(!ballAnimation){var end=ballPosition(segment,1);travelBall.style.transition='none';void travelBall.offsetWidth;travelBall.style.transition='transform '+ms+'ms linear';travelBall.style.transform='translate3d('+end.x+'px,'+end.y+'px,0)'}
 anim.started=Date.now();anim.duration=ms;runTimer=setTimeout(function(){if(!running||paused||!anim||anim.segment!==segment)return;runTimer=0;anim.progress=1;positionTravel(segment,1);if(ballAnimation){try{ballAnimation.cancel()}catch(e){}ballAnimation=null}finishSegment();if(running&&!paused)scheduleSegment()},ms)}
function pauseTravel(){if(!running||!anim)return;clearTimeout(runTimer);runTimer=0;var fraction=Math.min(1,Math.max(0,(Date.now()-anim.started)/(anim.duration||840)));anim.progress=anim.progress+(1-anim.progress)*fraction;if(ballAnimation){try{ballAnimation.cancel()}catch(e){}ballAnimation=null}travelBall.style.transition='none';positionTravel(anim.segment,anim.progress)}
function run(){if(running||paused)return;selected=null;inventory();running=true;failure=null;anim={segment:0,progress:0,pulse:null};sound(360,.13);message('Ball rolling to mount 1…');scheduleSegment();try{draw()}catch(e){message('Animation display error: '+e.message)}}
function finishSegment(){var index=anim.segment;if(index===nodes.length){running=false;anim=null;stopTravel();glow=1;chime();if(levelNo>=store.unlocked)store.unlocked=levelNo+1;saveBoard();var done=levelNo;message('Goal reached!');setTimeout(function(){if(levelNo===done&&!running&&!paused)show('success')},650);try{draw()}catch(e){}return}var p=placements[index],needed=level.parts[index],dir=nodes[index].dir;if(!p||p.type!==needed||((needed==='ramp'||needed==='fan'||needed==='seesaw'||needed==='magnet')&&p.dir!==dir)){running=false;anim=null;stopTravel();failure={x:nodes[index].x,y:nodes[index].y-14};sound(190,.25,'triangle');message(!p?'The ball stopped at mount '+(index+1)+'. Add a part.':p.type!==needed?'Mount '+(index+1)+' needs another kind of part.':'Turn the part at mount '+(index+1)+' around.');try{draw()}catch(e){}return}anim.pulse=p.type;message('Mount '+(index+1)+' engaged: '+TYPES[p.type]);sound({ramp:430,seesaw:310,spring:790,fan:530,pulley:370,gear:460,magnet:620}[p.type],.14);anim.segment++;anim.progress=0}
function loop(){requestAnimationFrame(loop);frame++;if(glow>0||running||drag){try{draw()}catch(e){}}}
function show(kind){if(running&&!paused)pauseTravel();paused=true;veil.hidden=false;var html='';if(kind==='intro'){html='<h2>Contraption Lab</h2><p>Build a chain reaction in a warm little workshop. Drag parts from the tray to the numbered mounts, then press Run.</p><div class="buttons"><button data-act="continue">Start building</button><button class="secondary" data-act="levels">Choose level</button></div>'}else if(kind==='help'){html='<h2>How to play</h2><p>Drag a part from the tray onto a mount. You can also tap a part, then tap its mount. Tap a mounted part to turn it around; drag it to move it. Follow the pale blue route from the steel ball to the goal. Press <b>Run</b> to test your machine. It stops at the first missing or incorrect link.</p><p>The tray contains a few spare parts. Undo and Reset change your construction, while Hint identifies the next link to fix.</p><div class="buttons"><button data-act="resume">Back to the board</button></div>'}else if(kind==='pause'){html='<h2>Paused</h2><p>Level '+levelNo+' · '+level.name+'</p><div class="buttons"><button data-act="resume">Resume</button><button class="secondary" data-act="levels">Levels</button><button class="secondary" data-act="exit">Exit</button></div>'}else if(kind==='success'){html='<h2>It works!</h2><p>The chain reaction reached its goal. Level '+(levelNo+1)+' is ready.</p><div class="buttons"><button data-act="next">Next level</button><button class="secondary" data-act="resume">View machine</button></div>'}else if(kind==='levels'){html='<h2>Workshop Levels</h2><p>12 handcrafted challenges, then unlimited generated workshop puzzles.</p><div class="levelgrid">';var choices=[];for(var i=1;i<=12;i++)choices.push(i);for(i=Math.max(13,store.unlocked-5);i<=store.unlocked;i++)choices.push(i);for(var j=0;j<choices.length;j++){i=choices[j];html+='<button class="'+(i>store.unlocked?'locked ':'')+(i===levelNo?'current':'')+'" data-level="'+i+'" '+(i>store.unlocked?'disabled':'')+'>'+(i>12?'Workshop '+(i-12):i)+'</button>'}html+='</div><div class="buttons"><button data-act="resume">Back to the board</button></div>'}sheet.innerHTML=html;sheet.scrollTop=0}
function closeModal(){paused=false;veil.hidden=true;if(running)scheduleSegment();try{draw()}catch(e){}}
sheet.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.level){load(Number(b.dataset.level));return}var a=b.dataset.act;if(a==='continue'||a==='resume')closeModal();if(a==='next')load(levelNo+1);if(a==='levels')show('levels');if(a==='exit')location.href='../../index.html'});
$('pauseBtn').onclick=function(){if(veil.hidden)show('pause');else closeModal()};$('helpBtn').onclick=function(){show('help')};$('exitBtn').onclick=function(){location.href='../../index.html'};$('levelsBtn').onclick=function(){show('levels')};$('soundBtn').onclick=function(){store.sound=!store.sound;persist();this.setAttribute('aria-pressed',String(!store.sound));this.textContent=store.sound?'♪':'×'};
$('runBtn').onclick=run;$('resetBtn').onclick=function(){if(paused)return;running=false;anim=null;failure=null;stopTravel();snapshot();placements=placements.map(function(){return null});selected=null;saveBoard();inventory();draw();message('Board cleared. Try a new arrangement.')};$('undoBtn').onclick=function(){if(paused||running)return;if(!undo.length){message('Nothing to undo yet');return}failure=null;placements=undo.pop();saveBoard();inventory();draw();sound(310,.07)};$('hintBtn').onclick=function(){if(paused||running)return;for(var i=0;i<placements.length;i++){var p=placements[i],need=level.parts[i];if(!p||p.type!==need||((need==='ramp'||need==='fan'||need==='seesaw'||need==='magnet')&&p.dir!==nodes[i].dir)){message('Mount '+(i+1)+': '+TYPES[need]+(p&&p.type===need?' — turn it around':''));return}}message('Everything looks ready. Press Run!')};
// A tap selects a tray part; a drag places it. Both interactions work with touch, mouse, or pen.
rack.addEventListener('pointerdown',function(e){var b=e.target.closest('.tile');if(!b||paused||running)return;e.preventDefault();var t=b.dataset.type;if(stock(t)<=0){message('That part is already on the board');return}drag={type:t,dir:1,origin:-1,sx:e.clientX,sy:e.clientY,moved:false,x:null,y:null};sound(550,.035)});
canvas.addEventListener('pointerdown',function(e){if(paused||running)return;e.preventDefault();var p=boardPoint(e),i=nearest(p);if(i>=0&&placements[i]){var piece=placements[i];drag={type:piece.type,dir:piece.dir,origin:i,sx:e.clientX,sy:e.clientY,moved:false,x:null,y:null}}else if(i>=0&&selected){place(i,selected,1)}else if(i<0&&selected){message('Drop the part onto a numbered mount')}});
window.addEventListener('pointermove',function(e){if(!drag)return;if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>7)drag.moved=true;if(drag.moved){var p=boardPoint(e);drag.x=p.x;drag.y=p.y;draw()}});
window.addEventListener('pointerup',function(e){if(!drag)return;var d=drag,p=boardPoint(e),i=p.inside?nearest(p):-1;drag=null;if(d.moved&&i>=0){if(d.origin>=0){if(i!==d.origin){snapshot();failure=null;var displaced=placements[i];placements[i]=placements[d.origin];placements[d.origin]=displaced;saveBoard();inventory();sound(510,.08)}}else place(i,d.type,d.dir)}else if(d.origin>=0&&!d.moved){if(selected&&selected!==d.type)place(d.origin,selected,1);else place(d.origin,d.type,d.dir)}else if(d.origin<0&&!d.moved){selected=d.type;inventory();message('Tap a numbered mount to place '+TYPES[selected])}else if(d.origin>=0&&d.moved&&!p.inside){snapshot();failure=null;placements[d.origin]=null;saveBoard();inventory();sound(280,.06)}draw()});window.addEventListener('pointercancel',function(){drag=null;draw()});
window.addEventListener('resize',layout);window.addEventListener('orientationchange',function(){setTimeout(layout,200)});document.addEventListener('visibilitychange',function(){if(document.hidden&&running&&!paused)show('pause')});$('soundBtn').setAttribute('aria-pressed',String(!store.sound));$('soundBtn').textContent=store.sound?'♪':'×';load(levelNo);show('intro');requestAnimationFrame(loop);
})();
