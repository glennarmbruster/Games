ctx.restore();if(!running){circle(x,y+58,13,'#173e5b','#c08c4d');ctx.fillStyle='#fff0ce';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.fillText(String(i+1),x,y+63)}}
function draw(){if(!canvas.width)return;ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle='#27170b88';ctx.fillRect(0,H-26,W,26);ctx.fillStyle='#c2ecff44';ctx.fillRect(0,H-29,W,3);var s=xy(source),g=xy(goal);ctx.save();ctx.shadowColor='#b8f6ff';ctx.shadowBlur=20;circle(s.x,s.y,23,'#173d60','#b9e6f3',4);ctx.restore();if(!running)circle(s.x,s.y-2,13,'#cbd8d9','#253940',3);ctx.fillStyle='#fff6da';ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.fillText('BALL',s.x,s.y+43);ctx.save();ctx.shadowColor='#ffe36b';ctx.shadowBlur=22;circle(g.x,g.y,31,'#654522','#ffde7b',5);circle(g.x,g.y,18,'#e0b544','#654b28',3);ctx.restore();ctx.fillStyle='#fff5dd';ctx.font='bold 13px Arial';ctx.fillText('GOAL',g.x,g.y+54);parts.forEach(machine);if(ball){ctx.save();ctx.shadowColor='#10121a';ctx.shadowBlur=9;circle(ball.x,ball.y,14,'#bdcdd2','#2e3c42',3);circle(ball.x-4,ball.y-5,4,'#f8ffff');ctx.restore()}if(gesture&&gesture.type==='rack'&&gesture.moved&&gesture.at&&gesture.at.inside){ctx.save();ctx.globalAlpha=.75;machine({type:gesture.part,u:gesture.at.x/W,v:gesture.at.y/H,angle:0},parts.length);ctx.restore()}}

if(elapsed-(hitTime[index]||-10)>.28){hitTime[index]=elapsed;if(kind==='spring'){ball.vx+=Math.cos(a-Math.PI/2)*340;ball.vy+=Math.sin(a-Math.PI/2)*340;beep(720,.1)}else if(kind==='gear'){ball.vx+=-uy*220;ball.vy+=ux*220;beep(470,.08)}else if(kind==='pulley'){ball.vx+=Math.cos(a)*220;ball.vy+=Math.sin(a)*220-120;beep(370,.08)}else if(kind==='magnet'){ball.vx+=ux*115;ball.vy+=uy*115;beep(560,.06)}}}
function step(dt){elapsed+=dt;ball.vy+=520*dt;ball.vx*=.999;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;for(var i=0;i<parts.length;i++)collision(parts[i],i,dt);ball.vx=clamp(ball.vx,-700,700);ball.vy=clamp(ball.vy,-700,700);if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)*.65}if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)*.65}if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy)*.65}if(ball.y>H-26-ball.r){ball.y=H-26-ball.r;ball.vy=-Math.abs(ball.vy)*.45;ball.vx*=.92;if(Math.abs(ball.vy)<12)ball.vy=0}var g=xy(goal);if(Math.hypot(ball.x-g.x,ball.y-g.y)<43){success();return}restTime=(Math.abs(ball.vx)+Math.abs(ball.vy)<20&&ball.y>=H-26-ball.r-1)?restTime+dt:0;if(restTime>1.8){stop('The ball came to rest. Move parts and try again.');return}if(elapsed>25){stop('The ball missed the goal. Move parts and try again.')}}
function tick(now){if(!running||paused)return;try{if(!last)last=now;acc+=Math.min(.08,Math.max(0,(now-last)/1000));last=now;var loops=0;while(acc>=1/120&&running&&loops++<10){step(1/120);acc-=1/120}if(running){draw();raf=requestAnimationFrame(tick)}}catch(e){stop('The run could not finish. Adjust your machine and try again.')}}
function modal(kind){if(running){paused=true;clearTimeout(watchdog);watchdog=0;cancelAnimationFrame(raf)}veil.hidden=false;var body='';if(kind==='help')body='<h2>Free Build</h2><p>Tap a tray part, then tap anywhere on the board to place it. Or drag it from the tray. Drag parts to move them. Tap a placed part to rotate it; drag it off the board to remove it.</p><p>Drag the Ball and Goal markers, or select their buttons and tap a new spot. Press Run to test your machine. Ramps guide, springs launch, fans blow, magnets pull, and moving parts kick the ball. Use Example to start from a small machine.</p>';else if(kind==='pause')body='<h2>Paused</h2><p>Your workshop is saved automatically.</p>';else body='<h2>Clear workshop?</h2><p>This removes all placed parts. Undo can restore them.</p>';sheet.innerHTML=body+'<div class="buttons">'+(kind==='clear'?'<button data-act="clear">Clear parts</button>':'<button data-act="resume">'+(running?'Resume':'Back to workshop')+'</button>')+'<button class="secondary" data-act="guided">Guided</button><button class="secondary" data-act="exit">Exit</button></div>'}
function closeModal(){veil.hidden=true;if(paused){paused=false;if(running){last=0;watchdog=setTimeout(function(){if(running)stop('The ball did not reach the goal. Move parts and try again.')},Math.max(1,(30-elapsed)*1000));raf=requestAnimationFrame(tick)}}draw()}
function example(){stop();snapshot();source={u:.10,v:.16};goal={u:.84,v:.72};parts=W<700?[{type:'spring',u:.40,v:.50,angle:0},{type:'fan',u:.60,v:.45,angle:0}]:[{type:'spring',u:.30,v:.68,angle:-.4},{type:'fan',u:.40,v:.55,angle:-.5}];save();$('status').textContent=parts.length+' parts';msg('Example loaded. Move parts, rotate them, then Run. Undo restores your layout.');draw()}
function createRack(){kinds.forEach(function(k){var b=document.createElement('button');b.className='tile';b.dataset.type=k;b.innerHTML='<svg viewBox="0 0 58 40" aria-hidden="true">'+icons[k]+'</svg><span>'+names[k]+'</span>';b.setAttribute('aria-label','Place '+names[k]);rack.appendChild(b)})}
var gesture=null;rack.addEventListener('pointerdown',function(e){var b=e.target.closest('.tile');if(!b||running||paused)return;e.preventDefault();gesture={type:'rack',part:b.dataset.type,sx:e.clientX,sy:e.clientY,moved:false,at:null}});
canvas.addEventListener('pointerdown',function(e){if(running||paused)return;e.preventDefault();var p=point(e),hit=nearest(p);gesture={type:hit?hit.type:'blank',index:hit&&hit.index,sx:e.clientX,sy:e.clientY,moved:false,at:p,origin:hit&&hit.type==='part'?JSON.stringify(parts[hit.index]):hit&&hit.type==='source'?JSON.stringify(source):hit&&hit.type==='goal'?JSON.stringify(goal):null,before:JSON.stringify({parts:parts,source:source,goal:goal})};if(!hit&&selected)gesture.type='place'});
window.addEventListener('pointermove',function(e){if(!gesture)return;var p=point(e),g=gesture;if(Math.hypot(e.clientX-g.sx,e.clientY-g.sy)>7)g.moved=true;g.at=p;if(!g.moved)return;if(g.type==='part'){parts[g.index]=Object.assign({},parts[g.index],norm(p));draw()}else if(g.type==='source'){source=norm(p);draw()}else if(g.type==='goal'){goal=norm(p);draw()}else if(g.type==='rack')draw()});
window.addEventListener('pointerup',function(e){if(!gesture)return;var g=gesture,p=point(e);gesture=null;drag=null;if(g.type==='rack'){if(g.moved&&p.inside)put(g.part,p);else select(g.part)}else if(g.type==='place'){if(selected)put(selected,p)}else if(g.type==='part'){if(g.moved){if(!p.inside)parts.splice(g.index,1);undo.push(g.before);if(undo.length>30)undo.shift();save();$('status').textContent=parts.length+' parts';msg(p.inside?'Part moved.':'Part removed.')}else{snapshot();parts[g.index].angle=(parts[g.index].angle||0)+Math.PI/4;save();msg('Rotated '+names[parts[g.index].type]+'.')}}else if(g.type==='source'||g.type==='goal'){if(g.moved){undo.push(g.before);if(undo.length>30)undo.shift();save();msg(g.type==='source'?'Ball moved.':'Goal moved.')}else if(selected)put(selected,p)}draw()});
window.addEventListener('pointercancel',function(){if(gesture&&gesture.origin){if(gesture.type==='part')parts[gesture.index]=JSON.parse(gesture.origin);if(gesture.type==='source')source=JSON.parse(gesture.origin);if(gesture.type==='goal')goal=JSON.parse(gesture.origin)}gesture=null;draw()});
$('sourceBtn').onclick=function(){if(!running&&!paused)select('source')};$('goalBtn').onclick=function(){if(!running&&!paused)select('goal')};$('runBtn').onclick=run;$('exampleBtn').onclick=function(){if(!paused)example()};$('undoBtn').onclick=function(){if(running||paused)return;if(!undo.length){msg('Nothing to undo.');return}var old=JSON.parse(undo.pop());parts=old.parts;source=old.source;goal=old.goal;save();$('status').textContent=parts.length+' parts';msg('Undone.');draw()};$('clearBtn').onclick=function(){if(!running&&!paused)modal('clear')};$('pauseBtn').onclick=function(){if(veil.hidden)modal('pause');else closeModal()};$('helpBtn').onclick=function(){modal('help')};$('guidedBtn').onclick=function(){location.href='index.html?guided=1'};$('exitBtn').onclick=function(){location.href='../../index.html'};$('soundBtn').onclick=function(){soundOn=!soundOn;this.textContent=soundOn?'♪':'×';save()};sheet.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var act=b.dataset.act;if(act==='resume')closeModal();if(act==='guided')location.href='index.html?guided=1';if(act==='exit')location.href='../../index.html';if(act==='clear'){snapshot();parts=[];save();$('status').textContent='0 parts';closeModal();msg('Workshop cleared. Undo can restore it.')}});
window.addEventListener('resize',function(){if(running)stop('Board resized. Press Run to test again.');layout()});window.addEventListener('orientationchange',function(){setTimeout(layout,200)});document.addEventListener('visibilitychange',function(){if(document.hidden&&running&&!paused)modal('pause')});createRack();load();layout();select(null);msg('Free Build: drag parts into the workshop.');
})();
</script></body></html>
