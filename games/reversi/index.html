<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173e62"><title>Reversi · Game Chest</title><script src="../../shared/goobs.js"></script><link rel="stylesheet" href="../../shared/new-games.css"><style>
