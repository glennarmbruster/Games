(function(){'use strict';

var puzzles={
 easy:[
 P('head over heels',stack(W('HEAD'),S(),W('HEELS')),'A phrase about being wildly in love.','HEAD is over HEELS.'),
 P('I understand',stack(W('STAND'),W('I')),'Think about where the letter I is.','I is under STAND.'),
 P('man overboard',stack(W('MAN'),W('BOARD')),'Something a sailor might shout.','MAN is over BOARD.'),

 P('broken heart','<div class="split">'+W('HEA','red')+W('RT','red')+'</div>','An unhappy feeling.','HEART has been broken in two.'),
 P('time flies',row(W('TIME','rotate'),'<span class="arrow">↗</span>'),'What happens when you are having fun?','TIME is flying upward.'),
 P('mind over matter',stack(W('MIND'),S(),W('MATTER')),'An expression about willpower.','MIND is over MATTER.'),
 P('hole in one','<span class="circle">'+W('ONE')+'</span>','A perfect golf shot.','ONE is in the hole.'),

 P('tricycle',row(W('CYCLE','small'),W('CYCLE','small'),W('CYCLE','small')),'A three-wheeled ride.','There are three CYCLEs.'),
 P('high five',stack(W('HIGH','small'),W('5','huge')),'A celebratory hand gesture.','HIGH is above FIVE.'),
 P('big deal',W('DEAL','giant'),'It may be a major event.','DEAL is unusually big.'),
 P('green light',W('LIGHT','green huge'),'Permission to go ahead.','LIGHT is green.'),
 P('backward glance',W('GLANCE','reverse'),'Looking back briefly.','GLANCE is written backward.'),
 P('down the stairs','<div class="stairs"><span style="--step:0">DOWN</span><span style="--step:1">DOWN</span><span style="--step:2">DOWN</span></div>','Follow the steps.','DOWN is stepping down the stairs.'),
 P('double take',row(W('TAKE'),W('TAKE')),'A surprised second look.','TAKE appears twice.'),
 P('rainbow',stack(W('RAIN','blue'),W('BOW','gold')),'Something colorful after a storm.','RAIN is over BOW.')
 ],
 medium:[
 P('think outside the box',row(W('THINK','small'),'<span class="frame">'+W('BOX','small')+'</span>'),'An expression about creativity.','THINK sits outside the BOX.'),
 P('jack in the box','<span class="frame">'+W('JACK')+'</span>','A spring-loaded toy.','JACK is in the BOX.'),
 P('under the weather',stack(W('WEATHER','blue'),W('ME','small')),'It means feeling unwell.','ME is under WEATHER.'),
 P('feet on the ground',stack(W('FEET'),S(),W('GROUND','small')),'Stay practical and realistic.','FEET rest on the GROUND.'),
 P('around the clock',row('<span class="arrow">↻</span>','<span class="circle">'+W('CLOCK','tiny')+'</span>'),'It means all day and night.','The arrow goes around the CLOCK.'),
 P('crossroads',row('<span class="rotate">'+W('ROAD','small')+'</span>',W('ROAD','small')),'A place where paths meet.','The ROADs cross.'),
 P('open secret','<span class="frame open">'+W('SECRET','small')+'</span>','Everyone seems to know it.','The SECRET is in an open frame.'),
 P('square meal','<span class="frame">'+W('MEAL')+'</span>','A proper, satisfying dinner.','MEAL is inside a square.'),
 P('footnote',stack(W('NOTE'),W('FOOT','tiny')),'A little detail at the bottom of a page.','FOOT is beneath NOTE.'),
 P('high noon',stack(W('HIGH'),W('NOON')),'The classic time for a Western showdown.','HIGH is over NOON.'),
 P('double trouble',row(W('TROUBLE','small red'),W('TROUBLE','small red')),'Two problems at once.','There is double TROUBLE.'),
 P('once in a blue moon','<span class="moon">'+W('ONCE','small')+'</span>','Something very rare.','ONCE is in a blue MOON.'),
 P('stand out',row(W('STAND','tiny faint'),W('STAND','huge gold'),W('STAND','tiny faint')),'Be noticeably different.','One STAND stands out from the others.'),
 P('back to square one',row(W('BACK','small'),'<span class="arrow">→</span>','<span class="frame">'+W('1')+'</span>'),'Starting all over again.','BACK points to a square containing ONE.'),
 P('top secret',stack(W('TOP','gold'),W('SECRET','small')),'Confidential information.','TOP is above SECRET.'),
 P('first aid',row(W('1','huge'),W('AID')),'Immediate help after an injury.','ONE comes first, followed by AID.', ['1st aid']),
 P('deep down',stack(W('DOWN','small'),W('DOWN','tiny')),'An inner feeling you might not admit.','DOWN appears lower and deeper.'),
 P('chip on your shoulder',stack(W('CHIP','tiny gold'),W('YOUR','small'),W('SHOULDER')),'A grudge someone carries.','CHIP rests on YOUR SHOULDER.', ['a chip on your shoulder'])
 ],
 hard:[
 P('blood is thicker than water',stack(W('BLOOD','thick red'),W('WATER','thin blue')),'A saying about family loyalty.','BLOOD is drawn thicker than WATER.', ['blood thicker than water']),
 P('calm before the storm',row(W('CALM','small blue'),'<span class="arrow">→</span>',W('STORM','red small')),'A quiet moment before chaos.','CALM comes before STORM.'),
 P('history repeats itself',stack(W('HISTORY','small'),'<span class="arrow">↺</span>',W('HISTORY','small')),'The past can happen again.','HISTORY goes around and repeats.'),
 P('between a rock and a hard place',row(W('ROCK','small'),W('YOU','tiny red'),'<span class="stack"><span>HARD</span><span>PLACE</span></span>'),'Stuck between two bad choices.','YOU are between ROCK and HARD PLACE.', ['a rock and a hard place']),
 P('split second','<div class="split">'+W('SEC','blue')+W('OND','blue')+'</div>','A very short moment.','SECOND is split in two.'),
 P('out of the blue',row('<span class="frame" style="background:#2b86b7">'+W('OUT','small')+'</span>','<span class="arrow">→</span>'),'Something unexpected.','OUT is leaving a blue area.'),
 P('no turning back',row(W('BACK','reverse small'),'<span class="slash">'+W('↶','red')+'</span>'),'You have passed the point of return.','The turn BACK is crossed out.'),
 P('hanging by a thread',stack('<span class="thread"></span>',W('HANGING','small')),'Barely holding on.','HANGING is suspended by a thin thread.'),
 P('burning the candle at both ends',row(W('🔥','small'),W('CANDLE','small'),W('🔥','small')),'Working too hard, early and late.','Both ends of CANDLE are burning.', ['burn the candle at both ends']),
 P('a drop in the ocean','<span class="frame" style="background:#2d92bc;color:white;border-color:#1b689b">'+stack(W('DROP','tiny'),W('OCEAN','small'))+'</span>','A tiny amount compared with the whole.','A little DROP is inside the vast OCEAN.', ['drop in the ocean']),
 P('cutting corners','<span class="squarecut">'+W('CORNERS','tiny')+'</span>','Taking shortcuts, sometimes carelessly.','The corners of the square are cut off.', ['cut corners']),
 P('the writing on the wall','<span class="brick">'+W('WRITING','small')+'</span>','An obvious sign of what will happen.','WRITING is on a wall.', ['writing on the wall']),
 P('walking on thin ice',stack(W('WALKING','small'),'<span class="line" style="height:2px;background:#64c2d9"></span>',W('ICE','thin blue')),'Being in a risky situation.','WALKING is on very thin ICE.'),
 P('pick up the pieces',stack(W('PICK','small'),'<span class="arrow">↑</span>',row(W('PIE','small'),W('CES','small'))),'Recover after something falls apart.','PICK moves up the broken PIECES.'),
 P('needle in a haystack',stack(row(W('HAY','small gold'),W('HAY','small gold')),row(W('HAY','small gold'),W('NEEDLE','tiny red'),W('HAY','small gold')),row(W('HAY','small gold'),W('HAY','small gold'))),'Something extremely hard to find.','The tiny NEEDLE is hidden in a stack of HAY.'),
 P('turning point',row(W('POINT','small rotate'),'<span class="arrow">↪</span>'),'A moment when everything changes.','POINT is turning.'),

 P('the tip of the iceberg',stack(W('TIP','tiny blue'),'<span class="line" style="background:#58b4d4;height:3px"></span>',W('ICEBERG','huge blue')),'Only a small part can be seen.','A tiny TIP sits above the waterline, while ICEBERG is huge below.', ['tip of the iceberg'])
 ]};
var key='goobs.rebus.v1',state={mode:'easy',index:{easy:0,medium:0,hard:0},solved:{}},mode=null,hintStep=0,revealed=false,wrong=0;
try{var old=JSON.parse(localStorage.getItem(key)||'null');if(old&&typeof old==='object'){if(puzzles[old.mode])state.mode=old.mode;if(old.index&&typeof old.index==='object'){['easy','medium','hard'].forEach(function(m){state.index[m]=Math.max(0,Math.min(puzzles[m].length-1,Number(old.index[m])||0))})}if(old.solved&&typeof old.solved==='object')state.solved=old.solved}}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}
function norm(s){return String(s||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9 ]/g,' ').replace(/\b(the|a|an)\b/g,' ').replace(/\s+/g,' ').trim()}
function item(){return puzzles[mode][state.index[mode]]}
function id(){return mode+':'+state.index[mode]}
function solvedCount(m){var n=0;for(var i=0;i<puzzles[m].length;i++)if(state.solved[m+':'+i])n++;return n}
function updateModes(){['easy','medium','hard'].forEach(function(m){var b=document.querySelector('[data-mode="'+m+'"]');b.classList.toggle('active',m===mode);b.setAttribute('aria-pressed',String(m===mode));$('count'+m[0].toUpperCase()+m.slice(1)).textContent=solvedCount(m)+'/'+puzzles[m].length})}
function feedback(text,cls){$('feedback').textContent=text;$('feedback').className='feedback'+(cls?' '+cls:'')}
function render(){if(!mode)return;var p=item(),index=state.index[mode];$('clue').innerHTML=p.art;$('visual').setAttribute('aria-label','Visual clue '+(index+1)+' of '+puzzles[mode].length+'. '+(state.solved[id()]?'Solved.':'Unsolved.'));
