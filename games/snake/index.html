<style>
/* Noodle styles (themes, UI kit and ad cards come from /shared/goobs.css) */
:root {
  --nd-board: #e7f3ea; --nd-board-2: #dcecdf; --nd-wall: #5b6b8c; --nd-wall-top: #7485a8; --nd-edge: #cfe2d4;
  --nd-snake: #22b573; --nd-snake-2: #0f8a55; --nd-food: #ff4d5e;
}
:root[data-theme="dark"] { --nd-board: #18221c; --nd-board-2: #1c2821; --nd-wall: #56617a; --nd-wall-top: #6c7894; --nd-edge: #26352b; }
:root[data-theme="blue"] { --nd-board: #10283f; --nd-board-2: #132e47; --nd-wall: #4d6a92; --nd-wall-top: #6583ad; --nd-edge: #1b3a58; }

.brand svg { border-radius: 10px; }
.modes button { font-size: 14px; white-space: nowrap; }

.info .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--gold); color: #3a2a00; border-radius: 10px; padding: 3px 9px; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.info .chip.hide { visibility: hidden; }
.info .mid .of { color: var(--muted); font-weight: 600; }

.stagewrap { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
.stage { position: relative; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); background: var(--nd-board); touch-action: none; }
.stage canvas { display: block; width: 100%; height: 100%; }
.stage.flash { animation: stflash .35s ease-out 2; }
@keyframes stflash { 50% { box-shadow: 0 0 0 4px var(--bad), var(--shadow); } }

/* start / pause panel inside the board */
.ready {
  position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  background: color-mix(in srgb, var(--surface) 72%, transparent); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  text-align: center; padding: 18px;
}
.ready.show { display: flex; }
.ready h2 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.3px; }
.ready p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.4; max-width: 280px; }
.ready .pick { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 16px; padding: 6px 8px; box-shadow: var(--shadow-sm); }
.ready .pick button { width: 42px; height: 42px; border-radius: 12px; border: 0; background: var(--surface-2); font-size: 20px; font-weight: 800; padding: 0; color: var(--ink); }
.ready .pick button:disabled { opacity: .3; }
.ready .pick div { min-width: 130px; }
.ready .pick b { display: block; font-size: 19px; }
.ready .pick small { display: block; font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .5px; text-transform: uppercase; }
.ready .go { min-height: 52px; width: 200px; flex: none; }
.ready .or { font-size: 13px; }
.ready.compact { gap: 7px; padding: 8px; }
.ready.compact h2 { font-size: 20px; }
.ready.compact > p:not(.or) { display: none; }
.ready.compact .pick { padding: 3px 5px; gap: 4px; }
.ready.compact .pick button { width: 34px; height: 34px; }
.ready.compact .pick div { min-width: 84px; }
.ready.compact .pick b { font-size: 16px; }
.ready.compact .go { min-height: 42px; width: 150px; }

/* on-screen arrows: an inverted T, like a keyboard's arrow keys */
.dpad { display: none; width: 100%; max-width: 330px; flex: none; grid-template-columns: repeat(3, 1fr); grid-template-rows: 50px 50px; gap: 6px; }
.dpad.show { display: grid; }
.dpad button {
  border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  box-shadow: var(--shadow-sm); font-size: 20px; color: var(--ink); padding: 0; touch-action: none;
}
.dpad button:active, .dpad button.held { background: var(--accent-soft); color: var(--accent); }
.dpad [data-d="0"] { grid-column: 2; grid-row: 1; }
.dpad [data-d="3"] { grid-column: 1; grid-row: 2; }
.dpad [data-d="2"] { grid-column: 2; grid-row: 2; }
.dpad [data-d="1"] { grid-column: 3; grid-row: 2; }

.cardicon svg { border-radius: 16px; }
.mazelist { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 6px 0 10px; }

/* full screen (Goobs.fullscreen, 2026-09-29): Pause sits in the top row as a round button (icon only) */
html.gg-fs .top #btnPause span { display: none; }
html.gg-fs .top #btnPause:disabled { opacity: .4; }
/* tall phones: the board is limited by the width, so the arrows (when on) get the spare height */
@media (min-height: 780px) { html.gg-fs .dpad { grid-template-rows: 60px 60px; max-width: 360px; } }
/* Botanical board materials; dark/blue themes retain their own palettes. */
:root:not([data-theme="dark"]):not([data-theme="blue"]) {--nd-board:#dfe6c9;--nd-board-2:#d5dfbf;--nd-wall:#657864;--nd-wall-top:#a5b093;--nd-snake:#45ad62;--nd-snake-2:#176448;--nd-food:#e94e52;}
.stage {border-radius:12px;box-shadow:0 0 0 1px #6d886688,0 0 0 4px #52694733,0 10px 24px #18352433;}
.ready {background:color-mix(in srgb,var(--surface) 87%,transparent);}
</style>

<script>
/* Noodle (Snake) game logic: grid, moves, food, bonus, mazes. No drawing here; runs in Node for tests. */
var NDL = (function () {
  'use strict';
  var W = 16, H = 22;
  // speed levels 1-9, like Nokia Snake II: time per step (ms)
  var SPEED_MS = [0, 330, 270, 220, 180, 150, 125, 105, 88, 74];
  var START_LEN = 5, BONUS_EVERY = 5, BONUS_STEPS = 26, MAZE_GOAL = 15, TIME_ATTACK_MS = 120000;
  var DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // up, right, down, left

  // ---------- mazes (a level series; each is cleared by eating MAZE_GOAL foods) ----------
  function grid() { return new Uint8Array(W * H); }
  function set(g, x, y) { if (x >= 0 && x < W && y >= 0 && y < H) g[y * W + x] = 1; }
  function hl(g, y, x0, x1) { for (var x = x0; x <= x1; x++) set(g, x, y); }
  function vl(g, x, y0, y1) { for (var y = y0; y <= y1; y++) set(g, x, y); }
  function border(g, gap) {
    hl(g, 0, 0, W - 1); hl(g, H - 1, 0, W - 1); vl(g, 0, 0, H - 1); vl(g, W - 1, 0, H - 1);
    if (gap) { // doorways in the middle of each side (the snake wraps through them)
      for (var x = 6; x <= 9; x++) { g[x] = 0; g[(H - 1) * W + x] = 0; }
      for (var y = 9; y <= 12; y++) { g[y * W] = 0; g[y * W + W - 1] = 0; }
    }
  }
  function clear(g, x, y) { g[y * W + x] = 0; }
  // start: [x, y, dir] for the head; the body trails behind it
  var MAZES = [
    { name: 'Box', start: [7, 17, 1], build: function (g) { border(g); } },
    { name: 'Doorways', start: [7, 17, 1], build: function (g) { border(g, true); } },
    { name: 'Two bars', start: [7, 18, 1], build: function (g) { hl(g, 7, 3, 12); hl(g, 14, 3, 12); } },
    { name: 'Tunnel', start: [7, 19, 1], build: function (g) { border(g); vl(g, 5, 4, 16); vl(g, 10, 4, 16); } },
    { name: 'Mill', start: [8, 18, 1], build: function (g) { hl(g, 10, 2, 5); hl(g, 10, 10, 13); hl(g, 11, 2, 5); hl(g, 11, 10, 13); vl(g, 7, 3, 7); vl(g, 8, 3, 7); vl(g, 7, 14, 17); vl(g, 8, 14, 17); } },
    { name: 'Rails', start: [7, 20, 1], build: function (g) { border(g); hl(g, 5, 0, 10); hl(g, 10, 5, 15); hl(g, 15, 0, 10); } },
    { name: 'Rooms', start: [5, 16, 1], build: function (g) {
      border(g); hl(g, 11, 0, 15); vl(g, 8, 0, 21);
      [[3, 11], [4, 11], [11, 11], [12, 11], [8, 4], [8, 5], [8, 16], [8, 17]].forEach(function (p) { clear(g, p[0], p[1]); });
    } },
    { name: 'Pillars', start: [7, 19, 1], build: function (g) {
      border(g);
      for (var y = 3; y <= 15; y += 4) for (var x = 3; x <= 11; x += 4) { set(g, x, y); set(g, x + 1, y); set(g, x, y + 1); set(g, x + 1, y + 1); }
    } },
    { name: 'Zigzag', start: [7, 20, 1], build: function (g) { border(g); hl(g, 4, 0, 11); hl(g, 8, 4, 15); hl(g, 12, 0, 11); hl(g, 16, 4, 15); } },
    { name: 'Spiral', start: [8, 20, 1], build: function (g) {
      border(g); hl(g, 3, 3, 12); vl(g, 12, 3, 18); hl(g, 18, 3, 12); vl(g, 3, 7, 18); hl(g, 7, 3, 9); vl(g, 9, 7, 14); hl(g, 14, 6, 9);
      clear(g, 3, 18); clear(g, 4, 18);
    } },
    { name: 'Apartment', start: [7, 8, 1], build: function (g) {
      border(g); vl(g, 5, 0, 6); vl(g, 10, 0, 6); hl(g, 6, 0, 3); hl(g, 6, 12, 15); hl(g, 11, 4, 11); vl(g, 5, 15, 21); vl(g, 10, 15, 21); hl(g, 15, 0, 2); hl(g, 15, 13, 15);
    } },
    { name: 'Labyrinth', start: [1, 12, 0], build: function (g) {
      border(g); vl(g, 3, 0, 16); vl(g, 6, 5, 21); vl(g, 9, 0, 16); vl(g, 12, 5, 21);
    } }
  ];
  function mazeGrid(i) { var g = grid(); if (i != null && MAZES[i]) MAZES[i].build(g); return g; }

  // ---------- game ----------
  // mode: 'classic' (walls kill), 'nowalls' (wrap), 'mazes' (maze i, wrap where there's no wall), 'time' (2 minutes, wrap)
  function create(mode, speed, maze) {
    var walls = mode === 'classic' ? mazeGrid(0) : mode === 'mazes' ? mazeGrid(maze || 0) : grid();
    var st0 = mode === 'mazes' ? MAZES[maze || 0].start : [7, 16, 1];
    var body = [], d = DIRS[st0[2]];
    for (var i = 0; i < START_LEN; i++) body.push([st0[0] - d[0] * i, st0[1] - d[1] * i]);
    var s = {
      mode: mode, speed: speed, maze: mode === 'mazes' ? (maze || 0) : -1, walls: Array.prototype.slice.call(walls),
      body: body, dir: st0[2], queue: [], grow: 0, food: null, bonus: null, eaten: 0, sinceBonus: 0, skips: 0,
      score: 0, steps: 0, alive: true, cleared: false, timeLeft: mode === 'time' ? TIME_ATTACK_MS : 0, bonusEaten: 0
    };
    placeFood(s, Math.random);
    return s;
  }
  function wrapX(x) { return (x + W) % W; }
  function wrapY(y) { return (y + H) % H; }
  function occupied(s, x, y, skipTail) {
    if (s.walls[y * W + x]) return true;
    var n = s.body.length - (skipTail ? 1 : 0);
    for (var i = 0; i < n; i++) if (s.body[i][0] === x && s.body[i][1] === y) return true;
    return false;
  }
  function freeCells(s) {
    var out = [];
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) if (!occupied(s, x, y)) out.push([x, y]);
    return out;
  }
  function onBonus(s, x, y) { return s.bonus && y === s.bonus.y && (x === s.bonus.x || x === s.bonus.x + 1); }
  function placeFood(s, rnd) {
    var f = freeCells(s).filter(function (c) { return !onBonus(s, c[0], c[1]); });
    s.food = null;
    if (f.length) { var c = f[0 | (rnd() * f.length)]; s.food = { x: c[0], y: c[1] }; }
  }
  function placeBonus(s, rnd) {
    // the bonus critter is two squares wide, like the original's bugs
    var f = freeCells(s).filter(function (c) {
      return c[0] < W - 1 && !occupied(s, c[0] + 1, c[1]) && !(s.food && s.food.y === c[1] && (s.food.x === c[0] || s.food.x === c[0] + 1));
    });
    if (!f.length) return;
    var c = f[0 | (rnd() * f.length)];
    s.bonus = { x: c[0], y: c[1], left: BONUS_STEPS, kind: 0 | (rnd() * 4) };
  }
  function bonusValue(s) {
    // worth more the faster you get it, and more after one is missed (as in Snake II)
    if (!s.bonus) return 0;

      cx.strokeStyle='#ecffcb44';cx.lineWidth=c*.28;cx.stroke();cx.strokeStyle='#ffffff33';cx.lineWidth=c*.08;cx.stroke();
      pts.slice(1).forEach(function(p,i){var xx=(p[0]+.5)*c,yy=(p[1]+.5)*c;if(xx+X<0||yy+Y<0||xx+X>W*c||yy+Y>H*c)return;cx.fillStyle=i%2?'#125b3433':'#ecffcf33';cx.beginPath();cx.ellipse(xx,yy,c*.17,c*.12,0,0,Math.PI*2);cx.fill();});
      // head
      var hx = (pts[0][0] + 0.5) * c, hy = (pts[0][1] + 0.5) * c, dx = sp.dx, dy = sp.dy;
      var head=cx.createRadialGradient(hx-c*.15,hy-c*.2,0,hx,hy,c*.48);head.addColorStop(0,'#b0e57c');head.addColorStop(.45,colors['--nd-snake']);head.addColorStop(1,colors['--nd-snake-2']);cx.fillStyle=head; cx.beginPath(); cx.arc(hx, hy, c * 0.46, 0, Math.PI * 2); cx.fill();
      var ex = -dy, ey = dx; // sideways
      [1, -1].forEach(function (k) {
        var x = hx + dx * c * 0.12 + ex * c * 0.2 * k, y = hy + dy * c * 0.12 + ey * c * 0.2 * k;
        cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(x, y, c * 0.14, 0, Math.PI * 2); cx.fill();
        cx.fillStyle = '#16202e'; cx.beginPath(); cx.arc(x + dx * c * 0.05, y + dy * c * 0.05, c * 0.075, 0, Math.PI * 2); cx.fill();
      });
      if (!s.alive) { cx.strokeStyle = '#16202e'; cx.lineWidth = c * 0.06; }
      cx.restore();
    }); });
  }

  // ================= input: swipes anywhere, arrow keys, on-screen arrows =================
  var sw = null;
  function input(d) {
    if (!s || sheetOpen()) return;
    S.unlock();
    if (phase === 'ready') { begin(d); return; }
    if (phase === 'paused') { resume(); NDL.turn(s, d); return; }
    if (phase === 'run' && NDL.turn(s, d)) S.turn();
  }
  function onDown(e) {
    if (e.target.closest('button, .overlay, .top, .modes, .toolbar, .dpad')) return;
    sw = { x: e.clientX, y: e.clientY, id: e.pointerId };
  }
  function onMove(e) {
    if (!sw || e.pointerId !== sw.id) return;
    var dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
    input(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
    sw.x = e.clientX; sw.y = e.clientY; // keep swiping without lifting to turn again
  }
  function onUp(e) { if (sw && e.pointerId === sw.id) sw = null; }

  // ================= info, panels, tools =================
  function renderInfo() {
    if (!s) return;
    var best = Math.max(bestFor(s.mode, s.maze), s.score), right;
    if (s.mode === 'mazes') right = '<div class="lbl">' + NDL.MAZES[s.maze].name + '</div><div class="mid">' + Math.min(s.eaten, NDL.MAZE_GOAL) + '<span class="of"> / ' + NDL.MAZE_GOAL + '</span></div>';
    else if (s.mode === 'time') right = '<div class="lbl">Time</div><div class="mid" id="clock">' + fmtTime(s.timeLeft) + '</div>';
    else right = '<div class="lbl">Best</div><div class="mid">' + fmt(best) + '</div>';
    var chip = s.bonus ? '<span class="chip">&#9733; ' + s.bonus.left + '</span>' : '<span class="chip hide">&#9733; 0</span>';
    $('info').innerHTML = '<div><div class="lbl">Score</div><div class="big">' + fmt(s.score) + '</div></div>' + chip + '<div class="right">' + right + '</div>';
  }
  function renderClock() { var el = $('clock'); if (el) el.textContent = fmtTime(s.timeLeft); }
  function renderModes() { Array.prototype.forEach.call($('modes').children, function (b) { b.classList.toggle('on', b.dataset.mode === meta.mode); }); }
  function renderTools() {
    var p = $('btnPause'), paused = phase === 'paused';
    p.setAttribute('aria-label', paused ? 'Resume' : 'Pause');
    p.innerHTML = '<svg viewBox="0 0 24 24"><use href="#i-' + (paused ? 'play' : 'pause') + '"/></svg><span>' + (paused ? 'Resume' : 'Pause') + '</span>';
    p.disabled = !(phase === 'run' || phase === 'paused');
  }
  var DESC = {
    classic: 'The walls are solid. Eat, grow, and don’t bump into anything.',
    nowalls: 'No walls: go off one edge and come back on the other.',
    mazes: 'Eat ' + NDL.MAZE_GOAL + ' to clear this maze and open the next one.',
    time: 'No walls. Score as much as you can in 2 minutes.'
  };
  function renderReady() {
    var r = $('ready');
    if (phase === 'paused') {
      r.innerHTML = '<h2>Paused</h2><p>Score ' + fmt(s.score) + ' &middot; length ' + s.body.length + '</p><button class="btn red go" id="btnGo">Resume</button><p class="or">or swipe to keep going</p>';
      r.classList.add('show');
      $('btnGo').addEventListener('click', resume);
      return;
    }
    if (phase !== 'ready') { r.classList.remove('show'); return; }
    var h = '<h2>' + MODE_NAMES[s.mode] + '</h2><p>' + DESC[s.mode] + '</p>';
    if (s.mode === 'mazes') {
      h += '<div class="pick"><button id="mzPrev" aria-label="Previous maze"' + (s.maze <= 0 ? ' disabled' : '') + '>&#8249;</button><div><small>Maze ' + (s.maze + 1) + ' of ' + NDL.MAZES.length + '</small><b>' + NDL.MAZES[s.maze].name + '</b></div>' +
        '<button id="mzNext" aria-label="Next maze"' + (s.maze + 1 >= Math.min(stats.mazesOpen, NDL.MAZES.length) ? ' disabled' : '') + '>&#8250;</button></div>';
    }
    h += '<div class="pick"><button id="spLess" aria-label="Slower"' + (settings.speed <= 1 ? ' disabled' : '') + '>&minus;</button><div><small>Speed</small><b>' + settings.speed + '</b></div>' +
      '<button id="spMore" aria-label="Faster"' + (settings.speed >= 9 ? ' disabled' : '') + '>+</button></div>';
    var best = bestFor(s.mode, s.maze);
    h += '<button class="btn red go" id="btnGo">Start</button><p class="or">or just swipe' + (best ? ' &middot; best ' + fmt(best) : '') + '</p>';
    r.innerHTML = h; r.classList.add('show');
    $('btnGo').addEventListener('click', function () { begin(null); });
    $('spLess').addEventListener('click', function () { setSpeed(-1); });
    $('spMore').addEventListener('click', function () { setSpeed(1); });
    if (s.mode === 'mazes') {
      $('mzPrev').addEventListener('click', function () { pickMaze(-1); });
      $('mzNext').addEventListener('click', function () { pickMaze(1); });
    }
  }
  function setSpeed(d) { settings.speed = Math.min(9, Math.max(1, settings.speed + d)); saveSettings(); if (s) s.speed = settings.speed; renderReady(); }
  function pickMaze(d) {
    var m = Math.min(Math.min(stats.mazesOpen, NDL.MAZES.length) - 1, Math.max(0, s.maze + d));
    if (m === s.maze) return;
    meta.maze = m; saveMeta();
    newGame('mazes', m);
  }
  function renderAll() { renderModes(); renderInfo(); renderTools(); renderReady(); draw(1); }
  function floatText(txt) {
    var f = document.createElement('div'), st = $('stage');
    f.className = 'float'; f.textContent = txt;
    f.style.cssText = 'position:absolute;left:50%;top:40%;transform:translateX(-50%);font-weight:900;font-size:26px;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.25);pointer-events:none;animation:ndrise .9s ease-out forwards';
    st.appendChild(f);
    setTimeout(function () { f.remove(); }, 950);
  }

  // ================= end of a game =================
  function record() {
    var st = stats[s.mode];
    st.games++; st.food += s.eaten; st.bonus += s.bonusEaten; st.ms += Math.round(playMs);
    if (s.body.length > st.bestLen) st.bestLen = s.body.length;
    var newBest = false;
    if (s.mode === 'mazes') { if (s.score > (stats.mazeBest[s.maze] || 0)) { stats.mazeBest[s.maze] = s.score; newBest = true; } if (s.score > st.best) st.best = s.score; }
    else if (s.score > st.best) { st.best = s.score; newBest = true; }
    saveStats();
    meta.finished++; saveMeta();
    store.del('run');
    return newBest;
  }
  function die() {
    phase = 'dying'; dyingAt = performance.now();
    S.die();
    $('stage').classList.remove('flash'); void $('stage').offsetWidth; $('stage').classList.add('flash');
    renderTools();
  }
  function showCard(title, html, buttons) {
    $('cardIcon').innerHTML = '<svg viewBox="0 0 100 100"><use href="#nd-logo"/></svg>';
    $('endTitle').textContent = title;
    $('endText').innerHTML = html;
    var box = $('endActions');
    box.innerHTML = '';
    buttons.forEach(function (b) {
      var el = document.createElement('button');
      el.className = 'btn' + (b.red ? ' red' : '');
      el.textContent = b.label;
      el.addEventListener('click', function () { $('ovEnd').classList.remove('show'); b.go(); });
      box.appendChild(el);
    });
    $('ovEnd').classList.add('show');
  }
  function again() { between(function () { newGame(s.mode, s.maze); }); }
  function gameOver() {
    var nb = record(), best = bestFor(s.mode, s.maze);
    S.over();
    var html = 'Score: <b>' + fmt(s.score) + '</b> &middot; length ' + s.body.length + (nb && s.score ? '<br><span class="newbest">New best!</span>' : '<br>Best: ' + fmt(best));
    if (s.mode === 'mazes') html = NDL.MAZES[s.maze].name + ': ' + Math.min(s.eaten, NDL.MAZE_GOAL) + ' of ' + NDL.MAZE_GOAL + ' eaten.<br>' + html;
    showCard(s.mode === 'time' ? 'Out of the race' : 'Game over', html, [{ label: 'Play again', red: true, go: again }]);
  }
  function timeUp() {
    phase = 'over';
    var nb = record();
    S.win();
    showCard('Time’s up!', 'Score: <b>' + fmt(s.score) + '</b> &middot; ' + s.eaten + ' eaten' + (nb && s.score ? '<br><span class="newbest">New best!</span>' : '<br>Best: ' + fmt(stats.time.best)), [{ label: 'Play again', red: true, go: again }]);
    renderTools();
  }
  function mazeCleared() {
    phase = 'over';
    var i = s.maze, nb = record(), last = i + 1 >= NDL.MAZES.length;
    if (!last && stats.mazesOpen < i + 2) { stats.mazesOpen = i + 2; saveStats(); }
    S.win();
    var html = NDL.MAZES[i].name + ' cleared with <b>' + fmt(s.score) + '</b> points.' + (nb ? '<br><span class="newbest">New best!</span>' : '');
    var b = [];
    if (!last) b.push({ label: 'Next: ' + NDL.MAZES[i + 1].name, red: true, go: function () { meta.maze = i + 1; saveMeta(); between(function () { newGame('mazes', i + 1); }); } });
    else html += '<br>That was the last maze. Every maze is open to replay.';
    b.push({ label: 'Play this maze again', red: last, go: again });
    showCard('Maze cleared!', html, b);
    renderTools();
  }
  function showAd(done) { GoobsAds.show({ onShow: function () { S.ding(); }, onStep: function () { S.sign(); } }, done); }
  function between(next) {
    if (Goobs.adsOn() && meta.finished > 0 && meta.finished % settings.adEvery === 0 && meta.lastAdAt !== meta.finished) {
      meta.lastAdAt = meta.finished; saveMeta();
      next();
      showAd(function () {});
      return;
    }
    next();
  }

  // ================= sheets =================
  function openHelp() {
    $('helpTitle').textContent = 'How to play Noodle';
    $('helpList').innerHTML = [
      '<b>Swipe</b> anywhere to turn: up, down, left or right. You can keep your finger down and swipe again to turn again. You can’t turn straight back.',
      'Eat the <b>berries</b>. Each one makes you one longer and scores as many points as your <b>speed</b> (1 to 9). Faster is harder but scores more.',
      'After every 5 berries a <b>bonus critter</b> shows up for a short time (the gold counter). The sooner you catch it, the more it’s worth. It doesn’t make you longer. Miss one and the next is worth more.',
      'Bump into yourself, or a wall, and the game is over.',
      '<b>Classic</b>: solid walls all round. <b>No walls</b>: go off an edge and come back on the other side. <b>Mazes</b>: ' + NDL.MAZES.length + ' mazes in a row; eat ' + NDL.MAZE_GOAL + ' to clear one and open the next. <b>Time</b>: the best score in 2 minutes.',
      'Pause any time. Turn on <b>on-screen arrows</b> in Settings if you’d rather tap than swipe.'
    ].map(function (x) { return '<li>' + x + '</li>'; }).join('');
    $('ovHelp').classList.add('show');
  }
  function renderStats() {
    var h = '';
    ['classic', 'nowalls', 'time'].forEach(function (m) {
      var st = stats[m];
      h += '<div class="themelabel">' + MODE_NAMES[m] + '</div><div class="tiles"><div class="tile"><b>' + fmt(st.best) + '</b><span>Best</span></div>' +
        '<div class="tile"><b>' + st.bestLen + '</b><span>Longest</span></div><div class="tile"><b>' + st.games + '</b><span>Games</span></div></div>';
    });
    var mz = stats.mazes, cleared = Math.min(NDL.MAZES.length, stats.mazesOpen - 1 + (stats.mazeBest[NDL.MAZES.length - 1] && stats.mazesOpen >= NDL.MAZES.length ? 1 : 0));
    h += '<div class="themelabel">Mazes</div><div class="tiles"><div class="tile"><b>' + Math.min(stats.mazesOpen, NDL.MAZES.length) + '</b><span>Open</span></div>' +
      '<div class="tile"><b>' + fmt(mz.best) + '</b><span>Best maze</span></div><div class="tile"><b>' + mz.games + '</b><span>Games</span></div></div>';
    var food = 0, bonus = 0, ms = 0;
    ['classic', 'nowalls', 'mazes', 'time'].forEach(function (m) { food += stats[m].food; bonus += stats[m].bonus; ms += stats[m].ms; });
    h += '<p class="version">' + fmt(food) + ' berries &middot; ' + fmt(bonus) + ' critters &middot; ' + Math.round(ms / 60000) + ' min played' + (cleared ? '' : '') + '</p>';
    $('statsBody').innerHTML = h;
  }

  // ================= wiring =================
  function syncSound() {
    $('btnSound').innerHTML = '<svg viewBox="0 0 24 24"><use href="#i-sound-' + (settings.sound ? 'on' : 'off') + '"/></svg>';
    $('btnSound').classList.toggle('on', settings.sound);
    $('setSound').checked = settings.sound;
    S.setEnabled(settings.sound);
  }
  function syncAds() {
    $('setAds').checked = Goobs.adsOn();
    $('adEvery').textContent = settings.adEvery;
    $('rowAdEvery').classList.toggle('off', !Goobs.adsOn());
  }
  function syncPad() { $('setPad').checked = settings.pad; $('dpad').classList.toggle('show', settings.pad); requestAnimationFrame(fit); }
  function sheet(btn, ov, close, onOpen) {
    if (btn) $(btn).addEventListener('click', function () { pause(); if (onOpen) onOpen(); $(ov).classList.add('show'); });
    $(close).addEventListener('click', function () { $(ov).classList.remove('show'); });
    $(ov).addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  }
  function switchMode(m) {
    if (phase === 'run') pause();
    if (phase === 'paused' && s && s.score > 0) {
      showCard('Leave this game?', 'This game ends now with ' + fmt(s.score) + ' points.', [
        { label: 'Leave it', red: true, go: function () { record(); meta.mode = m; saveMeta(); between(function () { newGame(m, meta.maze); }); } },
        { label: 'Keep playing', go: function () {} }]);
      return;
    }
    meta.mode = m; saveMeta();
    newGame(m, Math.min(meta.maze, stats.mazesOpen - 1));
  }
  function init() {
    Goobs.themePicker($('themes'));
    cv = $('cv'); cx = cv.getContext('2d');
    document.addEventListener('pointerdown', onDown);
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
    document.addEventListener('touchmove', function (e) { if (sw) e.preventDefault(); }, { passive: false });
    document.addEventListener('keydown', function (e) {
      var k = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3 }[e.key];
      if (k !== undefined) { e.preventDefault(); input(k); }
      else if (e.key === ' ' || e.key === 'p') { e.preventDefault(); if (phase === 'run') pause(); else if (phase === 'paused') resume(); else if (phase === 'ready') begin(null); }
    });
    Array.prototype.forEach.call($('dpad').children, function (b) {
      b.addEventListener('pointerdown', function (e) { e.preventDefault(); b.classList.add('held'); input(+b.dataset.d); });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { b.addEventListener(ev, function () { b.classList.remove('held'); }); });
    });
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) { document.addEventListener(ev, function () { S.unlock(); }, { passive: true }); });
    $('btnHome').addEventListener('click', function () { pause(); saveRun(); Goobs.home(); });
    $('btnPause').addEventListener('click', function () { if (phase === 'run') pause(); else if (phase === 'paused') resume(); });
    $('btnNew').addEventListener('click', function () {
      if (phase === 'run') pause();
      if ((phase === 'paused') && s.score > 0) {
        showCard('Start over?', 'This game ends now with ' + fmt(s.score) + ' points.', [
          { label: 'Start over', red: true, go: function () { record(); between(function () { newGame(s.mode, s.maze); }); } },
          { label: 'Keep playing', go: function () {} }]);
        return;
      }
      newGame(s.mode, s.maze);
    });
    $('modes').addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (!btn || btn.dataset.mode === meta.mode) return;
      switchMode(btn.dataset.mode);
    });
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings');
    sheet('btnStats', 'ovStats', 'btnCloseStats', renderStats);
    // full screen (2026-09-29): Pause moves up to the top row as a round button; How to, Restart, Stats and Settings live
    // in the Menu (the empty toolbar hides itself), so the board gets the toolbar's height. The game pauses while it is open.
    var pb = $('btnPause'); pb.className = 'iconbtn'; pb.setAttribute('aria-label', 'Pause');
    $('btnSound').parentNode.insertBefore(pb, $('btnSound'));
    Goobs.fullscreen({
      menu: ['btnNew', 'btnHelp', 'btnStats', 'btnSettings'],
      info: function () { return s ? 'Best in this mode <b>' + fmt(Math.max(bestFor(s.mode, s.maze), s.score)) + '</b>' : ''; },
      onOpen: function () { pause(); }
    });
    $('btnHelp').addEventListener('click', function () { pause(); openHelp(); });
    function closeHelp() { $('ovHelp').classList.remove('show'); if (!meta.seen) { meta.seen = true; saveMeta(); } }
    $('btnCloseHelp').addEventListener('click', closeHelp);
    $('ovHelp').addEventListener('click', function (e) { if (e.target === this) closeHelp(); });
    $('btnSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncSound(); S.ding(); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); syncSound(); S.ding(); });
    $('setPad').addEventListener('change', function () { settings.pad = this.checked; saveSettings(); syncPad(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncAds(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncAds(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncAds(); });
    // theme changes recolor the board
    new MutationObserver(function () { readColors(); draw(1); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    if (window.ResizeObserver) new ResizeObserver(function () { fit(); draw(1); }).observe($('stagewrap'));
    window.addEventListener('resize', function () { fit(); draw(1); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) { pause(); saveRun(); } });
    window.addEventListener('pagehide', function () { pause(); saveRun(); });
    var style = document.createElement('style');
    style.textContent = '@keyframes ndrise{0%{opacity:0;margin-top:10px}20%{opacity:1}100%{opacity:0;margin-top:-30px}}';
    document.head.appendChild(style);
    syncSound(); syncAds(); syncPad();
    fit();
    if (!resumeRun()) newGame(meta.mode, Math.min(meta.maze, stats.mazesOpen - 1));
    if (!meta.seen) openHelp();
    lastT = performance.now();
    requestAnimationFrame(frame);
    Goobs.markPlayed('snake');
    Goobs.initUpdates({
      beforeReload: function () { pause(); saveRun(); },
      onVersions: function (v) { $('version').textContent = 'Noodle ' + (v.snake || '?') + ' · Goobs-Games ' + (v.shell || '?'); }
    });
  }

  // hook for automated tests
  window.__nd = { get s() { return s; }, get phase() { return phase; }, input: input, begin: begin, pause: pause, resume: resume, newGame: newGame, stats: function () { return stats; }, meta: function () { return meta; }, settings: settings, tick: tick };

  init();
})();
</script>
