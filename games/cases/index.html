<script>
/* if Case Closed can't open, say so on screen (never a blank page) and offer a fresh start (records are kept) */
(function () {
  var shown = false;
  function fail(msg) {
    if (shown || window.__ckReady) return; shown = true;
    function put() {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:#1a0610;color:#fff;font:600 16px -apple-system,system-ui,sans-serif;text-align:center';
      d.innerHTML = '<b style="font-size:21px">Case Closed didn’t open</b><div style="max-width:320px;opacity:.75;font-size:13px">' + String(msg).replace(/[<>&]/g, '') + '</div>';
      function btn(t, bg, go) { var b = document.createElement('button'); b.textContent = t; b.style.cssText = 'font:800 17px -apple-system,system-ui,sans-serif;padding:13px 24px;border-radius:14px;border:0;color:#fff;background:' + bg; b.onclick = go; d.appendChild(b); }
      btn('Start a new show', '#5a54f0', function () { try { localStorage.removeItem('cases.game'); } catch (e) { /* ignore */ } location.reload(); });
      btn('All games', '#6b7080', function () { location.href = '../../'; });
      document.body.appendChild(d);
    }
    if (document.body) put(); else document.addEventListener('DOMContentLoaded', put);
  }
  window.addEventListener('error', function (e) { fail((e.message || 'Something went wrong') + (e.lineno ? ' (line ' + e.lineno + ')' : '')); });
  setTimeout(function () { if (!window.__ckReady) fail('It took too long to start.'); }, 8000);
})();
</script>
<title>Case Closed</title>
<style>
/* Case Closed styles (themes, UI kit and ad cards come from /shared/goobs.css).
   Full screen (kit overlay mode): the ship's theatre fills the phone (velvet curtains, a valance with bulbs, two
   sweeping spotlights); the top row floats over it. The stage: a band (your case, our host's line, the Banker's sky
   box), the floor (the money board in two columns either side of the cases) and the bottom (offer history, buttons).
   Sheets and cards follow the arcade theme; the theatre stays a theatre (Halloween recolours it). */
:root { --wine1: #2a0712; --wine2: #120308; --velvet: #8e1630; --velvet2: #4a0716; --gold1: #fff0b0; --gold2: #f2cf62; --gold3: #b8860b;
  --blue1: #bfe6ff; --blue2: #3d93d6; --blue3: #174f84; --spot: rgba(255,244,200,.16); --bw: 76px; --rh: 22px; --vfs: 12px;
  --gold-grad: linear-gradient(180deg, #fff0b0 0%, #f2cf62 45%, #c9971f 100%); --deal: #f2b81f; --nodeal: #d8263f; }
:root[data-skin="halloween"] { --wine1: #1c0a2a; --wine2: #0a0412; --velvet: #5a1f7a; --velvet2: #2a0a3d; --gold1: #ffe0b0; --gold2: #ff9a2e; --gold3: #b85a00;
  --blue1: #d8ffc8; --blue2: #57b83a; --blue3: #1f5a1a; --spot: rgba(190,255,170,.12); --gold-grad: linear-gradient(180deg, #ffe0b0 0%, #ff9a2e 45%, #b85a00 100%); }
html.gg-fs-over, html.gg-fs-over body { background: var(--wine2); }
html.gg-fs-over body::before { display: none; }

/* ---------- the theatre ---------- */
.scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  background: radial-gradient(90% 55% at 50% 100%, rgba(255,200,120,.16) 0, transparent 70%), radial-gradient(120% 70% at 50% 0%, var(--wine1) 0%, var(--wine2) 75%); }
.curtain { position: absolute; top: 0; bottom: 0; width: clamp(14px, 4.5vw, 56px);
  background: repeating-linear-gradient(90deg, var(--velvet2) 0, var(--velvet) 7px, #c0304f 10px, var(--velvet) 13px, var(--velvet2) 20px);
  box-shadow: 0 0 30px rgba(0,0,0,.7); }
:root[data-skin="halloween"] .curtain { background: repeating-linear-gradient(90deg, var(--velvet2) 0, var(--velvet) 7px, #8a3ab0 10px, var(--velvet) 13px, var(--velvet2) 20px); }
.cl { left: 0; border-radius: 0 0 60% 0 / 0 0 8% 0; }
.cr { right: 0; border-radius: 0 0 0 60% / 0 0 0 8%; }
.valance { position: absolute; left: 0; right: 0; top: 0; height: calc(env(safe-area-inset-top, 0px) + 14px);
  background: radial-gradient(circle at 50% 0, var(--velvet) 62%, transparent 64%) 0 100% / 34px 16px repeat-x, linear-gradient(var(--velvet2), var(--velvet));
  box-shadow: 0 4px 10px rgba(0,0,0,.5); }
.bulbs { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; opacity: .55;
  background: radial-gradient(circle, #ffe9a0 0 2px, rgba(255,210,120,.35) 3px, transparent 5px) 0 50% / 22px 10px repeat-x; animation: bulbs 1.6s steps(2) infinite; }
@keyframes bulbs { 50% { background-position: 11px 50%; } }
.spot { position: absolute; top: -10%; width: 46vmin; height: 130%; transform-origin: 50% 0; mix-blend-mode: screen;
  background: linear-gradient(180deg, var(--spot) 0%, rgba(255,240,200,.05) 70%, transparent 100%); clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%); }
.s1 { left: 6%; animation: sway1 9s ease-in-out infinite alternate; }
.s2 { right: 6%; animation: sway2 11s ease-in-out infinite alternate; }
@keyframes sway1 { from { transform: rotate(-18deg); } to { transform: rotate(14deg); } }
@keyframes sway2 { from { transform: rotate(16deg); } to { transform: rotate(-12deg); } }
@media (prefers-reduced-motion: reduce) { .s1, .s2, .bulbs { animation: none; } }

.app { position: relative; z-index: 1; }
html.gg-fs-over .top .brand .logo { display: none; }
.pills { flex: 1 1 auto; min-width: 0; display: flex; justify-content: center; }
.roundpill { font-family: inherit; font-size: 14px; padding: 7px 11px; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.roundpill b { font-weight: 800; }
html.gg-fs-over .top .topbtns { gap: 6px; }

/* ---------- the stage ---------- */
.stage { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; gap: 6px;
  padding: calc(env(safe-area-inset-top, 0px) + 56px) calc(env(safe-area-inset-right, 0px) + max(8px, clamp(14px, 4.5vw, 56px) - 4px)) calc(env(safe-area-inset-bottom, 0px) + 8px) calc(env(safe-area-inset-left, 0px) + max(8px, clamp(14px, 4.5vw, 56px) - 4px)); }
.stage > * { width: 100%; max-width: 900px; margin-left: auto; margin-right: auto; }
.band { flex: none; display: flex; align-items: stretch; gap: 8px; height: 76px; }
.mycase { flex: none; width: 74px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
.mycase .pcase { width: 66px; transition: transform .3s; }
.mycase .pcase svg { display: block; width: 100%; filter: drop-shadow(0 3px 6px rgba(0,0,0,.5)); }
.mycase .ped { width: 74px; height: 8px; border-radius: 4px 4px 2px 2px; background: linear-gradient(#f2cf62, #8a6410); box-shadow: 0 0 18px rgba(255,210,100,.45); }
.mycase small { position: absolute; top: -2px; left: 0; right: 0; text-align: center; font-size: 10px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: var(--gold2); }
.mycase .empty { width: 62px; height: 46px; border: 2px dashed rgba(255,230,160,.5); border-radius: 10px; display: grid; place-items: center; color: rgba(255,230,160,.8); font-size: 22px; font-weight: 900; margin-bottom: 2px; }
.mycase.glow .pcase { animation: myglow 1.4s ease-in-out infinite alternate; }
@keyframes myglow { to { transform: translateY(-3px); filter: drop-shadow(0 0 10px rgba(255,220,120,.9)); } }
.hostline { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; }
.hostav { flex: none; width: 40px; height: 40px; display: block; }
.hostav svg { width: 100%; height: 100%; display: block; }
.hostline p { margin: 0; flex: 1; min-width: 0; background: rgba(255,250,235,.95); color: #2a1a10; border-radius: 14px; padding: 5px 10px; font-size: 13px; line-height: 1.24; font-weight: 650;
  position: relative; box-shadow: 0 4px 12px rgba(0,0,0,.35); max-height: 74px; overflow: hidden; }
.hostline p::before { content: ""; position: absolute; left: -6px; top: 50%; margin-top: -6px; border: 6px solid transparent; border-left: 0; border-right-color: rgba(255,250,235,.95); }
.hostline p b { color: #8e1630; }
.hostline p.pop { animation: pop .25s ease-out; }
@keyframes pop { from { transform: scale(.94); opacity: .4; } }
.skybox { flex: none; width: 96px; position: relative; cursor: pointer; }
.skybox svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 4px 10px rgba(0,0,0,.55)); }
.skybox .bwin { transition: filter .3s; }
.skybox .rings { opacity: 0; }
.skybox.ringing .bkphone { animation: phone .09s linear infinite alternate; transform-box: fill-box; }
.skybox.ringing .rings { animation: rings .5s ease-out infinite; }
.skybox.ringing .bwin { animation: win .7s ease-in-out infinite alternate; }
.skybox.talking .bkarm { animation: arm 1.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 30% 100%; }
@keyframes phone { from { transform: translate(15px, 54px) rotate(-6deg); } to { transform: translate(17px, 54px) rotate(6deg); } }
@keyframes rings { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(-4px); } }
@keyframes win { to { filter: brightness(1.5) saturate(1.3) hue-rotate(-15deg); } }
@keyframes arm { to { transform: rotate(-4deg); } }

/* ---------- the floor: the board either side of the cases ---------- */
.floor { flex: 1 1 0; min-height: 0; display: flex; align-items: stretch; gap: 6px; }
.board { flex: none; width: var(--bw); display: flex; flex-direction: column; justify-content: center; gap: 3px; }
.board .v { height: var(--rh); border-radius: 6px; display: flex; align-items: center; justify-content: flex-end; padding: 0 6px; position: relative; overflow: hidden;
  font-weight: 850; font-size: var(--vfs); font-variant-numeric: tabular-nums; letter-spacing: -.3px; white-space: nowrap; transition: opacity .5s, filter .5s, transform .2s; }
.board .v.lo { background: linear-gradient(180deg, var(--blue1) 0%, var(--blue2) 50%, var(--blue3) 100%); color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.45); border: 1px solid rgba(0,0,0,.35); }
.board .v.hi { background: var(--gold-grad); color: #3a2600; border: 1px solid rgba(80,50,0,.5); }
.board .v::before { content: ""; position: absolute; left: 3px; top: 2px; right: 3px; height: 35%; border-radius: 4px; background: rgba(255,255,255,.35); }
.board .v.out { opacity: .2; filter: grayscale(1); }
.board .v.out::after { content: ""; position: absolute; left: 4px; right: 4px; top: 50%; height: 2px; background: rgba(0,0,0,.6); transform: rotate(-4deg); }
.board .v.hit { animation: hit .7s ease-out; }
@keyframes hit { 0% { transform: scale(1.18); filter: brightness(1.8); } 100% { transform: none; } }
.board.bl .v { justify-content: flex-start; }
.cases { flex: 1 1 0; min-width: 0; display: grid; align-content: center; justify-content: center; gap: var(--cg, 6px); }
.case { position: relative; border: 0; padding: 0; background: none; width: var(--cw, 52px); display: block; transition: transform .12s; }
.case svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 3px 4px rgba(0,0,0,.45)); }
.case:active { transform: scale(.93); }
.case.opened { pointer-events: none; }
.case.opened svg { filter: none; opacity: .55; }
.case.mine { pointer-events: none; }
.case.mine::after { content: "YOURS"; position: absolute; inset: 18% 4% 2%; border: 2px dashed rgba(255,230,160,.45); border-radius: 8px; display: grid; place-items: center; font-size: 9px; font-weight: 900; letter-spacing: 1px; color: rgba(255,230,160,.6); }
.case.mine svg { visibility: hidden; }
.case.flip { animation: flip .38s ease-in-out; }
@keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg) scale(1.1); } 100% { transform: rotateX(0); } }

@keyframes lastglow { to { filter: drop-shadow(0 0 10px rgba(255,220,120,.9)); } }

  color: #fff; font-weight: 800; font-size: 16px; padding: 4px 12px; }

  background: rgba(20,6,12,.92); color: #fff; font-weight: 700; font-size: 14px; padding: 8px 14px; border-radius: 14px; border: 1px solid rgba(242,207,98,.5); }

/* ---------- a case opening up close ---------- */
.opener { position: fixed; inset: 0; z-index: 9; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: radial-gradient(42% 38% at 50% 50%, rgba(255,240,200,.22) 0, transparent 70%), rgba(8,2,6,.78); }
.opener.show { display: flex; animation: ovin .2s ease-out; }
.oplabel { color: var(--gold2); font: italic 800 26px/1 Georgia, serif; text-shadow: 0 2px 8px rgba(0,0,0,.6); letter-spacing: .5px; }
.bigcase { position: relative; width: min(72vw, 320px); aspect-ratio: 240 / 184; perspective: 900px; }
.bigcase .inside, .bigcase .lid { position: absolute; inset: 0; }
.bigcase .inside svg { width: 100%; height: 100%; display: block; }
.bigcase .lid { transform-origin: 50% 8%; transition: transform .5s cubic-bezier(.3,.7,.3,1.1); backface-visibility: hidden; -webkit-backface-visibility: hidden; }

.opener.open .opvalue { opacity: 1; }

@keyframes goodglow { 40% { filter: drop-shadow(0 0 30px rgba(120,220,255,.9)); } }
@keyframes badshake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.opener .tapnote { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); color: rgba(255,255,255,.45); font-size: 12px; font-weight: 700; }

/* ---------- the Banker's offer ---------- */
.offerov { z-index: 10; background: rgba(8,2,6,.55); }

  background: radial-gradient(120% 70% at 50% 0%, #4a1022 0%, #1d0710 70%); border: 2px solid var(--gold2); box-shadow: 0 0 0 4px rgba(0,0,0,.35), 0 20px 50px rgba(0,0,0,.6); animation: cardin .3s cubic-bezier(.2,.8,.3,1.2); }

.ofmood.stingy { background: rgba(255,90,110,.25); color: #ffb3bf; }

.ofhist span.now { background: rgba(242,207,98,.3); color: #fff; }
.ofq { margin: 10px 0 8px; font: italic 900 22px/1 Georgia, serif; color: #fff; letter-spacing: .5px; }
.ofbtns { display: flex; gap: 10px; }
.dealbtn, .nodealbtn { flex: 1; height: 64px; border: 0; border-radius: 18px; font: 900 22px/1 -apple-system, system-ui, sans-serif; letter-spacing: 1.5px; transition: transform .1s; }
.dealbtn { background: var(--gold-grad); color: #3a2600; box-shadow: 0 6px 0 #8a6410, 0 10px 20px rgba(0,0,0,.4); }
.nodealbtn { background: linear-gradient(180deg, #ff5a6e, var(--nodeal) 55%, #8e0f22); color: #fff; box-shadow: 0 6px 0 #5e0814, 0 10px 20px rgba(0,0,0,.4); }

.offercard.counter .ofhead small { color: #b7f5c2; }

.stamp { position: fixed; z-index: 11; left: 50%; top: 42%; transform: translate(-50%, -50%) rotate(-10deg); pointer-events: none;
  font: 900 64px/1 Georgia, serif; letter-spacing: 4px; color: var(--gold2); border: 6px solid var(--gold2); border-radius: 14px; padding: 6px 18px;
  text-shadow: 0 3px 0 rgba(0,0,0,.4); box-shadow: 0 0 0 4px rgba(0,0,0,.25); animation: stamp .5s cubic-bezier(.2,.8,.3,1.3) forwards; }

.card .actions .btn small { display: block; font-size: 12px; font-weight: 600; opacity: .8; }

<script>
/* Case Closed logic (CL): runs in the page and in Node (tools/check.js).
   The board (which case holds which value) is fixed at the start by a fair Fisher-Yates shuffle with
   crypto.getRandomValues (exact rejection sampling, no modulo bias). The Banker's offer is a function of the values
   still in play ONLY (yours included, but he never knows which one is yours), the round, his personality and a mood
   rolled from the same RNG. Every state change happens here first and is saved before the page animates it. */
var CL = (function () {
  'use strict';

  // ---------- the two shows ----------
  var MODES = {
    classic: {
      id: 'classic', name: 'Classic', cases: 26, rounds: [6, 5, 4, 3, 2, 1, 1, 1, 1],
      values: [0.01, 1, 5, 10, 25, 50, 75, 100, 200, 300, 400, 500, 750,
        1000, 5000, 10000, 25000, 50000, 75000, 100000, 200000, 300000, 400000, 500000, 750000, 1000000]
    },
    quick: {
      id: 'quick', name: 'Quick', cases: 16, rounds: [5, 4, 3, 1, 1],
      values: [0.01, 1, 10, 50, 100, 500, 1000, 5000, 10000, 25000, 50000, 100000, 250000, 500000, 750000, 1000000]
    }
  };
  var BIG = 1000; // values from here up are "gold" on the board (below it: "blue")

  // ---------- fair random numbers ----------
  var src = null; // a function returning a uint32; tests may replace it (setRandom) to replay a run
  function cryptoU32() {
    var c = (typeof globalThis !== 'undefined' && globalThis.crypto) || (typeof window !== 'undefined' && window.crypto);
    if (c && c.getRandomValues) { var a = new Uint32Array(1); c.getRandomValues(a); return a[0]; }
    if (typeof require === 'function') { return require('crypto').randomBytes(4).readUInt32LE(0); }
    throw new Error('No secure random source');
  }
  function u32() { return (src || cryptoU32)() >>> 0; }
  function setRandom(fn) { src = fn || null; }
  // an integer 0..n-1, exactly uniform (rejection sampling)
  function rand(n) {
    if (!(n >= 1)) return 0;
    var lim = Math.floor(4294967296 / n) * n, x;
    do { x = u32(); } while (x >= lim);
    return x % n;
  }
  function rand01() { return rand(1000000) / 1000000; }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = rand(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  // a seeded uint32 stream (xorshift) for reproducible simulations in tests only
  function seeded(seed) {
    var s = (seed >>> 0) || 0x9e3779b9;
    return function () { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s; };
  }

  // ---------- money ----------
  function money(v) {
    if (v < 1) return '$' + v.toFixed(2);
    return '$' + Math.round(v).toLocaleString('en-US');
  }
  function short(v) {
    if (v < 1) return '$' + v.toFixed(2);
    if (v >= 1000000) return '$' + (v / 1000000).toFixed(v % 1000000 ? 1 : 0) + 'M';
    if (v >= 1000) { var k = v / 1000; return '$' + (k >= 100 || k === Math.floor(k) ? Math.round(k) : k.toFixed(1)) + 'K'; }
    return '$' + Math.round(v);
  }
  // round an offer to a number a banker would say out loud
  function nice(x) {
    if (!(x > 0)) return 0;
    if (x < 1) return Math.max(0.01, Math.round(x * 100) / 100); // pocket change: to the cent
    var step = x < 20 ? 1 : x < 200 ? 5 : x < 1000 ? 10 : x < 5000 ? 50 : x < 20000 ? 100 : x < 100000 ? 500 : x < 500000 ? 1000 : 5000;
    return Math.max(1, Math.round(x / step) * step);
  }

  // ---------- the Banker ----------
  var PERS = {
    classic: { id: 'classic', name: 'Classic', mul: 1.00, moods: [0.25, 0.50, 0.25] },
    generous: { id: 'generous', name: 'Generous', mul: 1.04, moods: [0.10, 0.50, 0.40] },
    tough: { id: 'tough', name: 'Tough', mul: 0.88, moods: [0.45, 0.45, 0.10] }
  };
  var MOODS = [
    { id: 'stingy', name: 'Stingy', lo: 0.88, hi: 0.95 },
    { id: 'fair', name: 'Fair', lo: 0.97, hi: 1.03 },
    { id: 'generous', name: 'Generous', lo: 1.05, hi: 1.12 }
  ];
  function mean(vs) { var s = 0; for (var i = 0; i < vs.length; i++) s += vs[i]; return vs.length ? s / vs.length : 0; }
  // certainty equivalent for a risk-averse player (utility sqrt): rises with every value, falls with the spread
  function certainty(vs) { var s = 0; for (var i = 0; i < vs.length; i++) s += Math.sqrt(vs[i]); s /= vs.length || 1; return s * s; }
  function sd(vs) { var m = mean(vs), s = 0; for (var i = 0; i < vs.length; i++) s += (vs[i] - m) * (vs[i] - m); return Math.sqrt(s / (vs.length || 1)); }
  // how far through the show we are: cases opened so far / cases there are to open (0..1)
  function progress(mode, round) {
    var m = MODES[mode], tot = 0, done = 0;
    for (var i = 0; i < m.rounds.length; i++) { tot += m.rounds[i]; if (i <= round) done += m.rounds[i]; }
    return done / tot;
  }
  // the share of "fair value" the Banker pays after this round: low early (he wants you to keep playing), near the
  // full value at the end
  function factor(p) { return 0.14 + 0.86 * Math.pow(p, 1.7); }
  // the deterministic part of an offer: no mood, no rounding
  function baseOffer(vs, mode, round, pers) {
    var p = progress(mode, round), ev = mean(vs), ce = certainty(vs);
    var w = 0.45 * (1 - p) + 0.08;                       // how much the spread (risk) counts: a lot early, little late
    var target = ev * (1 - w) + ce * w;                  // between the plain average and a cautious player's value
    return Math.min(Math.max.apply(null, vs), factor(p) * (PERS[pers] || PERS.classic).mul * target);
  }
  function pickMood(pers) {
    var pr = (PERS[pers] || PERS.classic).moods, r = rand01(), i = 0;
    while (i < 2 && r >= pr[i]) { r -= pr[i]; i++; }
    return i;
  }
  // the full offer after round `round` (0-based): values in play only (never which case is yours)
  function offer(vs, mode, round, pers, moodIdx) {
    var b = baseOffer(vs, mode, round, pers), mi = moodIdx == null ? pickMood(pers) : moodIdx, md = MOODS[mi];
    var mul = md.lo + (md.hi - md.lo) * rand01();
    var top = Math.max.apply(null, vs), low = Math.min.apply(null, vs);
    var amt = nice(b * mul);
    if (amt > top) amt = top >= 1 ? Math.floor(top) : top; // never more than the best case left
    if (amt < low) amt = nice(low) <= top ? nice(low) : low;
    var ev = mean(vs);
    return { amount: amt, ev: ev, mood: md.id, ratio: ev ? amt / ev : 0, base: b };
  }
  // what a fair-mood Banker would have said (the "what if" replay): no randomness at all
  function fairOffer(vs, mode, round, pers) {
    var b = baseOffer(vs, mode, round, pers), top = Math.max.apply(null, vs), amt = nice(b);
    return Math.min(amt, top >= 1 ? Math.floor(top) : top);
  }

  // the board either side, cases in the middle, as big as the space allows

    var m = meta.statsMode === 'quick' ? 'quick' : 'classic', s = stats[m], h = hall[m];
    $('statsMode').querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.dataset.m === m); });
    var tile = function (v, l) { return '<div class="tile"><b>' + v + '</b><span>' + l + '</span></div>'; };
    var gp = CL.goodPct(s);
    var html = '<div class="tiles">' + tile(s.games, 'Games') + tile(s.games ? CL.short(CL.average(s)) : '-', 'Average') + tile(s.games ? CL.short(s.best) : '-', 'Best') + '</div>' +
      '<div class="tiles">' + tile(s.deals, 'Deals taken') + tile(s.refused, 'Offers refused') + tile(gp == null ? '-' : gp + '%', 'Good deals') + '</div>' +
      '<div class="tiles">' + tile(s.biggestRefused ? CL.short(s.biggestRefused) : '-', 'Biggest refused') + tile(s.topInCase, 'Top prize in your case') + tile(s.swaps ? s.swapWins + '/' + s.swaps : '-', 'Swaps that paid') + '</div>' +
      '<div class="statgroup">Hall of fame</div>';
    if (!h.length) html += '<p class="helpbody note">No shows finished yet.</p>';
    else html += '<ul class="hall">' + h.map(function (e, k) {
      var how = e.how === 'deal' ? 'Deal in round ' + (e.round + 1) + ' (case had ' + CL.short(e.mine) + ')' : e.how === 'swap' ? 'Swapped and won' : 'Kept the case';
      var d = new Date(e.date); return '<li class="' + (k === 0 ? 'first' : '') + '"><span class="n">' + (k + 1) + '</span><span class="a">' + money(e.won) + '</span><span class="h">' + how + ' · ' + (d.getMonth() + 1) + '/' + d.getDate() + '</span></li>';
    }).join('') + '</ul>';
    html += '<p class="helpbody note" style="text-align:center">“Good deals”: deals worth at least what your case held. Play money only.</p>';
    $('statsBody').innerHTML = html;
  }
  function syncSound() { $('btnSound').innerHTML = '<svg viewBox="0 0 24 24"><use href="#i-sound-' + (settings.sound ? 'on' : 'off') + '"/></svg>'; $('btnSound').classList.toggle('on', settings.sound); $('setSound').checked = settings.sound; S.setEnabled(settings.sound); }
  function syncAds() { $('setAds').checked = Goobs.adsOn(); $('adEvery').textContent = settings.adEvery === 1 ? '1 game' : settings.adEvery + ' games'; $('rowAdEvery').classList.toggle('off', !Goobs.adsOn()); }
  function syncPers() { $('setPers').querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === settings.pers); }); }
  function sheet(btn, ov, close, onOpen) {
    if (btn) $(btn).addEventListener('click', function () { if (onOpen) onOpen(); $(ov).classList.add('show'); });
    $(close).addEventListener('click', function () { $(ov).classList.remove('show'); });
    $(ov).addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  }

  // ================= start up =================
  function init() {
    Goobs.fullscreen({ overlay: true, menu: ['btnNew', 'btnStats', 'btnSettings'], icon: CA.logo(), title: 'Case Closed', info: function () {
      if (!G || preview) return 'Play money only';
      if (G.phase === 'done') return '<b>' + (G.mode === 'quick' ? 'Quick game' : 'Classic') + '</b> · won ' + money(G.result.won) + ' · play money';
      return '<b>' + (G.mode === 'quick' ? 'Quick game' : 'Classic') + '</b> · round ' + (G.round + 1) + ' of ' + M().rounds.length + (G.mine >= 0 ? ' · your case ' + (G.mine + 1) : '') + ' · ' + CL.inPlay(G).length + ' cases in play · Banker: ' + CL.PERS[G.pers].name;
    } });
    Goobs.themePicker($('themes'));
    $('topLogo').innerHTML = CA.logo(); $('startLogo').innerHTML = CA.logo();
    $('hostAv').innerHTML = CA.host(); $('skybox').innerHTML = CA.banker(); $('ofBank').innerHTML = CA.banker();
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) { document.addEventListener(ev, function () { S.unlock(); }, { passive: true }); });
    $('btnHome').addEventListener('click', function () { commit(); Goobs.home(); });
    $('cases').addEventListener('click', function (e) { var b = e.target.closest('.case'); if (b) tapCase(+b.dataset.i); });
    $('opener').addEventListener('click', function () { if (opHurry) opHurry(); });
    $('btnDeal').addEventListener('click', function () { answerOffer('deal'); });
    $('btnNoDeal').addEventListener('click', function () { answerOffer('no'); });
    $('skybox').addEventListener('click', function () { if (G && (G.phase === 'offer' || G.phase === 'counter') && !busy() && !isOpen('ovOffer')) showOffer(); else toast('The Banker only calls at the end of a round.'); });
    $('btnClassic').addEventListener('click', function () { newGameFlow('classic'); });
    $('btnQuick').addEventListener('click', function () { newGameFlow('quick'); });
    $('btnNew').addEventListener('click', function () { setTimeout(askNew, 50); });
    $('pillRound').addEventListener('click', openHelp);
    $('btnHelp').addEventListener('click', openHelp);
    sheet(null, 'ovHelp', 'btnCloseHelp');
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings');
    sheet('btnStats', 'ovStats', 'btnCloseStats', renderStats);
    $('statsMode').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; meta.statsMode = b.dataset.m; store.set('meta', meta); renderStats(); });
    $('btnSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncSound(); S.button(); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); syncSound(); S.button(); });
    $('setMusic').checked = settings.music;
    $('setMusic').addEventListener('change', function () { settings.music = this.checked; saveSettings(); S.setMusic(settings.music); });
    $('setFast').checked = settings.fast;
    $('setFast').addEventListener('change', function () { settings.fast = this.checked; saveSettings(); });
    syncPers();
    $('setPers').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; settings.pers = b.dataset.v; saveSettings(); syncPers(); if (G && !preview && G.phase !== 'done' && G.phase !== 'pick') toast('The ' + CL.PERS[settings.pers].name + ' Banker takes over from your next show.'); else if (G && !preview && G.phase === 'pick') { G.pers = settings.pers; commit(); } });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncAds(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncAds(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncAds(); });
    if (window.ResizeObserver) { var ro = new ResizeObserver(function () { layout(); }); ro.observe($('floor')); }
    window.addEventListener('resize', function () { layout(); fitHost(); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) commit(); });
    window.addEventListener('pagehide', commit);
    syncSound(); syncAds(); if (settings.music) S.setMusic(true);

    if (G) {
      preview = false;
      if (G.phase === 'done') { revealedMine = true; revealedOther = true; if (G.whatif) { G.whatif.steps.forEach(function (s) { s.cases.forEach(function (c) { replay[c] = 1; }); }); replayGhosts = G.whatif.steps.map(function (s) { return s.offer; }); } }
      renderAll();
      if (G.phase === 'pick') say('Welcome back! Pick the case you’ll take home tonight.');
      else if (G.phase === 'open') { var ri = CL.roundInfo(G); say('Welcome back to <b>Case Closed</b>! Round ' + (G.round + 1) + ': open <b>' + plural(ri.left, 'more case', 'more cases') + '</b>.'); }
      else if (G.phase === 'offer' || G.phase === 'counter') bankerCall(true);
      else if (G.phase === 'final') say('Welcome back! Two cases left: yours (<b>' + (G.mine + 1) + '</b>) and <b>case ' + (CL.lastOther(G) + 1) + '</b>. <b>Keep or swap?</b>');
      else { say('Last show: you won <b>' + money(G.result.won) + '</b>. Ready for another?'); setTimeout(showEnd, 200); }
    } else {
      G = CL.newGame('classic', settings.pers); preview = true;
      renderAll();
      say('Good evening! I’m <b>Vic Velvet</b>, and this is <b>Case Closed</b>, live in the ship’s theatre!');
      showStart();
    }
    if (!meta.seen.help) { meta.seen.help = 1; store.set('meta', meta); }
    commit();
    window.__ckReady = true;
    Goobs.markPlayed('cases');
    Goobs.initUpdates({ beforeReload: commit, onVersions: function (v) { $('version').textContent = 'Case Closed ' + (v.cases || '1.0.0') + ' · Goobs-Games ' + (v.shell || '?'); } });
  }
  // hook for automated tests (players never reach it)
  window.__cases = {
    get G() { return G; }, meta: function () { return meta; }, stats: function () { return stats; }, hall: function () { return hall; }, settings: settings, CL: CL,
    busy: function () { return busy() || replaying; }, phase: function () { return G && !preview ? G.phase : 'none'; }, preview: function () { return preview; },
    start: function (mode, values) { startGame(mode, values); }, layout: layout,
    setFast: function (v) { settings.fast = !!v; saveSettings(); $('setFast').checked = settings.fast; }
  };
  init();
})();
</script>
<script src="../../shared/collection-batch5.js"></script>
</body>
</html>
