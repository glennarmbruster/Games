<script>
/* if Splash Sort can't open, say so on screen (never a blank page) and offer a fresh start */
(function () {
  var shown = false;
  function fail(msg) {
    if (shown || window.__ssReady) return; shown = true;
    function put() {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:#eaf3ff;color:#1b1f33;font:600 16px -apple-system,system-ui,sans-serif;text-align:center';
      d.innerHTML = '<b style="font-size:21px">Splash Sort didn\u2019t open</b><div style="max-width:320px;opacity:.75;font-size:13px">' + String(msg).replace(/[<>&]/g, '') + '</div>';
      function btn(t, bg, go) { var b = document.createElement('button'); b.textContent = t; b.style.cssText = 'font:800 17px -apple-system,system-ui,sans-serif;padding:13px 24px;border-radius:14px;border:0;color:#fff;background:' + bg; b.onclick = go; d.appendChild(b); }
      btn('Start fresh', '#5a54f0', function () { try { localStorage.removeItem('sort.game'); } catch (e) { /* ignore */ } location.reload(); });
      btn('All games', '#6b7080', function () { location.href = '../../'; });
      document.body.appendChild(d);
    }
    if (document.body) put(); else document.addEventListener('DOMContentLoaded', put);
  }
  window.addEventListener('error', function (e) { fail((e.message || 'Something went wrong') + (e.lineno ? ' (line ' + e.lineno + ')' : '')); });
  setTimeout(function () { if (!window.__ssReady) fail('It took too long to start.'); }, 6000);
})();
</script>

/* Splash Sort styles (themes, UI kit and ad cards come from /shared/goobs.css) */
.brand h1 { font-size: 22px; }
/* 1.2.0 full screen (Glenn: "not full screen - close but the playing board isn't"): the water-area backdrop fills the whole
   phone, edge to edge behind the status bar and home bar; the top row (kit overlay), the pills and Restart / Undo / Tube
   float on it, and the tubes are laid out in the free space between them (app.js fit()). */
html.gg-fs-over, html.gg-fs-over body { background: #a9d2ff; }
html.gg-fs-over[data-theme="dark"], html.gg-fs-over[data-theme="dark"] body, html.gg-fs-over[data-theme="blue"], html.gg-fs-over[data-theme="blue"] body { background: #1b2a4c; }
.stagewrap { position: fixed; inset: 0; z-index: 0; }
.stage { position: absolute; inset: 0; overflow: hidden; touch-action: none;
  background: radial-gradient(120% 90% at 50% 0%, #cfe9ff 0%, #a9d2ff 45%, #7fa8f0 100%); }
[data-theme="dark"] .stage, [data-theme="blue"] .stage { background: radial-gradient(120% 90% at 50% 0%, #2a3f6a 0%, #1b2a4c 55%, #121b33 100%); }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.toast { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 76px); transform: translateX(-50%); max-width: 92%; text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: rgba(20,24,36,.82); color: #fff; font-weight: 700; font-size: 14px; padding: 8px 14px; border-radius: 14px; }
.toast.show { opacity: 1; }
/* the top row: back, pills (level, moves left), sound, Menu */
.pills { flex: 1 1 auto; min-width: 0; display: flex; justify-content: center; gap: 6px; }
.pills .ggpill { font-size: 17px; padding: 4px 13px 5px; line-height: 18px; min-width: 0; overflow: hidden; text-align: center; }
.pills button.ggpill { font-family: inherit; cursor: pointer; }
.pills .ggpill small { display: block; font-size: 10px; line-height: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; opacity: .6; }
.pills .ggpill i { font-style: normal; font-size: 13px; opacity: .6; }
.pills .ggpill.warn { background: #ffb020; color: #3a2400; }
.pills .ggpill.out { background: #ef3b4f; color: #fff; }
/* Restart / Undo / Tube float at the bottom, clear of the home bar */
html.gg-fs-over .toolbar { position: fixed; z-index: 5; left: calc(env(safe-area-inset-left, 0px) + 10px); right: calc(env(safe-area-inset-right, 0px) + 10px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); width: auto; }
html.gg-fs-over .toolbar .tool { box-shadow: 0 4px 12px rgba(0,0,0,.18); }
html.gg-fs-over .toolbar .tool:not(.red) { background: rgba(255,255,255,.92); color: #1b2130; border-color: transparent; }
.tool { position: relative; }
.tool .cnt { position: absolute; top: 4px; right: 8px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--gold); color: #3a2a00; font-style: normal; font-weight: 800; font-size: 12px; line-height: 20px; }
.tool.red .cnt { background: #ffffff; color: var(--accent); }
/* Water / Balls tabs live at the top of the Menu sheet */
.ggmenu .modes { margin: 4px 0 2px; }
.cardicon svg { border-radius: 16px; }
.lvbig { font-size: 30px; }
.card .btn small { display: block; font-size: 12px; font-weight: 700; opacity: .8; }
</style>

<script>
/* Splash Sort rules (no DOM; runs in Node for the level tools and tests).
   A level is a row of tubes, each holding up to `cap` units of colour (4, 6 or 8 since 1.2.0; a level uses one capacity,
   and it is simply how many units of each colour the level has), listed bottom → top.
   Water: a pour moves the whole top run of one colour, as much as fits. Balls: a move takes one ball.
   You may only pour onto the same colour or into an empty tube. Solved = every tube empty or full of one colour.
   Level strings: tubes joined by '.', colours as letters a-l, bottom first ("abca.bcab.cabc.."). */
var SS = (function () {
  'use strict';
  var CAP = 4; // the capacity of the early levels (kept for old callers); a game's own capacity is g.cap
  function top(t) { return t.length ? t[t.length - 1] : -1; }
  function runLen(t) { var n = 0, c = top(t); for (var i = t.length - 1; i >= 0 && t[i] === c; i--) n++; return n; }
  function done(t, cap) { return t.length === cap && runLen(t) === cap; }
  function parse(str) { return str.split('.').map(function (s) { return s.split('').map(function (ch) { return ch.charCodeAt(0) - 97; }); }); }
  function serial(tubes) { return tubes.map(function (t) { return t.map(function (c) { return String.fromCharCode(97 + c); }).join(''); }).join('.'); }
  function colours(tubes) { var m = 0; tubes.forEach(function (t) { t.forEach(function (c) { if (c + 1 > m) m = c + 1; }); }); return m; }
  // a level's tube capacity = units of each colour (every colour fills exactly one tube)
  function capOf(str) { var ts = typeof str === 'string' ? parse(str) : str, u = 0; ts.forEach(function (t) { u += t.length; }); return Math.max(1, Math.round(u / Math.max(1, colours(ts)))); }
  // the move limit (1.2.0): the solver's move count plus a little slack, "realistic - maybe a little optimistic"
  function limitFor(solverMoves) { return solverMoves + Math.max(3, Math.ceil(solverMoves * 0.2)); }
  // moves given back by one "Continue" (watch an ad): a quarter of the limit, at least 8
  function bonusFor(limit) { return Math.max(8, Math.ceil(limit * 0.25)); }

  function create(str, opts) {
    opts = opts || {};
    var tubes = parse(str);
    // limit: moves allowed (0 = no limit); a move on the board counts one, an undo gives it back (moves used = hist.length);
    // conts: "Continue" ads used on this level (each adds bonusFor(limit) moves, at most 2)
    return { start: str, tubes: tubes, cap: capOf(tubes), balls: !!opts.balls, moves: 0, hist: [], undos: opts.undos == null ? 5 : opts.undos, extra: opts.extra == null ? 1 : opts.extra, added: 0,
      limit: opts.limit || 0, base: opts.limit || 0, conts: 0 };
  }
  // how many units a move a → b would carry (0 = not allowed)
  function canMove(g, a, b) {
    if (a === b || a < 0 || b < 0 || a >= g.tubes.length || b >= g.tubes.length) return 0;
    var A = g.tubes[a], B = g.tubes[b];
    if (!A.length || B.length >= g.cap) return 0;
    if (B.length && top(B) !== top(A)) return 0;
    return g.balls ? 1 : Math.min(runLen(A), g.cap - B.length);
  }
  function move(g, a, b) {
    var n = canMove(g, a, b); if (!n) return null;
    var A = g.tubes[a], B = g.tubes[b], c = top(A);
    for (var i = 0; i < n; i++) B.push(A.pop());
    g.moves++; g.hist.push([a, b, n]);
    return { a: a, b: b, n: n, c: c, filled: done(B, g.cap), won: solved(g) };
  }
  function undo(g) {
    if (!g.hist.length || g.undos <= 0) return null;
    var h = g.hist.pop(), A = g.tubes[h[0]], B = g.tubes[h[1]];
    for (var i = 0; i < h[2]; i++) A.push(B.pop());
    g.undos--; g.moves++;
    return { a: h[1], b: h[0], n: h[2], c: top(A) };
  }
  function addTube(g) { if (g.extra <= 0) return false; g.extra--; g.added++; g.tubes.push([]); return true; }
  // restart: the level as it started, with its own move limit (a fresh try: the two Continues are available again)
  function restart(g) { var r = create(g.start, { balls: g.balls, limit: g.base }); for (var k in r) g[k] = r[k]; return g; }
  function used(g) { return g.hist.length; }
  function movesLeft(g) { return g.limit ? g.limit - g.hist.length : Infinity; }
  function outOfMoves(g) { return !!g.limit && g.hist.length >= g.limit && !solved(g); }
  function addMoves(g) { var b = bonusFor(g.base || g.limit); g.limit += b; g.conts++; return b; }
  function solved(g) { return g.tubes.every(function (t) { return !t.length || done(t, g.cap); }); }
  // moves that actually change something (not a finished tube, not a one-colour tube into an empty one)
  function usefulMoves(g) {
    var out = [];
    for (var a = 0; a < g.tubes.length; a++) {
      var A = g.tubes[a]; if (!A.length || done(A, g.cap)) continue;
      var uniform = runLen(A) === A.length;
      for (var b = 0; b < g.tubes.length; b++) { if (!canMove(g, a, b)) continue; if (uniform && !g.tubes[b].length) continue; out.push([a, b]); }
    }
    return out;
  }

  // ---------------- solver (water rules; a water-solvable level is also ball-solvable) ----------------
  // depth-first with a visited set; returns { moves: [[a,b],...], nodes } or { moves: null, nodes }
  function solve(str, limit, rnd) {
    limit = limit || 200000;
    var start = parse(str), cap = capOf(start), seen = new Set(), nodes = 0;
    function key(ts) { return ts.map(function (t) { return t.join(','); }).sort().join('|'); }
    function isSolved(ts) { return ts.every(function (t) { return !t.length || (t.length === cap && runLen(t) === cap); }); }
    function options(ts) {
      var out = [], emptyUsed = false;
      for (var a = 0; a < ts.length; a++) {
        var A = ts[a]; if (!A.length || (A.length === cap && runLen(A) === cap)) continue;
        var rl = runLen(A), uniform = rl === A.length, c = top(A);
        emptyUsed = false;
        for (var b = 0; b < ts.length; b++) {
          if (a === b) continue; var B = ts[b];
          if (B.length >= cap) continue;
          if (!B.length) { if (uniform || emptyUsed) continue; emptyUsed = true; out.push([a, b, 1 + (rnd ? rnd() * 2.2 : 0)]); continue; }
          if (top(B) !== c) continue;

/* Splash Sort sounds: synthesized with Web Audio (no audio files). */
var SSSound = (function () {
  'use strict';
  var ac = null, master = null, on = false;
  function ctx() {
    if (!on) return null;
    if (!ac) {
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      try { ac = new AC(); } catch (e) { return null; }
      master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
    }
    if (ac.state === 'suspended') { try { ac.resume(); } catch (e) { /* ignore */ } }
    return ac;
  }
  function tone(type, f0, f1, dur, gain, delay) {
    var a = ctx(); if (!a) return;
    var t = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(freq, q, dur, gain, delay, f1) {
    var a = ctx(); if (!a) return;
    var t = a.currentTime + (delay || 0), len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / len);
    var s = a.createBufferSource(); s.buffer = buf;
    var bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.setValueAtTime(freq, t); if (f1) bp.frequency.exponentialRampToValueAtTime(f1, t + dur); bp.Q.value = q;
    var g = a.createGain(); g.gain.value = gain; s.connect(bp); bp.connect(g); g.connect(master); s.start(t);
  }
  return {
    setEnabled: function (v) { on = !!v; if (on) ctx(); },
    unlock: function () { if (on) ctx(); },
    pick: function () { if (on) tone('sine', 620, 760, 0.07, 0.1); },
    drop: function () { if (on) tone('sine', 520, 420, 0.07, 0.08); },
    pour: function (n) { if (!on) return; noise(500, 1.2, 0.3 + n * 0.08, 0.35, 0, 1300); for (var i = 0; i < 3 + n; i++) tone('sine', 300 + Math.random() * 500, 0, 0.05, 0.05, 0.05 + i * 0.07); },
    clack: function () { if (on) { tone('triangle', 1400, 900, 0.05, 0.14); noise(3000, 5, 0.03, 0.2); } },
    cap: function () { if (!on) return; tone('square', 880, 1320, 0.07, 0.07); tone('sine', 1760, 0, 0.3, 0.12, 0.05); },
    nope: function () { if (on) tone('sine', 300, 220, 0.1, 0.1); },
    undo: function () { if (on) tone('sine', 700, 440, 0.12, 0.09); },
    tube: function () { if (on) { tone('triangle', 520, 1040, 0.18, 0.12); tone('sine', 1560, 0, 0.2, 0.06, 0.12); } },
    win: function () { if (!on) return; [523, 659, 784, 1047, 1319].forEach(function (f, i) { tone('triangle', f, 0, i === 4 ? 0.6 : 0.18, 0.24, i * 0.1); }); noise(4000, 0.8, 0.5, 0.12, 0.45); },
    ding: function () { if (on) { tone('sine', 1319, 0, 0.4, 0.25); tone('sine', 1568, 0, 0.5, 0.2, 0.12); } },
    sign: function () { if (on) noise(900, 3, 0.07, 0.3); }
  };

<script>
/* Splash Sort app: drawing the tubes (water that stays level as a tube tips, or glossy balls), taps, pour and ball
   animations, undo, the spare tube, level flow for Water and Balls (separate progress), saves, stats, house ads. */
(function () {
  'use strict';
  var S = SSSound, LEVELS = window.SS_LEVELS || [];
  var COLORS = ['#ef3b4f', '#ff8f1f', '#ffd21e', '#97e03a', '#1fa653', '#2fd3e3', '#2f6ef0', '#8a4ae8', '#ff72c6', '#8d5a2b', '#a3a9b6', '#23306e'];
  var LIGHT = ['#ff8a96', '#ffc07a', '#fff08a', '#cff78e', '#6fe39a', '#a6f3fa', '#8fb4ff', '#c4a0ff', '#ffb6e3', '#c8955f', '#dfe3ea', '#5a6ab8'];

  // ================= storage =================
  var store = Goobs.store('sort');
  var settings = { sound: false, adEvery: 3, symbols: false };
  (function () { var s = store.get('settings', {}) || {}; for (var k in settings) if (typeof s[k] === typeof settings[k]) settings[k] = s[k]; settings.adEvery = Math.min(10, Math.max(1, settings.adEvery | 0)); })();
  function saveSettings() { store.set('settings', settings); }
  var meta = store.get('meta', null) || {};
  var MD = { mode: 'water', level: { water: 1, balls: 1 }, seen: false, finished: 0, lastAdAt: 0 };
  for (var mk in MD) if (meta[mk] === undefined) meta[mk] = MD[mk];
  if (meta.mode !== 'water' && meta.mode !== 'balls') meta.mode = 'water';
  ['water', 'balls'].forEach(function (m) { if (!(meta.level[m] >= 1)) meta.level[m] = 1; });
  function saveMeta() { store.set('meta', meta); }
  var stats = store.get('stats', null) || {};
  ['water', 'balls'].forEach(function (m) { var o = stats[m] || (stats[m] = {}); ['solved', 'moves', 'fewest', 'undos', 'tubes'].forEach(function (k) { if (typeof o[k] !== 'number') o[k] = 0; }); });
  if (typeof stats.capped !== 'number') stats.capped = 0;
  function saveStats() { store.set('stats', stats); }

  // ================= helpers =================
  function $(id) { return document.getElementById(id); }
  function isOpen(id) { return $(id).classList.contains('show'); }
  function sheetOpen() { return isOpen('ovEnd') || isOpen('ovSettings') || isOpen('ovStats') || isOpen('ovHelp') || isOpen('ggMenu') || GoobsAds.isOpen(); } // no pouring while the Menu is open either
  function fmt(n) { return (n || 0).toLocaleString(); }
  // a level: [level string, solver's water moves, solver's ball moves] (1.2.0); past the list it is made on the phone
  var beyond = {};
  function levelEntry(n) { if (n <= LEVELS.length) return LEVELS[n - 1]; return beyond[n] || (beyond[n] = SS.levelBeyond(n)); }
  function limitOf(n, balls) { var e = levelEntry(n); return SS.limitFor(balls ? e[2] : e[1]); }

  // ================= game =================
  var g = null, levelNo = 1, sel = -1, anims = [], parts = [], caps = {}, ending = false, lifts = [];
  function startLevel(n) {
    levelNo = n; meta.level[meta.mode] = n; saveMeta();
    var balls = meta.mode === 'balls';
    g = SS.create(levelEntry(n)[0], { balls: balls, limit: limitOf(n, balls) });
    g.level = n; sel = -1; anims = []; parts = []; caps = {}; ending = false; lifts = [];
    save(); layout(); renderInfo();
  }
  function save() { if (g && !ending) store.set('game.' + meta.mode, g); }
  function load() {
    var r = store.get('game.' + meta.mode, null);
    if (!r || !Array.isArray(r.tubes) || typeof r.start !== 'string' || r.level !== meta.level[meta.mode] || !!r.balls !== (meta.mode === 'balls')) return false;
    // 1.2.0 rebuilt the levels: a level saved before that (a different start) begins again as the new level of that number
    if (r.start !== levelEntry(r.level)[0] || !(r.limit > 0) || !(r.cap >= 1)) return false;
    if (!r.tubes.every(function (t) { return Array.isArray(t) && t.length <= r.cap; }) || SS.solved(r)) return false;
    if (typeof r.base !== 'number') r.base = r.limit; if (typeof r.conts !== 'number') r.conts = 0;
    g = r; levelNo = r.level; sel = -1; anims = []; parts = []; caps = {}; ending = false; lifts = [];
    g.tubes.forEach(function (t, i) { if (SS.done(t, g.cap)) caps[i] = 1; });
    layout(); renderInfo(); return true;
  }
  function busy(i) { return anims.some(function (a) { return a.a === i || a.b === i; }); }
  function tap(i) {
    if (!g || ending || sheetOpen()) return;
    S.unlock();
    if (SS.outOfMoves(g)) { if (!anims.length) outOfMoves(); return; } // no moves left: the card again (Continue or Restart)
    if (i < 0) { if (sel >= 0) { sel = -1; S.drop(); } return; }
    if (busy(i)) return;
    if (sel < 0) {
      if (!g.tubes[i].length || SS.done(g.tubes[i], g.cap)) { S.nope(); shake(i); return; }
      sel = i; S.pick(); return;
    }
    if (sel === i) { sel = -1; S.drop(); return; }
    var from = sel, n = SS.canMove(g, from, i);
    if (!n) {
      // not allowed: pick up the tapped tube instead if it has something to move
      if (g.tubes[i].length && !SS.done(g.tubes[i], g.cap)) { sel = i; S.pick(); shake(from); return; }
      S.nope(); shake(i); sel = -1; return;
    }
    var r = SS.move(g, from, i); sel = -1;
    stats[meta.mode].moves++; saveStats();
    anims.push({ a: from, b: i, n: r.n, c: r.c, t: 0, dur: g.balls ? 340 : 760, filled: r.filled, won: r.won });
    if (g.balls) S.clack(); else setTimeout(function () { S.pour(r.n); }, 190);
    save(); renderInfo();
  }
  function finishAnim(a) {
    if (a.filled) { caps[a.b] = performance.now(); S.cap(); stats.capped++; saveStats(); burst(a.b, 14, COLORS[a.c]); }
    if (a.won && SS.solved(g)) { win(); return; }
    if (!anims.length && SS.outOfMoves(g)) { outOfMoves(); return; }
    if (!anims.length && !SS.solved(g) && !SS.usefulMoves(g).length) stuck();
  }
  // the move limit ran out (1.2.0): Continue with more moves after a house ad (twice per try), or Restart
  var MAXCONT = 2;
  function outOfMoves() {
    if (!g || ending || isOpen('ovEnd')) return;
    sel = -1; S.nope();
    var bonus = SS.bonusFor(g.base || g.limit), left = MAXCONT - g.conts, btns = [];
    if (left > 0) btns.push({ label: 'Continue +' + bonus + ' moves', sub: 'watch an ad' + (left === 1 ? ' \u00b7 last one' : ''), red: true, go: function () {
      showAd(function () { if (!g || ending) return; var b = SS.addMoves(g); save(); renderInfo(); toast('+' + b + ' moves. Keep sorting!'); S.tube(); });
    } });
    btns.push({ label: 'Restart', red: left <= 0, go: function () { restart(); } });
    showCard('Out of moves', 'All <b>' + g.limit + '</b> moves are used and it isn\u2019t sorted yet.' + (left > 0 ? '' : ' No more Continues on this try.'), btns);
  }
  function stuck() {
    if (g.undos > 0 && g.hist.length) toast('No moves left. Undo, add a tube, or restart.');
    else if (g.extra > 0) toast('No moves left. Add a tube, or restart.');
    else showCard('Stuck', 'Nothing can move anymore. Try this level again?', [{ label: 'Restart', red: true, go: function () { restart(); } }]);
  }
  function win() {
    ending = true; store.del('game.' + meta.mode);
    var st = stats[meta.mode]; st.solved++; if (!st.fewest || g.moves < st.fewest) st.fewest = st.fewest ? Math.min(st.fewest, g.moves) : g.moves; saveStats();
    meta.finished++; meta.level[meta.mode] = levelNo + 1; saveMeta();
    S.win(); for (var i = 0; i < 90; i++) confetti();
    setTimeout(function () {
      showCard('Level ' + levelNo + ' sorted!', 'Done in <b>' + SS.used(g) + '</b> of ' + g.limit + ' moves.' + (levelNo === LEVELS.length ? ' That was the last hand-checked level; new ones are made on the phone from here on.' : ''), [
        { label: 'Next level', red: true, go: function () { between(function () { startLevel(levelNo + 1); }); } }]);
    }, 1100);

      if (t >= 0.3 && t < 0.72) { // the stream
        var ly = Q.y + L.th - 3 - disp[a.b].reduce(function (s2, r2) { return s2 + r2.amt; }, 0) * L.u;
        cx.fillStyle = COLORS[a.c]; var sw = tw * 0.14 * Math.min(1, (0.72 - t) * 10, (t - 0.3) * 12);
        var stream=cx.createLinearGradient(Q.x-sw/2,0,Q.x+sw/2,0);stream.addColorStop(0,COLORS[a.c]);stream.addColorStop(.38,LIGHT[a.c]);stream.addColorStop(.6,LIGHT[a.c]);stream.addColorStop(1,COLORS[a.c]);cx.fillStyle=stream;cx.fillRect(Q.x - sw / 2, my - 2, sw, ly - my + 3);
      }
      drawWaterTube(x, y, ang, disp[i], false, 0);
    });
    // balls in flight
    if (g.balls) anims.forEach(function (a) {
      var P = L.pos[a.a], Q = L.pos[a.b], r = ballR(), t = a.t, k;
      var y0 = P.y - r * 1.25, y1 = Q.y - r * 1.25, yEnd = Q.y + L.th - 3 - r - (g.tubes[a.b].length - 1) * L.u, x, y;
      if (t < 0.55) { k = ease(t / 0.55); x = P.x + (Q.x - P.x) * k; y = y0 + (y1 - y0) * k - Math.sin(k * Math.PI) * L.tw * 0.8; }
      else { k = (t - 0.55) / 0.45; x = Q.x; y = y1 + (yEnd - y1) * k * k; }
      drawBall(a.c, x, y, r);
    });
    drawParts();
  }
  // ================= particles =================
  function burst(i, n, col) { var p = L.pos[i]; for (var k = 0; k < n; k++) { var a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * 3; parts.push({ x: p.x, y: p.y - L.tw * 0.2, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 40, t: 0, c: k % 3 ? col : '#ffffff', r: 2 + Math.random() * 2.5, star: k % 3 === 0 }); } }
  function confetti() { var cols = COLORS; parts.push({ x: Math.random() * W, y: -10 - Math.random() * H * 0.4, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3, life: 160, t: 0, c: cols[Math.floor(Math.random() * cols.length)], r: 3 + Math.random() * 3, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, flake: true }); }
  function stepParts() { parts = parts.filter(function (p) { p.t++; p.x += p.vx; p.y += p.vy; p.vy += p.flake ? 0.03 : 0.15; if (p.flake) { p.vx *= 0.99; p.rot += p.vr; } return p.t < p.life && p.y < H + 20; }); }
  function drawParts() {
    parts.forEach(function (p) {
      cx.globalAlpha = Math.max(0, 1 - p.t / p.life); cx.fillStyle = p.c;
      if (p.flake) { cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillRect(-p.r, -p.r * 0.5, p.r * 2, p.r); cx.restore(); }
      else { cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, Math.PI * 2); cx.fill(); }
    });
    cx.globalAlpha = 1;
  }

  // ================= loop =================
  var lastT = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = lastT ? Math.min(60, now - lastT) : 16; lastT = now;
    var done = [];
    anims.forEach(function (a) { a.t += dt / a.dur; if (a.t >= 1) done.push(a); });
    done.forEach(function (a) { anims.splice(anims.indexOf(a), 1); finishAnim(a); });
    stepParts(); draw(now);
  }

  // ================= info, cards, sheets =================
  function renderInfo() {
    if (!g) return;
    // pills: the level, and the moves left of the limit (orange when few are left, red at 0)
    var left = SS.movesLeft(g), pm = $('pillMoves');
    $('pillLevel').innerHTML = '<small>Level</small>' + levelNo;
    pm.innerHTML = '<small>Moves left</small>' + Math.max(0, left) + '<i> / ' + g.limit + '</i>';
    pm.classList.toggle('warn', left > 0 && left <= Math.max(3, Math.round(g.limit * 0.1)));
    pm.classList.toggle('out', left <= 0);
    $('undoCnt').textContent = g.undos; $('tubeCnt').textContent = g.extra;
    $('btnUndo').disabled = g.undos <= 0; $('btnTube').disabled = g.extra <= 0;
  }
  function syncModes() { document.documentElement.dataset.sortMode=meta.mode; $('studioMode').textContent=meta.mode==='balls'?'MARBLE STUDIO':'LIQUID STUDIO'; Array.prototype.forEach.call($('modes').children, function (b) { b.classList.toggle('on', b.dataset.mode === meta.mode); }); }
  var toastT = 0;
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('show'); }, 2200); }
  function showCard(title, html, buttons) {
    $('cardIcon').innerHTML = '<svg viewBox="0 0 100 100"><use href="#ss-logo"/></svg>';
    $('endTitle').textContent = title; $('endText').innerHTML = html;
    var box = $('endActions'); box.innerHTML = '';
    buttons.forEach(function (b) { var el = document.createElement('button'); el.className = 'btn' + (b.red ? ' red' : ''); el.textContent = b.label;
      if (b.sub) { var sm = document.createElement('small'); sm.textContent = b.sub; el.appendChild(sm); } el.addEventListener('click', function () { $('ovEnd').classList.remove('show'); b.go(); }); box.appendChild(el); });
    $('ovEnd').classList.add('show');
  }
  function showAd(done2) { GoobsAds.show({ onShow: function () { S.ding(); }, onStep: function () { S.sign(); } }, done2); }
  function between(next) {
    if (Goobs.adsOn() && meta.finished > 0 && meta.finished % settings.adEvery === 0 && meta.lastAdAt !== meta.finished) { meta.lastAdAt = meta.finished; saveMeta(); next(); showAd(function () {}); return; }
    next();
  }
  function openHelp() {
    $('helpList').innerHTML = [
      '<b>Tap a tube</b> to pick it up, then <b>tap another</b> to pour into it. Tap the same tube again to put it down.',
      'You can only pour onto the <b>same color</b> or into an <b>empty tube</b>, and only as much as fits. <b>Water</b> pours the whole top color at once; in <b>Balls</b> one ball moves at a time.',
      'Sort it so every tube holds <b>one color</b>. A full tube gets a cork.',
      'Some levels have taller tubes that hold <b>6</b> or <b>8</b>. A tube is done when it is full of one color.',
      'Each level has a <b>move limit</b> (top right: moves left). It is a little more than our solver needed, so it is always possible. An <b>Undo</b> gives its move back. Out of moves? <b>Continue</b> with extra moves after a short ad (twice per try), or <b>Restart</b>.',
      'Stuck? <b>Undo</b> (5 per level), add <b>one spare tube</b> per level, or <b>Restart</b>. Every level has been checked to be solvable.',
      '<b>Water</b> and <b>Balls</b> each keep their own level. 1,000 levels are built in; after that new ones are made on the phone.',
      'Settings: <b>color symbols</b> put a small shape on each color, handy in bright sun.'
    ].map(function (x) { return '<li>' + x + '</li>'; }).join('');
    $('ovHelp').classList.add('show');
  }
  function renderStats() {
    var w = stats.water, b = stats.balls;
    $('statsBody').innerHTML = '<div class="tiles"><div class="tile"><b>' + fmt(w.solved) + '</b><span>Water levels</span></div><div class="tile"><b>' + fmt(b.solved) + '</b><span>Ball levels</span></div><div class="tile"><b>' + fmt(stats.capped) + '</b><span>Tubes corked</span></div></div>' +
      '<div class="tiles"><div class="tile"><b>' + fmt(w.moves + b.moves) + '</b><span>Moves</span></div><div class="tile"><b>' + fmt(w.undos + b.undos) + '</b><span>Undos</span></div><div class="tile"><b>' + fmt(w.tubes + b.tubes) + '</b><span>Spare tubes</span></div></div>' +
      '<p style="color:var(--muted);text-align:center;margin:4px 0 0">Next up: Water level ' + meta.level.water + ', Balls level ' + meta.level.balls + '.</p>';
  }

  // ================= wiring =================
  function syncSound() { $('btnSound').innerHTML = '<svg viewBox="0 0 24 24"><use href="#i-sound-' + (settings.sound ? 'on' : 'off') + '"/></svg>'; $('btnSound').classList.toggle('on', settings.sound); $('setSound').checked = settings.sound; S.setEnabled(settings.sound); }
  function syncAds() { $('setAds').checked = Goobs.adsOn(); $('adEvery').textContent = settings.adEvery; $('rowAdEvery').classList.toggle('off', !Goobs.adsOn()); }
  function sheet(btn, ov, close, onOpen) {
    if (btn) $(btn).addEventListener('click', function () { if (onOpen) onOpen(); $(ov).classList.add('show'); });
    $(close).addEventListener('click', function () { $(ov).classList.remove('show'); });
    $(ov).addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  }
  function init() {
    // full screen: How to play, Stats and Settings live in the Menu sheet; Restart, Undo and Tube stay under the tubes
    // 1.2.0: overlay (the backdrop fills the phone, the top row floats); Water / Balls tabs go to the top of the Menu
    var FS = Goobs.fullscreen({ overlay: true, menu: ['btnHelp', 'btnStats', 'btnSettings'], info: function () {
      if (!g) return '';
      return '<b>' + (meta.mode === 'balls' ? 'Balls' : 'Water') + ' level ' + g.level + '</b> \u00b7 ' + SS.used(g) + ' of ' + g.limit + ' moves \u00b7 tubes hold ' + g.cap;
    } });
    FS.list.parentNode.insertBefore($('modes'), FS.list);
    Goobs.themePicker($('themes'));
    cv = $('cv'); cx = cv.getContext('2d');
    cv.addEventListener('pointerdown', function (e) { var r = cv.getBoundingClientRect(); tap(hit(e.clientX - r.left, e.clientY - r.top)); e.preventDefault(); });
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) { document.addEventListener(ev, function () { S.unlock(); }, { passive: true }); });
    $('btnHome').addEventListener('click', function () { save(); Goobs.home(); });
    $('modes').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { S.unlock(); FS.close(); switchMode(b.dataset.mode); } });
    $('btnRestart').addEventListener('click', function () { if (!g || ending) return; if (g.moves) showCard('Restart this level?', 'It goes back to how it started.', [{ label: 'Restart', red: true, go: restart }, { label: 'Keep playing', go: function () {} }]); });
    $('btnUndo').addEventListener('click', undo);
    $('btnTube').addEventListener('click', addTube);
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings');
    sheet('btnStats', 'ovStats', 'btnCloseStats', renderStats);
    function closeHelp() { $('ovHelp').classList.remove('show'); if (!meta.seen) { meta.seen = true; saveMeta(); } }
    $('btnHelp').addEventListener('click', openHelp);
    $('btnCloseHelp').addEventListener('click', closeHelp);
    $('ovHelp').addEventListener('click', function (e) { if (e.target === this) closeHelp(); });
    $('pillLevel').addEventListener('click', openHelp);
    $('btnSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncSound(); S.ding(); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); syncSound(); S.ding(); });
    $('setSymbols').checked = settings.symbols;
    $('setSymbols').addEventListener('change', function () { settings.symbols = this.checked; saveSettings(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncAds(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncAds(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncAds(); });
    if (window.ResizeObserver) { var ro = new ResizeObserver(fit); ro.observe($('stagewrap')); ro.observe(document.querySelector('.toolbar')); ro.observe(document.querySelector('.top')); }
    window.addEventListener('resize', fit);
    document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });
    window.addEventListener('pagehide', save);
    syncSound(); syncAds(); syncModes(); fit();
    if (!load()) startLevel(meta.level[meta.mode]);
    fit();
    if (!meta.seen) openHelp();
    requestAnimationFrame(frame);
    window.__ssReady = true;
    Goobs.markPlayed('sort');
    Goobs.initUpdates({ beforeReload: save, onVersions: function (v) { $('version').textContent = 'Splash Sort ' + (v.sort || '2.1.0') + ' · Goobs-Games ' + (v.shell || '?'); } });
  }
  // hook for automated tests
  window.__ss = { get g() { return g; }, tap: tap, outOfMoves: outOfMoves, restart: restart, get FR() { return FR; }, startLevel: startLevel, switchMode: switchMode, undo: undo, addTube: addTube, get anims() { return anims; }, meta: function () { return meta; }, SS: SS, get L() { return L; } };
  init();
})();
</script>
