<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#5a54f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goobs-Games">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="../../icons/icon-192.png">
<link rel="stylesheet" href="../../shared/goobs.css">
<script src="../../shared/goobs.js"></script>
<title>Outpost Rush</title>
<style>
/* Outpost Rush styles (themes, UI kit, Menu sheet and ad cards come from /shared/goobs.css) */
.brand svg { border-radius: 10px; }
/* Full screen (Glenn: "please make sure this game is full screen"): the meadow fills the whole phone edge to edge,
   behind the notch and the home bar; the kit floats back, the pills, Sound and Menu on top (html.gg-fs-over). */
html, body { height: 100%; overflow: hidden; }
html.gg-fs-over body { background: #6cc04a; }
html.gg-fs-over body.reg1, .stage.reg1 { background: #f0c77e; }
html.gg-fs-over body.reg2, .stage.reg2 { background: #dfeefa; }
html.gg-fs-over body.reg3, .stage.reg3 { background: #3b302e; }
html.gg-fs-over body.reg4, .stage.reg4 { background: #3aa55a; }
html.gg-fs-over body.reg5, .stage.reg5 { background: #c4a462; }
html.gg-fs-over body.reg6, .stage.reg6 { background: #d98a5c; }
html.gg-fs-over body.reg7, .stage.reg7 { background: #2b3656; }
.stagewrap { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; }
html.gg-fs-over .stagewrap { position: fixed; inset: 0; }
.stage { position: relative; flex: 1 1 auto; overflow: hidden; touch-action: none; background: #6cc04a; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
.stage #fx { pointer-events: none; }
.top .topsp { flex: 1 1 auto; }
.top .ggpill { pointer-events: none; }
.lvpill { font-weight: 900; }
.timepill { font-size: 15px; min-width: 52px; text-align: center; }
.hint { position: absolute; left: 14px; right: 14px; margin: 0 auto; width: fit-content; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); z-index: 3; box-sizing: border-box;
  background: rgba(255,255,255,.93); color: #1b2a4a; font-weight: 800; font-size: 16px; line-height: 1.25; text-align: center; padding: 10px 16px; border-radius: 18px;
  box-shadow: 0 4px 14px rgba(0,0,0,.2); pointer-events: none; transition: opacity .35s; }
.hint:empty { display: none; }
.hint.tip { font-size: 15px; font-weight: 700; max-width: 360px; text-align: left; }
.hint.tip b { color: #d98a00; }
/* the strength bar: each colour's share of all the strength on the field, floating under the top row */
.sbar { position: absolute; z-index: 2; left: 50%; transform: translateX(-50%); top: 60px; width: min(84%, 340px); height: 16px; display: flex; border-radius: 9px; overflow: hidden;
  box-shadow: 0 0 0 2.5px rgba(255,255,255,.9), 0 3px 10px rgba(0,0,0,.2); pointer-events: none; background: rgba(255,255,255,.6); }
.sbar i { display: block; flex: 1 1 0; min-width: 0; transition: flex-grow .35s ease; position: relative; }
.sbar i + i { border-left: 2px solid rgba(255,255,255,.9); }
.sbar i.out { border-left: 0; }
.sbar b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 900 11px/1 system-ui, -apple-system, sans-serif; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.45); }
.sbar .c1 { background: linear-gradient(#5b95f5, #2f6fe0); }
.sbar .c2 { background: linear-gradient(#f06a6e, #d8363c); }
.sbar .c3 { background: linear-gradient(#58cf6f, #2fa648); }
.sbar .c4 { background: linear-gradient(#f8ca52, #e0a214); }
.lv.r1 small { color: #d98a00; }
.lv.r2 small { color: #3a8fd8; }
.hint.done { opacity: 0; }
.finger { position: absolute; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; z-index: 3; pointer-events: none; display: none;
  background: radial-gradient(circle, rgba(255,255,255,.95) 0 38%, rgba(255,255,255,.35) 40% 100%); box-shadow: 0 0 0 3px rgba(40,90,200,.35), 0 4px 10px rgba(0,0,0,.25); }
.finger.show { display: block; }
.loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; color: #1d4a16; pointer-events: none; }
.loading.hide { display: none; }
.toast { position: absolute; z-index: 4; left: 50%; top: 34%; transform: translateX(-50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: rgba(10,14,36,.8); color: #fff; font-weight: 800; font-size: 15px; padding: 8px 15px; border-radius: 14px; max-width: 86%; }
.toast.show { opacity: 1; }
.lvhead { display: flex; justify-content: space-between; align-items: center; font-weight: 800; color: var(--muted); margin: 0 2px 10px; font-size: 15px; }
.lvhead b { color: var(--ink); }
.gold { color: #d99a00; font-weight: 900; }
.gold::before { content: ''; display: inline-block; width: 14px; height: 14px; margin: 0 4px -2px 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c8 0 15%, #ffc83d 45%, #d08a00 100%); }
.lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.lv { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); height: 54px; font-weight: 800; font-size: 16px; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.lv small { font-size: 11px; color: #e0a800; letter-spacing: -1px; min-height: 12px; }
/* the level map takes each region's look: meadow green, desert sand, tundra ice (the current level keeps the accent) */
.lv.r0 { background: linear-gradient(#eaf8dd, #cbeab4); border-color: #a6d58a; color: #1f4a17; }
.lv.r1 { background: linear-gradient(#fcefd0, #f2d392); border-color: #deb25e; color: #5a3a0e; }
.lv.r2 { background: linear-gradient(#f6fbff, #d8eaf9); border-color: #a9c9e6; color: #18365a; }
.lvhead[class*=" r"] { padding: 9px 12px; border-radius: 12px; color: rgba(0,0,0,.6); }
.lvhead[class*=" r"] b { color: #111; }
.lvhead.r0 { background: linear-gradient(100deg, #bfe7a3, #8fd06a); }
.lvhead.r1 { background: linear-gradient(100deg, #f7dba0, #e9b861); }
.lvhead.r2 { background: linear-gradient(100deg, #eef6fd, #bcd9f2); }
/* 0.3.0 regions: lava (dark basalt, ember), jungle (lush green), autumn (orange), canyon (red rock), night harbor (navy, lamplight) */
.lv.r3 { background: linear-gradient(#5a4744, #3b302e); border-color: #ff8a3a; color: #ffd9b8; }
.lv.r4 { background: linear-gradient(#e2f8e6, #aee6b9); border-color: #5fc27a; color: #10431f; }
.lv.r5 { background: linear-gradient(#fff0d8, #f5c98a); border-color: #e0873a; color: #6a3208; }
.lv.r6 { background: linear-gradient(#fbe2d2, #eba27c); border-color: #c8653a; color: #5a1f08; }
.lv.r7 { background: linear-gradient(#4a5a86, #2b3656); border-color: #ffd873; color: #fff3cf; }
.lv.r3 small { color: #ffb23a; } .lv.r4 small { color: #b88400; } .lv.r5 small { color: #c0540a; } .lv.r6 small { color: #a8420f; } .lv.r7 small { color: #ffd873; }
.lvhead.r3 { background: linear-gradient(100deg, #6a4a3e, #d8602a); color: rgba(255,255,255,.8); } .lvhead.r3 b { color: #fff; }
.lvhead.r4 { background: linear-gradient(100deg, #c8f0cf, #58c47a); }
.lvhead.r5 { background: linear-gradient(100deg, #fbe0b0, #eb8f3c); }
.lvhead.r6 { background: linear-gradient(100deg, #f6cdb4, #d0703e); }
.lvhead.r7 { background: linear-gradient(100deg, #3d4c78, #1f2844); color: rgba(255,255,255,.8); } .lvhead.r7 b { color: #ffe08a; }
.lv.cur { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.lv:disabled { opacity: .35; }
.lvpages { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.lvpages button { font: inherit; font-weight: 800; font-size: 13px; border: 0; border-radius: 10px; padding: 7px 9px; background: var(--surface-2); color: var(--muted); }
.lvpages button.on { background: var(--accent); color: #fff; }
.lvpages button[disabled] { opacity: .35; filter: grayscale(1); }
.lvpages button small { font-size: 11px; font-weight: 700; opacity: .8; }
/* the Upgrades sheet: gold balance, one card per track (icon, level, effect now -> next, 20 pips, buy with its cost) */
#ovUpgrades { z-index: 12; }
.uphead { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-radius: 14px; background: linear-gradient(100deg, #fff4cf, #ffd873); color: #5a3a00; font-weight: 900; font-size: 16px; margin-bottom: 8px; }
.gold.big { font-size: 22px; }
.gold.big::before { width: 19px; height: 19px; margin-bottom: -3px; }
.upmsg { font-size: 13.5px; font-weight: 700; color: var(--muted); margin: 0 2px 10px; min-height: 18px; line-height: 1.3; }
.upmsg.bad { color: #d8363c; }
.upcard { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); margin-bottom: 8px; }
.upcard.shake { animation: upshake .4s; }
@keyframes upshake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.upicon { flex: 0 0 44px; height: 44px; border-radius: 12px; background: linear-gradient(#eaf2ff, #cfe0ff); display: flex; align-items: center; justify-content: center; }
.upicon svg { width: 32px; height: 32px; }
.upmain { flex: 1 1 auto; min-width: 0; }
.uptitle { display: flex; justify-content: space-between; gap: 6px; font-size: 15px; }
.uptitle span { font-size: 12px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.upfx { font-size: 13px; color: var(--ink); margin: 2px 0 5px; }
.upfx small { color: #2fa648; font-weight: 800; }
.uprow { display: flex; align-items: center; gap: 6px; }
.uprow span { font-size: 11px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.uppips { display: flex; gap: 2px; flex: 1 1 auto; }
.uppips i { flex: 1 1 0; height: 6px; border-radius: 3px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.uppips i.on { background: linear-gradient(#ffd873, #e0a214); box-shadow: none; }
.upbuy { flex: 0 0 76px; border: 0; border-radius: 12px; padding: 7px 4px; font: inherit; font-weight: 900; font-size: 13px; line-height: 1.25; display: flex; flex-direction: column; align-items: center;
  background: linear-gradient(#5b95f5, #2f6fe0); color: #fff; box-shadow: 0 3px 0 #1d4fae; }
.upbuy .gold { color: #fff3c0; font-size: 14px; }
.upbuy.poor { background: var(--surface-2); color: var(--muted); box-shadow: 0 3px 0 var(--line); }
.upbuy.poor .gold { color: #b08a2a; }
.upbuy.max { background: linear-gradient(#ffd873, #e0a214); color: #5a3a00; box-shadow: 0 3px 0 #b07c0a; }
.upbuy:active { transform: translateY(2px); box-shadow: none; }
.btn.goldbtn { background: linear-gradient(#ffd873, #f0b52a); color: #5a3a00; border-color: transparent; }
.upready { display: block; color: #d99a00; font-weight: 900; margin-top: 4px; }
.stars { font-size: 26px; color: #ffc83d; letter-spacing: 2px; }
.stars .off { color: var(--line-strong); }
.cardicon svg { border-radius: 16px; }
.endinfo { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; font-weight: 800; margin-top: 4px; }
.menustars { color: #ffb400; letter-spacing: 1px; }
.sbprobe { position: fixed; left: 0; bottom: 0; width: 1px; height: env(safe-area-inset-bottom, 0px); visibility: hidden; pointer-events: none; }
.brand h1 { font-size: 21px; }
@media (max-width: 385px) { .brand h1 { font-size: 19px; } }
@media (max-width: 360px) { .timepill { display: none; } }
/* 0.4.0: the horde (olive) in the strength bar, the wave pill, the Missions page of the level map, mission cards */
.sbar .c5 { background: linear-gradient(#a3b073, #6f7c48); }
.wavepill { position: absolute; z-index: 2; left: 50%; transform: translateX(-50%); top: 84px; display: none; pointer-events: none; white-space: nowrap;
  background: linear-gradient(#7d8a52, #5e6a3c); color: #fff; font: 800 13px/1 system-ui, -apple-system, sans-serif; padding: 5px 12px; border-radius: 11px;
  box-shadow: 0 0 0 2px rgba(255,255,255,.85), 0 3px 8px rgba(0,0,0,.2); }
.wavepill.show { display: block; }
.lvpill.mispill { background: linear-gradient(#ffd873, #f0b52a); color: #5a3a00; }
.lvpages button.mtab { position: relative; background: linear-gradient(#fff4cf, #ffd873); color: #5a3a00; }
.lvpages button.mtab.on { background: linear-gradient(#f5b82a, #e09a10); color: #fff; }
.newdot { position: absolute; top: -7px; right: -6px; font-style: normal; font-size: 9px; font-weight: 900; color: #fff; background: #e8383e; border-radius: 7px; padding: 2px 5px; box-shadow: 0 0 0 2px #fff; }
.lvhead.mis { background: linear-gradient(100deg, #fff1c4, #ffcf5a); color: rgba(0,0,0,.6); }
.lvhead.mis b { color: #111; }
.mhead { display: flex; align-items: baseline; gap: 8px; margin: 12px 2px 6px; font-size: 15px; }
.mhead small { font-size: 12px; color: var(--muted); font-weight: 700; }
.mhead.k-draw b { color: #12928a; } .mhead.k-gate b { color: #2f6fe0; } .mhead.k-event b { color: #b0561a; }
#lvgrid.mpage { display: block; }
.mgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.lv.mis .mlab { font-size: 16px; }
.lv.mis small { font-size: 10.5px; letter-spacing: -0.5px; }
.lv.mis.k-draw { background: linear-gradient(#e2fbf6, #b4ece2); border-color: #63c9b8; color: #0c4a43; }
.lv.mis.k-gate { background: linear-gradient(#e8f1ff, #c3d9ff); border-color: #7ea9f0; color: #13306a; }
.lv.mis.k-horde { background: linear-gradient(#eef3dc, #c9d59c); border-color: #8c9a62; color: #2f3a14; }
.lv.mis.k-boss { background: linear-gradient(#fbe6d6, #f0b48a); border-color: #c8682e; color: #5a2408; }
.lv.mis.fresh { box-shadow: 0 0 0 2px #ffcf3a; }
.lv.mis.cur { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.newmis { display: block; color: #e0730a; font-weight: 900; margin-top: 4px; }
.misname { font-weight: 800; color: var(--muted); margin-top: 2px; }
#endText > small { display: block; }
/* 0.5.0: endless levels: the small "Making level N..." note (only when you reach a level before it is made), the
   Endless tab and its pager on the level map, 4-5 digit level numbers */
.making { position: absolute; z-index: 4; left: 50%; top: 46%; transform: translateX(-50%); pointer-events: none; display: none; white-space: nowrap;
  background: rgba(10,14,36,.82); color: #fff; font: 800 15px/1 system-ui, -apple-system, sans-serif; padding: 10px 16px; border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.making.show { display: block; animation: opMake 1.2s ease-in-out infinite; }
@keyframes opMake { 50% { opacity: .65; } }
.lvpages button.etab { background: linear-gradient(#e7ecff, #c6d0ff); color: #1d2a6a; }
.lvpages button.etab.on { background: linear-gradient(#5a6cf0, #3446c8); color: #fff; }
.lvpager { display: flex; align-items: center; gap: 8px; margin: -4px 0 10px; }
.lvpager button { font: inherit; font-weight: 900; font-size: 20px; line-height: 1; width: 44px; height: 36px; border: 0; border-radius: 10px; background: var(--surface-2); color: var(--ink); flex: none; }
.lvpager button[disabled] { opacity: .3; }
.lvpager span { flex: 1; text-align: center; font-weight: 800; font-size: 15px; color: var(--ink); }
.lvpager span small { font-size: 12px; color: var(--muted); font-weight: 700; }
.lv.big { font-size: 13px; letter-spacing: -0.3px; }
.commandbar{position:absolute;z-index:3;left:calc(env(safe-area-inset-left,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;align-items:center;gap:10px;padding:5px 8px 5px 5px;border:1px solid #c8d9e239;background:#142936ed;color:#e8f2f8;border-radius:15px;box-shadow:0 5px 18px #07131d40;}
.commandbar button{flex:0 0 auto;min-width:68px;min-height:44px;border:1px solid #b9dce34d;border-radius:10px;color:#fff;background:#284a60;font:700 14px system-ui;touch-action:manipulation;}
.commandbar button[aria-pressed="true"]{background:#ceeafb;color:#102b3a;}
.commandbar span{flex:1;font:600 12px/1.3 system-ui;}
.commandbar #btnCancelOrder{min-width:44px;}.commandbar [hidden]{display:none;}
.hint{bottom:calc(env(safe-area-inset-bottom,0px) + 76px);border-radius:12px;font-size:14px;}
.sbar{height:12px;border-radius:6px;box-shadow:0 0 0 2px #142936c9,0 3px 10px #0003;}
@media(max-height:450px){.commandbar{left:calc(env(safe-area-inset-left,0px) + 8px);right:auto;max-width:270px}.commandbar span{font-size:11px}.hint{font-size:12px;max-width:230px;left:auto;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);padding:8px}}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="opbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fdc62"/><stop offset="1" stop-color="#4fae3c"/></linearGradient>
<symbol id="op-logo" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="url(#opbg)"/>
<path d="M30 70 L70 34" stroke="#ffffff" stroke-opacity=".55" stroke-width="9" stroke-linecap="round"/>
<g><ellipse cx="30" cy="84" rx="17" ry="5" fill="#2f6e22" opacity=".35"/><rect x="18" y="56" width="24" height="27" rx="3" fill="#3f7ff0"/><rect x="18" y="62" width="24" height="6" fill="#1b2f66"/><rect x="18" y="73" width="24" height="3" fill="#fff"/>
<rect x="17" y="40" width="26" height="17" rx="6" fill="#2f6fe0"/><text x="30" y="53" font-family="system-ui,sans-serif" font-weight="900" font-size="13" fill="#fff" text-anchor="middle">12</text></g>
<g><ellipse cx="70" cy="50" rx="15" ry="4.5" fill="#2f6e22" opacity=".35"/><rect x="60" y="28" width="20" height="21" rx="3" fill="#ea4a4f"/><rect x="60" y="33" width="20" height="5" fill="#5a1418"/>
<rect x="59" y="14" width="22" height="15" rx="5" fill="#d83a40"/><text x="70" y="25.5" font-family="system-ui,sans-serif" font-weight="900" font-size="11" fill="#fff" text-anchor="middle">5</text></g>
<g fill="#3f7ff0"><circle cx="44" cy="58" r="3.4"/><circle cx="53" cy="50" r="3.4"/></g></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-sound-on" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" fill-opacity=".15"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19.3 5.7a9 9 0 0 1 0 12.6"/></g></symbol>

<script>
/* Outpost Rush rules: the battle simulation (buildings, lines, troops, fights, capture, map elements), the computer
   players and the level format. Fixed timestep (OP.DT), deterministic (seeded), no drawing: the page (app.js +
   scene.js) and the Node checks (tools/check.js, tools/gen.js) run the very same code.

   The map is W x H world units, x to the right, y down the screen (the player is at the bottom).
   Owners: 0 gray (neutral), 1 blue (the player), 2 red, 3 green, 4 yellow (computers; they fight each other too).
   Buildings: 'b' barracks (soldiers), 'f' factory (tanks), 's' sniper tower (shoots, sends nothing), 'r' rocket
   launcher (fires at one target you pick), 'F' fort (big, higher max, drops paratroopers).

   0.2.0 (Glenn): sending is free. A line emits troops at a rate set by the tower; the tower keeps its number while sending; only idle towers grow naturally and only enemy hits lower its number. Link slots: 1 below 10, 2 from 10, 3 from 30.
   0.3.0 (Glenn): gold upgrades for blue (soldier strength, tank strength, production speed, starting tower level).
   Troop strength can be fractional (a 1.15 soldier): buildings keep a fraction accumulator so the fractions add up
   (seven 1.15 hits take 8); without upgrades every number stays whole and the game plays exactly as 0.2.0.
   0.4.0 (Glenn's Phase 4): special missions and events. Draw Mode: a line can follow a path drawn with the finger
   (a polyline; troops walk it, it can go round obstacles; the computers still only use straight lines). Gates: + and
   x gates (blue, they help) turn each of your troops that walks through into several, - gates (red) take strength
   off it; they work on your troops only, and the computers don't aim for them. Events: a horde
   (owner 5, "rust bots") marching in waves from the edges at your buildings, and a giant boss citadel (type 'X') with
   a huge number that fires volleys of shells. Campaign levels have none of these and play exactly as 0.3.0. */
// 0.5.0: the whole rule book is one named function so the page can also run it in a Web Worker (built from this
// function's source; the endless levels are made and checked there without freezing the battle)
function OP_FACTORY() {
  'use strict';
  var DT = 1 / 30;          // 30 steps a second
  var W = 9, H = 17;        // the battlefield (world units)
  var CAP = 63;             // a tower's top number ("Max")
  var FORT_CAP = 99;        // a fort's top number (a level may raise it, e.g. 120)
  var SPEED = [1.45, 0.95, 2.1, 1.05]; // units a second: soldier, tank (slower), paratrooper (flies), rust bot (the horde, 0.4.0)
  var HP = [1, 2, 1, 1];    // a tank counts as 2 soldiers
  var HORDE = 5, NOWN = 6;  // owner 5: the horde of an event level (0.4.0); owners 0-5
  var BOSS_EDGE = 1.0, BOSS_CAP = 300, BOSS_GROW = 2.6; // the boss citadel: big, a huge number, grows slowly (s per +1)
  var MAXU = 1400;          // past this many troops a gate makes stronger troops instead of more (keeps the page smooth)
  var EDGE = 0.42;          // troops leave / arrive at this distance from a building's middle
  var FORT_EDGE = 0.9;      // a fort is about 4x the footprint
  var GROW_IDLE = 0.9;      // seconds per +1 for a tower with no outgoing lines (the original: idle towers level faster)
  var GROW_SEND = Infinity; // sending suspends natural growth (kept in the public rules interface)
  var SEND_LO = 0.62, SEND_HI = 0.4; // seconds between two troops on one line, at 0 and at 63 (bigger towers send faster)
  var TANK_GAP = 2.0, PARA_GAP = 1.2; // a factory sends a tank every 2 soldier-gaps (same strength per second), a fort a paratrooper every 1.2
  var CLASH = 0.16;         // two opposing troops closer than this fight
  var START_CAP = 1;        // a captured tower starts with the troop that took it
  var SNIPE_R = [2.0, 2.5, 3.0], SNIPE_GAP = [1.2, 0.95, 0.75]; // sniper range / seconds per shot below 10, 10-29, 30+
  var ROCKET_DMG = 3, ROCKET_SPEED = 5.5, ROCKET_LO = 1.5, ROCKET_HI = 0.7; // rocket: -3, flies 5.5/s, one every 1.5 s at 0 -> 0.7 s at 63 (faster than any line)
  var MINE_TRIG = 0.32, MINE_R = 0.6, MINE_RE = 12; // a mine goes off when a troop passes this close, kills troops within MINE_R, re-arms after 12 s
  var GOLD_R = 0.5, GOLD_BOOST = 15, GOLD_COIN = 10; // gold bar pick-up distance; the sender grows twice as fast for 15 s; +10 gold for you
  var BOOST = 2;            // growth speed-up while boosted
  var EPS = 1e-9;
  // gold upgrades (blue only): 20 steps per track; the cost of step k rises (60, 105, 165 ... 3,440) so an upgrade
  // costs a few levels' gold early and grows (the check bot plays with none: every level is proven without them)
  var UP_MAX = 20, UP_KEYS = ['sol', 'tank', 'prod', 'start'];
  function upCost(k) { k = Math.max(1, k | 0); return Math.round((60 + 45 * (k - 1) + 7 * (k - 1) * (k - 1)) / 5) * 5; }
  // what a track does at level k: soldiers hit for 1 + 5% a step, tanks 2 + 5% a step, production (send rate and
  // growth) +3% a step, starting towers +1 a step
  function upValue(key, k) { k = Math.max(0, Math.min(UP_MAX, k | 0)); return key === 'sol' ? 1 + 0.05 * k : key === 'tank' ? 2 * (1 + 0.05 * k) : key === 'prod' ? 1 + 0.03 * k : k; }

  function rng(seed) {
    var a = seed >>> 0;
    return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  // link slots: 1 below 10, 2 from 10, 3 from 30 (the dots under the number). Snipers send nothing; a rocket launcher
  // has one target at a time.
  function slots(n, type) { if (type === 's') return 0; if (type === 'r') return 1; if (type === 'X') return 0; return n >= 30 ? 3 : n >= 10 ? 2 : 1; }
  // the number a tower needs to hold k lines (enemy hits pushing it under drop its newest lines)
  function floorFor(k) { return k >= 3 ? 30 : k >= 2 ? 10 : 0; }
  // floors drawn for a number (the tower visibly grows)
  function floors(n) { return n < 6 ? 1 : n < 14 ? 2 : n < 24 ? 3 : n < 36 ? 4 : n < 50 ? 5 : 6; }
  function band(n) { return n >= 30 ? 2 : n >= 10 ? 1 : 0; }
  function snipeRange(n) { return SNIPE_R[band(n)]; }
  function kindOf(type) { return type === 'f' ? 1 : type === 'F' ? 2 : 0; }
  function sender(type) { return type === 'b' || type === 'f' || type === 'F'; }
  // buildings whose troops walk (a drawn path makes sense for them; forts drop paratroopers, rockets fly). The boss
  // citadel ('X', 0.4.0) sends no troops: its attack is its volleys.
  function walker(type) { return type === 'b' || type === 'f'; }
  // seconds between two troops on one of this tower's lines
  // (s: the battle, for the owner's production upgrade; the checks call it without)
  function sendGap(T, s) { var g = SEND_LO - (SEND_LO - SEND_HI) * Math.min(1, T.n / CAP); g = T.type === 'f' ? g * TANK_GAP : T.type === 'F' ? g * PARA_GAP : g; return s ? g / s.prod[T.o] : g; }
  function rocketGap(T) { return ROCKET_LO - (ROCKET_LO - ROCKET_HI) * Math.min(1, T.n / CAP); }
  // troop strength a tower's line delivers per second (with the owner's upgrades when the battle is given)
  function rate(T, s) { return T.type === 'r' ? ROCKET_DMG / rocketGap(T) : (s ? s.hp[T.o][kindOf(T.type)] : HP[kindOf(T.type)]) / sendGap(T, s); }

  // ---------------- geometry ----------------
  function segDist(px, py, ax, ay, bx, by) { var dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy, t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0; t = Math.max(0, Math.min(1, t)); return Math.hypot(px - ax - dx * t, py - ay - dy * t); }
  // where segment a->b first crosses segment c-d (0..1 along a->b), or -1
  function segCross(ax, ay, bx, by, cx, cy, dx, dy) {
    var rx = bx - ax, ry = by - ay, sx = dx - cx, sy = dy - cy, den = rx * sy - ry * sx; if (Math.abs(den) < 1e-9) return -1;
    var t = ((cx - ax) * sy - (cy - ay) * sx) / den, u = ((cx - ax) * ry - (cy - ay) * rx) / den;
    return t >= 0 && t <= 1 && u >= 0 && u <= 1 ? t : -1;
  }
  // where segment a->b enters an axis-aligned box (centre x, y, size w, h), 0..1, or -1 (slab method)
  function segBox(ax, ay, bx, by, x, y, w, h, pad) {
    pad = pad || 0; var x0 = x - w / 2 - pad, x1 = x + w / 2 + pad, y0 = y - h / 2 - pad, y1 = y + h / 2 + pad;
    var t0 = 0, t1 = 1, d = [bx - ax, by - ay], p = [ax, ay], lo = [x0, y0], hi = [x1, y1];
    for (var k = 0; k < 2; k++) {
      if (Math.abs(d[k]) < 1e-9) { if (p[k] < lo[k] || p[k] > hi[k]) return -1; continue; }
      var ta = (lo[k] - p[k]) / d[k], tb = (hi[k] - p[k]) / d[k]; if (ta > tb) { var q = ta; ta = tb; tb = q; }
      t0 = Math.max(t0, ta); t1 = Math.min(t1, tb); if (t0 > t1) return -1;
    }
    return t0;
  }
  // obstacles: [kind, x, y, r] (round: rock, tree, pond, ice block, cactus) or [kind, x, y, w, h] (a box: water, lava, ice)
  function obsHit(o, ax, ay, bx, by) { return o.length >= 5 ? segBox(ax, ay, bx, by, o[1], o[2], o[3], o[4], 0.06) >= 0 : segDist(o[1], o[2], ax, ay, bx, by) < o[3] + 0.06; }

  // ---------------- a battle ----------------
  // level: { towers: [[x, y, owner, n, type?], ...], links: [[from, to], ...], ai: {...}, obs, fences, gaps, mines, bars, fortCap, cap }
  // opts.ai: { owner: params, ... } which owners the computer plays (the page: 2-4; the checks: 1 too)
  // opts.up: blue's gold upgrades { sol, tank, prod, start } (levels 0-20; none in the checks' proofs)
  function create(level, opts) {
    opts = opts || {};
    var s = { t: 0, tick: 0, towers: [], links: [], units: [], rockets: [], ev: [], nextId: 1, rng: rng(opts.seed || 12345),
      ai: {}, over: 0, paths: {}, lpaths: {}, coins: [0, 0, 0, 0, 0, 0],
      hp: [0, 1, 2, 3, 4, 5].map(function () { return HP.slice(); }), prod: [1, 1, 1, 1, 1, 1], up: null,
      obs: (level.obs || []).map(function (o) { return o.slice(); }),
      fences: (level.fences || []).map(function (f, i) { return { i: i, x: f[0], y: f[1], len: f[2], ang: f[3], hp: f[4], hp0: f[4] }; }),
      gaps: (level.gaps || []).map(function (g, i) { return { i: i, x: g[0], y: g[1], w: g[2], h: g[3], need: g[4], got: 0 }; }),
      mines: (level.mines || []).map(function (m, i) { return { i: i, x: m[0], y: m[1], armed: true, at: 0 }; }),
      bars: (level.bars || []).map(function (b, i) { return { i: i, x: b[0], y: b[1], taken: false }; }),
      // 0.4.0 gates: [x, y, width, angle, op ('add' | 'mul' | 'sub'), n]; add/mul are blue (help), sub is red (hurts)
      gates: (level.gates || []).map(function (g, i) { return { i: i, x: g[0], y: g[1], w: g[2], ang: g[3], op: g[4], n: g[5], hits: 0, by: [0, 0, 0, 0, 0, 0] }; }),
      // 0.4.0 horde: waves [start s, troops, x, y, troops a second] marching in from the edges
      horde: level.horde ? { waves: level.horde.waves.map(function (w, i) { return { i: i, t: w[0], n: w[1], x: w[2], y: w[3], rate: w[4] || 4, hp: w[5] || 1, sent: 0, acc: 0.99, on: false }; }), started: 0 } : null,
      boss: level.boss || null,
      stats: { sent: [0, 0, 0, 0, 0, 0], caps: [0, 0, 0, 0, 0, 0], lost: [0, 0, 0, 0, 0, 0], bars: [0, 0, 0, 0, 0, 0] } };
    level.towers.forEach(function (d, i) {
      var type = d[4] || 'b';
      // a level can raise the cap: forts (fortCap) or every building (cap), e.g. 120 ("some (few) levels have over 100")
      var cap = type === 'F' ? Math.max(level.fortCap || FORT_CAP, level.cap || 0) : type === 'X' ? ((level.boss && level.boss.cap) || BOSS_CAP) : (level.cap || CAP);
      var T0 = { i: i, x: d[0], y: d[1], o: d[2], n: d[3], type: type, cap: cap,
        r: type === 'F' ? FORT_EDGE : type === 'X' ? BOSS_EDGE : EDGE, g: 0, links: [], lastHit: -9, boost: 0, cd: 0.5, dacc: 0, racc: 0 };
      if (type === 'X') T0.vt = (level.boss && level.boss.first) || 10; // seconds to its first volley
