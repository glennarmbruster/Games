<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#153a60"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="../../manifest.json"><link rel="icon" href="../../icons/icon-192.png"><title>Handheld Sports · Goobs Games</title><script src="../../shared/goobs.js"></script><link rel="stylesheet" href="sports.css"></head><body>
<section id="lobby" class="lobby"><div class="intro"><span class="eyebrow">GOOBS GAMES · RETRO COLLECTION</span><h1>Handheld Sports</h1><p>Little lights. Big-league memories.</p></div><div class="modeCards"><button class="modeCard" data-mode="football"><span class="miniDevice footballIcon" aria-hidden="true"><i> ▰ &nbsp; ▪ ▪<br> ▪ &nbsp; ▪ &nbsp; ▪<br> &nbsp; ▪ &nbsp; ▪ </i><b>+ &nbsp; ●</b></span><span><strong>Football</strong><small>Dodge the defense.<br>Drive for the end zone.</small><em id="footballRecord">4 quarters · classic LED action</em></span></button><button class="modeCard" data-mode="baseball"><span class="miniDevice baseballIcon" aria-hidden="true"><i> &nbsp; ◆<br> ◆ &nbsp; ◆<br> &nbsp; ◆</i><b>● &nbsp; ●</b></span><span><strong>Baseball</strong><small>Time your swing.<br>Bring the runners home.</small><em id="baseballRecord">Pitch, bat, and run the bases</em></span></button></div><div class="options"><label>New-game challenge<select id="skill"><option value="classic">Classic</option><option value="pro">Pro</option></select></label><label>Baseball length<select id="innings"><option value="3">3 innings</option><option value="9">9 innings</option></select></label></div><p class="lobbyNote">Tap a sport to play or resume. Works offline.</p><div class="lobbyNav"><button id="lobbyExit">Exit</button><button id="lobbyHelp">How to Play</button></div><span id="version">Handheld Sports 1.1.2</span></section>
<main id="game" hidden><section class="device"><header class="deviceHeader"><div><span class="brand">GOOBS ELECTRONIC</span><h1 id="sportTitle">FOOTBALL</h1></div><button id="pause" aria-label="Pause">Ⅱ</button></header><section class="screen"><div class="scoreboard"><div><span>YOU</span><strong id="you">00</strong></div><div class="middleScore"><span id="period">Q1 · 0:45</span><b id="detail">1st & 10</b></div><div><span>CPU</span><strong id="cpu">00</strong></div></div><div class="fieldWrap"><canvas id="field" aria-label="Electronic playing field"></canvas></div><div id="readout" class="readout">BALL ON YOUR 20</div></section><section class="console"><div id="message" role="status" aria-live="polite">Press SNAP to begin</div><div id="footballControls" class="playControls"><div class="dpad"><button data-dir="up" aria-label="Move up">▲</button><button data-dir="left" aria-label="Move backward">◀</button><button data-dir="down" aria-label="Move down">▼</button><button data-dir="right" aria-label="Run forward">▶</button></div><div class="actionPair"><button id="snap" class="action">SNAP</button><button id="kick" class="secondary">KICK / PUNT</button></div></div><div id="baseballControls" class="playControls" hidden><div class="pitchOptions"><button id="pitchType">FASTBALL</button><span id="pitchCaption">Change pitch</span></div><div class="actionPair"><button id="pitch" class="secondary">PITCH</button><button id="swing" class="action">SWING</button></div></div><div class="speaker" aria-hidden="true"></div><nav class="deviceNav"><button id="newGame">New Game</button><button id="help">How to Play</button><button id="sound" aria-pressed="false">Sound Off</button><button id="exit">Exit</button></nav></section></section></main>
<dialog id="menu"><div class="dialogTop"><h2 id="menuTitle">Paused</h2><button id="menuExit">Exit</button></div><div id="menuBody"></div><div id="menuActions"></div></dialog>
<script src="engine.js"></script><script src="sports.js"></script></body></html>
